[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workbuddy-pycore"
version = "0.4.0"
description = "PyCore runtime bundled with WorkBuddy SDD V4"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3.0",
  "loguru>=0.7,<1.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.100,<1.0",
  "uvicorn[standard]>=0.20,<1.0",
  "python-multipart>=0.0.9,<1.0",
]
llm = [
  "openai>=1.0,<2.0",
  "tiktoken>=0.5,<1.0",
]
all = [
  "fastapi>=0.100,<1.0",
  "uvicorn[standard]>=0.20,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "openai>=1.0,<2.0",
  "tiktoken>=0.5,<1.0",
]
dev = [
  "pytest>=7.0,<9.0",
  "pytest-asyncio>=0.21,<1.0",
  "httpx2>=2.0,<3.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.8,<2.0",
]

[tool.setuptools.packages.find]
include = ["pycore*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
