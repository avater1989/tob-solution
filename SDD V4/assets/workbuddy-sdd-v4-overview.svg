<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">WorkBuddy SDD V4 全流程概览</title>
  <desc id="desc">展示从启用、调研、产品定义、前后端开发到验证交付和可选运营资料的十一阶段流程，以及 WorkBuddy 控制链路和六项核心能力。</desc>
  <style>
    .bg { fill: #f7f8fa; }
    .surface { fill: #ffffff; stroke: #dfe3e8; stroke-width: 1; }
    .ink { fill: #20242a; }
    .muted { fill: #626a73; }
    .eyebrow { font: 600 15px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 2px; }
    .title { font: 700 38px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .subtitle { font: 400 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .section-title { font: 700 22px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .phase-title { font: 600 17px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .code { font: 700 16px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .label { font: 500 15px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .small { font: 400 13px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .cap-title { font: 600 17px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .cap-copy { font: 400 14px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
  </style>

  <rect class="bg" width="1440" height="960" rx="8"/>

  <g transform="translate(60 52)">
    <text class="eyebrow" fill="#177b6b">WORKBUDDY · SPECIFICATION-DRIVEN DEVELOPMENT</text>
    <text class="title ink" y="51">从模糊想法到可靠交付的一条产品链路</text>
    <text class="subtitle muted" y="84">阶段门禁让 AI 在正确的时间做正确的事，所有关键结论都可确认、可追踪、可验证。</text>
    <g transform="translate(1110 8)">
      <rect width="208" height="48" rx="8" fill="#20242a"/>
      <text x="104" y="30" text-anchor="middle" fill="#ffffff" class="label">WorkBuddy 专用版 · V4</text>
    </g>
  </g>

  <g transform="translate(60 176)">
    <text class="section-title ink">01 · 产品交付主流程</text>
    <text x="1320" text-anchor="end" class="small muted">11 个阶段 · 前一门禁通过后才进入下一阶段</text>

    <g transform="translate(0 30)">
      <g>
        <rect width="238" height="140" rx="8" fill="#e5f5f1"/>
        <rect width="238" height="5" rx="2.5" fill="#18806e"/>
        <circle cx="21" cy="32" r="5" fill="#18806e"/>
        <text x="34" y="38" class="phase-title ink">发现问题</text>
        <g transform="translate(14 55)">
          <rect width="98" height="70" rx="6" fill="#ffffff" fill-opacity="0.9"/>
          <text x="12" y="25" class="code" fill="#177b6b">S0</text>
          <text x="12" y="52" class="label ink">启用与分类</text>
        </g>
        <g transform="translate(126 55)">
          <rect width="98" height="70" rx="6" fill="#ffffff" fill-opacity="0.9"/>
          <text x="12" y="25" class="code" fill="#177b6b">R</text>
          <text x="12" y="52" class="label ink">调研</text>
        </g>
      </g>

      <g transform="translate(252)">
        <rect width="486" height="140" rx="8" fill="#eef0fb"/>
        <rect width="486" height="5" rx="2.5" fill="#5266b2"/>
        <circle cx="21" cy="32" r="5" fill="#5266b2"/>
        <text x="34" y="38" class="phase-title ink">定义产品</text>
        <g transform="translate(14 55)">
          <rect width="105" height="70" rx="6" fill="#ffffff" fill-opacity="0.9"/>
          <text x="12" y="25" class="code" fill="#5266b2">A</text>
          <text x="12" y="52" class="label ink">需求范围</text>
        </g>
        <g transform="translate(133 55)">
          <rect width="105" height="70" rx="6" fill="#ffffff" fill-opacity="0.9"/>
          <text x="12" y="25" class="code" fill="#5266b2">B1</text>
          <text x="12" y="52" class="label ink">低保真</text>
        </g>
        <g transform="translate(252 55)">
          <rect width="105" height="70" rx="6" fill="#ffffff" fill-opacity="0.9"/>
          <text x="12" y="25" class="code" fill="#5266b2">B2</text>
          <text x="12" y="52" class="label ink">高保真</text>
        </g>
        <g transform="translate(371 55)">
          <rect width="101" height="70" rx="6" fill="#ffffff" fill-opacity="0.9"/>
          <text x="12" y="25" class="code" fill="#5266b2">C</text>
          <text x="12" y="52" class="label ink">接口与计划</text>
        </g>
      </g>

      <g transform="translate(752)">
        <rect width="252" height="140" rx="8" fill="#fff0e9"/>
        <rect width="252" height="5" rx="2.5" fill="#c75f38"/>
        <circle cx="21" cy="32" r="5" fill="#c75f38"/>
        <text x="34" y="38" class="phase-title ink">构建产品</text>
        <g transform="translate(14 55)">
          <rect width="105" height="70" rx="6" fill="#ffffff" fill-opacity="0.9"/>
          <text x="12" y="25" class="code" fill="#b84f2b">D1</text>
          <text x="12" y="52" class="label ink">完整前端</text>
        </g>
        <g transform="translate(133 55)">
          <rect width="105" height="70" rx="6" fill="#ffffff" fill-opacity="0.9"/>
          <text x="12" y="25" class="code" fill="#b84f2b">D2</text>
          <text x="12" y="52" class="label ink">后端联调</text>
        </g>
      </g>

      <g transform="translate(1018)">
        <rect width="302" height="140" rx="8" fill="#edf6e8"/>
        <rect width="302" height="5" rx="2.5" fill="#5e8b3d"/>
        <circle cx="21" cy="32" r="5" fill="#5e8b3d"/>
        <text x="34" y="38" class="phase-title ink">验证交付</text>
        <g transform="translate(14 55)">
          <rect width="82" height="70" rx="6" fill="#ffffff" fill-opacity="0.9"/>
          <text x="12" y="25" class="code" fill="#527d34">V</text>
          <text x="12" y="52" class="label ink">验证</text>
        </g>
        <g transform="translate(110 55)">
          <rect width="82" height="70" rx="6" fill="#ffffff" fill-opacity="0.9"/>
          <text x="12" y="25" class="code" fill="#527d34">H</text>
          <text x="12" y="52" class="label ink">交接</text>
        </g>
        <g transform="translate(206 55)">
          <rect width="82" height="70" rx="6" fill="#ffffff" fill-opacity="0.9"/>
          <text x="12" y="25" class="code" fill="#527d34">O</text>
          <text x="12" y="52" class="label ink">运营资料</text>
        </g>
      </g>
    </g>

    <g transform="translate(0 188)">
      <circle cx="8" cy="7" r="7" fill="#18806e"/>
      <path d="M4 7l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.8"/>
      <text x="24" y="12" class="small muted">需求与范围：产品经理确认</text>
      <circle cx="458" cy="7" r="7" fill="#c75f38"/>
      <path d="M454 7l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.8"/>
      <text x="474" y="12" class="small muted">完整前端 Mock：用户验收</text>
      <circle cx="930" cy="7" r="7" fill="#5e8b3d"/>
      <path d="M926 7l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.8"/>
      <text x="946" y="12" class="small muted">最终产品：证据验证后交付</text>
    </g>
  </g>

  <g transform="translate(60 420)">
    <text class="section-title ink">02 · WorkBuddy 控制中枢</text>
    <text x="1320" text-anchor="end" class="small muted">分层加载 · 状态门禁 · 禁止跳阶段</text>
    <rect y="26" width="1320" height="112" rx="8" class="surface"/>

    <g transform="translate(25 50)">
      <g>
        <circle cx="28" cy="28" r="28" fill="#e5f5f1"/>
        <text x="28" y="34" text-anchor="middle" class="code" fill="#177b6b">01</text>
        <text x="70" y="24" class="phase-title ink">MEMORY</text>
        <text x="70" y="47" class="small muted">常驻规则</text>
      </g>
      <path d="M214 28h42" stroke="#a8afb7" stroke-width="1.5"/><path d="M256 28l-7-5v10z" fill="#a8afb7"/>
      <g transform="translate(274)">
        <circle cx="28" cy="28" r="28" fill="#eef0fb"/>
        <text x="28" y="34" text-anchor="middle" class="code" fill="#5266b2">02</text>
        <text x="70" y="24" class="phase-title ink">sdd-router</text>
        <text x="70" y="47" class="small muted">唯一流程入口</text>
      </g>
      <path d="M496 28h42" stroke="#a8afb7" stroke-width="1.5"/><path d="M538 28l-7-5v10z" fill="#a8afb7"/>
      <g transform="translate(556)">
        <circle cx="28" cy="28" r="28" fill="#fff0e9"/>
        <text x="28" y="34" text-anchor="middle" class="code" fill="#b84f2b">03</text>
        <text x="70" y="24" class="phase-title ink">Manifest</text>
        <text x="70" y="47" class="small muted">19 个 Skills</text>
      </g>
      <path d="M764 28h42" stroke="#a8afb7" stroke-width="1.5"/><path d="M806 28l-7-5v10z" fill="#a8afb7"/>
      <g transform="translate(824)">
        <circle cx="28" cy="28" r="28" fill="#edf6e8"/>
        <text x="28" y="34" text-anchor="middle" class="code" fill="#527d34">04</text>
        <text x="70" y="24" class="phase-title ink">STATUS</text>
        <text x="70" y="47" class="small muted">门禁与回退</text>
      </g>
      <path d="M1032 28h42" stroke="#a8afb7" stroke-width="1.5"/><path d="M1074 28l-7-5v10z" fill="#a8afb7"/>
      <g transform="translate(1092)">
        <circle cx="28" cy="28" r="28" fill="#eceff2"/>
        <text x="28" y="34" text-anchor="middle" class="code" fill="#4d5660">05</text>
        <text x="70" y="24" class="phase-title ink">Stage Skill</text>
        <text x="70" y="47" class="small muted">当前阶段执行</text>
      </g>
    </g>
  </g>

  <g transform="translate(60 600)">
    <text class="section-title ink">03 · 六项核心能力</text>
    <text x="1320" text-anchor="end" class="small muted">让 AI 开发可确认、可追踪、可交付</text>

    <g transform="translate(0 28)">
      <g>
        <rect width="420" height="90" rx="8" class="surface"/>
        <circle cx="35" cy="34" r="19" fill="#e5f5f1"/>
        <text x="35" y="40" text-anchor="middle" class="code" fill="#177b6b">1</text>
        <text x="68" y="31" class="cap-title ink">会议纪要直达 PRD</text>
        <text x="68" y="55" class="cap-copy muted">提取决策、分歧与需求，并保留原文来源</text>
      </g>
      <g transform="translate(450)">
        <rect width="420" height="90" rx="8" class="surface"/>
        <circle cx="35" cy="34" r="19" fill="#eef0fb"/>
        <text x="35" y="40" text-anchor="middle" class="code" fill="#5266b2">2</text>
        <text x="68" y="31" class="cap-title ink">调研证据可视化</text>
        <text x="68" y="55" class="cap-copy muted">问题证据、竞品比较、结论决策三类图表</text>
      </g>
      <g transform="translate(900)">
        <rect width="420" height="90" rx="8" class="surface"/>
        <circle cx="35" cy="34" r="19" fill="#fff0e9"/>
        <text x="35" y="40" text-anchor="middle" class="code" fill="#b84f2b">3</text>
        <text x="68" y="31" class="cap-title ink">完整前端优先</text>
        <text x="68" y="55" class="cap-copy muted">全部页面与状态验收后，再进入后端开发</text>
      </g>
    </g>

    <g transform="translate(0 132)">
      <g>
        <rect width="420" height="90" rx="8" class="surface"/>
        <circle cx="35" cy="34" r="19" fill="#edf6e8"/>
        <text x="35" y="40" text-anchor="middle" class="code" fill="#527d34">4</text>
        <text x="68" y="31" class="cap-title ink">详细接口契约</text>
        <text x="68" y="55" class="cap-copy muted">业务、逻辑、字段、错误、权限与测试完整定义</text>
      </g>
      <g transform="translate(450)">
        <rect width="420" height="90" rx="8" class="surface"/>
        <circle cx="35" cy="34" r="19" fill="#e5f5f1"/>
        <text x="35" y="40" text-anchor="middle" class="code" fill="#177b6b">5</text>
        <text x="68" y="31" class="cap-title ink">状态失效与回退</text>
        <text x="68" y="55" class="cap-copy muted">上游变更只让受影响部分重新通过门禁</text>
      </g>
      <g transform="translate(900)">
        <rect width="420" height="90" rx="8" class="surface"/>
        <circle cx="35" cy="34" r="19" fill="#eef0fb"/>
        <text x="35" y="40" text-anchor="middle" class="code" fill="#5266b2">6</text>
        <text x="68" y="31" class="cap-title ink">证据交付与可选教程</text>
        <text x="68" y="55" class="cap-copy muted">以真实验证证明完成，并按需生成产品说明</text>
      </g>
    </g>
  </g>

  <g transform="translate(60 868)">
    <rect width="1320" height="54" rx="8" fill="#20242a"/>
    <text x="660" y="34" text-anchor="middle" fill="#ffffff" class="phase-title">从“AI 直接写代码”升级为“产品流程驱动的可靠交付”</text>
  </g>
</svg>
