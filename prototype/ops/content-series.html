<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>系列课 · 运营后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<style>
.cs-row {
  background: #fff; border: 1px solid #e8e8e8; border-radius: 8px;
  margin-bottom: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 14px;
  transition: all .15s;
}
.cs-row:hover { border-color: #165dff; box-shadow: 0 4px 14px rgba(22,93,255,.1); }
.cs-cover {
  width: 128px; height: 80px; border-radius: 6px;
  background: #f2f3f5; overflow: hidden; flex-shrink: 0;
}
.cs-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cs-info { flex: 1; min-width: 0; }
.cs-title {
  font-size: 15px; font-weight: 600; color: #1d2129;
  display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap;
}
.cs-desc { font-size: 12px; color: #8c8c8c; line-height: 1.6; margin-bottom: 8px; }
.cs-stats { display: flex; gap: 16px; font-size: 12px; color: #595959; flex-wrap: wrap; }
.cs-stats b { color: #165dff; font-weight: 600; font-family: monospace; }
.cs-cat { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: #e8f3ff; color: #165dff; font-weight: 500; }
.cs-src { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: #f4f0ff; color: #722ed1; font-weight: 500; }
.cs-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 380px; }
.cs-empty {
  font-size: 12px; color: #bfbfbf; text-align: center;
  padding: 32px; border: 1px dashed #e8e8e8; border-radius: 8px; background: #fafafa;
}
</style>
</head>
<body class="admin-body" data-module="content" data-nav="content-series" data-title="系列课" data-crumb="运营后台 / 内容 / 内容管理 / 系列课">

<div id="header-actions">
  <a class="btn btn-primary" href="content-series-edit.html">+ 新建平台系列课</a>
</div>

<div id="page-content" style="display:none">

  <div class="card" style="margin-bottom:14px"><div class="card-bd" style="padding:12px 16px">
    <div class="toolbar" style="border:none;padding:0;background:transparent">
      <input class="input" type="text" id="cs-keyword" placeholder="搜索系列课名称 / 讲师" style="width:240px" />
      <select class="input" id="cs-cat" style="width:160px">
        <option value="">全部内容分类</option>
      </select>
      <select class="input" id="cs-status" style="width:140px">
        <option value="">全部状态</option>
        <option value="draft">草稿</option>
        <option value="pending_audit">待平台审核</option>
        <option value="enabled">已启用</option>
        <option value="disabled">已停用</option>
        <option value="rejected">已驳回</option>
      </select>
      <select class="input" id="cs-source" style="width:120px">
        <option value="">全部来源</option>
        <option value="platform">平台</option>
        <option value="self">商家自建</option>
      </select>
      <button class="btn btn-primary" id="cs-query">查询</button>
      <button class="btn" id="cs-reset">重置</button>
    </div>
  </div></div>

  <p style="font-size:12px;color:#8c8c8c;margin:0 0 12px">说明：平台自建系列课可直接启用并下发商家只读；商家自建内容的上架前审核请在「平台审核」处理。</p>
  <div id="cs-list"></div>
  <div style="display:flex;align-items:center;gap:8px;margin-top:16px">
    <span style="color:#8c8c8c;font-size:12px">共 <b id="cs-count">0</b> 条</span>
  </div>
</div>

<div class="proto-mask" id="mask"></div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/content-cats.js?v=1"></script>
<script src="../assets/js/share-modal.js?v=1"></script>
<script src="../assets/js/series-store.js?v=1"></script>
<script src="../assets/js/ops-shell.js?v=7"></script>
<script>
setTimeout(function() {
  if (document.documentElement.getAttribute('data-shell-ready') === '1') return;
  if (document.querySelector('aside.sidebar')) return;
  var err = document.createElement('div');
  err.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fff1f0;color:#f53f3f;padding:12px 20px;border-bottom:1px solid #ffa39e;z-index:99999;font-family:system-ui;';
  err.innerHTML = '<b>⚠ 页面初始化失败</b>：请强制刷新。';
  document.body.appendChild(err);
}, 1500);

var Store = window.SeriesStore;
var filterCat = "", filterKeyword = "", filterStatus = "", filterSource = "";

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

function filteredSeries() {
  return Store.list({
    cat: filterCat || undefined,
    status: filterStatus || undefined,
    source: filterSource || undefined,
    keyword: filterKeyword || undefined
  });
}

function actionsOf(s) {
  var isPlat = s.source === "platform";
  var enabled = s.status === Store.STATUS.enabled;
  var pending = s.status === Store.STATUS.pending_audit;
  var html = "";
  html += '<button class="btn" data-share="' + s.id + '"' + (enabled ? "" : " disabled") + ">分享</button>";
  html += '<a class="btn" href="content-series-detail.html?id=' + encodeURIComponent(s.id) + '">查看</a>';
  html += '<a class="btn" href="content-series-outline.html?id=' + encodeURIComponent(s.id) + '">目录管理</a>';

  if (isPlat) {
    if (!enabled && !pending) {
      html += '<a class="btn" href="content-series-edit.html?id=' + encodeURIComponent(s.id) + '">编辑</a>';
      html += '<button class="btn btn-primary" data-shelf-on="' + s.id + '">启用</button>';
    }
    if (enabled) {
      html += '<button class="btn" data-shelf-off="' + s.id + '">停用</button>';
    }
    if (!enabled && (s.status === Store.STATUS.draft || s.status === Store.STATUS.disabled || s.status === Store.STATUS.rejected)) {
      html += '<button class="btn" style="color:#f53f3f;border-color:#ffa39e" data-del="' + s.id + '">删除</button>';
    }
  } else {
    if (pending) {
      html += '<a class="btn btn-primary" href="audit.html">去审核</a>';
    }
  }
  return html;
}

function renderList() {
  var list = filteredSeries();
  var html = list.map(function(s) {
    var label = Store.STATUS_LABEL[s.status] || s.status;
    var badge = Store.STATUS_BADGE[s.status] || "audit-cancelled";
    var chN = Store.chapterCount(s);
    return "" +
      '<div class="cs-row">' +
        '<div class="cs-cover"><img src="' + esc(s.cover) + '" alt="" /></div>' +
        '<div class="cs-info">' +
          '<div class="cs-title">' + esc(s.name) +
            '<span class="cs-cat">' + esc(s.cat) + "</span>" +
            '<span class="cs-src">' + (s.source === "platform" ? "平台" : "商家自建") + "</span>" +
            '<span class="audit-badge ' + badge + '">' + esc(label) + "</span>" +
            '<span style="color:#8c8c8c;font-size:11px;font-weight:400">ID: ' + esc(s.id) + "</span>" +
          "</div>" +
          '<div class="cs-desc">' + esc(s.intro) +
            (s.source === "self" ? " · 商户：" + esc(s.merchantName || "—") : "") + "</div>" +
          '<div class="cs-stats">' +
            "<span>讲师：" + esc(s.teacher) + "</span>" +
            "<span>总时长：<b>" + esc(Store.durationSummary(s)) + "</b></span>" +
            "<span>章节：<b>" + chN + "</b></span>" +
          "</div>" +
        "</div>" +
        '<div class="cs-actions">' + actionsOf(s) + "</div>" +
      "</div>";
  }).join("");
  document.getElementById("cs-list").innerHTML = html || '<div class="cs-empty">没有匹配的系列课</div>';
  document.getElementById("cs-count").textContent = list.length;
}

document.addEventListener("click", function(e) {
  var share = e.target.closest("[data-share]");
  if (share && !share.disabled) {
    var s = Store.get(share.getAttribute("data-share"));
    if (s) XiboShare.open({ type: "系列课", url: "https://yibo.app/s/" + s.id, cover: s.cover, name: s.name, desc: s.intro });
    return;
  }
  var off = e.target.closest("[data-shelf-off]");
  if (off) {
    Store.setStatus(off.getAttribute("data-shelf-off"), Store.STATUS.disabled);
    renderList(); Proto.toast("已停用"); return;
  }
  var on = e.target.closest("[data-shelf-on]");
  if (on) {
    var r = Store.enableDirect(on.getAttribute("data-shelf-on"));
    if (!r.ok) { Proto.toast(r.msg); return; }
    renderList(); Proto.toast("已启用（平台内容可下发商家）"); return;
  }
  var del = e.target.closest("[data-del]");
  if (del) {
    if (!confirm("确定删除？")) return;
    Store.remove(del.getAttribute("data-del"));
    renderList(); Proto.toast("已删除");
  }
});

document.getElementById("cs-cat").insertAdjacentHTML("beforeend", window.ContentCats.optionsHtml());
document.getElementById("cs-query").addEventListener("click", function() {
  filterCat = document.getElementById("cs-cat").value;
  filterStatus = document.getElementById("cs-status").value;
  filterSource = document.getElementById("cs-source").value;
  filterKeyword = document.getElementById("cs-keyword").value.trim();
  renderList();
});
document.getElementById("cs-reset").addEventListener("click", function() {
  filterCat = ""; filterKeyword = ""; filterStatus = ""; filterSource = "";
  document.getElementById("cs-cat").value = "";
  document.getElementById("cs-status").value = "";
  document.getElementById("cs-source").value = "";
  document.getElementById("cs-keyword").value = "";
  renderList();
});
["cs-cat","cs-status","cs-source"].forEach(function(id){
  document.getElementById(id).addEventListener("change", function(){ document.getElementById("cs-query").click(); });
});

function tryRender() {
  if (document.getElementById("page-content").style.display !== "none") renderList();
  else setTimeout(tryRender, 80);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tryRender);
else tryRender();
</script>
</body>
</html>
