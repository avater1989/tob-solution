<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>编辑线下课 · 运营后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/content-mgmt.css?v=4" />
<style>
.paid-box { display:none; margin-top:12px; padding:12px 14px; background:#f7f8fa; border-radius:6px; }
.paid-box.show { display:block; }
.paid-hint { font-size:12px; color:#86909c; margin-top:8px; line-height:1.5; }
</style>
</head>
<body class="admin-body" data-module="content" data-nav="content-offline" data-title="编辑线下课" data-crumb="运营后台 / 内容与审核 / 内容资产 / 线下课 / 编辑">

<div id="header-actions">
  <a class="btn" href="content-offline.html">返回列表</a>
  <button class="btn" id="btn-draft">保存草稿</button>
  <button class="btn btn-primary" id="btn-publish">保存并上架</button>
</div>

<div id="page-content" style="display:none">
  <a class="cm-back" href="content-offline.html">← 返回线下课列表</a>

  <div class="cm-tabs" id="anchors">
    <button class="btn active" data-tab="sec-base">基础信息</button>
    <button class="btn" data-tab="sec-time">时间与名额</button>
    <button class="btn" data-tab="sec-goods">关联商品</button>
    <button class="btn" data-tab="sec-access">报名与上架</button>
  </div>

  <div class="cm-section tab-panel active" id="sec-base">
    <div class="cm-section-hd"><h2>基础信息 <span class="hint">与线上课对齐；线下课无章节，需配置时间与地点</span></h2></div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field" style="grid-column:1/-1">
        <label>课程名称 * <span style="float:right;color:#8c8c8c;font-weight:400" id="name-cnt">0/45</span></label>
        <input class="input" id="f-name" maxlength="45" placeholder="建议 14 字内" />
      </div>
      <div class="field">
        <label>期数</label>
        <input class="input" id="f-term" placeholder="如：秋启 01 期" />
      </div>
      <div class="field">
        <label>讲师 *</label>
        <select class="input" id="f-teacher"></select>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>内容标签 <span style="float:right;color:#8c8c8c;font-weight:400">树状多选</span></label>
        <div id="f-tags"></div>
      </div>
      <div class="field">
        <label>课程角标</label>
        <select class="input" id="f-badge">
          <option value="">无</option>
          <option value="hot">热门课</option>
          <option value="premium">精品课</option>
        </select>
      </div>
      <div class="field">
        <label>封面图</label>
        <div class="cm-cover-up has-img" id="f-cover-box"><img id="f-cover-img" src="../assets/img/covers/classroom.jpg" alt="" /><span class="cm-cover-tip">更换封面</span></div>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>上课地址 *</label>
        <input class="input" id="f-address" placeholder="省市区 + 详细场地地址" />
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>课程简介 <span style="float:right;color:#8c8c8c;font-weight:400" id="intro-cnt">0/256</span></label>
        <textarea class="input" id="f-intro" rows="3" maxlength="256"></textarea>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>课程大纲（概要）</label>
        <textarea class="input" id="f-outline" rows="2" placeholder="线下日程 / 环节概要"></textarea>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>课程详情</label>
        <div class="rt-editor">
          <div class="rt-toolbar">
            <button type="button" class="rt-btn"><b>B</b></button>
            <button type="button" class="rt-btn"><i>I</i></button>
          </div>
          <div class="rt-body" id="f-detail" contenteditable="true"><span class="rt-placeholder">输入课程详情（富文本）</span></div>
        </div>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>购买须知</label>
        <textarea class="input" id="f-notes" rows="2" placeholder="如：请提前 15 分钟到场；未开课可退"></textarea>
      </div>
    </div>
  </div>

  <div class="cm-section tab-panel" id="sec-time">
    <div class="cm-section-hd"><h2>时间与名额</h2></div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field">
        <label>报名开始 *</label>
        <input class="input" type="datetime-local" id="f-signup-start" />
      </div>
      <div class="field">
        <label>报名截止 *</label>
        <input class="input" type="datetime-local" id="f-signup-end" />
      </div>
      <div class="field">
        <label>课程开始 *</label>
        <input class="input" type="datetime-local" id="f-course-start" />
      </div>
      <div class="field">
        <label>课程结束 *</label>
        <input class="input" type="datetime-local" id="f-course-end" />
      </div>
      <div class="field">
        <label>签到开始 *</label>
        <input class="input" type="datetime-local" id="f-checkin-start" />
      </div>
      <div class="field">
        <label>签到截止 *</label>
        <input class="input" type="datetime-local" id="f-checkin-end" />
      </div>
      <div class="field">
        <label>预计人数</label>
        <input class="input" type="number" id="f-expected" min="0" placeholder="如：80" />
      </div>
      <div class="field">
        <label>名额限制</label>
        <input class="input" type="number" id="f-capacity" min="1" placeholder="不填则不限" />
      </div>
    </div>
    <p class="paid-hint">建议：签到窗口落在课程开始前；名额限制 ≥ 预计人数。</p>
  </div>

  <div class="cm-section tab-panel" id="sec-goods">
    <div class="cm-section-hd">
      <h2>关联商品 <span class="hint">线下课不承载价格；门票价由商家自建的门票商品决定</span></h2>
    </div>
    <table class="data">
      <thead>
        <tr><th>商品</th><th style="width:110px">价格</th><th style="width:110px">审核</th><th style="width:100px">上架</th><th>已上架模块</th></tr>
      </thead>
      <tbody id="goods-tbody"></tbody>
    </table>
    <p class="muted" style="font-size:12px;margin:10px 0 0">报名资格免费或付费、试看与下单方式，由商家在「交易 · 店铺运营 · 首页装修」的上架配置里决定。</p>
  </div>

  <div class="cm-section tab-panel" id="sec-access">
    <div class="cm-section-hd"><h2>报名与上架</h2></div>
    <div class="cm-alert" id="access-hint" style="margin-bottom:12px"></div>
    <div class="field" style="margin-top:12px">
      <label>店铺显示</label>
      <div class="cm-choice">
        <label><input type="radio" name="store" value="1" checked> 显示</label>
        <label><input type="radio" name="store" value="0"> 隐藏</label>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/content-tags.js?v=2"></script>
<script src="../assets/js/teachers-store.js?v=2"></script>
<script src="../assets/js/prototype-business-store.js"></script>
<script src="../assets/js/goods-store.js?v=1"></script>
<script src="../assets/js/listing-store.js?v=1"></script>
<script src="../assets/js/ops-shell.js?v=16"></script>
<script>
var Tags = window.ContentTags;
var Goods = window.GoodsStore;
var Listing = window.ListingStore;
var Teachers = window.Teachers;

var PRESET = {
  O001: {
    name: "卓越家族培养计划 · 线下工作坊", term: "秋启 01 期", teacherId: "TCH02",
    tagIds: ["TG01", "TG02"], badge: "hot",
    cover: "../assets/img/covers/classroom.jpg",
    address: "上海市浦东新区陆家嘴环路 1000 号 3F",
    intro: "两天沉浸式工作坊，聚焦家族沟通与边界。",
    outlineText: "Day1 家庭系统觉察；Day2 沟通实操与复盘",
    detail: "<p>请提前 15 分钟到场签到。</p>",
    purchaseNotes: "未开课可退；开课后不支持退款。",
    signupStart: "2026-09-01T10:00", signupEnd: "2026-09-25T23:59",
    courseStart: "2026-09-28T09:30", courseEnd: "2026-09-29T17:00",
    checkinStart: "2026-09-28T08:30", checkinEnd: "2026-09-28T09:20",
    expected: 80, capacity: 100, access: "paid"
  },
  O002: {
    name: "亲子沟通实战 · 线下沙龙", term: "周末场", teacherId: "TCH01",
    tagIds: ["TG02", "TG04"], badge: "premium",
    cover: "../assets/img/covers/talk.jpg",
    address: "深圳市南山区科技园南路 8 号活动厅",
    intro: "半天沙龙，现场演练亲子对话。",
    outlineText: "破冰 → 案例演练 → 答疑",
    detail: "",
    purchaseNotes: "免费名额，报满即止。",
    signupStart: "2026-09-10T09:00", signupEnd: "2026-10-05T18:00",
    courseStart: "2026-10-12T14:00", courseEnd: "2026-10-12T17:30",
    checkinStart: "2026-10-12T13:30", checkinEnd: "2026-10-12T13:55",
    expected: 35, capacity: 40, access: "free"
  },
  O003: {
    name: "学习习惯养成 · 线下营", term: "冬令营", teacherId: "TCH03",
    tagIds: ["TG06", "TG04"], badge: "",
    cover: "../assets/img/covers/parent.jpg",
    address: "北京市海淀区中关村大街 1 号营地",
    intro: "三天两夜集训，培养自主学习习惯。",
    outlineText: "三天两夜日程",
    detail: "",
    purchaseNotes: "含食宿；开营前 7 天可退。",
    signupStart: "2026-11-01T10:00", signupEnd: "2026-11-20T23:59",
    courseStart: "2026-11-28T09:00", courseEnd: "2026-11-30T16:00",
    checkinStart: "2026-11-28T08:00", checkinEnd: "2026-11-28T08:50",
    expected: 25, capacity: 30, access: "paid"
  }
};

var id = new URLSearchParams(location.search).get("id") || "";
var isNew = !id || !PRESET[id];
var data = isNew ? {
  name: "", term: "", teacherId: "", tagIds: [], badge: "",
  cover: "../assets/img/covers/classroom.jpg", address: "", intro: "", outlineText: "",
  detail: "", purchaseNotes: "",
  signupStart: "", signupEnd: "", courseStart: "", courseEnd: "",
  checkinStart: "", checkinEnd: "", expected: "", capacity: "", access: "free"
} : PRESET[id];

document.getElementById("f-teacher").innerHTML = Teachers.optionsHtml({ emptyLabel: "请选择讲师" });
var tagPicker = Tags.mountTreeSelect("#f-tags", {
  selectedIds: data.tagIds || [],
  placeholder: "请选择内容标签（可多选）"
});

document.getElementById("f-name").value = data.name || "";
document.getElementById("f-term").value = data.term || "";
document.getElementById("f-teacher").value = data.teacherId || "";
document.getElementById("f-badge").value = data.badge || "";
document.getElementById("f-cover-img").src = data.cover || "../assets/img/covers/classroom.jpg";
document.getElementById("f-address").value = data.address || "";
document.getElementById("f-intro").value = data.intro || "";
document.getElementById("f-outline").value = data.outlineText || "";
document.getElementById("f-notes").value = data.purchaseNotes || "";
if (data.detail) document.getElementById("f-detail").innerHTML = data.detail;
document.getElementById("f-signup-start").value = data.signupStart || "";
document.getElementById("f-signup-end").value = data.signupEnd || "";
document.getElementById("f-course-start").value = data.courseStart || "";
document.getElementById("f-course-end").value = data.courseEnd || "";
document.getElementById("f-checkin-start").value = data.checkinStart || "";
document.getElementById("f-checkin-end").value = data.checkinEnd || "";
document.getElementById("f-expected").value = data.expected || "";
document.getElementById("f-capacity").value = data.capacity || "";

/* ---------- 关联商品（运营视角） ---------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}
/* 上架 / 审核状态徽标统一走 Proto.shelfTag（R-UI-010 全局配色一致） */
function auditTag(a) { return Proto.shelfTag(a); }
function shelfTag(s) { return Proto.shelfTag(s); }
(function renderGoods() {
  var rows = Goods.listByContent(id);
  var slots = Listing.activeSlotsOf(id);
  document.getElementById("goods-tbody").innerHTML = rows.length ? rows.map(function (g) {
    var used = Listing.listByContent(id).filter(function (r) { return r.default_goods_id === g.goods_id; });
    return "<tr>" +
      '<td><a href="../admin/goods-edit.html?create_mode=' + encodeURIComponent(g.create_mode || "from_content") +
        "&goods_id=" + encodeURIComponent(g.goods_id) + "&content_id=" + encodeURIComponent(id) + '">' + esc(g.name) + '</a></td>' +
      "<td><b>¥" + Number(g.price || 0).toFixed(2) + "</b></td>" +
      "<td>" + auditTag(g.audit_status) + "</td>" +
      "<td>" + shelfTag(g.status) + "</td>" +
      "<td>" + (used.length ? esc(used.map(function (r) { return Listing.SLOT_LABEL[r.slot] || r.slot; }).join("、")) : '<span class="muted">—</span>') + "</td>" +
      "</tr>";
  }).join("") : '<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">该场次尚无关联门票商品</td></tr>';

  var payable = rows.filter(function (g) { return g.price > 0; });
  var hint = document.getElementById("access-hint");
  if (!rows.length && data._legacyPrice) {
    hint.innerHTML = "本场次旧版本带有课程费 <b>¥" + data._legacyPrice + "</b>，内容已不承载价格，请商家补建门票商品。";
  } else if (payable.length) {
    hint.innerHTML = "已关联 " + payable.length + " 个付费门票商品（最低 ¥" +
      Math.min.apply(null, payable.map(function (g) { return g.price; })).toFixed(2) +
      "），C 端报名需付费；" + (slots.length ? "当前已上架至 " + esc(slots.join("、")) + "。" : "尚未上架到小程序模块。");
  } else {
    hint.innerHTML = "当前无付费商品，本场为免费报名。";
  }
})();

function updCnt() {
  document.getElementById("name-cnt").textContent = (document.getElementById("f-name").value || "").length + "/45";
  document.getElementById("intro-cnt").textContent = (document.getElementById("f-intro").value || "").length + "/256";
}
["f-name", "f-intro"].forEach(function (fid) {
  document.getElementById(fid).addEventListener("input", updCnt);
});
updCnt();

document.getElementById("anchors").addEventListener("click", function (e) {
  var b = e.target.closest("[data-tab]");
  if (!b) return;
  document.querySelectorAll("#anchors .btn").forEach(function (x) { x.classList.remove("active"); });
  b.classList.add("active");
  document.querySelectorAll(".tab-panel").forEach(function (p) {
    p.classList.toggle("active", p.id === b.getAttribute("data-tab"));
  });
});

document.getElementById("f-cover-box").addEventListener("click", function () {
  Proto.toast("已选择封面（原型）");
});

function validate() {
  if (!document.getElementById("f-name").value.trim()) { Proto.toast("请填写课程名称"); return false; }
  if (!document.getElementById("f-teacher").value) { Proto.toast("请选择讲师"); return false; }
  if (!document.getElementById("f-address").value.trim()) { Proto.toast("请填写上课地址"); return false; }
  if (!document.getElementById("f-signup-start").value || !document.getElementById("f-signup-end").value) {
    Proto.toast("请填写报名时间"); return false;
  }
  if (!document.getElementById("f-course-start").value || !document.getElementById("f-course-end").value) {
    Proto.toast("请填写课程时间"); return false;
  }
  if (!document.getElementById("f-checkin-start").value || !document.getElementById("f-checkin-end").value) {
    Proto.toast("请填写签到时间"); return false;
  }
  return true;
}

function saveToast(msg) {
  if (!validate()) return;
  Proto.toast(msg);
  setTimeout(function () { location.href = "content-offline.html"; }, 600);
}

document.getElementById("btn-draft").addEventListener("click", function () { saveToast("草稿已保存"); });
document.getElementById("btn-publish").addEventListener("click", function () { saveToast("已保存并上架（原型）"); });
</script>
</body>
</html>
