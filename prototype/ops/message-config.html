<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>消息配置 · 运营后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=17" />
</head>
<body class="admin-body" data-module="sys" data-nav="message-config" data-title="消息配置" data-crumb="运营后台 / 系统管理 / 消息配置">
<div id="page-content" style="display:none">

  <div class="alert alert-info" style="margin-bottom:12px;display:block;line-height:1.9">
    <span>
      本页只做<b>模板映射</b>：短信模板在<b>短信平台</b>配置、小程序服务通知模板在<b>微信公众平台</b>配置，本页记录
      <b>模板类型</b>、<b>对应平台的模板 ID</b> 与<b>适用租户</b>，供各业务场景调用。
      商家端仅可查看发送记录，不可修改模板。
    </span>
  </div>

  <!-- 筛选 -->
  <div class="card" style="margin-bottom:8px"><div class="card-bd">
    <div class="form-grid" style="grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 12px">
      <input id="f-name" placeholder="模板名称 / 平台模板 ID" />
      <select id="f-type">
        <option value="">模板类型</option>
        <option value="sms">短信</option>
        <option value="mp">小程序服务通知</option>
      </select>
      <select id="f-tenant">
        <option value="">适用租户</option>
        <option value="all">全部租户</option>
        <option value="星启家庭教育">星启家庭教育</option>
        <option value="晨光少儿成长">晨光少儿成长</option>
        <option value="慧心教育">慧心教育</option>
        <option value="青藤家长学堂">青藤家长学堂</option>
      </select>
      <select id="f-status">
        <option value="">状态</option>
        <option value="on">启用</option>
        <option value="off">停用</option>
      </select>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" id="btn-query">查询</button>
        <button class="btn" id="btn-reset">重置</button>
      </div>
    </div>
  </div></div>

  <!-- 列表工具栏（列表上方左侧） -->
  <div class="toolbar" style="margin-bottom:8px">
    <button class="btn btn-primary" id="btn-add">新增模板映射</button>
    <div class="spacer"></div>
    <span class="muted" style="font-size:12px">模板正文与审核在各自平台维护，本页仅登记映射关系</span>
  </div>

  <!-- 模板映射列表 -->
  <div class="card"><div class="card-bd" style="padding:0">
    <table class="data">
      <thead>
        <tr>
          <th style="width:180px">模板名称</th>
          <th style="width:150px">模板类型</th>
          <th style="width:190px">平台模板 ID</th>
          <th>适用租户</th>
          <th style="width:90px">状态</th>
          <th style="width:150px">更新时间</th>
          <th style="width:130px">操作</th>
        </tr>
      </thead>
      <tbody id="tpl-tbody"></tbody>
    </table>
  </div></div>

  <div class="toolbar" style="margin-top:8px">
    <span class="muted">共 <b id="tpl-count">0</b> 条模板映射</span>
    <div class="spacer"></div>
    <select><option>10条/页</option><option>20条/页</option></select>
    <button class="btn btn-sm" disabled>上一页</button><button class="btn btn-sm">下一页</button>
  </div>
</div>

<!-- 新增 / 编辑模板映射 -->
<div class="proto-mask" id="mask"></div>
<div class="proto-modal" id="modal-tpl" style="width:600px">
  <div class="proto-modal-hd"><h3 id="tpl-title" style="font-size:16px;font-weight:600">新增模板映射</h3><button class="btn btn-sm btn-ghost" data-close>×</button></div>
  <div class="proto-modal-bd">
    <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:10px 16px">
      <div class="field" style="grid-column:1/-1"><label>模板名称 *</label><input id="tpl-name" placeholder="如：支付成功通知" /></div>
      <div class="field"><label>模板类型 *</label>
        <select id="tpl-type" style="width:100%;padding:7px 8px;border:1px solid var(--color-border);border-radius:6px">
          <option value="sms">短信</option>
          <option value="mp">小程序服务通知</option>
        </select>
      </div>
      <div class="field"><label>平台模板 ID *</label><input id="tpl-pid" placeholder="如 SMS-TPL-1001 / MP-TPL-2001" />
        <span class="muted" style="font-size:12px" id="tpl-pid-hint">短信平台模板 ID</span>
      </div>
      <div class="field" style="grid-column:1/-1"><label>适用租户 *</label>
        <select id="tpl-scope" style="width:100%;padding:7px 8px;border:1px solid var(--color-border);border-radius:6px">
          <option value="all">全部租户</option>
          <option value="some">指定租户</option>
        </select>
      </div>
      <div class="field" style="grid-column:1/-1" id="tpl-tenants-wrap" hidden>
        <label>选择租户（可多选）*</label>
        <div class="tp-list" id="tpl-tenants"></div>
      </div>
      <div class="field"><label>状态</label>
        <select id="tpl-status" style="width:100%;padding:7px 8px;border:1px solid var(--color-border);border-radius:6px">
          <option value="on">启用</option>
          <option value="off">停用</option>
        </select>
      </div>
    </div>
    <p class="muted" style="margin:10px 0 0;font-size:12px">模板正文在对应平台维护；本页仅登记模板 ID 与适用范围，切换模板 ID 后新发送的消息立即生效。</p>
  </div>
  <div class="proto-drawer-ft" style="border-top:1px solid var(--color-border);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" data-close>取消</button>
    <button class="btn btn-primary" id="tpl-save">保存</button>
  </div>
</div>

<style>
.mono { font-family:ui-monospace,Consolas,monospace; font-size:12px; }
.tp-list { display:flex; flex-wrap:wrap; gap:8px 16px; padding:8px 10px; border:1px solid var(--color-border); border-radius:6px; }
.tp-list label { font-size:13px; white-space:nowrap; }
</style>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/ops-shell.js?v=29"></script>
<script>
(function () {
  var TENANTS = ["星启家庭教育", "晨光少儿成长", "慧心教育", "青藤家长学堂", "乐学伴家庭", "知行家研习社"];

  /* 模板映射种子：只登记类型 + 平台模板 ID + 适用租户 */
  var TPLS = [
    { id: "1", name: "支付成功通知",   type: "sms", pid: "SMS-TPL-1001", scope: "all",  tenants: [],  status: "on",  updated: "2026-09-28 16:40" },
    { id: "2", name: "开课提醒通知",   type: "sms", pid: "SMS-TPL-1002", scope: "all",  tenants: [],  status: "on",  updated: "2026-09-28 16:40" },
    { id: "3", name: "退款结果通知",   type: "sms", pid: "SMS-TPL-1003", scope: "all",  tenants: [],  status: "on",  updated: "2026-09-20 10:12" },
    { id: "4", name: "支付成功",       type: "mp",  pid: "MP-TPL-2001",  scope: "all",  tenants: [],  status: "on",  updated: "2026-09-18 09:30" },
    { id: "5", name: "权益开通",       type: "mp",  pid: "MP-TPL-2002",  scope: "all",  tenants: [],  status: "on",  updated: "2026-09-18 09:30" },
    { id: "6", name: "直播开播提醒",   type: "mp",  pid: "MP-TPL-2003",  scope: "some", tenants: ["星启家庭教育", "青藤家长学堂"], status: "on",  updated: "2026-10-08 14:05" },
    { id: "7", name: "会员到期提醒",   type: "sms", pid: "SMS-TPL-1004", scope: "some", tenants: ["晨光少儿成长"], status: "off", updated: "2026-10-12 11:20" }
  ];

  var mask = document.getElementById("mask");
  function closeAll() { mask.classList.remove("open"); document.querySelectorAll(".proto-modal").forEach(function (n) { n.classList.remove("open"); }); }
  function open(n) { mask.classList.add("open"); n.classList.add("open"); }
  mask.addEventListener("click", closeAll);
  document.querySelectorAll("[data-close]").forEach(function (n) { n.addEventListener("click", closeAll); });

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  function typeLabel(t) { return t === "sms" ? "短信" : "小程序服务通知"; }
  function scopeLabel(r) { return r.scope === "all" ? "全部租户" : ("指定 " + r.tenants.length + " 个租户"); }

  function filtered() {
    var kw = (document.getElementById("f-name").value || "").trim().toLowerCase();
    var ty = document.getElementById("f-type").value;
    var te = document.getElementById("f-tenant").value;
    var st = document.getElementById("f-status").value;
    return TPLS.filter(function (r) {
      if (kw && r.name.toLowerCase().indexOf(kw) < 0 && r.pid.toLowerCase().indexOf(kw) < 0) return false;
      if (ty && r.type !== ty) return false;
      if (st && r.status !== st) return false;
      if (te === "all" && r.scope !== "all") return false;
      if (te && te !== "all" && !(r.scope === "all" || r.tenants.indexOf(te) >= 0)) return false;
      return true;
    });
  }

  function render() {
    var rows = filtered();
    document.getElementById("tpl-tbody").innerHTML = rows.map(function (r) {
      return "<tr data-id=\"" + r.id + "\">" +
        "<td><b>" + esc(r.name) + "</b></td>" +
        "<td><span class=\"tag " + (r.type === "sms" ? "tag-blue" : "tag-green") + "\">" + typeLabel(r.type) + "</span></td>" +
        "<td class=\"mono\">" + esc(r.pid) + "</td>" +
        "<td>" + scopeLabel(r) +
          (r.scope === "some" ? "<br><span class=\"muted\" style=\"font-size:12px\">" + esc(r.tenants.join("、")) + "</span>" : "") +
        "</td>" +
        "<td>" + (r.status === "on" ? '<span class="badge badge-success">启用</span>' : '<span class="badge">停用</span>') + "</td>" +
        "<td>" + esc(r.updated) + "</td>" +
        "<td class=\"row-actions\"><a href=\"#\" data-row-act=\"edit\">编辑</a><a href=\"#\" data-row-act=\"" + (r.status === "on" ? "off" : "on") + "\">" + (r.status === "on" ? "停用" : "启用") + "</a></td>" +
        "</tr>";
    }).join("");
    document.getElementById("tpl-count").textContent = rows.length;
  }

  /* 适用租户多选 */
  function renderTenantChecks(selected) {
    document.getElementById("tpl-tenants").innerHTML = TENANTS.map(function (t) {
      var ck = selected && selected.indexOf(t) >= 0 ? " checked" : "";
      return "<label><input type=\"checkbox\" value=\"" + esc(t) + "\"" + ck + "> " + esc(t) + "</label>";
    }).join("");
  }
  function currentFormTenants() {
    return Array.prototype.slice.call(document.querySelectorAll("#tpl-tenants input:checked")).map(function (n) { return n.value; });
  }

  document.getElementById("tpl-scope").addEventListener("change", function () {
    document.getElementById("tpl-tenants-wrap").hidden = this.value !== "some";
  });
  document.getElementById("tpl-type").addEventListener("change", function () {
    document.getElementById("tpl-pid-hint").textContent =
      this.value === "sms" ? "短信平台模板 ID" : "微信公众平台模板 ID";
  });

  var editing = null;

  document.getElementById("btn-add").addEventListener("click", function () {
    editing = null;
    document.getElementById("tpl-title").textContent = "新增模板映射";
    document.getElementById("tpl-name").value = "";
    document.getElementById("tpl-type").value = "sms";
    document.getElementById("tpl-pid").value = "";
    document.getElementById("tpl-pid-hint").textContent = "短信平台模板 ID";
    document.getElementById("tpl-scope").value = "all";
    document.getElementById("tpl-tenants-wrap").hidden = true;
    renderTenantChecks([]);
    document.getElementById("tpl-status").value = "on";
    open(document.getElementById("modal-tpl"));
  });

  document.getElementById("tpl-tbody").addEventListener("click", function (e) {
    var a = e.target.closest("[data-row-act]");
    if (!a) return;
    e.preventDefault();
    var tr = a.closest("tr");
    var r = TPLS.filter(function (x) { return x.id === tr.getAttribute("data-id"); })[0];
    if (!r) return;
    var act = a.getAttribute("data-row-act");
    if (act === "on" || act === "off") {
      r.status = act;
      r.updated = "2026-10-21 " + new Date().toTimeString().slice(0, 5);
      render();
      Proto.toast(act === "on" ? "模板映射已启用（原型）" : "模板映射已停用（原型）");
      return;
    }
    editing = r;
    document.getElementById("tpl-title").textContent = "编辑模板映射 · " + r.name;
    document.getElementById("tpl-name").value = r.name;
    document.getElementById("tpl-type").value = r.type;
    document.getElementById("tpl-pid").value = r.pid;
    document.getElementById("tpl-pid-hint").textContent = r.type === "sms" ? "短信平台模板 ID" : "微信公众平台模板 ID";
    document.getElementById("tpl-scope").value = r.scope;
    document.getElementById("tpl-tenants-wrap").hidden = r.scope !== "some";
    renderTenantChecks(r.tenants);
    document.getElementById("tpl-status").value = r.status;
    open(document.getElementById("modal-tpl"));
  });

  document.getElementById("tpl-save").addEventListener("click", function () {
    var name = document.getElementById("tpl-name").value.trim();
    var pid = document.getElementById("tpl-pid").value.trim();
    var type = document.getElementById("tpl-type").value;
    var scope = document.getElementById("tpl-scope").value;
    var tenants = scope === "some" ? currentFormTenants() : [];
    if (!name) { Proto.toast("请填写模板名称"); return; }
    if (!pid) { Proto.toast("请填写平台模板 ID"); return; }
    if (scope === "some" && !tenants.length) { Proto.toast("请至少选择 1 个适用租户"); return; }
    var now = "2026-10-21 " + new Date().toTimeString().slice(0, 5);
    if (editing) {
      editing.name = name; editing.pid = pid; editing.type = type;
      editing.scope = scope; editing.tenants = tenants;
      editing.status = document.getElementById("tpl-status").value;
      editing.updated = now;
    } else {
      TPLS.push({
        id: String(Date.now()), name: name, type: type, pid: pid,
        scope: scope, tenants: tenants,
        status: document.getElementById("tpl-status").value, updated: now
      });
    }
    closeAll();
    render();
    Proto.toast(editing ? "模板映射已更新（原型）" : "模板映射已创建（原型）");
  });

  document.getElementById("btn-query").addEventListener("click", render);
  document.getElementById("btn-reset").addEventListener("click", function () {
    ["f-name", "f-type", "f-tenant", "f-status"].forEach(function (id) { document.getElementById(id).value = ""; });
    render();
    Proto.toast("已重置");
  });

  renderTenantChecks([]);
  render();
})();
</script>
</body>
</html>
