<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>目录管理 · 运营后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/content-mgmt.css?v=4" />
</head>
<body class="admin-body" data-module="content" data-nav="content-series" data-title="目录管理" data-crumb="运营后台 / 内容 / 系列课 / 目录管理">

<div id="header-actions">
  <button class="btn" id="btn-new-ch" style="display:none">+ 新建章节</button>
  <button class="btn btn-primary" id="btn-publish" style="display:none">完成并提交审核</button>
  <a class="btn" href="content-series.html">返回列表</a>
</div>

<div id="page-content" style="display:none">
  <a class="cm-back" href="content-series.html">← 返回系列课列表</a>

  <div class="cm-page-hd">
    <div>
      <h1 id="o-name">—</h1>
      <p class="sub" id="o-sub">—</p>
    </div>
  </div>

  <div class="cm-hero">
    <div class="cm-avatar" id="o-avatar">课</div>
    <div class="cm-hero-bd">
      <div class="cm-hero-title">
        <span id="o-name2">—</span>
        <span class="cm-pill" id="o-shelf">—</span>
      </div>
      <div class="cm-hero-desc" id="o-desc">—</div>
      <div class="cm-hero-meta">
        <span><b id="o-ch-count">0</b> 章节</span>
        <span><b id="o-v-count">0</b> 视频</span>
        <span id="o-source-label"></span>
      </div>
    </div>
  </div>

  <div class="cm-alert" id="o-readonly" style="display:none"></div>
  <div id="o-chapters"></div>
</div>

<div class="proto-mask" id="mask"></div>

<div class="proto-modal" id="modal-chapter">
  <div style="background:#fff;border-radius:10px;width:520px;max-width:94vw;max-height:86vh;overflow:auto;display:flex;flex-direction:column">
    <div class="proto-modal-hd">
      <h3 style="margin:0;font-size:16px" id="ch-modal-title">编辑章节</h3>
      <button class="ctrl-icon-btn" data-close>×</button>
    </div>
    <div class="proto-modal-bd">
      <p style="margin:0 0 12px;font-size:12px;color:#8c8c8c" id="ch-modal-course">—</p>
      <div class="field"><label>章节名称 *</label><input class="input" id="ch-name" placeholder="如：第一章 认识情绪" /></div>
      <div class="field">
        <label>视频来源 *</label>
        <select class="input" id="ch-src"></select>
        <div style="font-size:11px;color:#8c8c8c;margin-top:4px">从视频库选择，仅记录引用，不上传或复制文件</div>
      </div>
      <div class="field"><label>预计学习时长</label><input class="input" id="ch-dur" placeholder="如：15分钟" /></div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;font-weight:400"><input type="checkbox" id="ch-req" checked> 设为必修</label>
        <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-top:8px"><input type="checkbox" id="ch-trial"> 设为免费试看章节</label>
      </div>
    </div>
    <div class="proto-modal-ft" style="justify-content:flex-end;gap:8px">
      <button class="btn" data-close>取消</button>
      <button class="btn btn-primary" id="btn-save-ch">保存章节</button>
    </div>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/series-store.js?v=1"></script>
<script src="../assets/js/ops-shell.js?v=7"></script>
<script>
var Store = window.SeriesStore;
var params = new URLSearchParams(location.search);
var id = params.get("id") || "";
var intentAudit = params.get("intent") === "audit";
var forceReadonly = params.get("readonly") === "1";
var course = Store.get(id);
var editingIdx = -1;

if (!course) {
  document.getElementById("page-content").innerHTML =
    '<div class="card"><div class="card-bd" style="padding:48px;text-align:center"><p>未找到系列课</p><a class="btn" href="content-series.html">返回列表</a></div></div>';
  document.getElementById("page-content").style.display = "";
} else {
  document.getElementById("ch-src").innerHTML = Store.videoOptionsHtml();
}

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }

function isReadonly() {
  return forceReadonly || !Store.canEditOutline(course);
}

function render() {
  if (!course) return;
  course = Store.get(id) || course;
  var readonly = isReadonly();
  var label = Store.STATUS_LABEL[course.status] || course.status;
  document.getElementById("o-name").textContent = course.name;
  document.getElementById("o-name2").textContent = course.name;
  document.getElementById("o-sub").textContent = course.cat + " · 系列视频课程";
  document.getElementById("o-desc").textContent = course.intro;
  document.getElementById("o-avatar").textContent = (course.name || "课").charAt(0);
  document.getElementById("o-shelf").textContent = label;
  document.getElementById("o-shelf").className = "cm-pill" + (course.status === Store.STATUS.enabled ? "" : " off");
  document.getElementById("o-source-label").textContent = course.source === "platform" ? "来源：平台" : "来源：自建";

  var alertEl = document.getElementById("o-readonly");
  if (readonly) {
    alertEl.style.display = "block";
    if (course.status === Store.STATUS.enabled) {
      alertEl.textContent = "内容已启用，目录锁定。请先返回列表停用后再调整。";
    } else if (course.status === Store.STATUS.pending_audit) {
      alertEl.textContent = "商家内容正在平台审核中，目录锁定。请前往「平台审核」处理。";
    } else if (course.source === "self") {
      alertEl.textContent = "商家自建内容目录以商家侧维护为主。";
    } else {
      alertEl.textContent = "当前为只读模式。";
    }
  } else {
    alertEl.style.display = "none";
  }

  document.getElementById("btn-new-ch").style.display = readonly ? "none" : "";
  document.getElementById("btn-publish").style.display = readonly ? "none" : "";
  document.getElementById("btn-publish").textContent =
    course.source === "platform" ? "完成并启用" : "完成并提交审核";

  var n = Store.chapterCount(course);
  document.getElementById("o-ch-count").textContent = n;
  document.getElementById("o-v-count").textContent = n;

  var html = (course.chapters || []).map(function(ch, i){
    var acts = !readonly
      ? '<div class="cm-chapter-acts">' +
          '<button class="btn" data-move="' + i + '" data-dir="-1"' + (i === 0 ? " disabled" : "") + ">上移</button>" +
          '<button class="btn" data-move="' + i + '" data-dir="1"' + (i === course.chapters.length - 1 ? " disabled" : "") + ">下移</button>" +
          '<button class="btn" data-edit-ch="' + i + '">编辑</button>' +
          '<button class="btn" style="color:#f53f3f;border-color:#ffa39e" data-del-ch="' + i + '">删除</button>' +
        "</div>"
      : "";
    var tags = "";
    if (ch.required) tags += '<span class="req">必修</span>';
    if (ch.trial) tags += '<span class="req" style="background:#e8f3ff;color:#165dff;margin-left:4px">试看</span>';
    return '<div class="cm-chapter">' +
      '<div class="cm-chapter-hd">' +
        '<div class="cm-chapter-num">' + (i + 1) + "</div>" +
        '<div class="cm-chapter-title">' + esc(ch.title) + tags + "</div>" +
        '<span class="cm-chapter-status">已配置视频</span>' + acts +
      "</div>" +
      '<div class="cm-lesson">' +
        '<span class="cm-lesson-idx">▶</span>' +
        '<div class="cm-lesson-bd">' +
          '<div class="cm-lesson-title">' + esc(ch.videoName) + "</div>" +
          '<div class="cm-lesson-meta">' + esc(ch.videoName) + ".mp4 · " + esc(ch.duration || "—") +
            (ch.trial ? " · 免费试看" : "") + "</div>" +
        "</div>" +
        '<span class="cm-type-tag">视频</span>' +
      "</div>" +
    "</div>";
  }).join("");
  document.getElementById("o-chapters").innerHTML = html ||
    '<div class="cm-section" style="text-align:center;color:#bfbfbf">暂无章节，点击「新建章节」开始编排（每章对应一个视频）</div>';
}

if (course) render();

var mask = document.getElementById("mask");
function closeAll(){
  mask && mask.classList.remove("open");
  document.querySelectorAll(".proto-modal").forEach(function(n){ n.classList.remove("open"); });
}

function openChapterModal(idx){
  editingIdx = idx;
  var isNew = idx < 0;
  document.getElementById("ch-modal-title").textContent = isNew ? "新建章节" : "编辑章节";
  document.getElementById("ch-modal-course").textContent = course.name;
  if (isNew) {
    document.getElementById("ch-name").value = "";
    document.getElementById("ch-src").selectedIndex = 0;
    var v0 = Store.findVideo(document.getElementById("ch-src").value);
    document.getElementById("ch-dur").value = v0 ? v0.duration : "";
    document.getElementById("ch-req").checked = true;
    document.getElementById("ch-trial").checked = false;
  } else {
    var ch = course.chapters[idx];
    document.getElementById("ch-name").value = ch.title;
    document.getElementById("ch-src").innerHTML = Store.videoOptionsHtml(ch.videoId);
    document.getElementById("ch-dur").value = ch.duration || "";
    document.getElementById("ch-req").checked = !!ch.required;
    document.getElementById("ch-trial").checked = !!ch.trial;
  }
  mask.classList.add("open");
  document.getElementById("modal-chapter").classList.add("open");
}

document.getElementById("ch-src").addEventListener("change", function(){
  var v = Store.findVideo(this.value);
  if (v) document.getElementById("ch-dur").value = v.duration;
});

document.getElementById("btn-new-ch").addEventListener("click", function(){ openChapterModal(-1); });
document.getElementById("btn-publish").addEventListener("click", function(){
  course = Store.get(id);
  if (course.source === "platform") {
    var r = Store.enableDirect(id);
    if (!r.ok) { Proto.toast(r.msg); return; }
    Proto.toast("已启用");
  } else {
    var r2 = Store.submitAudit(id);
    if (!r2.ok) { Proto.toast(r2.msg); return; }
    Proto.toast("已提交平台审核");
  }
  course = Store.get(id);
  render();
});

document.getElementById("btn-save-ch").addEventListener("click", function(){
  var title = document.getElementById("ch-name").value.trim();
  if (!title) { Proto.toast("请填写章节名称"); return; }
  var videoId = document.getElementById("ch-src").value;
  var v = Store.findVideo(videoId);
  if (!v) { Proto.toast("请选择视频"); return; }
  var ch = {
    id: editingIdx >= 0 ? course.chapters[editingIdx].id : undefined,
    title: title,
    videoId: videoId,
    videoName: v.name,
    duration: document.getElementById("ch-dur").value.trim() || v.duration,
    required: document.getElementById("ch-req").checked,
    trial: document.getElementById("ch-trial").checked
  };
  Store.upsertChapter(id, ch, editingIdx);
  course = Store.get(id);
  closeAll();
  render();
  Proto.toast("章节已保存");
});

document.addEventListener("click", function(e){
  var edit = e.target.closest("[data-edit-ch]");
  if (edit) { openChapterModal(+edit.getAttribute("data-edit-ch")); return; }
  var del = e.target.closest("[data-del-ch]");
  if (del) {
    Store.removeChapter(id, +del.getAttribute("data-del-ch"));
    course = Store.get(id);
    render(); Proto.toast("章节已删除"); return;
  }
  var mv = e.target.closest("[data-move]");
  if (mv) {
    Store.reorderChapter(id, +mv.getAttribute("data-move"), +mv.getAttribute("data-dir"));
    course = Store.get(id);
    render();
  }
});

mask && mask.addEventListener("click", closeAll);
document.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeAll); });

if (course && intentAudit && Store.canSubmitAudit(course) && Store.chapterCount(course) > 0) {
  setTimeout(function(){ Proto.toast("目录配置完成后，可点击「完成并提交审核」"); }, 400);
}
</script>
</body>
</html>
