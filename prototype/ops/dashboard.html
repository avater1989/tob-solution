<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>运营工作台 · 运营后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=17" />
<style>
.wb-sec { margin-bottom: 20px; scroll-margin-top: 72px; }
.wb-sec h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.wb-sec .sub { margin: 0 0 12px; font-size: 13px; color: var(--color-text-muted); }
.wb-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
/* 时间维度切换（今日 / 近 7 天 / 近 30 天） */
.wb-dim { display: flex; gap: 4px; margin: 0 0 12px; }
.wb-dim button { padding: 5px 14px; border: 1px solid var(--color-border); background: #fff; border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--color-text-secondary); font-family: inherit; }
.wb-dim button.active { background: #165dff; border-color: #165dff; color: #fff; }
.wb-kpis a, .wb-item {
  display: block; padding: 14px 16px; background: #fff; border: 1px solid var(--color-border);
  border-radius: 8px; text-decoration: none; color: inherit;
}
.wb-kpis .label { font-size: 12px; color: var(--color-text-muted); }
.wb-kpis .value { font-size: 22px; font-weight: 700; margin-top: 6px; }
.wb-todo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.wb-item { display: flex; justify-content: space-between; align-items: center; }
.wb-item .n { min-width: 36px; height: 36px; border-radius: 18px; background: #e8f3ff; color: #165dff; font-weight: 700; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body class="admin-body" data-module="workbench" data-nav="dashboard" data-title="运营工作台" data-crumb="运营后台 / 工作台" data-assist="1">
<div id="header-actions">
  <button class="btn" data-toast="已刷新（原型）">刷新</button>
</div>
<div id="page-content" style="display:none">

  <section class="wb-sec" id="today">
    <h2>今日经营</h2>
    <p class="sub">平台侧经营概览 · 可切换时间维度（2026-10-21 新增近 7 天 / 近 30 天）</p>
    <div class="wb-dim" id="dim-switch">
      <button type="button" class="active" data-dim="today">今日</button>
      <button type="button" data-dim="d7">近 7 天</button>
      <button type="button" data-dim="d30">近 30 天</button>
    </div>
    <div class="wb-kpis">
      <a href="tenants.html"><div class="label">接入商家</div><div class="value" id="kpi-tenants">18</div></a>
      <a href="trade-orders.html"><div class="label">全局成交订单</div><div class="value" id="kpi-orders">326</div></a>
      <a href="trade-orders.html"><div class="label">成交金额</div><div class="value" id="kpi-gmv">¥32,860.00</div></a>
      <a href="settlements.html"><div class="label">待复核结算</div><div class="value" id="kpi-settle">5</div></a>
      <a href="audit.html" data-phase2-only="1"><div class="label">待审内容</div><div class="value" id="kpi-audit">12</div></a>
    </div>
  </section>

  <section class="wb-sec" id="todo">
    <h2>我的待办</h2>
    <p class="sub">数字跳转处理页</p>
    <div class="wb-todo">
      <a class="wb-item" href="tenants.html?tab=apply" data-phase2-only="1"><span>开通申请</span><div class="n">3</div></a>
      <a class="wb-item" href="audit.html" data-phase2-only="1"><span>内容审核</span><div class="n">8</div></a>
      <a class="wb-item" href="audit.html?type=live" data-phase2-only="1"><span>直播审核</span><div class="n">2</div></a>
      <a class="wb-item" href="audit.html?type=goods" data-phase2-only="1"><span>商品审核</span><div class="n">4</div></a>
      <a class="wb-item" href="settlements.html"><span>结算复核</span><div class="n">5</div></a>
      <a class="wb-item" href="payouts.html"><span>提现审核</span><div class="n">2</div></a>
    </div>
  </section>

  <section class="wb-sec" id="alert">
    <h2>异常提醒</h2>
    <div class="wb-todo">
      <a class="wb-item" href="recon.html"><span>对账异常</span><div class="n">3</div></a>
      <a class="wb-item" href="entitlement.html?filter=exception" data-phase2-only="1"><span>权益异常</span><div class="n">2</div></a>
      <a class="wb-item" href="aftersales.html" data-phase2-only="1"><span>售后积压</span><div class="n">4</div></a>
      <a class="wb-item" href="audit.html?tab=appeal" data-phase2-only="1"><span>申诉处理</span><div class="n">1</div></a>
      <a class="wb-item" href="onboard-audit.html" data-phase2-only="1"><span>进件异常</span><div class="n">1</div></a>
      <a class="wb-item" href="data.html?view=health" data-phase2-only="1"><span>商家健康度告警</span><div class="n">2</div></a>
    </div>
  </section>

</div>
<script src="../assets/js/proto.js"></script>
<script src="../assets/js/ops-shell.js?v=29"></script>
<script>
(function () {
  /* 今日经营时间维度（2026-10-21 评审标注）：今日 / 近 7 天 / 近 30 天 */
  var DATA = {
    today: { tenants: "18", orders: "326",     gmv: "¥32,860.00",  settle: "5",  audit: "12" },
    d7:    { tenants: "18", orders: "2,148",   gmv: "¥214,800.00", settle: "12", audit: "46" },
    d30:   { tenants: "18", orders: "9,326",   gmv: "¥932,600.00", settle: "34", audit: "158" }
  };
  var KEY = { "kpi-tenants": "tenants", "kpi-orders": "orders", "kpi-gmv": "gmv", "kpi-settle": "settle", "kpi-audit": "audit" };

  function apply(dim) {
    var d = DATA[dim];
    if (!d) return;
    Object.keys(KEY).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.textContent = d[KEY[id]];
    });
  }

  document.querySelectorAll("#dim-switch button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("#dim-switch button").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      apply(btn.getAttribute("data-dim"));
    });
  });

  apply("today");
})();
</script>
</body>
</html>
