<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>编辑系列课 · 运营后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=4" />
<link rel="stylesheet" href="../assets/css/content-mgmt.css?v=3" />
</head>
<body class="admin-body" data-module="content" data-nav="content-series" data-title="编辑系列课" data-crumb="运营后台 / 内容 / 系列课 / 编辑">

<div id="header-actions">
  <a class="btn" href="content-series.html">返回列表</a>
  <button class="btn" id="btn-draft">保存草稿</button>
  <button class="btn" id="btn-preview">用户端预览</button>
  <button class="btn btn-primary" id="btn-save-outline">保存并进入目录</button>
</div>

<div id="page-content" style="display:none">
  <a class="cm-back" href="content-series.html">← 返回系列课列表</a>

  <div class="cm-page-hd">
    <div>
      <h1 id="e-title">新建系列课</h1>
      <p class="sub">配置系列课展示与商品规则，保存后继续维护章节目录</p>
    </div>
  </div>

  <div class="cm-anchor" id="anchors">
    <button class="btn active" data-goto="sec-content">内容信息</button>
    <button class="btn" data-goto="sec-product">商品信息</button>
    <button class="btn" data-goto="sec-share">分享设置</button>
  </div>

  <div class="cm-section" id="sec-content">
    <div class="cm-section-hd">
      <h2>内容信息 <span class="hint">配置学员在课程详情页看到的基础内容</span></h2>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field" style="grid-column:1/-1">
        <label>系列课名称 * <span style="float:right;color:#8c8c8c;font-weight:400" id="name-cnt">0/45</span></label>
        <input class="input" id="f-name" maxlength="45" placeholder="建议14字内" />
      </div>
      <div class="field">
        <label>课程分类</label>
        <select class="input" id="f-cat">
          <option>未分类</option><option>K12 教育</option><option>家庭教育</option><option>学习能力</option>
        </select>
      </div>
      <div class="field">
        <label>封面</label>
        <div class="cm-cover-up has-img"><img src="../assets/img/covers/reading.jpg" alt="" /><span class="cm-cover-tip">更换封面</span></div>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>系列课简介 <span style="float:right;color:#8c8c8c;font-weight:400" id="intro-cnt">0/256</span></label>
        <textarea class="input" id="f-intro" rows="3" maxlength="256" placeholder="建议256字内"></textarea>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>系列课详情</label>
        <div class="rt-editor">
          <div class="rt-toolbar">
            <button type="button" class="rt-btn">⊕ 插入</button>
            <button type="button" class="rt-btn">↶</button>
            <button type="button" class="rt-btn">↷</button>
            <div class="rt-divider"></div>
            <button type="button" class="rt-btn">正文</button>
            <button type="button" class="rt-btn">16px</button>
            <button type="button" class="rt-btn"><b>B</b></button>
            <button type="button" class="rt-btn"><i>I</i></button>
            <button type="button" class="rt-btn"><u>U</u></button>
            <button type="button" class="rt-btn">≡</button>
            <div class="rt-divider"></div>
            <button type="button" class="rt-btn">预览</button>
          </div>
          <div class="rt-body" contenteditable="true"><span class="rt-placeholder">输入系列课详情，支持粘贴富文本内容</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="cm-section" id="sec-product">
    <div class="cm-section-hd">
      <h2>商品信息 <span class="hint">配置课程获取方式、有效期与店铺展示状态</span></h2>
    </div>
    <div class="field">
      <label class="cm-check"><input type="checkbox" checked> 允许在店铺或链接中独立获取</label>
    </div>
    <div class="field">
      <label>获取方式</label>
      <div class="cm-choice">
        <label><input type="radio" name="access" value="free"> 免费获取</label>
        <label><input type="radio" name="access" value="pay" checked> 付费购买</label>
        <label><input type="radio" name="access" value="vip"> 仅限指定用户</label>
      </div>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field"><label>销售价格（元）</label><input class="input" id="f-price" type="number" value="99" /></div>
      <div class="field">
        <label>商品分组</label>
        <select class="input"><option>默认分组</option><option selected>K12 教育</option><option>家庭教育</option><option>学习能力</option></select>
      </div>
    </div>
    <div class="field">
      <label class="cm-check"><input type="checkbox"> 启用访问密码</label>
    </div>
    <div class="field">
      <label>有效期</label>
      <div class="cm-choice">
        <label><input type="radio" name="valid" checked> 长期有效</label>
        <label><input type="radio" name="valid"> 自定义</label>
      </div>
    </div>
    <div class="field">
      <label>上架策略</label>
      <div class="cm-choice">
        <label><input type="radio" name="shelf"> 立即上架</label>
        <label><input type="radio" name="shelf"> 定时上架</label>
        <label><input type="radio" name="shelf" checked> 暂不上架</label>
      </div>
    </div>
    <div class="field">
      <label>店铺显示</label>
      <div class="cm-choice">
        <label><input type="radio" name="store" checked> 显示</label>
        <label><input type="radio" name="store"> 隐藏</label>
      </div>
    </div>
  </div>

  <div class="cm-section" id="sec-share">
    <div class="cm-section-hd">
      <h2>分享设置 <span class="hint">配置小程序分享卡片和海报使用的商品级素材</span></h2>
    </div>
    <div class="field">
      <label class="cm-check"><input type="checkbox" checked> 允许用户在小程序内分享</label>
    </div>
    <div class="field">
      <label class="cm-check"><input type="checkbox"> 自定义分享标题</label>
    </div>
    <div class="field">
      <label class="cm-check"><input type="checkbox"> 自定义分享描述</label>
    </div>
    <div class="field">
      <label class="cm-check"><input type="checkbox"> 使用独立分享图片</label>
    </div>
    <p style="font-size:12px;color:#8c8c8c;margin:8px 0 0">草稿阶段可预览素材；课程正式上架后生成可用短链和二维码。</p>
    <button class="btn" style="margin-top:10px" data-toast="海报预览（演示）">预览海报</button>
  </div>

  <div class="cm-sticky-ft">
    <a class="btn" href="content-series.html">取消</a>
    <button class="btn" id="btn-draft2">保存草稿</button>
    <button class="btn" id="btn-preview2">用户端预览</button>
    <button class="btn btn-primary" id="btn-save-outline2">保存并进入目录</button>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/ops-shell.js?v=6"></script>
<script>
var PRESET = {
  S001: { name:"小学语文阅读启蒙系列", cat:"K12 教育", intro:"针对 6-12 岁儿童阅读兴趣培养，从绘本到章节书的进阶路径。", price:99 },
  S002: { name:"家长情绪管理训练营", cat:"家庭教育", intro:"8 周系统训练，帮助家长识别情绪、管理情绪、与孩子正向沟通。", price:199 },
  S003: { name:"AI 学习规划入门", cat:"学习能力", intro:"AI 助力学习规划，10 节实操课让孩子学会用 AI 工具提升学习效率。", price:0 }
};
var id = new URLSearchParams(location.search).get("id") || "";
var isNew = !id || !PRESET[id];
document.getElementById("e-title").textContent = isNew ? "新建系列课" : "编辑系列课";
if (!isNew) {
  var p = PRESET[id];
  document.getElementById("f-name").value = p.name;
  document.getElementById("f-intro").value = p.intro;
  document.getElementById("f-price").value = p.price;
  var cat = document.getElementById("f-cat");
  for (var i=0;i<cat.options.length;i++) if (cat.options[i].text === p.cat) cat.selectedIndex = i;
}
function updCnt(){
  document.getElementById("name-cnt").textContent = (document.getElementById("f-name").value||"").length + "/45";
  document.getElementById("intro-cnt").textContent = (document.getElementById("f-intro").value||"").length + "/256";
}
document.getElementById("f-name").addEventListener("input", updCnt);
document.getElementById("f-intro").addEventListener("input", updCnt);
updCnt();

document.getElementById("anchors").addEventListener("click", function(e){
  var b = e.target.closest("[data-goto]"); if (!b) return;
  document.querySelectorAll("#anchors .btn").forEach(function(x){ x.classList.remove("active"); });
  b.classList.add("active");
  var el = document.getElementById(b.getAttribute("data-goto"));
  if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
});

function goOutline(){
  var nid = id || "S002";
  location.href = "content-series-outline.html?id=" + encodeURIComponent(nid);
}
function draft(){ Proto.toast("草稿已保存"); }
function preview(){ Proto.toast("已打开用户端预览（演示）"); }
document.getElementById("btn-draft").addEventListener("click", draft);
document.getElementById("btn-draft2").addEventListener("click", draft);
document.getElementById("btn-preview").addEventListener("click", preview);
document.getElementById("btn-preview2").addEventListener("click", preview);
document.getElementById("btn-save-outline").addEventListener("click", goOutline);
document.getElementById("btn-save-outline2").addEventListener("click", goOutline);

document.querySelector(".rt-body").addEventListener("focus", function(){
  var ph = this.querySelector(".rt-placeholder"); if (ph) ph.remove();
});
</script>
</body>
</html>
