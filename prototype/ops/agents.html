<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智能体 · 运营后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
</head>
<body class="admin-body" data-module="content" data-nav="agents" data-title="智能体" data-crumb="运营后台 / 内容与审核 / 学习服务 / 智能体">

<div id="header-actions">
  <button class="btn" data-toast="已同步智言系统（原型）">同步智言</button>
</div>

<div id="page-content" style="display:none">
  <div class="as-banner" style="background:#f0f5ff;border:1px solid #bedaff;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#1d2129">
    智能体是能力资产（对接智言），<strong>不可单独商品化售卖</strong>。业务上仅以<strong>任务</strong>形式编入<a href="assess-plans.html">定制化计划</a>（计划 → 关卡 → 智能体任务）。报告模板可引用其解读能力，但不构成商品。
  </div>

  <div class="card" style="margin-bottom:14px"><div class="card-bd" style="padding:12px 16px">
    <div class="toolbar" style="border:none;padding:0;background:transparent">
      <input class="input" id="f-q" placeholder="搜索名称 / 能力 / 来源" style="width:240px" />
      <select class="input" id="f-taskable" style="width:160px">
        <option value="">全部</option>
        <option value="1">可编入计划任务</option>
        <option value="0">不可任务化</option>
      </select>
      <select class="input" id="f-status" style="width:120px">
        <option value="">全部状态</option>
        <option>启用</option>
        <option>停用</option>
      </select>
      <button class="btn btn-primary" id="btn-query">查询</button>
    </div>
  </div></div>

  <div class="card"><div class="card-bd" style="padding:0">
    <table class="data">
      <thead>
        <tr>
          <th>名称</th>
          <th>描述</th>
          <th>能力</th>
          <th>来源</th>
          <th>可任务化</th>
          <th>输入</th>
          <th>输出</th>
          <th>状态</th>
          <th style="width:200px">操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div></div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/ops-shell.js?v=20"></script>
<script>
var AGENTS = [
  { id: "AG01", name: "亲子沟通辅导助手", desc: "在计划关卡中与家长对话辅导", capability: "对话辅导", source: "智言", taskable: true, input: "用户画像+关卡目标", output: "建议文本", status: "启用" },
  { id: "AG02", name: "家庭教育顾问", desc: "按关卡目标给出每日练习建议", capability: "对话辅导", source: "智言", taskable: true, input: "用户画像+关卡目标", output: "建议文本", status: "启用" },
  { id: "AG03", name: "情绪识别助手", desc: "关卡练习中识别情绪倾向", capability: "情绪分析", source: "智言", taskable: true, input: "用户文本", output: "标签+建议", status: "启用" },
  { id: "AG04", name: "旧版闲聊助手", desc: "已停用，不可编入计划", capability: "闲聊", source: "智言", taskable: false, input: "文本", output: "回复", status: "停用" }
];

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }

function filtered() {
  var q = (document.getElementById("f-q").value || "").trim();
  var t = document.getElementById("f-taskable").value;
  var st = document.getElementById("f-status").value;
  return AGENTS.filter(function (a) {
    if (t === "1" && !a.taskable) return false;
    if (t === "0" && a.taskable) return false;
    if (st && a.status !== st) return false;
    if (q && (a.name + a.desc + a.capability + a.source).indexOf(q) < 0) return false;
    return true;
  });
}

function render() {
  document.getElementById("tbody").innerHTML = filtered().map(function (a) {
    return "<tr>" +
      "<td><b>" + esc(a.name) + "</b><br><span class='muted' style='font-size:12px'>" + esc(a.id) + "</span></td>" +
      "<td style='max-width:200px;font-size:13px'>" + esc(a.desc) + "</td>" +
      "<td>" + esc(a.capability) + "</td>" +
      "<td>" + esc(a.source) + "</td>" +
      "<td>" + (a.taskable ? "<span class='badge badge-success'>是</span>" : "<span class='badge'>否</span>") + "</td>" +
      "<td style='font-size:12px'>" + esc(a.input) + "</td>" +
      "<td style='font-size:12px'>" + esc(a.output) + "</td>" +
      "<td><span class='as-tag " + (a.status === "启用" ? "green" : "gray") + "'>" + esc(a.status) + "</span></td>" +
      "<td class='row-actions'>" +
        (a.taskable
          ? "<a href='content-tasks.html?type=agent&agent_id=" + a.id + "'>生成任务</a>" +
            "<a href='assess-plans.html?agent_id=" + a.id + "'>编入定制化计划</a>"
          : "<span class='muted' style='font-size:12px'>不可用</span>") +
      "</td></tr>";
  }).join("") || "<tr><td colspan='9' style='text-align:center;color:#bfbfbf;padding:28px'>暂无智能体</td></tr>";
}

document.getElementById("btn-query").addEventListener("click", render);
render();
</script>
</body>
</html>
