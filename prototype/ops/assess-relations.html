<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>关联规则 · 运营后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=4" />
<link rel="stylesheet" href="../assets/css/assess.css?v=3" />
</head>
<body class="admin-body" data-module="content" data-nav="assess-projects" data-title="关联规则" data-crumb="运营后台 / 内容 / 测评管理 / 关联规则">

<div id="header-actions">
  <a class="btn" id="btn-back" href="assess-projects.html">返回测试项目管理</a>
  <button class="btn btn-primary" id="btn-new">+ 新建关联规则</button>
</div>

<div id="page-content" style="display:none">
  <a class="cm-back" id="link-back" href="assess-projects.html" style="display:inline-flex;color:#165dff;font-size:13px;margin-bottom:12px;text-decoration:none">← 返回测试项目管理</a>

  <div style="margin-bottom:14px">
    <h1 style="margin:0 0 4px;font-size:22px"><span id="owner-name">心理健康测评</span> · 关联规则</h1>
    <p class="muted" style="margin:0;font-size:13px" id="owner-sub">配置该测评结果到任务的下发规则</p>
  </div>

  <div class="as-stats" id="stats"></div>

  <table class="as-table">
    <thead>
      <tr>
        <th style="width:110px">关联类型</th>
        <th>触发条件</th>
        <th style="width:70px">优先级</th>
        <th>关联任务</th>
        <th style="width:150px">更新时间</th>
        <th style="width:80px">状态</th>
        <th style="width:260px">操作</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div style="margin-top:12px;font-size:12px;color:#8c8c8c">共 <b id="cnt">0</b> 条规则</div>
</div>

<!-- 新建/编辑 -->
<div class="proto-modal" id="modal-edit">
  <div style="background:#fff;border-radius:10px;width:560px;max-width:94vw;max-height:88vh;overflow:auto">
    <div class="proto-modal-hd"><h3 style="margin:0;font-size:16px" id="edit-title">新建关联规则</h3><button class="ctrl-icon-btn" data-close>×</button></div>
    <div class="proto-modal-bd">
      <div class="field"><label>关联类型 *</label>
        <select class="input" id="e-type">
          <option value="总分区间">总分区间</option>
          <option value="维度得分">维度得分</option>
          <option value="选项匹配">选项匹配</option>
          <option value="脚本导入">脚本导入</option>
        </select>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr" id="score-range">
        <div class="field"><label>最低分 *</label><input class="input" id="e-min" type="number" value="0" /></div>
        <div class="field"><label>最高分 *</label><input class="input" id="e-max" type="number" value="30" /></div>
      </div>
      <div class="field" id="dim-wrap" style="display:none">
        <label>维度 *</label>
        <select class="input" id="e-dim"><option>情绪状态</option><option>压力水平</option><option>社交适应</option></select>
      </div>
      <div class="field" id="opt-wrap" style="display:none">
        <label>匹配选项 *</label>
        <input class="input" id="e-opt" placeholder="如：总是" />
      </div>
      <div class="field"><label>关联任务 *</label>
        <select class="input" id="e-task" multiple style="min-height:96px">
          <option value="情绪管理基础课">情绪管理基础课</option>
          <option value="情绪调节问卷">情绪调节问卷</option>
          <option value="人工关怀工单">人工关怀工单</option>
          <option value="呼吸放松训练">呼吸放松训练</option>
          <option value="学习习惯打卡">学习习惯打卡</option>
          <option value="职业兴趣初探">职业兴趣初探</option>
        </select>
        <div class="muted" style="font-size:11px;margin-top:4px">按住 Ctrl / Cmd 可多选</div>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr">
        <div class="field"><label>优先级 *</label><input class="input" id="e-pri" type="number" value="10" min="1" max="99" /></div>
        <div class="field" style="padding-top:28px">
          <label style="display:flex;align-items:center;gap:8px;font-weight:400"><input type="checkbox" id="e-on" checked> 保存后启用</label>
        </div>
      </div>
    </div>
    <div class="proto-modal-ft" style="justify-content:flex-end;gap:8px">
      <button class="btn" data-close>取消</button>
      <button class="btn btn-primary" id="btn-save-edit">保存规则</button>
    </div>
  </div>
</div>

<!-- 查看 -->
<div class="proto-modal" id="modal-view">
  <div style="background:#fff;border-radius:10px;width:480px;max-width:94vw;overflow:hidden">
    <div class="proto-modal-hd"><h3 style="margin:0;font-size:16px">查看关联规则</h3><button class="ctrl-icon-btn" data-close>×</button></div>
    <div class="proto-modal-bd" id="view-bd"></div>
    <div class="proto-modal-ft" style="justify-content:flex-end"><button class="btn" data-close>关闭</button></div>
  </div>
</div>

<!-- 试运行 -->
<div class="proto-modal" id="modal-run">
  <div style="background:#fff;border-radius:10px;width:480px;max-width:94vw;overflow:hidden">
    <div class="proto-modal-hd"><h3 style="margin:0;font-size:16px">试运行规则</h3><button class="ctrl-icon-btn" data-close>×</button></div>
    <div class="proto-modal-bd">
      <p class="muted" style="margin:0 0 12px;font-size:12px">输入模拟得分，查看是否命中本规则及将下发的任务。</p>
      <div class="field"><label>模拟总分</label><input class="input" id="run-score" type="number" value="45" /></div>
      <div id="run-result" class="as-seg" style="display:none;margin-top:8px"></div>
    </div>
    <div class="proto-modal-ft" style="justify-content:flex-end;gap:8px">
      <button class="btn" data-close>关闭</button>
      <button class="btn btn-primary" id="btn-run">执行试运行</button>
    </div>
  </div>
</div>

<div class="proto-mask" id="mask"></div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/ops-shell.js?v=7"></script>
<script>
var qs = new URLSearchParams(location.search);
var from = qs.get("from") || "project";
var id = qs.get("id") || (from === "series" ? "S1" : "P001");

var OWNERS = {
  project: {
    P001: { name: "心理健康测评", sub: "配置该测评结果到任务的下发规则" },
    P002: { name: "学习能力诊断", sub: "配置该测评结果到任务的下发规则" },
    P003: { name: "情绪调节问卷", sub: "配置该测评结果到任务的下发规则" }
  },
  series: {
    S1: { name: "新生入学心理系列", sub: "配置系列测评完成后的任务关联规则" },
    S2: { name: "学习力提升测评包", sub: "配置系列测评完成后的任务关联规则" }
  }
};

var META = (OWNERS[from] && OWNERS[from][id]) || { name: "未命名对象", sub: "配置关联规则" };
document.getElementById("owner-name").textContent = META.name;
document.getElementById("owner-sub").textContent = META.sub;
document.title = META.name + " · 关联规则 · 运营后台";
document.body.setAttribute("data-nav", from === "series" ? "assess-series" : "assess-projects");
document.body.setAttribute("data-crumb", from === "series"
  ? "运营后台 / 内容 / 测评管理 / 系列关联规则"
  : "运营后台 / 内容 / 测评管理 / 关联规则");

var backHref = from === "series" ? "assess-series.html" : "assess-projects.html";
var backLabel = from === "series" ? "返回系列测评管理" : "返回测试项目管理";
document.getElementById("btn-back").href = backHref;
document.getElementById("btn-back").textContent = "返回" + (from === "series" ? "系列测评管理" : "测试项目管理");
document.getElementById("link-back").href = backHref;
document.getElementById("link-back").textContent = "← " + backLabel;

var RULES = {
  "project:P001": [
    { id: "R1", type: "总分区间", cond: "总分 0–30", min: 0, max: 30, pri: 10, tasks: ["情绪管理基础课"], on: true, time: "2026-09-01 10:22" },
    { id: "R2", type: "总分区间", cond: "总分 31–60", min: 31, max: 60, pri: 20, tasks: ["情绪调节问卷", "呼吸放松训练"], on: true, time: "2026-09-02 14:08" },
    { id: "R3", type: "总分区间", cond: "总分 61–100", min: 61, max: 100, pri: 30, tasks: ["人工关怀工单"], on: true, time: "2026-09-03 09:15" }
  ],
  "project:P002": [
    { id: "R4", type: "维度得分", cond: "学习风格 ≤ 2", min: 0, max: 2, pri: 10, tasks: ["学习习惯打卡"], on: true, time: "2026-08-28 11:00" },
    { id: "R5", type: "总分区间", cond: "总分 ≥ 24", min: 24, max: 36, pri: 15, tasks: ["职业兴趣初探"], on: false, time: "2026-08-29 16:40" }
  ],
  "project:P003": [],
  "series:S1": [
    { id: "SR1", type: "总分区间", cond: "系列总分 ≥ 50", min: 50, max: 200, pri: 10, tasks: ["人工关怀工单", "情绪管理基础课"], on: true, time: "2026-09-04 12:00" }
  ],
  "series:S2": []
};

var key = from + ":" + id;
var list = RULES[key] ? RULES[key].slice() : [];
var editing = null;
var runTarget = null;

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }

function renderStats(){
  var on = list.filter(function(r){return r.on;}).length;
  var tasks = {};
  list.forEach(function(r){ r.tasks.forEach(function(t){ tasks[t]=1; }); });
  document.getElementById("stats").innerHTML =
    '<div class="as-stat accent"><div class="n">'+list.length+'</div><div class="l">规则数</div></div>' +
    '<div class="as-stat ok"><div class="n">'+on+'</div><div class="l">已启用</div></div>' +
    '<div class="as-stat warn"><div class="n">'+(list.length-on)+'</div><div class="l">已停用</div></div>' +
    '<div class="as-stat"><div class="n">'+Object.keys(tasks).length+'</div><div class="l">关联任务数</div></div>';
}

function render(){
  renderStats();
  document.getElementById("cnt").textContent = list.length;
  document.getElementById("tbody").innerHTML = list.map(function(r){
    return '<tr>' +
      '<td><span class="as-tag blue">'+esc(r.type)+'</span></td>' +
      '<td>'+esc(r.cond)+'</td>' +
      '<td>'+r.pri+'</td>' +
      '<td style="font-size:12px">'+esc(r.tasks.join("、"))+'</td>' +
      '<td style="font-size:12px;color:#8c8c8c">'+esc(r.time)+'</td>' +
      '<td><span class="as-tag '+(r.on?"green":"gray")+'">'+(r.on?"已启用":"已停用")+'</span></td>' +
      '<td><div class="as-acts">' +
        '<button class="btn" data-view="'+r.id+'">查看</button>' +
        '<button class="btn" data-edit="'+r.id+'">编辑</button>' +
        '<button class="btn" data-run="'+r.id+'">试运行</button>' +
        '<button class="btn" data-toggle="'+r.id+'">'+(r.on?"停用":"启用")+'</button>' +
        '<button class="btn" style="color:#f53f3f;border-color:#ffa39e" data-del="'+r.id+'">删除</button>' +
      '</div></td></tr>';
  }).join("") || '<tr><td colspan="7" style="text-align:center;color:#bfbfbf;padding:36px">暂无关联规则，点击右上角新建</td></tr>';
}

var mask = document.getElementById("mask");
function closeAll(){ mask.classList.remove("open"); document.querySelectorAll(".proto-modal").forEach(function(n){n.classList.remove("open");}); }
function openM(mid){ mask.classList.add("open"); document.getElementById(mid).classList.add("open"); }

function syncTypeUI(){
  var t = document.getElementById("e-type").value;
  document.getElementById("score-range").style.display = (t==="总分区间"||t==="维度得分") ? "" : "none";
  document.getElementById("dim-wrap").style.display = t==="维度得分" ? "" : "none";
  document.getElementById("opt-wrap").style.display = t==="选项匹配" ? "" : "none";
}

function selectedTasks(){
  return Array.from(document.getElementById("e-task").selectedOptions).map(function(o){return o.value;});
}

function openEdit(rid){
  editing = rid;
  var r = rid ? list.find(function(x){return x.id===rid;}) : null;
  document.getElementById("edit-title").textContent = r ? "编辑关联规则" : "新建关联规则";
  document.getElementById("e-type").value = r ? r.type : "总分区间";
  document.getElementById("e-min").value = r ? r.min : 0;
  document.getElementById("e-max").value = r ? r.max : 30;
  document.getElementById("e-pri").value = r ? r.pri : 10;
  document.getElementById("e-on").checked = r ? r.on : true;
  document.getElementById("e-opt").value = "";
  Array.from(document.getElementById("e-task").options).forEach(function(o){
    o.selected = r ? r.tasks.indexOf(o.value)>=0 : false;
  });
  syncTypeUI();
  openM("modal-edit");
}

document.getElementById("e-type").onchange = syncTypeUI;
document.getElementById("btn-new").onclick = function(){ openEdit(null); };

document.getElementById("btn-save-edit").onclick = function(){
  var type = document.getElementById("e-type").value;
  var min = +document.getElementById("e-min").value;
  var max = +document.getElementById("e-max").value;
  var tasks = selectedTasks();
  if (!tasks.length) { Proto.toast("请选择关联任务"); return; }
  var cond = type === "总分区间" ? ("总分 "+min+"–"+max)
    : type === "维度得分" ? (document.getElementById("e-dim").value+" "+min+"–"+max)
    : type === "选项匹配" ? ("选项匹配「"+(document.getElementById("e-opt").value||"—")+"」")
    : "脚本条件";
  var payload = {
    type:type, cond:cond, min:min, max:max, pri:+document.getElementById("e-pri").value||10,
    tasks:tasks, on:document.getElementById("e-on").checked,
    time: new Date().toISOString().slice(0,16).replace("T"," ")
  };
  if (editing) {
    var ex = list.find(function(x){return x.id===editing;});
    Object.assign(ex, payload);
  } else {
    payload.id = "R"+Date.now().toString().slice(-5);
    list.unshift(payload);
  }
  closeAll(); render(); Proto.toast("规则已保存");
};

document.getElementById("btn-run").onclick = function(){
  if (!runTarget) return;
  var score = +document.getElementById("run-score").value;
  var hit = score >= runTarget.min && score <= runTarget.max;
  var el = document.getElementById("run-result");
  el.style.display = "block";
  el.innerHTML = hit
    ? '<b style="color:#389e0d">命中</b> · 将下发：'+esc(runTarget.tasks.join("、"))
    : '<b style="color:#8c8c8c">未命中</b> · 当前得分 '+score+' 不在区间 '+runTarget.min+'–'+runTarget.max;
};

document.addEventListener("click", function(e){
  var view = e.target.closest("[data-view]");
  if (view) {
    var r = list.find(function(x){return x.id===view.getAttribute("data-view");});
    document.getElementById("view-bd").innerHTML =
      '<div style="font-size:13px;line-height:1.9">' +
        '<div>关联类型：<span class="as-tag blue">'+esc(r.type)+'</span></div>' +
        '<div>触发条件：'+esc(r.cond)+'</div>' +
        '<div>优先级：'+r.pri+'</div>' +
        '<div>关联任务：'+esc(r.tasks.join("、"))+'</div>' +
        '<div>状态：'+(r.on?"已启用":"已停用")+'</div>' +
        '<div>更新时间：'+esc(r.time)+'</div>' +
      '</div>';
    openM("modal-view"); return;
  }
  var ed = e.target.closest("[data-edit]"); if (ed) { openEdit(ed.getAttribute("data-edit")); return; }
  var run = e.target.closest("[data-run]");
  if (run) {
    runTarget = list.find(function(x){return x.id===run.getAttribute("data-run");});
    document.getElementById("run-score").value = Math.round((runTarget.min+runTarget.max)/2);
    document.getElementById("run-result").style.display = "none";
    openM("modal-run"); return;
  }
  var tg = e.target.closest("[data-toggle]");
  if (tg) {
    var r2 = list.find(function(x){return x.id===tg.getAttribute("data-toggle");});
    r2.on = !r2.on; render(); Proto.toast(r2.on?"已启用":"已停用"); return;
  }
  var del = e.target.closest("[data-del]");
  if (del) {
    list = list.filter(function(x){return x.id!==del.getAttribute("data-del");});
    render(); Proto.toast("已删除"); return;
  }
});

mask.addEventListener("click", closeAll);
document.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeAll); });
render();
</script>
</body>
</html>
