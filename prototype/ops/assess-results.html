<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>测评报告 · 运营后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/assess.css?v=6" />
<style>
.as-answer-q {
  border:1px solid #e8e8e8; border-radius:8px; padding:12px 14px; margin-bottom:10px; background:#fafafa;
}
.as-answer-q .q-hd { display:flex; align-items:flex-start; gap:8px; margin-bottom:8px; }
.as-answer-q .q-num {
  flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:#165dff; color:#fff;
  display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; margin-top:1px;
}
.as-answer-q .q-text { flex:1; font-size:13px; font-weight:600; color:#1d2129; line-height:1.5; }
.as-answer-q .q-meta { font-size:11px; color:#8c8c8c; font-weight:400; margin-top:2px; }
.as-answer-opts { display:flex; flex-direction:column; gap:4px; margin:0 0 0 30px; }
.as-answer-opt { font-size:12px; color:#8c8c8c; padding:4px 8px; border-radius:4px; line-height:1.4; }
.as-answer-opt.is-chosen { background:#e8f3ff; color:#165dff; font-weight:600; }
.as-answer-opt.is-chosen::before { content:"✓ "; }
.as-answer-pick {
  margin:8px 0 0 30px; font-size:13px; color:#1d2129;
  padding:8px 10px; background:#fff; border:1px solid #bedaff; border-radius:6px;
}
.as-answer-pick b { color:#165dff; }
.as-tabs-inline { display:flex; gap:0; border-bottom:1px solid #e8e8e8; margin-bottom:14px; }
.as-tabs-inline button {
  border:0; background:transparent; padding:10px 16px; font-size:13px; color:#595959; cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.as-tabs-inline button.active { color:#165dff; font-weight:600; border-bottom-color:#165dff; }
.rpt-view { background:#fff; border:1px solid #e8e8e8; border-radius:10px; padding:20px; }
.rpt-view .rpt-hd h1 { margin:0 0 6px; font-size:18px; }
.rpt-view .meta { color:#86909c; font-size:12px; margin:0 0 14px; }
.rpt-view .rpt-score { background:#f0f5ff; color:#165dff; padding:10px 12px; border-radius:8px; margin-bottom:16px; font-size:14px; }
.rpt-view .rpt-ai, .rpt-view .rpt-advice {
  background:#fafafa; border-radius:8px; padding:12px; font-size:13px; line-height:1.6; white-space:pre-wrap; margin-bottom:12px;
}
.rpt-view h2 { font-size:14px; margin:0 0 8px; }
</style>
</head>
<body class="admin-body" data-module="content" data-nav="assess-results" data-title="测评报告" data-crumb="运营后台 / 内容与审核 / 测评中心 / 测评报告">

<div id="header-actions">
  <button class="btn" id="btn-export">导出数据</button>
</div>

<div id="page-content" style="display:none">
  <div style="background:#fff7e8;border:1px solid #ffe4a8;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px">
    完成测评后按所绑<a href="assess-report-templates.html">报告模板</a> + 智能体生成最终报告。列表可查看<strong>作答明细</strong>与<strong>生成报告</strong>。
  </div>

  <div class="card" style="margin-bottom:14px"><div class="card-bd" style="padding:12px 16px">
    <div class="toolbar" style="border:none;padding:0;background:transparent;flex-wrap:wrap">
      <input class="input" id="f-q" placeholder="搜索用户名、测试名称、人群..." style="width:260px" />
      <select class="input" id="f-type" style="width:110px">
        <option value="">全部类型</option><option>实名</option><option>匿名</option>
      </select>
      <select class="input" id="f-status" style="width:110px">
        <option value="">全部状态</option><option>已完成</option><option>进行中</option><option>已放弃</option>
      </select>
      <button class="btn btn-primary" id="btn-query">查询</button>
      <button class="btn" id="btn-reset">重置</button>
    </div>
  </div></div>

  <table class="as-table">
    <thead>
      <tr>
        <th>参与者</th>
        <th>测评名称</th>
        <th style="width:90px">类型</th>
        <th style="width:90px">状态</th>
        <th style="width:120px">报告</th>
        <th style="width:140px">完成时间</th>
        <th style="width:200px">操作</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div style="margin-top:12px;font-size:12px;color:#8c8c8c">共 <b id="cnt">0</b> 条</div>
</div>

<div class="proto-modal as-wide-modal" id="modal-view">
  <div style="background:#fff;border-radius:10px;width:min(820px,94vw);max-height:90vh;overflow:hidden;display:flex;flex-direction:column">
    <div class="proto-modal-hd"><h3 style="margin:0;font-size:16px" id="view-title">测评详情</h3><button class="ctrl-icon-btn" data-close>×</button></div>
    <div class="proto-modal-bd" style="overflow:auto">
      <div class="as-tabs-inline">
        <button type="button" class="active" data-tab="report">生成报告</button>
        <button type="button" data-tab="answers">作答明细</button>
      </div>
      <div id="tab-report"></div>
      <div id="tab-answers" style="display:none"></div>
    </div>
    <div class="proto-modal-ft" style="justify-content:flex-end;gap:8px">
      <button class="btn" id="btn-dl" data-toast="已导出（演示）">导出</button>
      <button class="btn" data-close>关闭</button>
    </div>
  </div>
</div>

<div class="proto-mask" id="mask"></div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/assess-report-store.js?v=2"></script>
<script src="../assets/js/ops-shell.js?v=14"></script>
<script>
var ReportStore = window.AssessReportStore;
var currentRow = null;

var ROWS = [
  {
    id:"R1", user:"李女士", test:"亲子沟通能力测评", type:"实名", status:"已完成", time:"2026-09-06 14:22", crowd:"家长",
    reportTemplateId:"RT01", reportStatus:"已生成", score:"72", segment:"良好",
    answers:[
      { text:"与孩子发生分歧时，你更常先讲道理还是先听感受？", type:"单选题", dim:"倾听表达", options:["先讲道理","先听感受","看情况"], chosen:["先讲道理"] },
      { text:"孩子向你倾诉时，你通常会？", type:"单选题", dim:"倾听表达", options:["边听边给建议","专注听完再回应","忙时让他晚点说"], chosen:["边听边给建议"] },
      { text:"冲突后你会主动发起修复对话吗？", type:"单选题", dim:"情绪应对", options:["几乎不会","偶尔会","多数会"], chosen:["偶尔会"] },
      { text:"你认为有效的亲子规则应该？", type:"多选题", dim:"规则边界", options:["家长单方面制定","共同商量后执行","允许孩子提出修改","完全由孩子决定"], chosen:["共同商量后执行","允许孩子提出修改"] }
    ]
  },
  {
    id:"R2", user:"匿名用户#6612", test:"家庭教育风格测评", type:"匿名", status:"已完成", time:"2026-09-05 19:08", crowd:"家长",
    reportTemplateId:"RT02", reportStatus:"已生成", score:"58", segment:"一般",
    answers:[
      { text:"家庭规则通常由谁决定？", type:"单选题", dim:"规则边界", options:["家长说了算","共同商量","孩子自己定"], chosen:["家长说了算"] },
      { text:"孩子犯错时，你更倾向？", type:"单选题", dim:"温暖回应", options:["立即批评纠正","先安抚再讲规则","先观察再决定"], chosen:["立即批评纠正"] },
      { text:"你会给孩子多大自主选择空间？", type:"量表题", dim:"自主支持", options:["1（很少）","2","3","4","5（很多）"], chosen:["2"] }
    ]
  },
  {
    id:"R3", user:"张妈妈", test:"心理健康测评", type:"实名", status:"进行中", time:"—", crowd:"家长",
    reportTemplateId:"RT03", reportStatus:"未生成", score:"", segment:"",
    answers:[
      { text:"你最近是否感到情绪低落？", type:"单选题", dim:"情绪状态", options:["从不","偶尔","经常","总是"], chosen:["偶尔"] }
    ]
  },
  {
    id:"R4", user:"王同学", test:"新生入学心理系列", type:"实名", status:"已放弃", time:"2026-09-03 10:11", crowd:"初一",
    reportTemplateId:"RT01", reportStatus:"未生成", score:"", segment:"",
    answers:[]
  },
  {
    id:"R5", user:"陈爸爸", test:"心理健康测评", type:"实名", status:"已完成", time:"2026-09-07 09:40", crowd:"家长",
    reportTemplateId:"RT03", reportStatus:"已生成", score:"41", segment:"需关注",
    answers:[
      { text:"你最近是否感到情绪低落？", type:"单选题", dim:"情绪状态", options:["从不","偶尔","经常","总是"], chosen:["经常"] },
      { text:"过去一周睡眠质量如何？", type:"单选题", dim:"压力水平", options:["很好","一般","较差","很难入睡"], chosen:["很难入睡"] },
      { text:"面对压力时你会？", type:"多选题", dim:"社交适应", options:["向家人倾诉","运动释放","独自消化","寻求专业帮助"], chosen:["独自消化"] }
    ]
  }
];

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }
function statusTag(st){
  var c = st==="已完成"?"green":(st==="进行中"?"blue":"gray");
  return '<span class="as-tag '+c+'">'+esc(st)+'</span>';
}
function reportTag(st){
  if (st === "已生成") return '<span class="as-tag green">已生成</span>';
  return '<span class="as-tag gray">未生成</span>';
}

function renderAnswers(answers){
  if (!answers || !answers.length) {
    return '<div class="as-banner" style="margin-bottom:0">暂无作答记录。</div>';
  }
  return answers.map(function(a, i){
    var chosen = a.chosen || [];
    var optsHtml = (a.options||[]).map(function(o){
      var hit = chosen.indexOf(o) >= 0;
      return '<div class="as-answer-opt'+(hit?' is-chosen':'')+'">'+esc(o)+'</div>';
    }).join("");
    var pick = chosen.length
      ? '<div class="as-answer-pick">用户选择：<b>'+chosen.map(esc).join("、")+'</b></div>'
      : '<div class="as-answer-pick muted">用户选择：未作答</div>';
    return '<div class="as-answer-q">' +
      '<div class="q-hd">' +
        '<span class="q-num">'+(i+1)+'</span>' +
        '<div class="q-text">'+esc(a.text)+
          '<div class="q-meta">'+esc(a.type||"单选题")+(a.dim?' · '+esc(a.dim):'')+'</div>' +
        '</div>' +
      '</div>' +
      '<div class="as-answer-opts">'+optsHtml+'</div>' +
      pick +
    '</div>';
  }).join("");
}

function renderGeneratedReport(r) {
  if (r.status !== "已完成" || r.reportStatus !== "已生成") {
    return '<div class="as-banner" style="margin:0">报告尚未生成。完成测评后将按所绑模板与智能体自动生成。</div>' +
      '<p class="muted" style="font-size:12px;margin-top:10px">绑定模板：' + esc(ReportStore.templateLabel(r.reportTemplateId)) + "</p>";
  }
  var tpl = ReportStore.getTemplate(r.reportTemplateId);
  if (!tpl) {
    return '<div class="as-banner" style="margin:0">未找到报告模板，请在测评编辑中重新关联。</div>';
  }
  var rendered = ReportStore.renderTemplate(tpl, {
    user_name: r.user,
    assess_name: r.test,
    total_score: r.score || "—",
    segment_label: r.segment || "—",
    finish_time: r.time
  });
  return '<div class="muted" style="font-size:12px;margin-bottom:10px">模板：' + esc(tpl.name) + " · " + esc(tpl.ver) +
    " · 智能体：" + esc(rendered.agentName) + "</div>" +
    '<div class="rpt-view">' + rendered.html + "</div>";
}

function render(){
  var q=(document.getElementById("f-q").value||"").trim();
  var type=document.getElementById("f-type").value;
  var status=document.getElementById("f-status").value;
  var focusTpl = new URLSearchParams(location.search).get("template_id");
  var focusAssess = new URLSearchParams(location.search).get("assess_id");
  var list = ROWS.filter(function(r){
    if (type && r.type!==type) return false;
    if (status && r.status!==status) return false;
    if (focusTpl && r.reportTemplateId !== focusTpl) return false;
    if (focusAssess && r.test.indexOf(focusAssess) < 0 && r.id.indexOf(focusAssess) < 0) {
      /* soft filter by assess name map */
      var map = { MP01: "亲子沟通", MP02: "家庭教育", PP01: "心理健康", PP02: "学习能力", PP03: "情绪调节" };
      var key = map[focusAssess];
      if (key && r.test.indexOf(key) < 0) return false;
      if (!key && focusAssess) { /* keep */ }
    }
    if (q && (r.user+r.test+r.crowd).indexOf(q)<0) return false;
    return true;
  });
  document.getElementById("cnt").textContent = list.length;
  document.getElementById("tbody").innerHTML = list.map(function(r){
    return '<tr>' +
      '<td><div class="as-name">'+esc(r.user)+'</div><div class="as-desc">人群：'+esc(r.crowd)+'</div></td>' +
      '<td>'+esc(r.test)+'</td>' +
      '<td><span class="as-tag '+(r.type==="实名"?"blue":"purple")+'">'+esc(r.type)+'</span></td>' +
      '<td>'+statusTag(r.status)+'</td>' +
      '<td>'+reportTag(r.reportStatus)+'</td>' +
      '<td style="font-size:12px;color:#8c8c8c">'+esc(r.time)+'</td>' +
      '<td class="as-acts">' +
        '<button class="btn btn-primary" data-view="'+r.id+'" data-open="report">查看报告</button>' +
        '<button class="btn" data-view="'+r.id+'" data-open="answers">作答明细</button>' +
      '</td></tr>';
  }).join("");
}

function switchTab(name) {
  document.querySelectorAll(".as-tabs-inline button").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-tab") === name);
  });
  document.getElementById("tab-report").style.display = name === "report" ? "" : "none";
  document.getElementById("tab-answers").style.display = name === "answers" ? "" : "none";
}

function openDetail(id, tab) {
  var r = ROWS.find(function(x){ return x.id === id; });
  if (!r) return;
  currentRow = r;
  document.getElementById("view-title").textContent = r.user + " · " + r.test;
  document.getElementById("tab-report").innerHTML = renderGeneratedReport(r);
  document.getElementById("tab-answers").innerHTML =
    '<div class="form-grid" style="grid-template-columns:1fr 1fr;gap:10px 16px;font-size:13px;margin-bottom:14px">' +
      '<div><span class="muted">状态</span><div style="margin-top:2px">'+statusTag(r.status)+'</div></div>' +
      '<div><span class="muted">类型 / 人群</span><div style="margin-top:2px">'+esc(r.type)+' · '+esc(r.crowd)+'</div></div>' +
      '<div><span class="muted">完成时间</span><div style="margin-top:2px">'+esc(r.time)+'</div></div>' +
      '<div><span class="muted">报告模板</span><div style="margin-top:2px">'+esc(ReportStore.templateLabel(r.reportTemplateId))+'</div></div>' +
    '</div>' +
    '<h4 style="margin:0 0 10px;font-size:14px">题目与选择结果</h4>' +
    renderAnswers(r.answers);
  switchTab(tab === "answers" ? "answers" : "report");
  document.getElementById("mask").classList.add("open");
  document.getElementById("modal-view").classList.add("open");
}

var mask = document.getElementById("mask");
function closeAll(){ mask.classList.remove("open"); document.getElementById("modal-view").classList.remove("open"); }

document.getElementById("btn-query").onclick = render;
document.getElementById("btn-reset").onclick = function(){
  ["f-q","f-type","f-status"].forEach(function(id){ document.getElementById(id).value=""; });
  render();
};
document.getElementById("btn-export").onclick = function(){ Proto.toast("导出任务已创建（演示）"); };

document.querySelector(".as-tabs-inline").addEventListener("click", function (e) {
  var b = e.target.closest("[data-tab]");
  if (b) switchTab(b.getAttribute("data-tab"));
});

document.addEventListener("click", function(e){
  var v = e.target.closest("[data-view]"); if (!v) return;
  openDetail(v.getAttribute("data-view"), v.getAttribute("data-open") || "report");
});

mask.addEventListener("click", closeAll);
document.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeAll); });
render();
</script>
</body>
</html>
