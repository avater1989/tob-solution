<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>用户列表 · 运营后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<style>
.ua-field { display:flex; align-items:center; gap:6px; font-size:13px; }
.ua-field label { white-space:nowrap; color:var(--color-text-secondary); min-width:72px; }
.ua-field input, .ua-field select { flex:1; min-width:0; }
.ua-search-row { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px 14px; margin-bottom:10px; }
@media (max-width:1100px) { .ua-search-row { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.tenant-chip { display:inline-block; font-size:11px; padding:1px 6px; border-radius:4px; background:#f2f3f5; margin:0 4px 2px 0; }
</style>
</head>
<body class="admin-body" data-module="users" data-nav="platform-users" data-title="用户列表" data-crumb="运营后台 / 用户 / 用户列表">
<div id="header-actions">
  <button class="btn" id="btn-export">导出用户</button>
</div>
<div id="page-content" style="display:none">

  <div class="board-tip" style="margin-bottom:12px">
    <b>跨租户 C 端用户聚合：</b>按手机号优先、其次微信 UnionID 汇总各租户学员足迹。一期只读核查。
    <span class="muted">租户员工（商家后台登录账号）请在 <a href="tenant-config.html?tab=user">租户管理 → 租户配置 → 租户用户</a> 查看。</span>
  </div>

  <div class="card" style="margin-bottom:12px"><div class="card-bd">
    <div class="ua-search-row">
      <div class="ua-field"><label>姓名</label><input id="f-name" placeholder="请输入姓名" /></div>
      <div class="ua-field"><label>手机号</label><input id="f-phone" placeholder="完整或脱敏均可" /></div>
      <div class="ua-field"><label>平台用户 ID</label><input id="f-puid" placeholder="PU…" /></div>
      <div class="ua-field"><label>租户内用户 ID</label><input id="f-local" placeholder="租户侧 UID" /></div>
    </div>
    <div class="ua-search-row">
      <div class="ua-field"><label>所属租户</label>
        <select id="f-tenant"><option value="">全部租户</option></select>
      </div>
      <div class="ua-field"><label>来源渠道</label>
        <select id="f-source">
          <option value="">全部</option>
          <option>小程序</option>
          <option>直播间</option>
          <option>投放</option>
          <option>视频号</option>
          <option>表单获客</option>
        </select>
      </div>
      <div class="ua-field"><label>是否加微</label>
        <select id="f-wecom">
          <option value="">全部</option>
          <option value="1">任一租户已加微</option>
          <option value="0">均未加微</option>
        </select>
      </div>
      <div class="ua-field"><label>权益状态</label>
        <select id="f-right">
          <option value="">全部</option>
          <option value="valid">有有效权益</option>
          <option value="abnormal">存在异常/回收</option>
          <option value="none">暂无权益</option>
        </select>
      </div>
    </div>
    <div class="ua-search-row" style="grid-template-columns:repeat(2,minmax(0,1fr)) auto">
      <div class="ua-field"><label>聚合状态</label>
        <select id="f-merge">
          <option value="">全部</option>
          <option value="merged">已聚合</option>
          <option value="single">单租户</option>
        </select>
      </div>
      <div></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;align-items:center">
        <button class="btn btn-primary" id="btn-query">查询</button>
        <button class="btn" id="btn-reset">重置</button>
      </div>
    </div>
  </div></div>

  <div class="card"><div class="card-bd" style="padding:0">
    <table class="data">
      <thead>
        <tr>
          <th>平台用户 ID</th>
          <th>姓名</th>
          <th>手机</th>
          <th>关联租户</th>
          <th>累计订单</th>
          <th>有效权益</th>
          <th>最近活跃</th>
          <th>聚合状态</th>
          <th style="width:100px">操作</th>
        </tr>
      </thead>
      <tbody id="pu-tbody"></tbody>
    </table>
  </div></div>
  <div class="toolbar" style="margin-top:8px">
    <span class="muted">共 <b id="pu-count">0</b> 人 · 跨租户聚合视图</span>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/platform-user-store.js?v=2"></script>
<script src="../assets/js/ops-shell.js?v=24"></script>
<script>
(function () {
  var Store = window.PlatformUserStore;
  var tenantSel = document.getElementById("f-tenant");
  Store.TENANTS.forEach(function (t) {
    var opt = document.createElement("option");
    opt.value = t.id;
    opt.textContent = t.name;
    tenantSel.appendChild(opt);
  });

  function tenantSummary(names) {
    if (!names || !names.length) return "—";
    var shown = names.slice(0, 2).map(function (n) {
      return '<span class="tenant-chip">' + n + "</span>";
    }).join("");
    if (names.length > 2) shown += '<span class="muted">+' + (names.length - 2) + "</span>";
    return shown;
  }

  function readFilter() {
    return {
      qName: document.getElementById("f-name").value.trim(),
      qPhone: document.getElementById("f-phone").value.trim(),
      qPuId: document.getElementById("f-puid").value.trim(),
      qLocalId: document.getElementById("f-local").value.trim(),
      tenantId: document.getElementById("f-tenant").value,
      source: document.getElementById("f-source").value,
      wecom: document.getElementById("f-wecom").value,
      rightSt: document.getElementById("f-right").value,
      mergeStatus: document.getElementById("f-merge").value
    };
  }

  function render() {
    var rows = Store.list(readFilter());
    var tb = document.getElementById("pu-tbody");
    document.getElementById("pu-count").textContent = String(rows.length);
    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="9" class="muted" style="text-align:center;padding:28px">暂无匹配用户</td></tr>';
      return;
    }
    tb.innerHTML = rows.map(function (u) {
      var badge = Store.mergeStatusBadge(u.mergeStatus);
      var st = Store.mergeStatusLabel(u.mergeStatus);
      return "<tr>" +
        '<td class="mono"><a href="platform-user-detail.html?id=' + encodeURIComponent(u.id) + '">' + u.id + "</a></td>" +
        "<td>" + u.name + (u.nick ? '<div class="muted" style="font-size:12px">' + u.nick + "</div>" : "") + "</td>" +
        "<td>" + (u.phoneMask || "—") + "</td>" +
        "<td><div>" + u.tenantCount + " 个</div>" + tenantSummary(u.tenantNames) + "</td>" +
        "<td>" + u.orderCount + "</td>" +
        "<td>" + u.validRights + "</td>" +
        "<td>" + (u.lastActiveTenantName || "—") +
          '<div class="muted" style="font-size:12px">' + (u.lastActiveAt || "—") + "</div></td>" +
        "<td>" + (badge ? '<span class="badge ' + badge + '">' + st + "</span>" : st) + "</td>" +
        '<td class="row-actions"><a href="platform-user-detail.html?id=' + encodeURIComponent(u.id) + '">查看详情</a></td>' +
        "</tr>";
    }).join("");
  }

  document.getElementById("btn-query").onclick = render;
  document.getElementById("btn-reset").onclick = function () {
    ["f-name", "f-phone", "f-puid", "f-local"].forEach(function (id) {
      document.getElementById(id).value = "";
    });
    ["f-tenant", "f-source", "f-wecom", "f-right", "f-merge"].forEach(function (id) {
      document.getElementById(id).value = "";
    });
    render();
  };
  document.getElementById("btn-export").onclick = function () {
    Proto.toast("已导出当前筛选结果（原型）");
  };
  render();
})();
</script>
</body>
</html>
