<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>任务 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/assess.css?v=3" />
</head>
<body class="admin-body" data-module="content" data-nav="content-tasks" data-title="任务" data-crumb="内容 / 学习服务 / 任务">

<div id="header-actions">
  <button class="btn btn-primary" id="btn-new">+ 新建任务定义</button>
</div>

<div id="page-content" style="display:none">
  <div class="as-banner" style="background:#f7f8fa;border:1px solid #e8e8e8;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px">
    统一模型：<b>任务定义 → 任务实例</b>。类型：线上课任务 / 文章任务 / 测评任务 / 智能体任务。智能体任务只出现在定制化计划关卡中，不可单独商品化。文章默认免费，也可编为文章任务。
  </div>

  <div class="tabs" id="main-tabs">
    <a class="active" href="#" data-tab="def">任务定义</a>
    <a href="#" data-tab="inst">任务实例</a>
  </div>

  <div id="panel-def">
    <div class="card" style="margin-bottom:12px"><div class="card-bd" style="padding:12px 16px">
      <div class="toolbar" style="border:none;padding:0;background:transparent">
        <input class="input" id="f-q" placeholder="任务名称" style="width:200px" />
        <select class="input" id="f-type" style="width:140px">
          <option value="">全部类型</option>
          <option>线上课任务</option>
          <option>文章任务</option>
          <option>测评任务</option>
          <option>智能体任务</option>
        </select>
        <select class="input" id="f-shelf" style="width:120px">
          <option value="">全部上下架</option>
          <option>上架</option>
          <option>下架</option>
        </select>
        <button class="btn btn-primary" id="btn-query-def">查询</button>
      </div>
    </div></div>
    <table class="as-table">
      <thead>
        <tr>
          <th>任务名称</th>
          <th>类型</th>
          <th>关联对象</th>
          <th>完成条件</th>
          <th>状态</th>
          <th style="width:220px">操作</th>
        </tr>
      </thead>
      <tbody id="tbody-def"></tbody>
    </table>
  </div>

  <div id="panel-inst" style="display:none">
    <div class="card" style="margin-bottom:12px"><div class="card-bd" style="padding:12px 16px">
      <div class="toolbar" style="border:none;padding:0;background:transparent">
        <input class="input" id="f-user" placeholder="用户 / customer_id" style="width:180px" />
        <select class="input" id="f-st" style="width:120px">
          <option value="">全部状态</option>
          <option>待开始</option>
          <option>进行中</option>
          <option>已完成</option>
          <option>已逾期</option>
        </select>
        <button class="btn btn-primary" id="btn-query-inst">查询</button>
      </div>
    </div></div>
    <table class="as-table">
      <thead>
        <tr>
          <th>用户</th>
          <th>任务</th>
          <th>开始时间</th>
          <th>截止时间</th>
          <th>状态</th>
          <th>完成时间</th>
          <th>完成结果</th>
        </tr>
      </thead>
      <tbody id="tbody-inst"></tbody>
    </table>
  </div>
</div>

<div class="proto-modal" id="modal-new">
  <div style="background:#fff;border-radius:10px;width:480px;max-width:94vw;overflow:hidden">
    <div class="proto-modal-hd"><h3 style="margin:0;font-size:16px">新建任务定义</h3><button class="ctrl-icon-btn" data-close>×</button></div>
    <div class="proto-modal-bd">
      <div class="field"><label>任务名称 *</label><input class="input" id="n-name" placeholder="如：完成亲子沟通线上课" /></div>
      <div class="field"><label>任务类型 *</label>
        <select class="input" id="n-type">
          <option>线上课任务</option>
          <option>文章任务</option>
          <option>测评任务</option>
          <option>智能体任务</option>
        </select>
      </div>
      <div class="field"><label>关联对象 *</label><input class="input" id="n-ref" placeholder="content_id / assessment_id / agent_id" /></div>
      <div class="field"><label>完成条件 *</label><input class="input" id="n-done" placeholder="如：学习进度 ≥ 80%" /></div>
    </div>
    <div class="proto-modal-ft" style="justify-content:flex-end;gap:8px">
      <button class="btn" data-close>取消</button>
      <button class="btn btn-primary" id="btn-save-new">保存</button>
    </div>
  </div>
</div>
<div class="proto-mask" id="mask"></div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/admin-shell.js?v=25"></script>
<script>
var DEFS = [
  { id: "T001", name: "完成亲子沟通线上课", type: "线上课任务", ref: "C001 · 线上课", done: "进度≥80%", status: "上架" },
  { id: "T002", name: "完成亲子沟通测评", type: "测评任务", ref: "AS001 · 测评", done: "提交答卷", status: "上架" },
  { id: "T003", name: "与家庭教育顾问对话", type: "智能体任务", ref: "AG02 · 智能体", done: "完成 1 轮有效对话", status: "上架" },
  { id: "T004", name: "阅读启蒙第 1 章学习", type: "线上课任务", ref: "C001 · 线上课", done: "章节完课", status: "上架" },
  { id: "T005", name: "阅读新学期家长指南", type: "文章任务", ref: "A001 · 文章", done: "阅读完成", status: "上架" }
];
var INST = [
  { user: "张女士", customer_id: "C1001", task: "T001 完成亲子沟通线上课", start: "2026-09-18 09:00", due: "2026-09-20 23:59", status: "进行中", doneAt: "—", result: "—" },
  { user: "李先生", customer_id: "C1002", task: "T002 完成亲子沟通测评", start: "2026-09-17 10:00", due: "2026-09-19 23:59", status: "已完成", doneAt: "2026-09-18 15:20", result: "总分 72" },
  { user: "王女士", customer_id: "C1003", task: "T003 与家庭教育顾问对话", start: "2026-09-15 09:00", due: "2026-09-16 23:59", status: "已逾期", doneAt: "—", result: "—" },
  { user: "赵先生", customer_id: "C1004", task: "T001 完成亲子沟通线上课", start: "2026-09-19 08:00", due: "2026-09-21 23:59", status: "待开始", doneAt: "—", result: "—" }
];

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }

function renderDef() {
  var q = (document.getElementById("f-q").value || "").trim();
  var t = document.getElementById("f-type").value;
  var shelf = document.getElementById("f-shelf").value;
  var list = DEFS.filter(function (d) {
    if (t && d.type !== t) return false;
    if (shelf && d.status !== shelf) return false;
    if (q && d.name.indexOf(q) < 0) return false;
    return true;
  });
  document.getElementById("tbody-def").innerHTML = list.map(function (d) {
    var shelfBtn = d.status === "上架"
      ? "<button class='btn' data-shelf='" + d.id + "'>下架</button>"
      : "<button class='btn btn-primary' data-shelf='" + d.id + "'>上架</button>";
    return "<tr><td><b>" + esc(d.name) + "</b><br><span class='muted' style='font-size:12px'>" + esc(d.id) + "</span></td>" +
      "<td>" + esc(d.type) + "</td><td>" + esc(d.ref) + "</td><td>" + esc(d.done) + "</td>" +
      "<td><span class='as-tag " + (d.status === "上架" ? "green" : "gray") + "'>" + esc(d.status) + "</span></td>" +
      "<td class='as-acts'><a class='btn' href='#' data-toast='已打开编辑（原型）'>编辑</a> " + shelfBtn + "</td></tr>";
  }).join("") || "<tr><td colspan='6' style='text-align:center;color:#bfbfbf;padding:24px'>暂无任务定义</td></tr>";
}

function renderInst() {
  var u = (document.getElementById("f-user").value || "").trim();
  var st = document.getElementById("f-st").value;
  var list = INST.filter(function (r) {
    if (st && r.status !== st) return false;
    if (u && (r.user + r.customer_id).indexOf(u) < 0) return false;
    return true;
  });
  var color = { "待开始": "gray", "进行中": "blue", "已完成": "green", "已逾期": "orange" };
  document.getElementById("tbody-inst").innerHTML = list.map(function (r) {
    return "<tr><td>" + esc(r.user) + "<br><span class='muted' style='font-size:12px'><a href='user-detail.html?customer_id=" + r.customer_id + "'>" + esc(r.customer_id) + "</a></span></td>" +
      "<td>" + esc(r.task) + "</td><td style='font-size:12px'>" + esc(r.start) + "</td><td style='font-size:12px'>" + esc(r.due) + "</td>" +
      "<td><span class='as-tag " + (color[r.status] || "gray") + "'>" + esc(r.status) + "</span></td>" +
      "<td style='font-size:12px'>" + esc(r.doneAt) + "</td><td>" + esc(r.result) + "</td></tr>";
  }).join("") || "<tr><td colspan='7' style='text-align:center;color:#bfbfbf;padding:24px'>暂无任务实例</td></tr>";
}

document.querySelectorAll("#main-tabs a").forEach(function (a) {
  a.addEventListener("click", function (e) {
    e.preventDefault();
    document.querySelectorAll("#main-tabs a").forEach(function (x) { x.classList.remove("active"); });
    a.classList.add("active");
    var tab = a.getAttribute("data-tab");
    document.getElementById("panel-def").style.display = tab === "def" ? "" : "none";
    document.getElementById("panel-inst").style.display = tab === "inst" ? "" : "none";
  });
});

document.getElementById("btn-query-def").addEventListener("click", renderDef);
document.getElementById("btn-query-inst").addEventListener("click", renderInst);
document.getElementById("tbody-def").addEventListener("click", function (e) {
  var btn = e.target.closest("[data-shelf]");
  if (!btn) return;
  var row = DEFS.find(function (x) { return x.id === btn.getAttribute("data-shelf"); });
  if (!row) return;
  row.status = row.status === "上架" ? "下架" : "上架";
  renderDef();
  Proto.toast(row.status === "上架" ? "已上架" : "已下架");
});
document.getElementById("btn-new").addEventListener("click", function () {
  document.getElementById("mask").classList.add("open");
  document.getElementById("modal-new").classList.add("open");
});
document.querySelectorAll("[data-close]").forEach(function (el) {
  el.addEventListener("click", function () {
    document.getElementById("mask").classList.remove("open");
    document.getElementById("modal-new").classList.remove("open");
  });
});
document.getElementById("btn-save-new").addEventListener("click", function () {
  var name = document.getElementById("n-name").value.trim();
  if (!name) { Proto.toast("请填写任务名称"); return; }
  DEFS.unshift({
    id: "T" + String(100 + DEFS.length),
    name: name,
    type: document.getElementById("n-type").value,
    ref: document.getElementById("n-ref").value || "—",
    done: document.getElementById("n-done").value || "—",
    status: "上架"
  });
  document.getElementById("mask").classList.remove("open");
  document.getElementById("modal-new").classList.remove("open");
  Proto.toast("任务定义已创建 · 下一步：加入关卡/计划");
  renderDef();
});

var params = new URLSearchParams(location.search);
if (params.get("type") === "agent") {
  document.getElementById("n-type").value = "智能体任务";
  document.getElementById("n-ref").value = params.get("agent_id") || "";
  document.getElementById("mask").classList.add("open");
  document.getElementById("modal-new").classList.add("open");
}
if (params.get("type") === "article") {
  document.getElementById("n-type").value = "文章任务";
  document.getElementById("n-ref").value = (params.get("ref") || "") + (params.get("ref") ? " · 文章" : "");
  document.getElementById("n-name").value = params.get("ref") ? ("阅读文章 " + params.get("ref")) : "";
  document.getElementById("n-done").value = "阅读完成";
  document.getElementById("mask").classList.add("open");
  document.getElementById("modal-new").classList.add("open");
}

renderDef();
renderInst();
</script>
</body>
</html>
