<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>视频号订单 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
</head>
<body class="admin-body" data-module="trade" data-nav="channels-orders" data-title="视频号订单" data-crumb="交易 / 渠道订单 / 视频号订单">
<div id="header-actions">
  <button class="btn btn-primary" id="btn-import">导入手机号</button>
  <button class="btn" id="btn-export">导出列表</button>
  <button class="btn" id="btn-sms">重发领课短信</button>
  <button class="btn" id="btn-touch">加微触达</button>
  <button class="btn" id="btn-decrypt">批量解密</button>
</div>
<div id="page-content" style="display:none">

  <!-- 顶部统计卡片 -->
  <div class="grid-4" style="margin-bottom:16px">
    <div class="stat"><div class="label">总订单</div><div class="value" id="st-total">0</div></div>
    <div class="stat"><div class="label">短信失败</div><div class="value" id="st-failed">0</div></div>
    <div class="stat"><div class="label">发送成功</div><div class="value" id="st-ok">0</div></div>
    <div class="stat"><div class="label">待发送</div><div class="value" id="st-pending">0</div></div>
    <div class="stat"><div class="label">已领课</div><div class="value" id="st-claim">0</div></div>
  </div>

  <div id="sms-filter-chip" style="display:none;margin-bottom:8px">
    <span class="filter-chip">筛选：短信发送失败 <a href="#" id="chip-clear" style="margin-left:8px">清除</a></span>
  </div>

  <!-- 筛选 -->
  <div class="card" style="margin-bottom:8px"><div class="card-bd">
    <div class="form-grid" style="grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 12px">
      <input id="f-order-public" placeholder="公域订单号" />
      <input id="f-order-local" placeholder="艺博订单号" />
      <select id="f-status">
        <option value="">订单状态</option>
        <option>全部</option><option>已支付</option><option>待付款</option>
        <option>待发货</option><option>已发货</option>
        <option>已完成</option><option>已取消</option>
      </select>
      <select id="f-refund">
        <option value="">退款状态</option>
        <option>全部</option><option>否</option><option>是</option>
      </select>
      <select id="f-deliver">
        <option value="">发货状态</option>
        <option>全部</option><option>已发货</option><option>待发货</option>
      </select>
      <select id="f-sms">
        <option value="">短信发送</option>
        <option value="all">全部</option>
        <option value="pending">待发送</option>
        <option value="success">发送成功</option>
        <option value="failed">发送失败</option>
      </select>
      <select id="f-has-note">
        <option value="">商家备注</option>
        <option>全部</option><option>是</option><option>否</option>
      </select>
      <input id="f-product" placeholder="公域商品" />
      <input id="f-time1" type="datetime-local" />
      <input id="f-time2" type="datetime-local" />
      <select id="f-decrypt">
        <option value="">解密状态</option>
        <option>全部</option><option>已解密</option><option>未解密</option>
      </select>
      <button class="btn btn-primary" id="btn-query">筛选</button>
      <button class="btn" id="btn-reset">重置</button>
    </div>
  </div></div>

  <!-- 表格 -->
  <div class="card"><div class="card-bd" style="padding:0">
    <table class="data">
      <thead>
        <tr>
          <th style="width:36px"><input type="checkbox" id="ck-all" /></th>
          <th style="width:48px">商品图</th>
          <th>商品信息</th>
          <th>客户信息</th>
          <th>价格</th>
          <th>实付金额</th>
          <th>订单来源</th>
          <th>短信发送</th>
          <th>来源订单号</th>
          <th>领课状态</th>
          <th>添加时间</th>
          <th>商家备注</th>
          <th style="width:200px">操作</th>
        </tr>
      </thead>
      <tbody id="co-tbody"></tbody>
    </table>
  </div></div>
  <!-- 分页 -->
  <div class="toolbar" style="margin-top:8px">
    <span class="muted" id="co-count">共 <b>0</b> 条</span>
    <div class="spacer"></div>
    <select><option>10条/页</option><option>20条/页</option><option>50条/页</option></select>
    <button class="btn btn-sm" disabled>上一页</button>
    <button class="btn btn-sm">下一页</button>
  </div>
</div>

<!-- ============ 弹窗 / 抽屉 ============ -->
<div class="proto-mask" id="mask"></div>

<!-- 详情抽屉 -->
<div class="proto-drawer" id="drawer-detail">
  <div class="proto-drawer-hd">
    <h3 id="cod-title">订单详情</h3>
    <button class="btn btn-sm btn-ghost" data-close>×</button>
  </div>
  <div class="proto-drawer-bd">
    <h4 style="margin-bottom:8px">订单信息</h4>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field"><label>公域订单号</label><div id="cod-public">—</div></div>
      <div class="field"><label>艺博订单号</label><div id="cod-local">—</div></div>
      <div class="field"><label>订单来源</label><div id="cod-source">—</div></div>
      <div class="field"><label>订单状态</label><div id="cod-status">—</div></div>
      <div class="field"><label>下单时间</label><div id="cod-time">—</div></div>
      <div class="field"><label>订单归属人</label><div id="cod-owner">—</div></div>
      <div class="field"><label>价格</label><div id="cod-price">—</div></div>
      <div class="field"><label>实付金额</label><div id="cod-paid">—</div></div>
      <div class="field"><label>解密状态</label><div id="cod-decrypt">—</div></div>
      <div class="field"><label>短信发送</label><div id="cod-sms">—</div></div>
    </div>
    <h4 style="margin:16px 0 8px">商品信息</h4>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field"><label>商品</label><div id="cod-product">—</div></div>
      <div class="field"><label>规格</label><div id="cod-spec">—</div></div>
    </div>
    <h4 style="margin:16px 0 8px">客户信息</h4>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field"><label>客户</label><div id="cod-customer">—</div></div>
      <div class="field"><label>手机号</label><div id="cod-phone">—</div></div>
    </div>
    <h4 style="margin:16px 0 8px">备注</h4>
    <p class="muted" id="cod-note">—</p>
  </div>
  <div class="proto-drawer-ft">
    <button class="btn" data-close>关闭</button>
    <button class="btn">发起退款</button>
    <button class="btn btn-primary">查看售后</button>
  </div>
</div>

<style>
.thumb {
  width: 48px; height: 36px; border-radius: 4px;
}
.thumb-course { background: linear-gradient(135deg,#165dff,#4080ff); }
.thumb-live { background: linear-gradient(135deg,#722ed1,#a066f5); }
.link-mono {
  font-family: ui-monospace, Consolas, monospace;
  font-size: 12px;
  color: var(--color-primary);
  text-decoration: none;
}
.link-mono:hover { text-decoration: underline; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.tag-blue { background: #e8f3ff; color: #165dff; }
.row-actions a.danger { color: var(--color-danger); }
.filter-chip {
  display: inline-flex; align-items: center;
  padding: 6px 12px; border-radius: 16px;
  background: #fff7e6; border: 1px solid #ffd591; color: #d48806;
  font-size: 12px;
}
.filter-chip a { color: #165dff; text-decoration: none; }
</style>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/prototype-business-store.js"></script>
<script src="../assets/js/admin-shell.js?v=13"></script>
<script>
(function () {
  var Biz = window.ProtoBiz;
  var smsFailedOnly = false;
  var listCache = [];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function normalizeFocusUrl(enable) {
    try {
      var u = new URL(location.href);
      u.searchParams.delete("sms");
      if (enable) u.searchParams.set("focus", "sms_failed");
      else u.searchParams.delete("focus");
      var next = u.pathname + u.search + u.hash;
      if (next !== location.pathname + location.search + location.hash) {
        history.replaceState(null, "", next);
      }
    } catch (e) {}
  }

  function readFocusFromUrl() {
    try {
      var q = new URLSearchParams(location.search);
      if (q.get("focus") === "sms_failed" || q.get("sms") === "failed") {
        smsFailedOnly = true;
        normalizeFocusUrl(true);
        return;
      }
    } catch (e) {}
    smsFailedOnly = false;
  }

  function smsBadge(o) {
    if (o.smsStatus === "failed") return '<span class="badge badge-danger">' + esc(o.smsStatusLabel || "发送失败") + "</span>";
    if (o.smsStatus === "success") return '<span class="badge badge-success">' + esc(o.smsStatusLabel || "发送成功") + "</span>";
    return '<span class="badge">' + esc(o.smsStatusLabel || "待发送") + "</span>";
  }

  function setOrderUrl(orderId) {
    try {
      var u = new URL(location.href);
      if (orderId) u.searchParams.set("order_id", orderId);
      else u.searchParams.delete("order_id");
      u.searchParams.delete("id");
      history.replaceState(null, "", u.pathname + u.search + u.hash);
    } catch (e) {}
  }

  function setDrawerA11y(open) {
    var d = document.getElementById("drawer-detail");
    if (!d) return;
    if (open) {
      d.removeAttribute("aria-hidden");
      d.removeAttribute("inert");
    } else {
      d.setAttribute("aria-hidden", "true");
      d.setAttribute("inert", "");
    }
  }

  function fillDetail(o) {
    if (!o || !o.id) {
      Proto.toast("未找到对应订单，请返回列表重新选择。");
      setDrawerA11y(false);
      setOrderUrl("");
      return;
    }
    document.getElementById("cod-title").textContent = "订单详情 · " + o.title;
    document.getElementById("cod-public").textContent = o.id;
    document.getElementById("cod-local").textContent = o.id;
    document.getElementById("cod-source").textContent = "视频号";
    document.getElementById("cod-status").textContent = "已支付";
    document.getElementById("cod-time").textContent = o.paidAt || "—";
    document.getElementById("cod-owner").textContent = "—";
    document.getElementById("cod-price").textContent = "¥" + Number(o.amount || 0).toFixed(2);
    document.getElementById("cod-paid").textContent = "¥" + Number(o.amount || 0).toFixed(2);
    document.getElementById("cod-decrypt").textContent = "已解密";
    document.getElementById("cod-sms").textContent = o.smsStatusLabel || o.smsStatus;
    document.getElementById("cod-product").textContent = o.title;
    document.getElementById("cod-spec").textContent = "默认";
    document.getElementById("cod-customer").textContent = o.buyer || "—";
    document.getElementById("cod-phone").textContent = o.phone || "—";
    document.getElementById("cod-note").textContent = "无";
    setOrderUrl(o.id);
    open(document.getElementById("drawer-detail"));
    setDrawerA11y(true);
  }

  function render() {
    var all = Biz.getChannelOrders() || [];
    var failed = Biz.getChannelOrders("sms_failed") || [];
    document.getElementById("st-total").textContent = String(all.length);
    document.getElementById("st-failed").textContent = String(failed.length);
    document.getElementById("st-ok").textContent = String(all.filter(function (o) { return o.smsStatus === "success"; }).length);
    document.getElementById("st-pending").textContent = String(all.filter(function (o) { return o.smsStatus === "pending"; }).length);
    document.getElementById("st-claim").textContent = String(all.filter(function (o) { return o.claimStatus === "已领课"; }).length);

    document.getElementById("sms-filter-chip").style.display = smsFailedOnly ? "" : "none";
    if (smsFailedOnly) document.getElementById("f-sms").value = "failed";

    var smsFilter = document.getElementById("f-sms").value;
    var kw = (document.getElementById("f-product").value || "").trim();
    var list = smsFailedOnly ? Biz.getChannelOrders("sms_failed") : Biz.getChannelOrders();
    if (!smsFailedOnly && smsFilter === "failed") list = Biz.getChannelOrders("sms_failed");
    else if (!smsFailedOnly && smsFilter === "success") list = list.filter(function (o) { return o.smsStatus === "success"; });
    else if (!smsFailedOnly && smsFilter === "pending") list = list.filter(function (o) { return o.smsStatus === "pending"; });
    if (kw) list = list.filter(function (o) { return (o.title || "").indexOf(kw) >= 0 || (o.id || "").indexOf(kw) >= 0; });

    listCache = list;
    document.getElementById("co-count").innerHTML = "共 <b>" + list.length + "</b> 条";
    var tbody = document.getElementById("co-tbody");
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="13" class="muted" style="text-align:center;padding:24px">暂无订单</td></tr>';
      return;
    }
    var focusQs = smsFailedOnly ? "focus=sms_failed&" : "";
    tbody.innerHTML = list.map(function (o) {
      var detailHref = "channels-orders.html?" + focusQs + "order_id=" + encodeURIComponent(o.id);
      return '<tr data-id="' + esc(o.id) + '">' +
        '<td><input type="checkbox" class="row-check" data-id="' + esc(o.id) + '" data-sms="' + esc(o.smsStatus) + '" /></td>' +
        '<td><div class="thumb thumb-course"></div></td>' +
        "<td>" + esc(o.title) + '<br><span class="muted">¥' + Number(o.amount || 0).toFixed(2) + "</span></td>" +
        "<td>" + esc(o.buyer) + '<br><span class="muted">' + esc(o.phone) + "</span></td>" +
        "<td>¥" + Number(o.amount || 0).toFixed(2) + "</td>" +
        "<td><b>¥" + Number(o.amount || 0).toFixed(2) + "</b></td>" +
        '<td><span class="tag tag-blue">视频号</span></td>' +
        "<td>" + smsBadge(o) + "</td>" +
        '<td><a href="' + detailHref + '" class="link-mono" data-row-act="detail" data-id="' + esc(o.id) + '">' + esc(o.id) + "</a></td>" +
        "<td>" + esc(o.claimStatus || "—") + "</td>" +
        "<td>" + esc(o.paidAt || "—") + "</td>" +
        "<td>—</td>" +
        '<td class="row-actions">' +
          '<a href="' + detailHref + '" data-row-act="detail" data-id="' + esc(o.id) + '">详情</a>' +
          (o.smsStatus === "failed" ? '<a href="' + detailHref + '&act=resend" data-row-act="resend" data-id="' + esc(o.id) + '">重发短信</a>' : "") +
        "</td></tr>";
    }).join("");

    tbody.querySelectorAll("[data-row-act]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        var id = a.getAttribute("data-id") || (a.closest("tr") && a.closest("tr").getAttribute("data-id"));
        var o = listCache.find(function (x) { return x.id === id; });
        if (!o) { Proto.toast("未找到订单 " + (id || "")); return; }
        var act = a.getAttribute("data-row-act");
        if (act === "detail") fillDetail(o);
        else if (act === "resend") {
          Biz.resendSms([o.id]);
          Proto.toast("已重发短信：" + o.id);
          render();
        }
      });
    });
  }

  var mask = document.getElementById("mask");
  function closeAll() {
    mask.classList.remove("open");
    document.querySelectorAll(".proto-modal, .proto-drawer").forEach(function (n) { n.classList.remove("open"); });
    setDrawerA11y(false);
    setOrderUrl("");
  }
  function open(node) { mask.classList.add("open"); node.classList.add("open"); }
  mask.addEventListener("click", closeAll);
  document.querySelectorAll("[data-close]").forEach(function (n) { n.addEventListener("click", closeAll); });

  document.getElementById("ck-all").addEventListener("change", function () {
    var c = this.checked;
    document.querySelectorAll(".row-check").forEach(function (x) { x.checked = c; });
  });

  document.getElementById("btn-sms").addEventListener("click", function () {
    var ids = Array.from(document.querySelectorAll(".row-check:checked"))
      .filter(function (c) { return c.getAttribute("data-sms") === "failed"; })
      .map(function (c) { return c.getAttribute("data-id"); });
    if (!ids.length) {
      Proto.toast("请勾选短信发送失败的订单");
      return;
    }
    Biz.resendSms(ids);
    Proto.toast("已重发 " + ids.length + " 条短信");
    render();
  });

  document.getElementById("chip-clear").addEventListener("click", function (e) {
    e.preventDefault();
    smsFailedOnly = false;
    document.getElementById("f-sms").value = "";
    normalizeFocusUrl(false);
    render();
  });

  document.getElementById("btn-import").addEventListener("click", function () { Proto.toast("打开导入手机号（原型）"); });
  document.getElementById("btn-export").addEventListener("click", function () { Proto.toast("已导出（原型）"); });
  document.getElementById("btn-touch").addEventListener("click", function () { Proto.toast("加微触达（原型）"); });
  document.getElementById("btn-decrypt").addEventListener("click", function () { Proto.toast("批量解密手机号（原型）"); });
  document.getElementById("btn-query").addEventListener("click", function () {
    if (document.getElementById("f-sms").value === "failed") {
      smsFailedOnly = true;
      normalizeFocusUrl(true);
    }
    render();
  });
  document.getElementById("btn-reset").addEventListener("click", function () {
    ["f-order-public","f-order-local","f-product"].forEach(function (id) { document.getElementById(id).value = ""; });
    ["f-status","f-refund","f-deliver","f-sms","f-has-note","f-decrypt"].forEach(function (id) { document.getElementById(id).value = ""; });
    document.getElementById("f-time1").value = "";
    document.getElementById("f-time2").value = "";
    smsFailedOnly = false;
    normalizeFocusUrl(false);
    render();
    Proto.toast("已重置");
  });

  setDrawerA11y(false);
  readFocusFromUrl();
  render();
  try {
    var q2 = new URLSearchParams(location.search);
    var oid = q2.get("order_id");
    var act = q2.get("act");
    if (oid) {
      var hit = (Biz.getChannelOrders() || []).find(function (o) { return o.id === oid; });
      if (hit) {
        if (act === "resend" && hit.smsStatus === "failed") {
          Biz.resendSms([hit.id]);
          Proto.toast("已重发短信：" + hit.id);
          try {
            var u = new URL(location.href);
            u.searchParams.delete("act");
            history.replaceState(null, "", u.pathname + u.search + u.hash);
          } catch (e3) {}
          render();
          hit = (Biz.getChannelOrders() || []).find(function (o) { return o.id === oid; }) || hit;
        }
        fillDetail(hit);
      } else {
        Proto.toast("未找到对应订单，请返回列表重新选择。");
        setOrderUrl("");
      }
    }
  } catch (e2) {}
})();
</script>
</body>
</html>
