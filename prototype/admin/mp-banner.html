<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Banner管理 · 艺博 To-B</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<style>
.b-preview {
  width: 150px; min-height: 56px; border-radius: 8px; padding: 8px 10px;
  color: #fff; font-size: 12px; font-weight: 600; line-height: 1.4;
  display: flex; align-items: center;
}
.b-blue   { background: linear-gradient(135deg, #5b8cf7, #3b6de0); }
.b-orange { background: linear-gradient(135deg, #f7a054, #ef823a); }
.b-green  { background: linear-gradient(135deg, #4cae6d, #2f9e57); }
.b-title { font-size: 14px; font-weight: 600; color: #1d2129; }
.b-sub   { font-size: 12px; color: #8c8c8c; margin-top: 4px; }
.b-status-show   { font-size: 12px; color: #2f9e57; font-weight: 500; }
.b-status-hidden { font-size: 12px; color: #bfbfbf; }
.b-op { color: #165dff; cursor: pointer; margin-right: 10px; font-size: 13px; }
.b-op.off { color: #bfbfbf; cursor: default; }
.b-foot { display: flex; align-items: center; margin-top: 14px; }
.b-foot .hint-right { margin-left: auto; font-size: 12px; color: #8c8c8c; }
</style>
</head>
<body class="admin-body" data-module="content" data-nav="mp-banner" data-title="Banner管理" data-crumb="内容 / 小程序管理 / Banner管理">

<div id="header-actions">
  <button class="btn btn-primary" id="btn-add-top">+ 新增 Banner</button>
</div>

<div id="page-content" style="display:none">
  <div class="card">
    <div class="card-bd" style="padding:16px">
      <table class="data" style="width:100%">
        <thead>
          <tr><th style="width:180px">预览</th><th>标题 / 副标题</th><th style="width:220px">跳转链接</th><th style="width:90px">状态</th><th style="width:240px">操作</th></tr>
        </thead>
        <tbody id="banner-tbody"></tbody>
      </table>
      <div class="b-foot">
        <button class="btn" id="btn-add-bottom">+ 新增 Banner</button>
        <span class="hint-right">最多 6 条，C 端自动轮播，第一条为默认主推</span>
      </div>
    </div>
  </div>
</div>

<!-- 弹窗遮罩 -->
<div class="proto-mask" id="mask"></div>

<!-- 编辑 Banner 弹窗 -->
<div class="proto-modal" id="banner-modal" style="width:560px;max-width:94vw">
  <div style="background:#fff;border-radius:10px;overflow:hidden">
    <div class="proto-modal-hd"><h3 style="margin:0;font-size:16px" id="bm-title">编辑 Banner</h3><button class="ctrl-icon-btn" data-bm-close>×</button></div>
    <div class="proto-modal-bd">
      <div class="form-grid" style="grid-template-columns:1fr 1fr">
        <div class="field">
          <label>标题 *</label>
          <input class="input" id="bm-name" maxlength="20" placeholder="建议 8 字内，C 端卡片加粗展示" />
        </div>
        <div class="field">
          <label>副标题</label>
          <input class="input" id="bm-sub" maxlength="24" placeholder="一行补充说明，选填" />
        </div>
        <div class="field">
          <label>跳转链接 *</label>
          <select class="input" id="bm-jump"></select>
        </div>
        <div class="field">
          <label>主图</label>
          <input class="input" type="file" id="bm-img" accept="image/jpeg,image/png" />
          <div style="font-size:11px;color:#8c8c8c;margin-top:4px">建议 750×300px，JPG/PNG，≤500KB</div>
        </div>
      </div>
    </div>
    <div class="proto-modal-ft" style="display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid #f0f0f0">
      <button class="btn" data-bm-close>取消</button>
      <button class="btn btn-primary" id="bm-ok">确定</button>
    </div>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/admin-shell.js?v=15"></script>
<script>
// ===== 跳转链接取值：C 端核心页面 =====
var JUMPS = [
  { v: "course:S001", label: "课程详情 · 亲子沟通基础课" },
  { v: "course:S002", label: "课程详情 · 家庭教育风格测评训练营" },
  { v: "claim",       label: "领课兑换页" },
  { v: "live:L001",   label: "直播预告 · 开学第一课家长专场" },
  { v: "assess:A01",  label: "测评页 · 家庭教育风格测评" },
];
var COLORS = ["blue", "orange", "green"];

var BANNERS = [
  { title: "开学季亲子沟通特训营", sub: "限时 5 折 · 前 100 名赠 1v1 咨询", jump: "course:S001", color: "blue",   hidden: false },
  { title: "家庭教育风格测评免费测", sub: "3 分钟了解你的教养风格",       jump: "claim",       color: "orange", hidden: false },
  { title: "开学第一课 · 家长专场直播", sub: "9 月 12 日 20:00 开播",     jump: "live:L001",   color: "green",  hidden: true },
];

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}
function jumpLabel(v) {
  var j = JUMPS.find(function(x){ return x.v === v; });
  return j ? j.label : v;
}

function render() {
  document.getElementById("banner-tbody").innerHTML = BANNERS.map(function(b, i) {
    return '' +
      '<tr>' +
        '<td><div class="b-preview b-' + b.color + '">' + esc(b.title) + '</div></td>' +
        '<td><div class="b-title">' + esc(b.title) + '</div><div class="b-sub">' + esc(b.sub || "—") + '</div></td>' +
        '<td style="font-size:13px;color:#4e5969">' + esc(jumpLabel(b.jump)) + '</td>' +
        '<td><span class="' + (b.hidden ? "b-status-hidden" : "b-status-show") + '">' + (b.hidden ? "已隐藏" : "展示中") + '</span></td>' +
        '<td>' +
          (i === 0 ? '<span class="b-op off">—</span>' : '<span class="b-op" data-up="' + i + '">上移</span>') +
          '<span class="b-op" data-edit="' + i + '">编辑</span>' +
          '<span class="b-op" data-toggle="' + i + '">' + (b.hidden ? "展示" : "隐藏") + '</span>' +
          '<span class="b-op" data-del="' + i + '">删除</span>' +
        '</td>' +
      '</tr>';
  }).join("") || '<tr><td colspan="5" style="text-align:center;color:#bfbfbf;padding:24px">暂无 Banner，点击下方「新增 Banner」添加</td></tr>';
}

// ===== 弹窗 =====
var mask = document.getElementById("mask");
var modal = document.getElementById("banner-modal");
var editIdx = -1; // -1 = 新增

function openModal(idx) {
  editIdx = idx;
  document.getElementById("bm-title").textContent = idx >= 0 ? "编辑 Banner" : "新增 Banner";
  var b = idx >= 0 ? BANNERS[idx] : { title: "", sub: "", jump: JUMPS[0].v };
  document.getElementById("bm-name").value = b.title;
  document.getElementById("bm-sub").value = b.sub || "";
  var sel = document.getElementById("bm-jump");
  sel.innerHTML = JUMPS.map(function(j){ return '<option value="' + j.v + '">' + esc(j.label) + '</option>'; }).join("");
  sel.value = b.jump;
  document.getElementById("bm-img").value = "";
  mask.classList.add("open");
  modal.classList.add("open");
}
function closeModal() {
  mask.classList.remove("open");
  modal.classList.remove("open");
}

document.getElementById("bm-ok").addEventListener("click", function() {
  var title = document.getElementById("bm-name").value.trim();
  if (!title) { Proto.toast("请填写标题"); return; }
  var data = {
    title: title,
    sub: document.getElementById("bm-sub").value.trim(),
    jump: document.getElementById("bm-jump").value,
    color: editIdx >= 0 ? BANNERS[editIdx].color : COLORS[BANNERS.length % COLORS.length],
    hidden: editIdx >= 0 ? BANNERS[editIdx].hidden : false,
  };
  if (editIdx >= 0) BANNERS[editIdx] = data;
  else {
    if (BANNERS.length >= 6) { Proto.toast("最多 6 条 Banner，请先删除或隐藏"); return; }
    BANNERS.push(data);
  }
  render();
  closeModal();
  Proto.toast(editIdx >= 0 ? "Banner 已保存" : "Banner 已添加");
});

// ===== 事件 =====
document.addEventListener("click", function(e) {
  if (e.target.closest("#btn-add-top") || e.target.closest("#btn-add-bottom")) { openModal(-1); return; }
  if (e.target.closest("[data-bm-close]") || e.target === mask) { closeModal(); return; }
  var up = e.target.closest("[data-up]");
  if (up) {
    var i = +up.getAttribute("data-up");
    var t = BANNERS[i - 1]; BANNERS[i - 1] = BANNERS[i]; BANNERS[i] = t;
    render(); Proto.toast("已上移，第一条为默认主推"); return;
  }
  var ed = e.target.closest("[data-edit]");
  if (ed) { openModal(+ed.getAttribute("data-edit")); return; }
  var tg = e.target.closest("[data-toggle]");
  if (tg) {
    var i2 = +tg.getAttribute("data-toggle");
    BANNERS[i2].hidden = !BANNERS[i2].hidden;
    render(); Proto.toast(BANNERS[i2].hidden ? "已在 C 端隐藏" : "已在 C 端展示"); return;
  }
  var del = e.target.closest("[data-del]");
  if (del) {
    BANNERS.splice(+del.getAttribute("data-del"), 1);
    render(); Proto.toast("已删除（演示）"); return;
  }
});

render();
</script>
</body>
</html>
