<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>期次经营复盘 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=14" />
<style>
.board-kpi-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:16px; }
@media (max-width:1200px) { .board-kpi-grid { grid-template-columns:repeat(3,1fr); } }
@media (max-width:720px) { .board-kpi-grid { grid-template-columns:repeat(2,1fr); } }
.board-kpi { background:#fff; border:1px solid var(--color-border); border-radius:8px; padding:14px 16px; }
.board-kpi .kpi-label { font-size:12px; color:var(--color-text-muted); margin-bottom:4px; }
.board-kpi .kpi-value { font-size:24px; font-weight:700; line-height:1.2; }
.board-kpi .kpi-sub { font-size:12px; color:var(--color-text-muted); margin-top:4px; }
.board-kpi .kpi-meta { font-size:11px; color:var(--color-text-muted); margin-top:8px; line-height:1.5; }
.board-kpi .kpi-meta .up { color:#00b42a; }
.board-kpi .kpi-meta .down { color:#f53f3f; }
.board-filter-note { font-size:12px; color:var(--color-text-muted); margin-left:8px; }
.trend-metric-bar button.active { background:var(--color-primary); color:#fff; border-color:var(--color-primary); }
.term-empty { text-align:center; padding:48px 16px; background:#fff; border:1px dashed var(--color-border); border-radius:8px; margin-bottom:16px; }
#from-source { margin:0 0 12px; padding:10px 12px; background:#f2f7ff; border:1px solid #bedaff; border-radius:6px; font-size:13px; }
#term-trend-chart { min-height:220px; }
#slice-seg button:disabled { opacity:.45; cursor:not-allowed; }
.term-window-chip { font-size:12px; color:var(--color-text-muted); margin-left:8px; white-space:nowrap; }
</style>
</head>
<body class="admin-body" data-module="data" data-nav="board-t" data-title="期次经营复盘" data-crumb="数据看板 / 期次经营复盘" data-assist="1">
<div id="header-actions">
  <span class="muted" style="font-size:12px;margin-right:8px">统计切片</span>
  <div class="segmented" id="slice-seg" style="margin-right:8px">
    <button type="button" class="active" data-slice="term">整期</button>
    <button type="button" data-slice="7d">近7日</button>
    <button type="button" data-slice="30d">近30日</button>
    <button type="button" data-slice="custom">自定义</button>
  </div>
  <span class="muted" id="slice-range-label" style="font-size:12px;margin-right:8px"></span>
  <span class="muted" id="board-updated" style="margin-right:8px;font-size:12px"></span>
</div>
<div id="page-content" style="display:none">

  <div class="board-tip">
    <b>期次经营复盘：</b>以招生期次为主轴；时间仅为期内切片（默认整期）。
    <span class="muted" id="scope-help-brief"></span>
  </div>

  <div class="board-filter">
    <select id="f-term" title="选择期次"></select>
    <span class="term-window-chip" id="term-window-chip">经营周期 —</span>
    <span class="board-filter-note" id="slice-hint">默认按整期统计；近 N 日仅截取期内可用区间</span>
  </div>
  <div id="from-source" hidden></div>

  <div id="term-empty" class="term-empty" hidden>
    <h2 style="margin:0 0 8px;font-size:16px" id="term-empty-title">请选择一个具体期次进行经营复盘</h2>
    <p class="muted" style="margin:0 0 16px;font-size:13px" id="term-empty-desc">「全部期次」不能作为单个期次复盘对象。请在上方选择具体期次。</p>
    <button type="button" class="btn btn-primary" id="btn-pick-default">打开默认经营期次</button>
  </div>

  <div id="term-main" hidden>
    <h2 style="margin:0 0 12px;font-size:14px">核心经营指标 <span class="muted" style="font-weight:400"> · <span data-slice-label>整期</span></span></h2>
    <div class="board-kpi-grid" id="term-kpis"></div>

    <div class="card" id="term-trend-section" style="margin-bottom:16px">
      <div class="card-hd" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <h2 style="margin:0">核心指标趋势</h2>
        <span class="muted" style="font-size:12px;font-weight:400">按日 / 累计 / 上一期同期</span>
      </div>
      <div class="card-bd">
        <div class="trend-metric-bar" id="term-trend-bar" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px"></div>
        <p class="muted" style="font-size:12px;margin:0 0 8px" id="term-trend-note"></p>
        <div id="term-trend-chart"></div>
        <div style="margin-top:16px;padding-top:12px;border-top:1px dashed var(--color-border)">
          <h3 style="margin:0 0 8px;font-size:13px" id="term-detail-title">指标明细</h3>
          <div style="overflow-x:auto">
            <table class="data" style="min-width:960px">
              <thead id="term-detail-thead"></thead>
              <tbody id="term-metric-detail"></tbody>
            </table>
          </div>
          <p class="muted" style="font-size:12px;margin:8px 0 0" id="term-detail-note"></p>
        </div>
      </div>
    </div>
  </div>

</div>
<script src="../assets/js/proto.js"></script>
<script src="../assets/js/board-data.js?v=10"></script>
<script src="../assets/js/term-store.js?v=1"></script>
<script src="../assets/js/board-metrics.js?v=16"></script>
<script src="../assets/js/board-insights.js?v=10"></script>
<script src="../assets/js/board-term.js?v=2"></script>
<script src="../assets/js/board-dictionary.js?v=4"></script>
<script src="../assets/js/board-tools.js?v=6"></script>
<script src="../assets/js/admin-shell.js?v=20"></script>
<script>
(function () {
  BoardMetrics.ensureCaliberUI();
  BoardMetrics.setUpdatedNow();
  BoardMetrics.fillAttr();
  var brief = document.getElementById("scope-help-brief");
  if (brief) brief.textContent = " · 期次圈人，统计切片圈事件窗口";

  var METRICS = BoardInsights.OVERVIEW_METRICS || [];
  var trendState = {
    metric: (METRICS[0] && METRICS[0].trendKey) || "pool_new",
    label: (METRICS[0] && METRICS[0].label) || "入池人数"
  };
  var pageState = {
    sliceMode: "term",
    lastTermId: null,
    bootstrappedTerm: false,
    lastSliceLabel: "整期"
  };
  var lastDetailRows = null;

  var FROM_LABELS = {
    overview: "经营总览",
    acquire: "获客分析",
    private: "私域转化分析",
    live: "直播分析",
    convert: "商品分析",
    term_review: "期次经营复盘"
  };

  function trendClass(t) {
    return t === "up" ? "up" : t === "down" ? "down" : "";
  }

  function fmtDetailCell(v, kind) {
    if (v == null) return "—";
    if (kind === "rate") return v + "%";
    if (kind === "money") return BoardMetrics.money(v);
    return BoardMetrics.fmt(v);
  }

  function currentTermId() {
    return (BoardMetrics.getFilters().term || "").trim();
  }

  function addDaysYmd(ymd, delta) {
    var d = BoardMetrics.parseYmd(ymd);
    if (!d) return "";
    d.setDate(d.getDate() + delta);
    return BoardMetrics.formatYmd(d);
  }

  function minYmd(a, b) { return !a ? b : (!b ? a : (a < b ? a : b)); }
  function maxYmd(a, b) { return !a ? b : (!b ? a : (a > b ? a : b)); }

  function getTermBounds(term) {
    if (!term) return null;
    var start = term.startDate || "";
    var end = term.conversionDeadline || term.endDate || "";
    if (!start || !end) return null;
    return { start: start, end: end };
  }

  function resolveTermSlice(term, mode, customStart, customEnd) {
    var bounds = getTermBounds(term);
    if (!bounds) {
      return { ok: false, reason: "期次缺少经营起止日期" };
    }
    var today = BoardMetrics.formatYmd(BoardMetrics.businessToday());
    if (bounds.start > today) {
      return {
        ok: false,
        upcoming: true,
        reason: "期次尚未开始（" + bounds.start + " 起）",
        bounds: bounds
      };
    }
    var availableEnd = minYmd(bounds.end, today);
    if (availableEnd < bounds.start) {
      return { ok: false, reason: "当前无可统计区间", bounds: bounds };
    }
    var ended = bounds.end < today;

    if (mode === "custom" && customStart && customEnd) {
      var s = maxYmd(customStart, bounds.start);
      var e = minYmd(customEnd, availableEnd);
      if (s > e) {
        return { ok: false, reason: "自定义区间与期次窗口无交集", bounds: bounds };
      }
      return {
        ok: true,
        mode: "custom",
        start_date: s,
        end_date: e,
        sliceLabel: "自定义",
        bounds: bounds,
        ended: ended,
        clamped: s !== customStart || e !== customEnd
      };
    }

    if (mode === "7d" || mode === "30d") {
      var span = mode === "30d" ? 29 : 6;
      var end = availableEnd;
      var start = maxYmd(addDaysYmd(end, -span), bounds.start);
      var label = mode === "30d" ? "近30日" : "近7日";
      if (ended) {
        return {
          ok: true,
          mode: mode,
          start_date: start,
          end_date: end,
          sliceLabel: label,
          bounds: bounds,
          ended: true,
          hint: "该期已结束，近 N 日已裁剪为期内可用区间"
        };
      }
      return {
        ok: true,
        mode: mode,
        start_date: start,
        end_date: end,
        sliceLabel: label,
        bounds: bounds,
        ended: false
      };
    }

    return {
      ok: true,
      mode: "term",
      start_date: bounds.start,
      end_date: availableEnd,
      sliceLabel: "整期",
      bounds: bounds,
      ended: ended
    };
  }

  function writeSliceParam(mode) {
    try {
      var q = new URLSearchParams(location.search);
      if (mode && mode !== "term") q.set("slice", mode);
      else q.delete("slice");
      var qs = q.toString();
      var next = location.pathname + (qs ? "?" + qs : "") + location.hash;
      var cur = location.pathname + location.search + location.hash;
      if (next !== cur) history.replaceState({ boardFilters: true }, "", next);
    } catch (e) {}
  }

  function applySliceToFilters(termId, slice, push) {
    var cur = BoardMetrics.getFilters();
    if (
      cur.term === termId &&
      cur.range === "custom" &&
      cur.start_date === slice.start_date &&
      cur.end_date === slice.end_date &&
      !(cur.channel || "")
    ) {
      writeSliceParam(pageState.sliceMode);
      return;
    }
    BoardMetrics.setFilters({
      term: termId,
      channel: "",
      range: "custom",
      start_date: slice.start_date,
      end_date: slice.end_date
    }, { push: !!push });
    writeSliceParam(pageState.sliceMode);
  }

  function syncSliceUI(slice) {
    var seg = document.getElementById("slice-seg");
    if (seg) {
      seg.querySelectorAll("[data-slice]").forEach(function (b) {
        var mode = b.getAttribute("data-slice");
        b.classList.toggle("active", mode === pageState.sliceMode);
      });
    }
    var labelEl = document.getElementById("slice-range-label");
    if (labelEl) {
      if (slice && slice.ok) {
        labelEl.textContent = BoardMetrics.formatDateRangeFriendly(slice.start_date, slice.end_date);
      } else {
        labelEl.textContent = "";
      }
    }
    var chip = document.getElementById("term-window-chip");
    if (chip) {
      if (slice && slice.bounds) {
        chip.textContent = "经营周期 " + slice.bounds.start + " — " + slice.bounds.end;
      } else {
        chip.textContent = "经营周期 —";
      }
    }
    var hint = document.getElementById("slice-hint");
    if (hint) {
      if (slice && slice.upcoming) {
        hint.textContent = slice.reason || "期次尚未开始";
      } else if (slice && slice.hint) {
        hint.textContent = slice.hint;
      } else if (slice && slice.clamped) {
        hint.textContent = "已按期次窗口裁剪自定义区间";
      } else {
        hint.textContent = "默认按整期统计；近 N 日仅截取期内可用区间";
      }
    }
    var displayLabel = (slice && slice.ok) ? (slice.sliceLabel || "整期") : "—";
    pageState.lastSliceLabel = displayLabel;
    document.querySelectorAll("[data-slice-label]").forEach(function (el) {
      el.textContent = displayLabel;
    });
  }

  function ensureDefaultTerm() {
    if (pageState.bootstrappedTerm) return;
    pageState.bootstrappedTerm = true;
    var q = new URLSearchParams(location.search);
    if (q.has("term")) return;
    var def = BoardTerm.defaultTermId();
    if (!def) return;
    BoardMetrics.setFilters({ term: def, channel: "" }, { push: true });
    var sel = document.getElementById("f-term");
    if (sel) sel.value = def;
  }

  function showEmpty(show) {
    document.getElementById("term-empty").hidden = !show;
    document.getElementById("term-main").hidden = show;
  }

  function renderFromSource() {
    var el = document.getElementById("from-source");
    if (!el) return;
    var q = new URLSearchParams(location.search);
    var from = q.get("from_board") || q.get("from") || "";
    if (!from || from === "term_review") {
      el.hidden = true;
      el.innerHTML = "";
      return;
    }
    var label = FROM_LABELS[from] || from;
    var term = BoardTerm.getTermById(currentTermId());
    var bits = ["来自：" + label];
    if (term) bits.push(term.name);
    var href = BoardInsights.buildReturnBoardUrl
      ? BoardInsights.buildReturnBoardUrl("board-overview.html")
      : "board-overview.html";
    el.hidden = false;
    el.innerHTML = "<b>" + bits.join(" / ") +
      '</b> <a href="' + href + '" style="margin-left:8px">返回来源报表</a>';
  }

  function renderTrendBar() {
    var bar = document.getElementById("term-trend-bar");
    if (!bar) return;
    bar.innerHTML = METRICS.map(function (m) {
      var active = m.trendKey === trendState.metric ? " active" : "";
      return '<button type="button" class="btn btn-sm' + active + '" data-trend="' + m.trendKey +
        '" data-trend-label="' + m.label + '">' + m.label + "</button>";
    }).join("");
    bar.querySelectorAll("[data-trend]").forEach(function (btn) {
      btn.onclick = function () {
        openTermTrend(btn.getAttribute("data-trend"), btn.getAttribute("data-trend-label"), false);
      };
    });
  }

  function syncTrendBar() {
    document.querySelectorAll("#term-trend-bar [data-trend]").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-trend") === trendState.metric);
    });
  }

  function buildMetricDetailTable(termId, filters) {
    if (!window.BoardTerm || !termId) return null;
    var seriesMap = {};
    var labels = null;
    METRICS.forEach(function (m) {
      var s = BoardTerm.buildTrendSeries(termId, m.trendKey, filters);
      if (s) {
        seriesMap[m.trendKey] = s;
        if (!labels) labels = s.labels;
      }
    });
    if (!labels || !labels.length) return null;
    return {
      labels: labels,
      metrics: METRICS,
      seriesMap: seriesMap,
      rows: labels.map(function (lb, i) {
        var row = { label: lb, cells: {} };
        METRICS.forEach(function (m) {
          var s = seriesMap[m.trendKey];
          row.cells[m.trendKey] = s && s.daily ? s.daily[i] : null;
        });
        return row;
      })
    };
  }

  function renderMetricDetail(termId, filters) {
    var title = document.getElementById("term-detail-title");
    var thead = document.getElementById("term-detail-thead");
    var tbody = document.getElementById("term-metric-detail");
    var note = document.getElementById("term-detail-note");
    if (!title || !thead || !tbody) return;

    title.textContent = "指标明细";
    var table = buildMetricDetailTable(termId, filters);
    lastDetailRows = table;
    var colCount = METRICS.length + 1;

    if (!table) {
      thead.innerHTML = "<tr><th>日期</th>" +
        METRICS.map(function (m) { return "<th>" + m.label + "</th>"; }).join("") + "</tr>";
      BoardMetrics.renderEmpty(tbody, colCount, "暂无按日明细");
      if (note) note.textContent = "";
      return;
    }

    thead.innerHTML = "<tr><th>日期</th>" +
      METRICS.map(function (m) { return "<th>" + m.label + "</th>"; }).join("") + "</tr>";
    tbody.innerHTML = table.rows.map(function (r) {
      return "<tr><td>" + r.label + "</td>" +
        METRICS.map(function (m) {
          return "<td>" + fmtDetailCell(r.cells[m.trendKey], m.kind) + "</td>";
        }).join("") + "</tr>";
    }).join("");

    if (note) {
      note.textContent = "与上方核心指标同一套口径；时间窗口为当前统计切片（" +
        (pageState.lastSliceLabel || "整期") + "）。";
    }
  }

  function renderCoreKpis(filters) {
    var kpis = BoardInsights.getCoreKpis(filters);
    document.getElementById("term-kpis").innerHTML = kpis.map(function (k) {
      var cmp = k.compare && k.compare.comparable
        ? '<span class="' + trendClass(k.compare.trend) + '">' + k.compareLabel + " " + k.compare.text + "</span>"
        : '<span class="muted">' + (k.compare ? k.compare.text : "") + "</span>";
      var metric = k.trendKey || "pool_new";
      var tipId = k.tipId || k.id;
      return '<div class="board-kpi" data-kpi="' + k.id + '">' +
        '<div class="kpi-label" data-metric="' + tipId + '">' + k.label + "</div>" +
        '<div class="kpi-value">' + k.value + "</div>" +
        (k.sub ? '<div class="kpi-sub">' + k.sub + "</div>" : "") +
        '<div class="kpi-meta">' + cmp +
        '<br/><a href="#" data-open-trend="' + metric + '" data-trend-label="' + k.label + '">查看趋势</a></div></div>';
    }).join("");
    if (window.BoardTools) BoardTools.bindMetricTips(document.getElementById("term-kpis"));
    document.querySelectorAll("[data-open-trend]").forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        openTermTrend(a.getAttribute("data-open-trend"), a.getAttribute("data-trend-label"), true);
      };
    });
  }

  function openTermTrend(metric, label, scroll) {
    if (!window.BoardTerm) return;
    var termId = currentTermId();
    if (!termId) return;
    if (metric) trendState.metric = metric;
    if (label) trendState.label = label;
    syncTrendBar();
    var filters = BoardMetrics.getFilters();
    var note = document.getElementById("term-trend-note");
    var host = document.getElementById("term-trend-chart");
    var term = BoardTerm.getTermById(termId) || {};
    if (note) {
      note.textContent = (trendState.label || "指标") + " · 期次 " + (term.name || termId) +
        " · 切片 " + (pageState.lastSliceLabel || "整期");
    }
    var series = BoardTerm.buildTrendSeries(termId, trendState.metric, filters);
    BoardTerm.renderTrendChart(host, series);
    if (scroll) {
      var card = document.getElementById("term-trend-section");
      if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  function maybeScrollTrend() {
    var q = new URLSearchParams(location.search);
    var st = BoardInsights.getAnalyticsState();
    if (q.get("section") === "trend" || st.section === "trend" || q.get("metric") || st.scrollAnchor === "term-trend-section") {
      setTimeout(function () {
        var el = document.getElementById("term-trend-section");
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 80);
    }
  }

  function sync(opts) {
    opts = opts || {};
    ensureDefaultTerm();
    BoardMetrics.setFilters({ channel: "" }, { push: false });
    var termId = currentTermId();
    var emptyTitle = document.getElementById("term-empty-title");
    var emptyDesc = document.getElementById("term-empty-desc");
    renderFromSource();

    if (!termId) {
      showEmpty(true);
      syncSliceUI(null);
      if (emptyTitle) emptyTitle.textContent = "请选择一个具体期次进行经营复盘";
      if (emptyDesc) {
        emptyDesc.textContent = "「全部期次」不能作为单个期次复盘对象。请在上方选择具体期次。";
      }
      lastDetailRows = null;
      BoardMetrics.wireBoardLinks();
      return;
    }

    var term = BoardTerm.getTermById(termId);
    if (!term) {
      showEmpty(true);
      syncSliceUI(null);
      if (emptyTitle) emptyTitle.textContent = "未找到该期次";
      if (emptyDesc) emptyDesc.textContent = "URL 中的期次无效或不存在，请重新选择。";
      lastDetailRows = null;
      BoardMetrics.wireBoardLinks();
      return;
    }

    if (pageState.lastTermId && pageState.lastTermId !== termId) {
      pageState.sliceMode = "term";
    }
    pageState.lastTermId = termId;

    var f = BoardMetrics.getFilters();
    var slice = resolveTermSlice(
      term,
      pageState.sliceMode,
      f.start_date,
      f.end_date
    );
    syncSliceUI(slice);

    if (!slice.ok) {
      showEmpty(true);
      if (emptyTitle) emptyTitle.textContent = slice.upcoming ? "期次尚未开始" : "暂无可统计区间";
      if (emptyDesc) emptyDesc.textContent = slice.reason || "请更换期次或等待开营。";
      lastDetailRows = null;
      BoardMetrics.wireBoardLinks();
      return;
    }

    applySliceToFilters(termId, slice, !!opts.pushSlice);
    var filters = BoardMetrics.getFilters();

    showEmpty(false);
    try {
      BoardMetrics.applyRange("custom", document, { skipSet: true });
      renderCoreKpis(filters);
      openTermTrend();
      renderMetricDetail(termId, filters);
      BoardMetrics.fillAttr();
      BoardMetrics.wireBoardLinks();
      maybeScrollTrend();
      if (slice.hint && opts.toastHint) Proto.toast(slice.hint);
    } catch (err) {
      console.error("[board-term-review sync]", err);
    }
  }

  function setSliceMode(mode, opts) {
    opts = opts || {};
    mode = mode || "term";
    if (mode === "custom" && window.BoardTools && BoardTools.openCustomDate) {
      var term = BoardTerm.getTermById(currentTermId());
      BoardTools.openCustomDate(function () {
        var f = BoardMetrics.getFilters();
        /* 清空自定义会回到近7日：对本页等价于重置为整期 */
        if (f.range !== "custom" || !f.start_date || !f.end_date) {
          pageState.sliceMode = "term";
          sync({ pushSlice: true, toastHint: false });
          return;
        }
        var slice = resolveTermSlice(term, "custom", f.start_date, f.end_date);
        if (!slice.ok) {
          Proto.toast(slice.reason || "自定义区间无效");
          pageState.sliceMode = "term";
          sync({ pushSlice: true, toastHint: false });
          return;
        }
        if (slice.clamped) Proto.toast("已按期次窗口裁剪自定义区间");
        pageState.sliceMode = "custom";
        sync({ pushSlice: true });
      });
      return;
    }
    pageState.sliceMode = mode;
    sync({ pushSlice: true, toastHint: !!opts.toastHint });
  }

  document.getElementById("btn-pick-default").onclick = function () {
    var def = BoardTerm.defaultTermId();
    if (!def) {
      Proto.toast("暂无可用期次");
      return;
    }
    pageState.sliceMode = "term";
    BoardMetrics.setFilters({ term: def, channel: "" }, { push: true });
    var sel = document.getElementById("f-term");
    if (sel) sel.value = def;
    sync({ pushSlice: true });
  };

  document.getElementById("slice-seg").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-slice]");
    if (!btn || btn.disabled) return;
    setSliceMode(btn.getAttribute("data-slice"), { toastHint: true });
  });

  (function bootFromUrl() {
    var q = new URLSearchParams(location.search);
    if (q.get("metric")) {
      var key = q.get("metric");
      var found = METRICS.find(function (m) { return m.trendKey === key || m.id === key; });
      if (found) {
        trendState.metric = found.trendKey;
        trendState.label = found.label;
      } else {
        trendState.metric = key;
      }
    }
    if (q.get("section")) {
      BoardInsights.setAnalyticsState({ section: q.get("section") }, { syncUrl: false });
    }
    var sliceQ = q.get("slice");
    if (sliceQ === "7d" || sliceQ === "30d" || sliceQ === "term" || sliceQ === "custom") {
      pageState.sliceMode = sliceQ;
    } else if (q.get("range") === "custom" && q.get("start_date") && q.get("end_date")) {
      pageState.sliceMode = "custom";
    } else {
      pageState.sliceMode = "term";
    }
  })();

  BoardMetrics.setFilters({ channel: "" }, { push: false });
  BoardMetrics.bindFilterBar({
    onApply: function () {
      sync({ pushSlice: true });
    },
    autoApply: true
  });
  BoardTools.init({
    onApply: function () { sync({ pushSlice: true }); },
    collectExtra: function () {
      return {
        metric: trendState.metric || "",
        slice: pageState.sliceMode || "term"
      };
    },
    getExportTable: function () {
      var termId = currentTermId();
      if (!termId) {
        return { reason: "请先选择具体期次后再导出", headers: [], rows: [] };
      }
      var table = lastDetailRows;
      if (!table) table = buildMetricDetailTable(termId, BoardMetrics.getFilters());
      var name = "期次经营_指标明细";
      var headers = ["日期"].concat(METRICS.map(function (m) { return m.label; }));
      if (!table || !table.rows || !table.rows.length) {
        return {
          name: name,
          filename: BoardMetrics.exportFileName(name),
          headers: headers,
          rows: []
        };
      }
      return {
        name: name,
        filename: BoardMetrics.exportFileName(name),
        headers: headers,
        rows: table.rows.map(function (r) {
          return [r.label].concat(METRICS.map(function (m) {
            return fmtDetailCell(r.cells[m.trendKey], m.kind);
          }));
        })
      };
    }
  });

  renderTrendBar();
  sync({ pushSlice: false });
})();
</script>
</body>
</html>
