<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>获客渠道分析 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=14" />
<style>#active-filters { margin: 0 0 12px; font-size: 12px; }</style>
</head>
<body class="admin-body" data-module="data" data-nav="board-a" data-title="获客与转化" data-crumb="数据 / 获客与转化" data-assist="1">
<div id="header-actions">
  <span class="muted" id="board-updated" style="margin-right:8px;font-size:12px"></span>
  <button class="btn" id="btn-export">导出</button>
</div>
<div id="page-content" style="display:none">

  <div class="board-tip">
    <b>获客专题：</b>回答「从哪来」与「质量如何」。一级渠道为视频号 / 其他；「视频号」下的二级渠道来自 SCRM「渠道管理」中的视频号商品映射。「视频号获客首单」为前端辅指标，不进后链路。
    <span class="muted">暂无投放成本，不展示 CAC / ROI。</span>
    <span class="muted" id="scope-help-brief"></span>
  </div>

  <div class="board-filter">
    <div class="segmented" id="range-seg">
      <button type="button" class="active" data-range="7d">近7日</button>
      <button type="button" data-range="30d">近30日</button>
      <button type="button" data-range="today">今日</button>
      <button type="button" data-range="yesterday">昨日</button>
    </div>
    <select id="f-channel"></select>
    <select id="f-term"></select>
    <button class="btn" id="btn-reset">重置筛选</button>
    <span class="muted" style="font-size:12px;margin-left:8px">筛选变更后立即生效</span>
  </div>
  <div id="active-filters"></div>
  <div class="stat-cards board-stats" style="grid-template-columns:repeat(4,1fr)">
    <a class="stat-card" data-board-link="leads.html" href="leads.html">
      <div class="stat-label" id="lbl-pool">入池线索</div>
      <div class="stat-value" data-m="pool">612</div>
      <div class="stat-hint"><span data-range-label>近7日</span></div>
    </a>
    <a class="stat-card" data-board-link="orders.html" href="orders.html">
      <div class="stat-label" id="lbl-vx-orders">视频号获客首单</div>
      <div class="stat-value" data-m="vxOrders">286</div>
      <div class="stat-hint">辅口径 · 流入 <span data-m="vxLeads">241</span></div>
    </a>
    <div class="stat-card">
      <div class="stat-label">有效入池率</div>
      <div class="stat-value" id="valid-rate">75%</div>
      <div class="stat-hint">留资/下单 <span data-m="validLeadIn">812</span> → 入池 <span data-m="pool">612</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">头部渠道</div>
      <div class="stat-value" style="font-size:20px" id="top-channel">视频号 —</div>
      <div class="stat-hint">当前筛选下入池占比最高</div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-hd">
      <h2>渠道质量分析</h2>
      <span class="muted" style="font-size:12px;font-weight:400">一级：视频号 / 其他 · 二级：渠道管理映射 · 成本数据：暂无</span>
    </div>
    <div class="card-bd">
      <div class="board-sort-bar">
        <span class="muted">排序：</span>
        <button type="button" class="btn btn-sm active" data-cq-sort="pool">用户规模</button>
        <button type="button" class="btn btn-sm" data-cq-sort="wecomRate">加微率</button>
        <button type="button" class="btn btn-sm" data-cq-sort="attendRate">到场率</button>
        <button type="button" class="btn btn-sm" data-cq-sort="payRate">支付率</button>
        <button type="button" class="btn btn-sm" data-cq-sort="gmv">成交贡献</button>
      </div>
      <div style="overflow-x:auto">
        <table class="data" style="min-width:720px">
          <thead>
            <tr>
              <th>渠道</th><th>入池</th><th>有效率</th><th>加微 / 率</th><th>到场 / 率</th>
              <th>支付 / 率</th><th>归因GMV</th>
            </tr>
          </thead>
          <tbody id="cq-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <p class="board-attr" data-board-attr style="padding:12px 0"></p>

</div>
<script src="../assets/js/proto.js"></script>
<script src="../assets/js/board-data.js?v=11"></script>
<script src="../assets/js/term-store.js?v=1"></script>
<script src="../assets/js/channel-store.js?v=2"></script>
<script src="../assets/js/board-metrics.js?v=17"></script>
<script src="../assets/js/board-insights.js?v=12"></script>
<script src="../assets/js/board-term.js?v=1"></script>
<script src="../assets/js/board-dictionary.js?v=4"></script>
<script src="../assets/js/board-tools.js?v=6"></script>
<script src="../assets/js/admin-shell.js?v=28"></script>
<script>
(function () {
  BoardMetrics.ensureCaliberUI();
  BoardMetrics.setUpdatedNow();
  BoardMetrics.fillAttr();
  var brief = document.getElementById("scope-help-brief");
  if (brief) brief.textContent = " · " + (BoardMetrics.FILTER_SCOPE_HELP || "").slice(0, 48) + "…";

  var state = { sort: "pool" };

  function qualityRows(filters) {
    var q = BoardInsights.getChannelQuality(filters);
    var parents = (q.rows || []).filter(function (r) { return r.isParent; });
    var children = BoardInsights.sortBy(
      (q.rows || []).filter(function (r) { return r.isChild; }),
      state.sort,
      "desc"
    );
    var others = BoardInsights.sortBy(
      (q.rows || []).filter(function (r) { return !r.isParent && !r.isChild; }),
      state.sort,
      "desc"
    );
    return parents.concat(children).concat(others);
  }

  function channelCell(r) {
    if (r.isChild) {
      return '<span class="muted" style="margin-right:4px">└</span>' + r.label +
        '<div class="muted" style="font-size:11px;padding-left:14px">视频号 · 二级</div>';
    }
    if (r.isParent) {
      return "<b>" + r.label + '</b> <span class="badge" style="font-size:11px;font-weight:400">一级汇总</span>';
    }
    return "<b>" + r.label + "</b>";
  }

  function renderQuality(filters) {
    var rows = qualityRows(filters);
    var tbody = document.getElementById("cq-tbody");
    if (!rows.length) {
      BoardMetrics.renderEmpty(tbody, 7);
      return;
    }
    tbody.innerHTML = rows.map(function (r) {
      var gmv = r.gmv == null ? "—" : BoardMetrics.money(r.gmv);
      var rowStyle = r.isChild ? ' style="background:#fafbfc"' : "";
      return "<tr" + rowStyle + "><td>" + channelCell(r) + "</td><td>" +
        BoardMetrics.fmt(r.pool) + "</td><td>" + (r.validRate != null ? r.validRate + "%" : "—") + "</td><td>" +
        BoardMetrics.fmt(r.wecom) + " / " + (r.wecomRate != null ? r.wecomRate + "%" : "—") + "</td><td>" +
        BoardMetrics.fmt(r.attend) + " / " + (r.attendRate != null ? r.attendRate + "%" : "—") + "</td><td>" +
        BoardMetrics.fmt(r.pay) + " / " + (r.payRate != null ? r.payRate + "%" : "—") + "</td><td>" + gmv + "</td></tr>";
    }).join("");
  }

  function renderDetails(d) {
    var filters = BoardMetrics.getFilters();
    var ch = filters.channel;
    var lblPool = document.getElementById("lbl-pool");
    var lblVx = document.getElementById("lbl-vx-orders");
    if (ch) {
      var name = BoardMetrics.channelLabel(ch) || ch;
      if (lblPool) lblPool.textContent = "入池线索（" + name + "）";
      if (lblVx) lblVx.textContent = ch === "video" ? "视频号获客首单（当前渠道）" : "视频号获客首单（渠道外）";
    } else {
      if (lblPool) lblPool.textContent = "入池线索";
      if (lblVx) lblVx.textContent = "视频号获客首单";
    }

    var pool = d.poolLeads || 0;
    var allRows = BoardInsights.getChannelQuality(Object.assign({}, filters, { channel: "" })).rows || [];
    var leaf = allRows.filter(function (r) { return !r.isParent; });
    var rows = BoardInsights.sortBy(leaf, "pool", "desc");
    if (!rows.length || !pool) {
      document.getElementById("top-channel").textContent = "—";
    } else {
      var top = rows[0];
      var topPool = rows.reduce(function (s, r) { return s + (r.pool || 0); }, 0) || pool;
      document.getElementById("top-channel").textContent =
        top.label + " " + Math.round(((top.pool || 0) / topPool) * 100) + "%";
    }

    document.getElementById("valid-rate").textContent = d.validLeadIn ? Math.round((d.poolLeads / d.validLeadIn) * 100) + "%" : "—";

    renderQuality(filters);
    BoardMetrics.renderActiveFilters();
    BoardMetrics.wireBoardLinks();
  }

  document.querySelectorAll("[data-cq-sort]").forEach(function (btn) {
    btn.onclick = function () {
      state.sort = btn.getAttribute("data-cq-sort");
      document.querySelectorAll("[data-cq-sort]").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      renderQuality(BoardMetrics.getFilters());
    };
  });

  BoardMetrics.bindRange("range-seg", function (k, d) { renderDetails(d); });
  BoardMetrics.bindFilterBar({ onApply: function (k, d) { renderDetails(d); }, autoApply: true });
  document.getElementById("btn-export").style.display = "none";
  BoardTools.init({
    onApply: function (k, d) { renderDetails(d); },
    collectExtra: function () {
      return { sort: state.sort || "", dimension: "channel" };
    },
    getExportTable: function () {
      var rows = qualityRows(BoardMetrics.getFilters());
      if (!rows.length) return { reason: "当前筛选下暂无渠道质量数据", rows: [] };
      return {
        name: "渠道质量分析",
        filename: BoardMetrics.exportFileName("渠道质量分析"),
        headers: ["渠道", "层级", "入池", "有效率", "加微人数", "加微率", "到场人数", "到场率", "支付人数", "支付率", "归因GMV"],
        rows: rows.map(function (r) {
          var level = r.isParent ? "一级汇总" : (r.isChild ? "二级" : "一级");
          return [
            r.label, level, r.pool, r.validRate != null ? r.validRate : "—",
            r.wecom, r.wecomRate != null ? r.wecomRate : "—",
            r.attend, r.attendRate != null ? r.attendRate : "—",
            r.pay, r.payRate != null ? r.payRate : "—",
            r.gmv == null ? "—" : r.gmv
          ];
        })
      };
    }
  });
})();
</script>
</body>
</html>
