<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>店铺商品 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<style>
.mono { font-family:ui-monospace,Consolas,monospace; font-size:12px; }
</style>
</head>
<body class="admin-body" data-module="trade" data-nav="goods" data-title="店铺商品" data-crumb="交易 / 商品管理 / 店铺商品">
<div id="header-actions">
  <button class="btn" id="btn-batch">批量操作</button>
  <button class="btn btn-primary" id="btn-create">通过内容创建</button>
</div>
<div id="page-content" style="display:none">

  <div class="grid-4" style="margin-bottom:16px">
    <div class="stat"><div class="label">店铺商品</div><div class="value" id="st-total">0</div><div class="hint">全部自有内容商品</div></div>
    <div class="stat"><div class="label">上架中</div><div class="value" id="st-onsale">0</div><div class="hint">可售卖</div></div>
    <div class="stat"><div class="label">未上架</div><div class="value" id="st-pending">0</div><div class="hint">草稿 · 可直接上架</div></div>
    <div class="stat"><div class="label">已下架</div><div class="value" id="st-draft">0</div><div class="hint">可再次上架</div></div>
  </div>

  <div class="card" style="margin-bottom:8px"><div class="card-bd">
    <div class="form-grid" style="grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 12px">
      <input id="f-name" placeholder="商品名称 / ID" />
      <select id="f-type">
        <option value="">内容类型</option>
        <option value="online_course">线上课</option>
        <option value="offline">线下课</option>
        <option value="article">文章</option>
        <option value="live">直播</option>
      </select>
      <select id="f-cat"><option value="">商品类目</option></select>
      <select id="f-status">
        <option value="">上架状态</option>
        <option value="on_sale">上架中</option>
        <option value="off">已下架</option>
        <option value="draft">未上架</option>
      </select>
      <button class="btn btn-primary" id="btn-query">筛选</button>
    </div>
  </div></div>

  <div class="card"><div class="card-bd" style="padding:0">
    <table class="data">
      <thead>
        <tr>
          <th>商品</th>
          <th>内容类型</th>
          <th>关联内容</th>
          <th>类目</th>
          <th>价格</th>
          <th>上架状态</th>
          <th style="width:220px">操作</th>
        </tr>
      </thead>
      <tbody id="gd-tbody"></tbody>
    </table>
  </div></div>

  <div class="card" style="margin-top:16px"><div class="card-bd">
    <p class="muted" style="font-size:12px;line-height:1.8;margin:0">
      <b>口径：</b>店铺商品仅支持「通过自有内容创建」（线上课 / 线下课 / 文章 / 直播），免平台审核，保存后可直接上架。同一内容可建多个商品。微信小店审批仍走微信接口，见「微信小店商品」。违规处置由运营侧「强制下架」执行。
    </p>
  </div></div>
</div>

<div class="proto-mask" id="reject-mask"></div>
<div class="proto-modal" id="reject-modal" style="width:480px;flex-direction:column;background:#fff;border-radius:10px;z-index:1001;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:92vw">
  <div class="proto-modal-hd" style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--color-border)">
    <h3 style="margin:0;font-size:16px">驳回原因</h3>
    <button type="button" class="btn btn-sm btn-ghost" id="reject-close">×</button>
  </div>
  <div class="proto-modal-bd" style="padding:16px 18px">
    <p style="margin:0 0 8px"><b id="rj-name">—</b></p>
    <p class="muted" style="margin:0;font-size:13px;line-height:1.7" id="rj-text">—</p>
  </div>
  <div class="proto-modal-ft" style="padding:12px 18px;border-top:1px solid var(--color-border);display:flex;justify-content:flex-end;gap:8px">
    <button class="btn" id="reject-close2">关闭</button>
    <button class="btn btn-primary" id="rj-reedit">修改并重新提审</button>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/goods-taxonomy.js?v=1"></script>
<script src="../assets/js/prototype-business-store.js"></script>
<script src="../assets/js/share-modal.js"></script>
<script src="../assets/js/admin-shell.js?v=26"></script>
<script>
(function () {
  var Tax = window.GoodsTaxonomy;
  var Biz = window.ProtoBiz;
  var rows = [];
  var rejectTarget = null;

  function persist() {
    if (!Biz || !Biz.load || !Biz.save) return;
    var data = Biz.load();
    data.goodsDemo = rows.filter(function (r) { return !r.channel || r.channel === "store"; });
    Biz.save(data);
  }

  function loadRows() {
    try {
      if (Biz && typeof Biz.load === "function") {
        var data = Biz.load();
        rows = (data && data.goodsDemo) ? data.goodsDemo.slice() : [];
      }
    } catch (e) {}
    if (!rows.length) {
      rows = [
        { goods_id: "G001", channel: "store", create_mode: "from_content", content_source: "self", content_type: "online_course", content_id: "C003", category_id: "GC02", tag_ids: ["GT01"], name: "AI 学习规划入门", status: "on_sale", audit_status: "approved", price: 199 },
        { goods_id: "G002B", channel: "store", create_mode: "from_content", content_source: "self", content_type: "online_course", content_id: "C001", category_id: "GC08", tag_ids: [], name: "体验价商品", status: "draft", audit_status: "approved", price: 9.9 },
        { goods_id: "G-DRAFT", channel: "store", create_mode: "from_content", content_source: "self", content_type: "article", content_id: "A001", category_id: "GC07", tag_ids: [], name: "草稿商品", status: "draft", audit_status: "approved", price: 129 },
        { goods_id: "G-OFF01", channel: "store", create_mode: "from_content", content_source: "self", content_type: "offline", content_id: "O001", category_id: "GC07", tag_ids: [], name: "已下架商品", status: "off", audit_status: "approved", price: 199 }
      ];
    }
    rows = rows.filter(function (r) {
      return r.create_mode !== "from_platform" && r.content_source !== "platform" && r.content_type !== "plan";
    });
    rows.forEach(function (r) {
      /* 最简版免审：历史 pending/rejected 归一 */
      if (r.audit_status === "pending" || r.audit_status === "rejected" || !r.audit_status) {
        r.audit_status = "approved";
        r.reject_reason = "";
        r.submitted_at = "";
      }
      r.create_mode = "from_content";
      r.content_source = "self";
      delete r.platform_goods_id;
    });
  }

  function shelfBadge(s) {
    if (s === "on_sale") return '<span class="badge badge-success">上架中</span>';
    if (s === "off") return '<span class="badge badge-warn">已下架</span>';
    return '<span class="badge">未上架</span>';
  }
  function nowStr() {
    var d = new Date();
    function p(n) { return n < 10 ? "0" + n : "" + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  document.getElementById("f-cat").innerHTML = '<option value="">商品类目</option>' + Tax.catOptionsHtml();

  function filtered() {
    var name = (document.getElementById("f-name").value || "").trim().toLowerCase();
    var type = document.getElementById("f-type").value;
    var cat = document.getElementById("f-cat").value;
    var status = document.getElementById("f-status").value;
    return rows.filter(function (r) {
      if (r.channel && r.channel !== "store") return false;
      if (name && String(r.name).toLowerCase().indexOf(name) < 0 && String(r.goods_id).toLowerCase().indexOf(name) < 0) return false;
      if (type && r.content_type !== type) return false;
      if (cat && r.category_id !== cat) return false;
      if (status && r.status !== status) return false;
      return true;
    });
  }

  function renderStats() {
    var store = rows.filter(function (r) { return !r.channel || r.channel === "store"; });
    document.getElementById("st-total").textContent = store.length;
    document.getElementById("st-onsale").textContent = store.filter(function (r) { return r.status === "on_sale"; }).length;
    document.getElementById("st-pending").textContent = store.filter(function (r) { return r.status === "draft"; }).length;
    document.getElementById("st-draft").textContent = store.filter(function (r) { return r.status === "off"; }).length;
  }

  function buildActs(r) {
    var editHref = "goods-edit.html?create_mode=from_content&goods_id=" + encodeURIComponent(r.goods_id) + "&content_type=" + encodeURIComponent(r.content_type || "") + "&content_id=" + encodeURIComponent(r.content_id || "");
    var id = Tax.esc(r.goods_id);
    var acts = [];
    acts.push('<a href="' + editHref + '">编辑</a>');
    if (r.status === "on_sale") acts.push('<a href="#" data-row-act="off" data-id="' + id + '">下架</a>');
    else acts.push('<a href="#" data-row-act="on" data-id="' + id + '">上架</a>');
    acts.push('<a href="#" data-row-act="share" data-id="' + id + '">分享</a>');
    return acts.join(" ");
  }

  function render() {
    var list = filtered();
    document.getElementById("gd-tbody").innerHTML = list.map(function (r) {
      var editHref = "goods-edit.html?create_mode=from_content&goods_id=" + encodeURIComponent(r.goods_id) + "&content_type=" + encodeURIComponent(r.content_type || "") + "&content_id=" + encodeURIComponent(r.content_id || "");
      var cat = Tax.catPathLabel(r.category_id) || "—";
      return "<tr>" +
        "<td><b><a href=\"" + editHref + "\">" + Tax.esc(r.name) + "</a></b><br><span class=\"muted mono\">" + Tax.esc(r.goods_id) + "</span></td>" +
        "<td>" + Tax.esc(Tax.contentTypeLabel(r.content_type)) + "</td>" +
        "<td class=\"mono\">" + Tax.esc(r.content_id || "—") + "</td>" +
        "<td>" + Tax.esc(cat) + "</td>" +
        "<td><b>¥" + (r.price != null ? Number(r.price).toFixed(2) : "—") + "</b></td>" +
        "<td>" + shelfBadge(r.status) + "</td>" +
        '<td class="row-actions">' + buildActs(r) + "</td>" +
        "</tr>";
    }).join("") || '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">暂无店铺商品</td></tr>';
    renderStats();
  }

  function openCreate() {
    location.href = "goods-edit.html?create_mode=from_content";
  }
  function openReject(row) {
    rejectTarget = row;
    document.getElementById("rj-name").textContent = row.name;
    document.getElementById("rj-text").textContent = row.reject_reason || "（无驳回说明）";
    document.getElementById("reject-mask").classList.add("open");
    document.getElementById("reject-modal").classList.add("open");
  }
  function closeReject() {
    document.getElementById("reject-mask").classList.remove("open");
    document.getElementById("reject-modal").classList.remove("open");
  }

  document.getElementById("btn-create").addEventListener("click", openCreate);
  document.getElementById("reject-close").addEventListener("click", closeReject);
  document.getElementById("reject-close2").addEventListener("click", closeReject);
  document.getElementById("reject-mask").addEventListener("click", closeReject);
  document.getElementById("rj-reedit").addEventListener("click", function () {
    if (!rejectTarget) return;
    location.href = "goods-edit.html?create_mode=from_content&goods_id=" + encodeURIComponent(rejectTarget.goods_id) +
      "&content_type=" + encodeURIComponent(rejectTarget.content_type || "") +
      "&content_id=" + encodeURIComponent(rejectTarget.content_id || "");
  });
  document.getElementById("btn-query").addEventListener("click", render);
  document.getElementById("btn-batch").addEventListener("click", function () {
    Proto.toast("批量上下架（原型）");
  });

  document.getElementById("gd-tbody").addEventListener("click", function (e) {
    var a = e.target.closest("[data-row-act]");
    if (!a) return;
    e.preventDefault();
    var act = a.getAttribute("data-row-act");
    var id = a.getAttribute("data-id");
    var row = rows.find(function (r) { return r.goods_id === id; });
    if (!row) return;
    if (act === "share") {
      if (window.ShareModal) ShareModal.open({ title: row.name, link: "https://yibo.app/g/" + id });
      else Proto.toast("分享（原型）");
      return;
    }
    if (act === "on") {
      row.status = "on_sale";
      row.audit_status = "approved";
      persist();
      Proto.toast("已上架");
      render();
      return;
    }
    if (act === "off") {
      row.status = "off";
      persist();
      Proto.toast("已下架");
      render();
    }
  });

  loadRows();
  render();
})();
</script>
</body>
</html>
