<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>系列课 · 艺博 To-B</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<style>
/* ===== 列表行（样式对齐「视频」「图文」：左侧内容 + 右侧操作按钮） ===== */
.cs-row {
  background: #fff; border: 1px solid #e8e8e8; border-radius: 8px;
  margin-bottom: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 14px;
  transition: all .15s;
}
.cs-row:hover { border-color: #165dff; box-shadow: 0 4px 14px rgba(22,93,255,.1); }
.cs-cover {
  width: 128px; height: 80px; border-radius: 6px;
  background: #f2f3f5; overflow: hidden; flex-shrink: 0;
}
.cs-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cs-info { flex: 1; min-width: 0; }
.cs-title {
  font-size: 15px; font-weight: 600; color: #1d2129;
  display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
}
.cs-desc { font-size: 12px; color: #8c8c8c; line-height: 1.6; margin-bottom: 8px; }
.cs-stats { display: flex; gap: 16px; font-size: 12px; color: #595959; flex-wrap: wrap; }
.cs-stats b { color: #165dff; font-weight: 600; font-family: monospace; }
.cs-cat { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: #e8f3ff; color: #165dff; font-weight: 500; flex-shrink: 0; }
.cs-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 320px; }

/* ===== 空列表 ===== */
.cs-empty {
  font-size: 12px; color: #bfbfbf; text-align: center;
  padding: 32px; border: 1px dashed #e8e8e8; border-radius: 8px; background: #fafafa;
}
</style>
</head>
<body class="admin-body" data-module="content" data-nav="content-series" data-title="系列课" data-crumb="内容 / 内容管理 / 系列课">

<div id="header-actions">
  <a class="btn btn-primary" href="content-series-edit.html">+ 新建系列课</a>
</div>

<div id="page-content" style="display:none">

  <!-- 筛选条 -->
  <div class="card" style="margin-bottom:14px"><div class="card-bd" style="padding:12px 16px">
    <div class="toolbar" style="border:none;padding:0;background:transparent">
      <input class="input" type="text" id="cs-keyword" placeholder="搜索系列课名称 / 讲师" style="width:240px" />
      <select class="input" id="cs-cat" style="width:160px">
        <option value="">全部内容分类</option>
      </select>
      <select class="input" id="cs-status" style="width:140px">
        <option value="">全部状态</option><option>已上架</option><option>已下架</option>
      </select>
      <button class="btn btn-primary" id="cs-query">查询</button>
      <button class="btn" id="cs-reset">重置</button>
    </div>
  </div></div>

  <!-- 系列课列表 -->
  <div id="cs-list"></div>

  <!-- 分页 -->
  <div style="display:flex;align-items:center;gap:8px;margin-top:16px">
    <span style="color:#8c8c8c;font-size:12px">共 <b id="cs-count">3</b> 条</span>
    <div style="margin-left:auto;display:flex;gap:6px">
      <button class="btn" disabled>上一页</button>
      <button class="btn btn-primary">1</button>
      <button class="btn" disabled>下一页</button>
    </div>
  </div>

</div><!-- /#page-content -->

<!-- 弹窗遮罩 -->
<div class="proto-mask" id="mask"></div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/content-cats.js?v=1"></script>
<script src="../assets/js/share-modal.js?v=1"></script>
<script src="../assets/js/admin-shell.js?v=14"></script>
<script>
// ===== 兜底 =====
setTimeout(function() {
  if (document.documentElement.getAttribute('data-shell-ready') === '1') return;
  if (document.querySelector('aside.sidebar')) return;
  var err = document.createElement('div');
  err.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fff1f0;color:#f53f3f;padding:12px 20px;border-bottom:1px solid #ffa39e;z-index:99999;font-family:system-ui;';
  err.innerHTML = '<b>⚠ 页面初始化失败</b>：浏览器可能缓存了旧版本。请按 <kbd style="background:#fff;padding:2px 6px;border-radius:3px;border:1px solid #ffa39e;font-family:monospace;">Ctrl+Shift+R</kbd> 强制刷新，或 <button onclick="location.reload();" style="background:#165dff;color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;margin-left:8px;">点击重试</button>';
  document.body.appendChild(err);
}, 1500);

// ===== 数据 =====
var SERIES = [
  { id: "S001", name: "小学语文阅读启蒙系列", cover: "../assets/img/covers/reading.jpg",
    teacher: "张老师", desc: "针对 6-12 岁儿童阅读兴趣培养，从绘本到章节书的进阶路径。",
    cat: "K12 教育", videos: 6, articles: 3, students: 1287, duration: "2.5h",
    status: "已上架", statusType: "pass", onShelf: true },
  { id: "S002", name: "家长情绪管理训练营", cover: "../assets/img/covers/emotion.jpg",
    teacher: "李老师", desc: "8 周系统训练，帮助家长识别情绪、管理情绪、与孩子正向沟通。",
    cat: "家庭教育", videos: 4, articles: 2, students: 0, duration: "1.8h",
    status: "已下架", statusType: "review", onShelf: false },
  { id: "S003", name: "AI 学习规划入门", cover: "../assets/img/covers/ai.jpg",
    teacher: "王博士", desc: "AI 助力学习规划，10 节实操课让孩子学会用 AI 工具提升学习效率。",
    cat: "K12 教育", videos: 5, articles: 1, students: 856, duration: "3.2h",
    status: "已上架", statusType: "pass", onShelf: true }
];

var filterCat = "";
var filterKeyword = "";
var filterStatus = "";

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

function filteredSeries() {
  return SERIES.filter(function(s) {
    if (filterCat && s.cat !== filterCat) return false;
    if (filterStatus && s.status !== filterStatus) return false;
    if (filterKeyword) {
      var kw = filterKeyword.toLowerCase();
      var hit = (s.name + " " + s.teacher + " " + s.id).toLowerCase().indexOf(kw) !== -1;
      if (!hit) return false;
    }
    return true;
  });
}

function actionsOf(s) {
  var html = '<button class="btn" data-share="' + s.id + '"' + (s.onShelf ? '' : ' disabled') + '>分享</button>';
  // 评审结论：已下架的 S002 行去掉「查看系列课」入口
  if (s.id !== "S002") {
    html += '<a class="btn" href="content-series-detail.html?id=' + s.id + '">查看系列课</a>';
  }
  if (s.onShelf) {
    html += '<button class="btn" data-shelf-off="' + s.id + '">下架</button>';
  } else {
    html += '<a class="btn btn-primary" href="content-series-edit.html?id=' + s.id + '">编辑系列课</a>';
    html += '<button class="btn" data-shelf-on="' + s.id + '">上架</button>';
    html += '<button class="btn" style="color:#f53f3f;border-color:#ffa39e" data-del="' + s.id + '">删除</button>';
  }
  // 创建商品：将本系列课内容带入「新建商品」
  html += '<a class="btn" href="goods-edit.html?from=series&id=' + encodeURIComponent(s.id) +
          '&title=' + encodeURIComponent(s.name) + '&desc=' + encodeURIComponent(s.desc) + '">创建商品</a>';
  html += '<button class="btn" data-copy="' + s.id + '">复制</button>';
  return html;
}

function renderList() {
  var list = filteredSeries();
  var html = list.map(function(s) {
    return '' +
      '<div class="cs-row">' +
        '<div class="cs-cover"><img src="' + s.cover + '" alt="" /></div>' +
        '<div class="cs-info">' +
          '<div class="cs-title">' + esc(s.name) +
            '<span class="cs-cat">' + esc(s.cat) + '</span>' +
            '<span class="audit-badge ' + s.statusType + '">' + esc(s.status) + '</span>' +
            '<span style="color:#8c8c8c;font-size:11px;font-weight:400">ID: ' + esc(s.id) + '</span>' +
          '</div>' +
          '<div class="cs-desc">' + esc(s.desc) + '</div>' +
          '<div class="cs-stats">' +
            '<span>讲师：' + esc(s.teacher) + '</span>' +
            '<span>总时长：<b>' + esc(s.duration) + '</b></span>' +
            '<span>📹 <b>' + s.videos + '</b> 视频</span>' +
            '<span>📝 <b>' + s.articles + '</b> 图文</span>' +
            '<span>学员：<b>' + s.students.toLocaleString() + '</b></span>' +
          '</div>' +
        '</div>' +
        '<div class="cs-actions">' + actionsOf(s) + '</div>' +
      '</div>';
  }).join("");
  document.getElementById("cs-list").innerHTML = html ||
    '<div class="cs-empty">没有匹配的系列课</div>';
  document.getElementById("cs-count").textContent = list.length;
}

// ===== Mask & 弹窗 =====
var mask = document.getElementById("mask");
function closeAll() {
  mask.classList.remove("open");
  document.querySelectorAll(".proto-modal, .proto-drawer").forEach(function(n) { n.classList.remove("open"); });
}

function openShare(s) {
  XiboShare.open({
    type: "系列课",
    url: "https://yibo.app/s/" + s.id,
    cover: s.cover,
    name: s.name,
    desc: s.desc
  });
}

document.addEventListener("click", function(e) {
  var share = e.target.closest("[data-share]");
  if (share && !share.disabled) {
    openShare(SERIES.find(function(x){ return x.id === share.getAttribute("data-share"); }));
    return;
  }
  var off = e.target.closest("[data-shelf-off]");
  if (off) {
    var s = SERIES.find(function(x){ return x.id === off.getAttribute("data-shelf-off"); });
    if (s) { s.onShelf = false; s.status = "已下架"; s.statusType = "review"; renderList(); Proto.toast("已下架"); }
    return;
  }
  var on = e.target.closest("[data-shelf-on]");
  if (on) {
    var s2 = SERIES.find(function(x){ return x.id === on.getAttribute("data-shelf-on"); });
    if (s2) { s2.onShelf = true; s2.status = "已上架"; s2.statusType = "pass"; renderList(); Proto.toast("已上架"); }
    return;
  }
  if (e.target.closest("[data-copy]")) { Proto.toast("已复制系列课（演示）"); return; }
  if (e.target.closest("[data-del]")) { Proto.toast("已删除（演示）"); return; }
});

// ===== 筛选 =====
// 内容分类下拉取值于「内容分类」页面列表
document.getElementById("cs-cat").insertAdjacentHTML("beforeend", window.ContentCats.optionsHtml());
document.getElementById("cs-cat").addEventListener("change", function () {
  filterCat = this.value;
  renderList();
});
document.getElementById("cs-status").addEventListener("change", function () {
  filterStatus = this.value;
  renderList();
});
document.getElementById("cs-keyword").addEventListener("input", function () {
  filterKeyword = this.value.trim();
  renderList();
});
document.getElementById("cs-query").addEventListener("click", function () {
  filterCat = document.getElementById("cs-cat").value;
  filterStatus = document.getElementById("cs-status").value;
  filterKeyword = document.getElementById("cs-keyword").value.trim();
  renderList();
});
document.getElementById("cs-reset").addEventListener("click", function () {
  filterCat = ""; filterKeyword = ""; filterStatus = "";
  document.getElementById("cs-cat").value = "";
  document.getElementById("cs-status").value = "";
  document.getElementById("cs-keyword").value = "";
  renderList();
});

mask && mask.addEventListener("click", closeAll);

// 渲染
function tryRender() {
  if (document.getElementById("page-content").style.display !== "none") renderList();
  else setTimeout(tryRender, 80);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tryRender);
else tryRender();
</script>
</body>
</html>
