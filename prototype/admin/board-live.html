<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>直播分析 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=14" />
<style>#active-filters { margin: 0 0 12px; font-size: 12px; }</style>
</head>
<body class="admin-body" data-module="data" data-nav="board-l" data-title="直播分析" data-crumb="经营分析 / 直播" data-assist="1">
<div id="header-actions">
  <span class="muted" id="board-updated" style="margin-right:8px;font-size:12px"></span>
  <button class="btn" id="btn-refresh">刷新</button>
  <button class="btn" id="btn-export">导出</button>
</div>
<div id="page-content" style="display:none">

  <div class="board-tip">
    <b>直播分析：</b>多场直播比较、期次表现、异常发现与经营判断。单场观看/互动/商品趋势请下钻「场次数据」。待开播准备请到工作台或直播列表。
    <span class="muted" id="scope-help-brief"></span>
  </div>

  <div class="board-filter">
    <div class="segmented" id="range-seg">
      <button type="button" class="active" data-range="7d">近7日</button>
      <button type="button" data-range="30d">近30日</button>
      <button type="button" data-range="today">今日</button>
      <button type="button" data-range="yesterday">昨日</button>
    </div>
    <select id="f-channel" title="只影响关联人群指标"></select>
    <select id="f-term" title="影响场次明细"></select>
    <button class="btn" id="btn-reset">重置筛选</button>
    <span class="muted" style="font-size:12px;margin-left:8px">筛选变更后立即生效</span>
  </div>
  <div id="active-filters"></div>
  <div class="board-conclusion" id="live-conclusion"></div>

  <div class="stat-cards board-stats" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat-card">
      <div class="stat-label">全部场次</div>
      <div class="stat-value" id="stat-sessions" data-m="lives">18</div>
      <div class="stat-hint">已结束 <span id="stat-ended">0</span> · <span data-range-label>近7日</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">平均到课率</div>
      <div class="stat-value" id="stat-attend-avg" data-m="liveAttendAvg">41%</div>
      <div class="stat-hint" id="stat-attend-hint">有效样本 <span id="stat-attend-sample">0</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">促到到课差</div>
      <div class="stat-value" style="color:#00b42a" id="invite-lift">+9pt</div>
      <div class="stat-hint" id="invite-lift-hint">相关，非因果</div>
    </div>
    <a class="stat-card" data-board-link="board-convert.html" data-board-section="attributed" href="board-convert.html">
      <div class="stat-label">加微人群到课</div>
      <div class="stat-value" data-m="attend">186</div>
      <div class="stat-hint">旁路 · 受渠道</div>
    </a>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-hd" style="flex-wrap:wrap;gap:8px">
      <h2 style="margin:0">已结束场次</h2>
      <select id="live-sort" class="board-inline-select" title="排序">
        <option value="recent">最近结束</option>
        <option value="attend_asc">到场率最低</option>
        <option value="pay_asc">支付率最低</option>
        <option value="gap">与平均差距最大</option>
        <option value="no_sop">未执行直播促到SOP</option>
        <option value="risk">风险最高</option>
      </select>
    </div>
    <div class="card-bd" style="padding:0;overflow-x:auto">
      <table class="data" style="min-width:1100px">
        <thead id="live-thead"></thead>
        <tbody id="live-tbody"></tbody>
      </table>
    </div>
  </div>
  <!-- 场次详情改用右侧抽屉，由脚本创建 #live-drawer -->

  <div class="board-two" style="margin-top:16px">
    <div class="card">
      <div class="card-hd"><h2>与主漏斗衔接</h2></div>
      <div class="card-bd">
        <div class="board-funnel slope">
          <div class="step" style="--h:100%"><div class="n" data-m="wecom">392</div><div class="l">已加微</div></div>
          <div class="step drop" style="--h:47%"><div class="n" data-m="attend">186</div><div class="l">有到课</div></div>
          <div class="step" style="--h:33%"><div class="n" data-m="pay">128</div><div class="l">可归因支付</div></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-hd"><h2>私域促到效果</h2></div>
      <div class="card-bd" style="padding:0">
        <table class="data">
          <thead><tr><th>分组</th><th>场次</th><th>场均到课率</th></tr></thead>
          <tbody id="invite-groups"></tbody>
        </table>
        <p class="muted" style="padding:8px 16px;font-size:12px;margin:0" id="invite-note"></p>
      </div>
    </div>
  </div>
  <p class="board-attr" data-board-attr style="padding:12px 0"></p>

</div>
<script src="../assets/js/proto.js"></script>
<script src="../assets/js/board-data.js?v=10"></script>
<script src="../assets/js/term-store.js?v=1"></script>
<script src="../assets/js/board-metrics.js?v=15"></script>
<script src="../assets/js/board-insights.js?v=10"></script>
<script src="../assets/js/board-term.js?v=1"></script>
<script src="../assets/js/board-dictionary.js?v=4"></script>
<script src="../assets/js/board-tools.js?v=5"></script>
<script src="../assets/js/admin-shell.js?v=19"></script>
<script>
(function () {
  BoardMetrics.ensureCaliberUI();
  BoardMetrics.setUpdatedNow();
  BoardMetrics.fillAttr();
  var brief = document.getElementById("scope-help-brief");
  if (brief) brief.textContent = " · " + (BoardMetrics.FILTER_SCOPE_HELP || "").slice(0, 40) + "…";

  var liveState = { tab: "ended", sort: "recent", selected: "", scrollY: 0 };

  function closeLiveDrawer() {
    var d = document.getElementById("live-drawer");
    if (d) d.remove();
    BoardInsights.setAnalyticsState({ selectedLive: "", liveId: "" }, { syncUrl: true, push: true });
    if (liveState.scrollY != null) window.scrollTo(0, liveState.scrollY);
    var focusBtn = document.querySelector('[data-open-live="' + (liveState.selected || "") + '"]');
    if (focusBtn && focusBtn.focus) focusBtn.focus();
    liveState.selected = "";
  }

  function buildStatsUrl(liveId, liveName) {
    var returnUrl = location.pathname.split("/").pop() + location.search;
    var q = "live-stats.html?live_id=" + encodeURIComponent(liveId) +
      "&from=board-live&return_url=" + encodeURIComponent(returnUrl);
    if (liveName) q += "&live_name=" + encodeURIComponent(liveName);
    return q;
  }

  function openPanel(liveId) {
    var detail = BoardInsights.getLiveSessionDetail(liveId);
    if (!detail) return;
    var r = detail.row;
    if (r.upcoming) return;
    var existing = document.getElementById("live-drawer");
    if (existing && liveState.selected === r.id && existing.querySelector("#live-panel-title")) {
      return;
    }
    liveState.scrollY = window.scrollY || 0;
    liveState.selected = r.id;
    BoardInsights.setAnalyticsState({
      selectedLive: r.id,
      liveId: r.id,
      liveTab: "ended",
      liveSort: liveState.sort
    }, { syncUrl: true, push: true });

    if (existing) existing.remove();
    var drawer = document.createElement("div");
    drawer.id = "live-drawer";
    drawer.className = "board-drawer-overlay";
    drawer.innerHTML =
      '<div class="board-drawer live-recap-drawer" role="dialog" aria-modal="true" aria-label="场次复盘">' +
      '<div class="board-drawer-hd"><h3 id="live-panel-title"></h3><button type="button" class="btn btn-sm" data-close>关闭</button></div>' +
      '<div class="board-drawer-bd">' +
      '<p class="muted" style="font-size:12px;margin:0 0 8px" id="live-panel-sub"></p>' +
      '<div class="board-mini-funnel" id="live-funnel"></div>' +
      '<div class="board-two" style="margin-top:12px">' +
      '<div><h4 style="margin:0 0 8px;font-size:13px">期次 / 渠道表现</h4>' +
      '<table class="data"><thead><tr><th>维度</th><th>到场</th><th>支付</th><th>支付率</th></tr></thead><tbody id="live-dim-tbody"></tbody></table></div>' +
      '<div><h4 style="margin:0 0 8px;font-size:13px">经营差异与结论</h4>' +
      '<p style="font-size:13px;margin:0 0 10px" id="live-risks"></p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap" id="live-actions"></div></div></div></div></div>';
    document.body.appendChild(drawer);

    document.getElementById("live-panel-title").textContent = "场次复盘 · " + r.id + " " + r.name;
    var vsAvg = r.attendDiff == null ? "—" : ((r.attendDiff > 0 ? "+" : "") + r.attendDiff + "pp vs 整体平均到场率");
    document.getElementById("live-panel-sub").textContent =
      "已结束 · 经营判断" +
      " · 直播促到SOP：" + (r.sopDone ? "已执行" : "未执行") +
      " · " + vsAvg;

    document.getElementById("live-funnel").innerHTML = [
      ["目标", r.target], ["邀约", r.invite], ["推送成功", r.pushOk],
      ["到场", r.attend == null ? "—" : r.attend],
      ["有效观看", r.watch == null ? "—" : r.watch],
      ["支付", r.payUsers || 0]
    ].map(function (x) {
      return '<div class="mf"><div class="n">' + BoardMetrics.fmt(x[1]) + '</div><div class="l">' + x[0] + "</div></div>";
    }).join("");

    var dims = detail.channels.map(function (c) {
      return "<tr><td>渠道 · " + c.label + "</td><td>" + BoardMetrics.fmt(c.attend) + "</td><td>" +
        BoardMetrics.fmt(c.pay) + "</td><td>" + (c.payRate != null ? c.payRate + "%" : "—") + "</td></tr>";
    }).concat(detail.terms.map(function (tm) {
      var termLink = (tm.id && tm.id !== "mixed" && window.BoardTerm)
        ? (' <a href="' + BoardTerm.termBoardUrl(tm.id, {
            selected_live: r.id, live_id: r.id, from_board: "live"
          }) + '" data-drill-save="1">查看期次经营看板</a>')
        : "";
      return "<tr><td>期次 · " + tm.label + termLink + "</td><td>" + BoardMetrics.fmt(tm.attend) + "</td><td>" +
        BoardMetrics.fmt(tm.pay) + "</td><td>—</td></tr>";
    }));
    document.getElementById("live-dim-tbody").innerHTML = dims.join("") || "<tr><td colspan='4' class='muted'>暂无维度数据</td></tr>";

    var conclusions = [];
    if (r.attendDiff != null && r.attendDiff < 0) {
      conclusions.push("到场率低于整体平均 " + Math.abs(r.attendDiff) + " 个百分点");
    }
    if (!r.sopDone) conclusions.push("未执行直播促到SOP");
    if (detail.pushFail) conclusions.push("推送缺口 " + detail.pushFail);
    if (r.payRateNum != null && r.payRateNum < 10) conclusions.push("支付率偏低（" + r.payRateNum + "%）");
    document.getElementById("live-risks").textContent =
      conclusions.length ? ("主要异常：" + conclusions.join("；")) : "本场与整体平均值差异不大，可结合完整场次数据复盘互动与商品。";

    document.getElementById("live-actions").innerHTML =
      '<a class="btn btn-sm btn-primary" href="' + buildStatsUrl(r.id, r.name) + '">查看完整场次数据</a>' +
      '<a class="btn btn-sm" href="live-edit.html?live_id=' + encodeURIComponent(r.id) + '&mode=view">返回直播详情</a>';

    drawer.querySelectorAll("[data-drill-save]").forEach(function (a) {
      a.addEventListener("click", function () { BoardInsights.saveReturnState(); });
    });
    var closeBtn = drawer.querySelector("[data-close]");
    closeBtn.onclick = closeLiveDrawer;
    drawer.addEventListener("click", function (e) { if (e.target === drawer) closeLiveDrawer(); });
    document.addEventListener("keydown", function onEsc(ev) {
      if (ev.key === "Escape") {
        document.removeEventListener("keydown", onEsc);
        closeLiveDrawer();
      }
    });
    closeBtn.focus();
  }

  function renderLiveTable(filters) {
    var thead = document.getElementById("live-thead");
    var tbody = document.getElementById("live-tbody");
    var rows = BoardInsights.getLiveRecapRows(filters, { tab: "ended", sort: liveState.sort });
    thead.innerHTML = "<tr><th>场次ID</th><th>主题</th><th>目标</th><th>邀约</th><th>推送成功</th><th>到场 / 率</th><th>有效观看</th><th>支付 / 率</th><th>直播促到SOP</th><th>vs 平均</th><th>操作</th></tr>";
    if (!rows.length) { BoardMetrics.renderEmpty(tbody, 11, "暂无已结束场次"); return; }
    tbody.innerHTML = rows.map(function (r) {
      var sel = liveState.selected === r.id ? " is-selected" : "";
      var vs = r.attendDiff == null ? "—" : ((r.attendDiff > 0 ? "+" : "") + r.attendDiff + "pp");
      var note = r.dataInsufficient ? " <span class='muted'>数据不足</span>" : "";
      return '<tr class="' + sel + '" id="live-row-' + r.id + '"><td>' + r.id + note + "</td><td>" + r.name + "</td><td>" +
        BoardMetrics.fmt(r.target) + "</td><td>" + BoardMetrics.fmt(r.invite) + "</td><td>" +
        BoardMetrics.fmt(r.pushOk) + "</td><td>" +
        (r.attend == null ? "—" : BoardMetrics.fmt(r.attend)) + " / " + (r.attendRate || "—") + "</td><td>" +
        (r.watch == null ? "—" : BoardMetrics.fmt(r.watch)) + "</td><td>" +
        BoardMetrics.fmt(r.payUsers) + " / " + (r.payRateNum != null ? r.payRateNum + "%" : "—") +
        "</td><td>" + (r.sopDone ? "已执行" : "未执行") + "</td><td>" + vs +
        '</td><td class="row-actions"><a href="#" data-open-live="' + r.id + '">场次复盘</a></td></tr>';
    }).join("");
    tbody.querySelectorAll("[data-open-live]").forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        openPanel(a.getAttribute("data-open-live"));
      };
    });
  }

  function renderDetails(d) {
    var filters = BoardMetrics.getFilters();
    var q = new URLSearchParams(location.search);
    liveState.tab = "ended";
    liveState.sort = q.get("live_sort") || q.get("sort") || BoardInsights.getAnalyticsState().liveSort || liveState.sort || "recent";
    liveState.selected = q.get("selected_live") || q.get("live_id") || BoardInsights.getAnalyticsState().selectedLive || "";

    var sortEl = document.getElementById("live-sort");
    if (sortEl) sortEl.value = liveState.sort;

    var sum = BoardMetrics.getLiveSummary();
    var sessions = d.liveSessions != null ? d.liveSessions : (sum.sessions || 0);
    var ended = d.endedSessions != null ? d.endedSessions : (sum.endedSessions || 0);
    var sample = d.attendSampleSessions != null ? d.attendSampleSessions : (sum.attendSampleSessions || 0);
    document.getElementById("stat-sessions").textContent = sessions ? BoardMetrics.fmt(sessions) : "—";
    document.getElementById("stat-ended").textContent = sessions ? BoardMetrics.fmt(ended) : "—";
    document.getElementById("stat-attend-avg").textContent = (!sessions || !sample) ? "—" : (d.liveAttendAvg || "—");
    document.getElementById("stat-attend-hint").textContent = "有效样本 " + (sample || "—");
    var liftOk = sum.sampleOk && sessions;
    document.getElementById("invite-lift").textContent = liftOk ? (d.inviteLift || "—") : "—";
    document.getElementById("invite-lift-hint").textContent = liftOk ? "有促到场次平均到课更高（相关表现，非因果）" : "样本不足";

    var lines = BoardInsights.getLiveConclusions(filters);
    document.getElementById("live-conclusion").innerHTML = BoardInsights.renderConclusionHtml(lines);
    document.querySelectorAll("#live-conclusion [data-conclusion-idx]").forEach(function (btn) {
      btn.onclick = function () {
        var item = lines[Number(btn.getAttribute("data-conclusion-idx"))];
        if (!item || !item.action || item.action.type !== "open_live") return;
        openPanel(item.action.id);
      };
    });

    renderLiveTable(filters);

    var g = d.inviteGroups || sum;
    document.getElementById("invite-groups").innerHTML =
      "<tr><td>已执行直播促到SOP</td><td>" + (g.sent || 0) + "</td><td>" + (g.sentAvg || "—") + "</td></tr>" +
      "<tr><td>未执行直播促到SOP</td><td>" + (g.miss || 0) + "</td><td>" + (g.missAvg || "—") + "</td></tr>" +
      "<tr><td>数据不足场次</td><td>" + (g.pending || 0) + "</td><td>—</td></tr>";
    document.getElementById("invite-note").textContent = "全部场次比较：期次影响场次名额；获客渠道不影响场次。直播促到SOP执行组与未执行组到场率为相关表现。";

    if (liveState.selected) openPanel(liveState.selected);
    BoardMetrics.renderActiveFilters();
    BoardMetrics.wireBoardLinks();
  }

  document.getElementById("live-sort").onchange = function () {
    liveState.sort = document.getElementById("live-sort").value;
    BoardInsights.setAnalyticsState({ liveTab: "ended", liveSort: liveState.sort }, { syncUrl: true, push: true });
    renderLiveTable(BoardMetrics.getFilters());
  };

  BoardMetrics.bindRange("range-seg", function (k, d) { renderDetails(d); });
  BoardMetrics.bindFilterBar({ onApply: function (k, d) { renderDetails(d); }, autoApply: true });
  (function () {
    var ch = document.getElementById("f-channel");
    if (ch && ch.options[0] && !ch.options[0].value) ch.options[0].textContent = "人群获客渠道（不影响场次）";
  })();
  document.getElementById("btn-export").style.display = "none";
  BoardTools.init({
    onApply: function (k, d) { renderDetails(d); },
    collectExtra: function () {
      var st = BoardInsights.getAnalyticsState();
      return {
        selected_live: st.selectedLive || st.liveId || new URLSearchParams(location.search).get("selected_live") || "",
        live_tab: "ended",
        live_sort: st.liveSort || liveState.sort || "recent"
      };
    },
    getExportTable: function () {
      var rows = BoardInsights.getLiveRecapRows(BoardMetrics.getFilters());
      if (!rows.length) return { reason: "暂无场次数据", rows: [] };
      return {
        name: "直播场次复盘",
        filename: BoardMetrics.exportFileName("直播场次复盘"),
        headers: ["场次ID", "主题", "状态", "目标", "邀约", "推送成功", "到场", "到场率", "有效观看", "支付", "支付率", "直播促到SOP", "vs平均"],
        rows: rows.map(function (r) {
          return [
            r.id, r.name, r.upcoming ? "未开播" : "已结束",
            r.target, r.invite, r.pushOk,
            r.attend == null ? "—" : r.attend, r.attendRate || "—",
            r.watch == null ? "—" : r.watch,
            r.payUsers, r.payRateNum != null ? r.payRateNum : "—",
            r.sopDone ? "已执行" : "未执行",
            r.attendDiff == null ? "—" : r.attendDiff
          ];
        })
      };
    }
  });
})();
</script>
</body>
</html>
