<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>编辑系列课 · 艺博 To-B</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/content-mgmt.css?v=3" />
</head>
<body class="admin-body" data-module="content" data-nav="content-series" data-title="编辑系列课" data-crumb="内容 / 内容管理 / 系列课 / 编辑">

<div id="header-actions">
  <a class="btn" href="content-series.html">返回列表</a>
  <button class="btn" id="btn-draft">保存草稿</button>
  <button class="btn" id="btn-preview">用户端预览</button>
  <button class="btn btn-primary" id="btn-save-outline">保存并进入目录</button>
</div>

<div id="page-content" style="display:none">
  <a class="cm-back" href="content-series.html">← 返回系列课列表</a>

  <div class="cm-page-hd">
    <div>
      <h1 id="e-title">新建系列课</h1>
      <p class="sub">配置系列课展示与状态规则，保存后继续维护章节目录；如需售卖，可在列表页「创建商品」将内容带入商品模块</p>
    </div>
  </div>

  <div class="cm-anchor" id="anchors">
    <button class="btn active" data-goto="sec-content">内容信息</button>
    <button class="btn" data-goto="sec-status">状态设置</button>
    <button class="btn" data-goto="sec-share">分享设置</button>
  </div>

  <div class="cm-section" id="sec-content">
    <div class="cm-section-hd">
      <h2>内容信息 <span class="hint">配置学员在课程详情页看到的基础内容</span></h2>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field" style="grid-column:1/-1">
        <label>系列课名称 * <span style="float:right;color:#8c8c8c;font-weight:400" id="name-cnt">0/45</span></label>
        <input class="input" id="f-name" maxlength="45" placeholder="建议14字内" />
      </div>
      <div class="field">
        <label>内容分类 <span style="float:right;color:#8c8c8c;font-weight:400">取值于「内容分类」</span></label>
        <select class="input" id="f-cat"></select>
      </div>
      <div class="field">
        <label>封面</label>
        <div class="cm-cover-up has-img"><img src="../assets/img/covers/reading.jpg" alt="" /><span class="cm-cover-tip">更换封面</span></div>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>系列课简介 <span style="float:right;color:#8c8c8c;font-weight:400" id="intro-cnt">0/256</span></label>
        <textarea class="input" id="f-intro" rows="3" maxlength="256" placeholder="建议256字内"></textarea>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>系列课详情</label>
        <div class="rt-editor">
          <div class="rt-toolbar">
            <button type="button" class="rt-btn">⊕ 插入</button>
            <button type="button" class="rt-btn">↶</button>
            <button type="button" class="rt-btn">↷</button>
            <div class="rt-divider"></div>
            <button type="button" class="rt-btn">正文</button>
            <button type="button" class="rt-btn">16px</button>
            <button type="button" class="rt-btn"><b>B</b></button>
            <button type="button" class="rt-btn"><i>I</i></button>
            <button type="button" class="rt-btn"><u>U</u></button>
            <button type="button" class="rt-btn">≡</button>
            <div class="rt-divider"></div>
            <button type="button" class="rt-btn">预览</button>
          </div>
          <div class="rt-body" contenteditable="true"><span class="rt-placeholder">输入系列课详情，支持粘贴富文本内容</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="cm-section" id="sec-status">
    <div class="cm-section-hd">
      <h2>状态设置 <span class="hint">配置内容在店铺内的展示状态</span></h2>
    </div>
    <div class="field">
      <label>上架设置</label>
      <div class="cm-choice col">
        <label><input type="radio" name="shelf" checked> 立即上架（保存后提交内容审核队列）</label>
        <label><input type="radio" name="shelf"> 定时上架 <input type="datetime-local" class="input" style="width:200px;margin-left:8px" /></label>
        <label><input type="radio" name="shelf"> 暂存草稿</label>
      </div>
    </div>
    <div class="field">
      <label>店铺显示</label>
      <div class="cm-choice">
        <label><input type="radio" name="store" checked> 显示</label>
        <label><input type="radio" name="store"> 隐藏（仅可通过链接访问）</label>
      </div>
    </div>
  </div>

  <div class="cm-section" id="sec-share">
    <div class="cm-section-hd">
      <h2>分享设置 <span class="hint">自定义学员端分享卡片的标题、描述与封面；列表页「分享」弹窗（链接 / 二维码 / 海报）默认使用以上内容</span></h2>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field">
        <label>分享标题 <span style="float:right;color:#8c8c8c;font-weight:400" id="share-title-cnt">0/30</span></label>
        <input class="input" id="f-share-title" maxlength="30" placeholder="默认使用系列课名称" />
      </div>
      <div class="field">
        <label>分享封面</label>
        <div class="cm-choice">
          <label><input type="radio" name="share-cover" checked> 使用课程封面</label>
          <label><input type="radio" name="share-cover"> 自定义上传</label>
        </div>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>分享描述 <span style="float:right;color:#8c8c8c;font-weight:400" id="share-desc-cnt">0/60</span></label>
        <textarea class="input" id="f-share-desc" rows="2" maxlength="60" placeholder="默认使用系列课简介，建议60字内"></textarea>
      </div>
    </div>
    <p style="font-size:12px;color:#8c8c8c;margin:8px 0 0">草稿阶段可预览分享卡片；内容正式上架后生成可用短链和二维码。</p>
    <button class="btn" style="margin-top:10px" id="btn-share-preview">预览分享卡片</button>
  </div>

  <div class="cm-sticky-ft">
    <a class="btn" href="content-series.html">取消</a>
    <button class="btn" id="btn-draft2">保存草稿</button>
    <button class="btn" id="btn-preview2">用户端预览</button>
    <button class="btn btn-primary" id="btn-save-outline2">保存并进入目录</button>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/content-cats.js?v=1"></script>
<script src="../assets/js/share-modal.js?v=1"></script>
<script src="../assets/js/admin-shell.js?v=14"></script>
<script>
var PRESET = {
  S001: { name:"小学语文阅读启蒙系列", cat:"K12 教育", intro:"针对 6-12 岁儿童阅读兴趣培养，从绘本到章节书的进阶路径。", cover:"../assets/img/covers/reading.jpg" },
  S002: { name:"家长情绪管理训练营", cat:"家庭教育", intro:"8 周系统训练，帮助家长识别情绪、管理情绪、与孩子正向沟通。", cover:"../assets/img/covers/emotion.jpg" },
  S003: { name:"AI 学习规划入门", cat:"学习能力", intro:"AI 助力学习规划，10 节实操课让孩子学会用 AI 工具提升学习效率。", cover:"../assets/img/covers/ai.jpg" }
};

// 内容分类下拉：取值于「内容分类」页面列表
var catSel = document.getElementById("f-cat");
catSel.insertAdjacentHTML("beforeend", window.ContentCats.optionsHtml({ emptyLabel: "未分类" }));

var id = new URLSearchParams(location.search).get("id") || "";
var isNew = !id || !PRESET[id];
document.getElementById("e-title").textContent = isNew ? "新建系列课" : "编辑系列课";
if (!isNew) {
  var p = PRESET[id];
  document.getElementById("f-name").value = p.name;
  document.getElementById("f-intro").value = p.intro;
  catSel.value = p.cat;
  if (catSel.selectedIndex < 0) catSel.selectedIndex = 0;
}

function updCnt(){
  document.getElementById("name-cnt").textContent = (document.getElementById("f-name").value||"").length + "/45";
  document.getElementById("intro-cnt").textContent = (document.getElementById("f-intro").value||"").length + "/256";
}
document.getElementById("f-name").addEventListener("input", updCnt);
document.getElementById("f-intro").addEventListener("input", updCnt);
updCnt();

// 分享设置字数
var fShareTitle = document.getElementById("f-share-title");
var fShareDesc = document.getElementById("f-share-desc");
function updShareCnt(){
  document.getElementById("share-title-cnt").textContent = (fShareTitle.value||"").length + "/30";
  document.getElementById("share-desc-cnt").textContent = (fShareDesc.value||"").length + "/60";
}
fShareTitle.addEventListener("input", updShareCnt);
fShareDesc.addEventListener("input", updShareCnt);
if (!isNew) {
  // 默认分享语 = 内容名称 / 简介
  fShareTitle.placeholder = PRESET[id].name;
  fShareDesc.placeholder = PRESET[id].intro;
}
updShareCnt();

// 预览分享卡片（链接 / 二维码 / 海报 / 分享设置，与列表页「分享」弹窗一致）
document.getElementById("btn-share-preview").addEventListener("click", function(){
  var p = !isNew ? PRESET[id] : null;
  XiboShare.open({
    type: "系列课",
    url: "https://yibo.app/s/" + (id || "NEW"),
    cover: p ? p.cover : "../assets/img/covers/reading.jpg",
    name: fShareTitle.value || (p ? p.name : document.getElementById("f-name").value) || "未命名系列课",
    desc: fShareDesc.value || (p ? p.intro : "") || ""
  });
});

document.getElementById("anchors").addEventListener("click", function(e){
  var b = e.target.closest("[data-goto]"); if (!b) return;
  document.querySelectorAll("#anchors .btn").forEach(function(x){ x.classList.remove("active"); });
  b.classList.add("active");
  var el = document.getElementById(b.getAttribute("data-goto"));
  if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
});

function goOutline(){
  var nid = id || "S002";
  location.href = "content-series-outline.html?id=" + encodeURIComponent(nid);
}
function draft(){ Proto.toast("草稿已保存"); }
function preview(){ Proto.toast("已打开用户端预览（演示）"); }
document.getElementById("btn-draft").addEventListener("click", draft);
document.getElementById("btn-draft2").addEventListener("click", draft);
document.getElementById("btn-preview").addEventListener("click", preview);
document.getElementById("btn-preview2").addEventListener("click", preview);
document.getElementById("btn-save-outline").addEventListener("click", goOutline);
document.getElementById("btn-save-outline2").addEventListener("click", goOutline);

document.querySelector(".rt-body").addEventListener("focus", function(){
  var ph = this.querySelector(".rt-placeholder"); if (ph) ph.remove();
});
</script>
</body>
</html>
