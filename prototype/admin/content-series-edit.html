<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>编辑系列课 · 艺博 To-B</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/content-mgmt.css?v=4" />
</head>
<body class="admin-body" data-module="content" data-nav="content-series" data-title="编辑系列课" data-crumb="内容 / 内容管理 / 系列课 / 编辑">

<div id="header-actions">
  <a class="btn" href="content-series.html">返回列表</a>
  <button class="btn" id="btn-draft">保存草稿</button>
  <button class="btn btn-primary" id="btn-save-outline">保存并进入目录</button>
</div>

<div id="page-content" style="display:none">
  <a class="cm-back" href="content-series.html">← 返回系列课列表</a>
  <div id="edit-lock" class="cm-alert" style="display:none;margin-bottom:12px"></div>

  <div class="cm-tabs" id="anchors">
    <button class="btn active" data-tab="sec-content">内容信息</button>
    <button class="btn" data-tab="sec-status">状态设置</button>
    <button class="btn" data-tab="sec-share">分享设置</button>
  </div>

  <div class="cm-section tab-panel active" id="sec-content">
    <div class="cm-section-hd">
      <h2>内容信息 <span class="hint">配置学员在课程详情页看到的基础内容</span></h2>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field" style="grid-column:1/-1">
        <label>系列课名称 * <span style="float:right;color:#8c8c8c;font-weight:400" id="name-cnt">0/45</span></label>
        <input class="input" id="f-name" maxlength="45" placeholder="建议14字内" />
      </div>
      <div class="field">
        <label>内容分类 <span style="float:right;color:#8c8c8c;font-weight:400">取值于「内容分类」</span></label>
        <select class="input" id="f-cat"></select>
      </div>
      <div class="field">
        <label>讲师</label>
        <input class="input" id="f-teacher" placeholder="如：张老师" />
      </div>
      <div class="field">
        <label>封面</label>
        <div class="cm-cover-up has-img" id="f-cover-box"><img id="f-cover-img" src="../assets/img/covers/reading.jpg" alt="" /><span class="cm-cover-tip">更换封面</span></div>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>系列课简介 <span style="float:right;color:#8c8c8c;font-weight:400" id="intro-cnt">0/256</span></label>
        <textarea class="input" id="f-intro" rows="3" maxlength="256" placeholder="建议256字内"></textarea>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>系列课详情</label>
        <div class="rt-editor">
          <div class="rt-toolbar">
            <button type="button" class="rt-btn">⊕ 插入</button>
            <button type="button" class="rt-btn"><b>B</b></button>
            <button type="button" class="rt-btn"><i>I</i></button>
          </div>
          <div class="rt-body" id="f-detail" contenteditable="true"><span class="rt-placeholder">输入系列课详情，支持粘贴富文本内容</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="cm-section tab-panel" id="sec-status">
    <div class="cm-section-hd">
      <h2>状态设置 <span class="hint">保存后进入目录配置章节；有章节后可提交平台审核</span></h2>
    </div>
    <div class="field">
      <label>启用意图</label>
      <div class="cm-choice col">
        <label><input type="radio" name="shelf" value="audit" checked> 配置完目录后提交平台审核（通过后启用）</label>
        <label><input type="radio" name="shelf" value="draft"> 暂存草稿</label>
      </div>
    </div>
    <div class="field">
      <label>店铺显示</label>
      <div class="cm-choice">
        <label><input type="radio" name="store" value="1" checked> 显示</label>
        <label><input type="radio" name="store" value="0"> 隐藏（仅可通过链接访问）</label>
      </div>
    </div>
  </div>

  <div class="cm-section tab-panel" id="sec-share">
    <div class="cm-section-hd">
      <h2>分享设置 <span class="hint">自定义学员端分享卡片</span></h2>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field">
        <label>分享标题 <span style="float:right;color:#8c8c8c;font-weight:400" id="share-title-cnt">0/30</span></label>
        <input class="input" id="f-share-title" maxlength="30" placeholder="默认使用系列课名称" />
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>分享描述 <span style="float:right;color:#8c8c8c;font-weight:400" id="share-desc-cnt">0/60</span></label>
        <textarea class="input" id="f-share-desc" rows="2" maxlength="60" placeholder="默认使用系列课简介"></textarea>
      </div>
    </div>
    <button class="btn" style="margin-top:10px" id="btn-share-preview">预览分享卡片</button>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/content-cats.js?v=1"></script>
<script src="../assets/js/share-modal.js?v=1"></script>
<script src="../assets/js/series-store.js?v=1"></script>
<script src="../assets/js/admin-shell.js?v=15"></script>
<script>
var Store = window.SeriesStore;
var catSel = document.getElementById("f-cat");
catSel.insertAdjacentHTML("beforeend", window.ContentCats.optionsHtml({ emptyLabel: "未分类" }));

var id = new URLSearchParams(location.search).get("id") || "";
var course = id ? Store.get(id) : null;
var isNew = !course;
if (isNew) {
  course = Store.createBlank({ source: "self" });
  id = course.id;
}

var locked = !Store.canEditContent(course);
var lockEl = document.getElementById("edit-lock");
if (locked) {
  lockEl.style.display = "block";
  if (course.source === "platform") {
    lockEl.textContent = "平台下发内容，商家侧不可编辑。可查看目录或启停用于店铺。";
  } else if (course.status === Store.STATUS.enabled) {
    lockEl.textContent = "内容已启用，请先在列表停用后再编辑。";
  } else if (course.status === Store.STATUS.pending_audit) {
    lockEl.textContent = "内容正在平台审核中，暂不可编辑。";
  }
  document.querySelectorAll("#page-content input, #page-content textarea, #page-content select, #page-content [contenteditable]").forEach(function(el) {
    el.disabled = true;
    if (el.isContentEditable) el.contentEditable = "false";
  });
  document.getElementById("btn-draft").disabled = true;
  document.getElementById("btn-save-outline").textContent = "查看目录";
}

document.getElementById("f-name").value = course.name || "";
document.getElementById("f-intro").value = course.intro || "";
document.getElementById("f-teacher").value = course.teacher || "";
catSel.value = course.cat || "未分类";
if (catSel.selectedIndex < 0) catSel.selectedIndex = 0;
document.getElementById("f-cover-img").src = course.cover || "../assets/img/covers/reading.jpg";
document.getElementById("f-share-title").value = course.shareTitle || "";
document.getElementById("f-share-desc").value = course.shareDesc || "";
if (course.detail) {
  var body = document.getElementById("f-detail");
  body.innerHTML = course.detail;
}
if (course.storeVisible === false) {
  document.querySelector('input[name="store"][value="0"]').checked = true;
}

function updCnt(){
  document.getElementById("name-cnt").textContent = (document.getElementById("f-name").value||"").length + "/45";
  document.getElementById("intro-cnt").textContent = (document.getElementById("f-intro").value||"").length + "/256";
  document.getElementById("share-title-cnt").textContent = (document.getElementById("f-share-title").value||"").length + "/30";
  document.getElementById("share-desc-cnt").textContent = (document.getElementById("f-share-desc").value||"").length + "/60";
}
["f-name","f-intro","f-share-title","f-share-desc"].forEach(function(fid){
  document.getElementById(fid).addEventListener("input", updCnt);
});
updCnt();

document.getElementById("anchors").addEventListener("click", function(e){
  var b = e.target.closest("[data-tab]"); if (!b) return;
  document.querySelectorAll("#anchors .btn").forEach(function(x){ x.classList.remove("active"); });
  b.classList.add("active");
  document.querySelectorAll(".tab-panel").forEach(function(p){ p.classList.toggle("active", p.id === b.getAttribute("data-tab")); });
});

function collect() {
  var name = document.getElementById("f-name").value.trim();
  if (!name) { Proto.toast("请填写系列课名称"); return null; }
  var detailEl = document.getElementById("f-detail");
  var detailHtml = detailEl.querySelector(".rt-placeholder") ? "" : detailEl.innerHTML;
  var intent = (document.querySelector('input[name="shelf"]:checked') || {}).value || "draft";
  course.name = name;
  course.cat = catSel.value || "未分类";
  course.teacher = document.getElementById("f-teacher").value.trim() || "未指定";
  course.intro = document.getElementById("f-intro").value.trim();
  course.detail = detailHtml;
  course.cover = document.getElementById("f-cover-img").src;
  course.shareTitle = document.getElementById("f-share-title").value.trim();
  course.shareDesc = document.getElementById("f-share-desc").value.trim();
  course.storeVisible = document.querySelector('input[name="store"]:checked').value === "1";
  if (course.status === Store.STATUS.draft || course.status === Store.STATUS.rejected || isNew) {
    if (intent === "draft") course.status = Store.STATUS.draft;
  }
  course._intentAudit = intent === "audit";
  return course;
}

function persist(toastMsg) {
  if (locked) return course;
  var c = collect();
  if (!c) return null;
  Store.save(c);
  if (toastMsg) Proto.toast(toastMsg);
  return c;
}

document.getElementById("btn-draft").addEventListener("click", function(){
  persist("草稿已保存");
});
document.getElementById("btn-save-outline").addEventListener("click", function(){
  if (locked) {
    location.href = "content-series-outline.html?id=" + encodeURIComponent(id);
    return;
  }
  var c = persist();
  if (!c) return;
  location.href = "content-series-outline.html?id=" + encodeURIComponent(c.id) +
    (c._intentAudit ? "&intent=audit" : "");
});

document.getElementById("btn-share-preview").addEventListener("click", function(){
  XiboShare.open({
    type: "系列课",
    url: "https://yibo.app/s/" + id,
    cover: course.cover,
    name: document.getElementById("f-share-title").value || document.getElementById("f-name").value || "未命名系列课",
    desc: document.getElementById("f-share-desc").value || document.getElementById("f-intro").value || ""
  });
});

document.getElementById("f-detail").addEventListener("focus", function(){
  var ph = this.querySelector(".rt-placeholder"); if (ph) ph.remove();
});

var covers = ["reading.jpg","emotion.jpg","ai.jpg","series.jpg"];
var coverIdx = 0;
document.getElementById("f-cover-box").addEventListener("click", function(){
  if (locked) return;
  coverIdx = (coverIdx + 1) % covers.length;
  document.getElementById("f-cover-img").src = "../assets/img/covers/" + covers[coverIdx];
  Proto.toast("已切换封面（原型）");
});
</script>
</body>
</html>
