<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>经营总览 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=14" />
<style>
.board-kpi-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:16px; }
@media (max-width:1200px) { .board-kpi-grid { grid-template-columns:repeat(3,1fr); } }
@media (max-width:720px) { .board-kpi-grid { grid-template-columns:repeat(2,1fr); } }
.board-kpi { background:#fff; border:1px solid var(--color-border); border-radius:8px; padding:14px 16px; }
.board-kpi .kpi-label { font-size:12px; color:var(--color-text-muted); margin-bottom:4px; }
.board-kpi .kpi-value { font-size:24px; font-weight:700; line-height:1.2; }
.board-kpi .kpi-sub { font-size:12px; color:var(--color-text-muted); margin-top:4px; }
.board-kpi .kpi-meta { font-size:11px; color:var(--color-text-muted); margin-top:8px; line-height:1.5; }
.board-kpi .kpi-meta .up { color:#00b42a; }
.board-kpi .kpi-meta .down { color:#f53f3f; }
.trend-metric-bar button.active { background:var(--color-primary); color:#fff; border-color:var(--color-primary); }
</style>
</head>
<body class="admin-body" data-module="data" data-nav="board-o" data-title="经营总览" data-crumb="数据看板 / 总览" data-assist="1">
<div id="header-actions">
  <div class="segmented" id="range-seg" style="margin-right:8px">
    <button type="button" class="active" data-range="7d">近7日</button>
    <button type="button" data-range="30d">近30日</button>
    <button type="button" data-range="today">今日</button>
    <button type="button" data-range="yesterday">昨日</button>
  </div>
  <span class="muted" id="board-updated" style="margin-right:8px;font-size:12px"></span>
</div>
<div id="page-content" style="display:none">

  <div class="board-tip">
    <b>经营总览：</b>查看核心指标与趋势；详细分析请进入对应专题页。
    <span class="muted" id="scope-help-brief"></span>
  </div>

  <div id="cross-filters" style="margin:0 0 12px;font-size:12px;display:none"></div>

  <h2 style="margin:0 0 12px;font-size:14px">核心经营指标 <span class="muted" style="font-weight:400"> · <span data-range-label>近7日</span></span></h2>
  <div class="board-kpi-grid" id="core-kpis"></div>

  <div class="card" id="overview-trend-card" style="margin-bottom:16px">
    <div class="card-hd" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <h2 style="margin:0">核心指标趋势</h2>
      <span class="muted" style="font-size:12px;font-weight:400">按日 / 累计 / 上一期同期</span>
    </div>
    <div class="card-bd">
      <div class="trend-metric-bar" id="overview-trend-bar" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px"></div>
      <p class="muted" style="font-size:12px;margin:0 0 8px" id="overview-trend-note"></p>
      <div id="overview-trend-chart" style="min-height:220px"></div>
      <div style="margin-top:16px;padding-top:12px;border-top:1px dashed var(--color-border)">
        <h3 style="margin:0 0 8px;font-size:13px" id="overview-detail-title">指标明细</h3>
        <div style="overflow-x:auto">
          <table class="data" style="min-width:960px">
            <thead id="overview-detail-thead"></thead>
            <tbody id="overview-metric-detail"></tbody>
          </table>
        </div>
        <p class="muted" style="font-size:12px;margin:8px 0 0" id="overview-detail-note"></p>
      </div>
    </div>
  </div>

</div>
<script src="../assets/js/proto.js"></script>
<script src="../assets/js/board-data.js?v=10"></script>
<script src="../assets/js/term-store.js?v=1"></script>
<script src="../assets/js/board-metrics.js?v=16"></script>
<script src="../assets/js/board-insights.js?v=10"></script>
<script src="../assets/js/board-term.js?v=2"></script>
<script src="../assets/js/board-dictionary.js?v=4"></script>
<script src="../assets/js/board-tools.js?v=6"></script>
<script src="../assets/js/admin-shell.js?v=16"></script>
<script>
(function () {
  BoardMetrics.ensureCaliberUI();
  BoardMetrics.setUpdatedNow();
  BoardMetrics.fillAttr();
  var brief = document.getElementById("scope-help-brief");
  if (brief) brief.textContent = " · " + (BoardMetrics.FILTER_SCOPE_HELP || "").slice(0, 48) + "…";

  var METRICS = BoardInsights.OVERVIEW_METRICS || [];
  var trendState = {
    metric: (METRICS[0] && METRICS[0].trendKey) || "pool_new",
    label: (METRICS[0] && METRICS[0].label) || "入池人数"
  };
  var lastDetailRows = null;

  function trendClass(t) {
    return t === "up" ? "up" : t === "down" ? "down" : "";
  }

  function fmtDetailCell(v, kind) {
    if (v == null) return "—";
    if (kind === "rate") return v + "%";
    if (kind === "money") return BoardMetrics.money(v);
    return BoardMetrics.fmt(v);
  }

  function renderTrendBar() {
    var bar = document.getElementById("overview-trend-bar");
    if (!bar) return;
    bar.innerHTML = METRICS.map(function (m) {
      var active = m.trendKey === trendState.metric ? " active" : "";
      return '<button type="button" class="btn btn-sm' + active + '" data-trend="' + m.trendKey +
        '" data-trend-label="' + m.label + '">' + m.label + "</button>";
    }).join("");
    bar.querySelectorAll("[data-trend]").forEach(function (btn) {
      btn.onclick = function () {
        openOverviewTrend(btn.getAttribute("data-trend"), btn.getAttribute("data-trend-label"), false);
      };
    });
  }

  function buildMetricDetailTable(termId, filters) {
    if (!window.BoardTerm || !termId) return null;
    var seriesMap = {};
    var labels = null;
    METRICS.forEach(function (m) {
      var s = BoardTerm.buildTrendSeries(termId, m.trendKey, filters);
      if (s) {
        seriesMap[m.trendKey] = s;
        if (!labels) labels = s.labels;
      }
    });
    if (!labels || !labels.length) return null;
    return {
      labels: labels,
      metrics: METRICS,
      seriesMap: seriesMap,
      rows: labels.map(function (lb, i) {
        var row = { label: lb, cells: {} };
        METRICS.forEach(function (m) {
          var s = seriesMap[m.trendKey];
          row.cells[m.trendKey] = s && s.daily ? s.daily[i] : null;
        });
        return row;
      })
    };
  }

  function renderMetricDetail(termId, filters) {
    var title = document.getElementById("overview-detail-title");
    var thead = document.getElementById("overview-detail-thead");
    var tbody = document.getElementById("overview-metric-detail");
    var note = document.getElementById("overview-detail-note");
    if (!title || !thead || !tbody) return;

    title.textContent = "指标明细";
    var table = buildMetricDetailTable(termId, filters);
    lastDetailRows = table;
    var colCount = METRICS.length + 1;

    if (!table) {
      thead.innerHTML = "<tr><th>日期</th>" +
        METRICS.map(function (m) { return "<th>" + m.label + "</th>"; }).join("") + "</tr>";
      BoardMetrics.renderEmpty(tbody, colCount, "暂无按日明细");
      if (note) note.textContent = "";
      return;
    }

    thead.innerHTML = "<tr><th>日期</th>" +
      METRICS.map(function (m) { return "<th>" + m.label + "</th>"; }).join("") +
      "</tr>";

    tbody.innerHTML = table.rows.map(function (r) {
      return "<tr><td>" + r.label + "</td>" +
        METRICS.map(function (m) {
          return "<td>" + fmtDetailCell(r.cells[m.trendKey], m.kind) + "</td>";
        }).join("") +
        "</tr>";
    }).join("");

    if (note) {
      note.textContent = "与上方核心指标同一套口径；按日展示入池到成交、退款的完整链路。";
    }
  }

  function renderCoreKpis(d, filters) {
    var kpis = BoardInsights.getCoreKpis(filters);
    document.getElementById("core-kpis").innerHTML = kpis.map(function (k) {
      var cmp = k.compare && k.compare.comparable
        ? '<span class="' + trendClass(k.compare.trend) + '">' + k.compareLabel + " " + k.compare.text + "</span>"
        : '<span class="muted">' + (k.compare ? k.compare.text : "") + "</span>";
      var metric = k.trendKey || "pool_new";
      var tipId = k.tipId || k.id;
      return '<div class="board-kpi" data-kpi="' + k.id + '">' +
        '<div class="kpi-label" data-metric="' + tipId + '">' + k.label + "</div>" +
        '<div class="kpi-value">' + k.value + "</div>" +
        (k.sub ? '<div class="kpi-sub">' + k.sub + "</div>" : "") +
        '<div class="kpi-meta">' + cmp +
        '<br/><a href="#" data-open-trend="' + metric + '" data-trend-label="' + k.label + '">查看趋势</a></div></div>';
    }).join("");
    if (window.BoardTools) BoardTools.bindMetricTips(document.getElementById("core-kpis"));
    document.querySelectorAll("[data-open-trend]").forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        openOverviewTrend(a.getAttribute("data-open-trend"), a.getAttribute("data-trend-label"), true);
      };
    });
  }

  function syncTrendBar() {
    document.querySelectorAll("#overview-trend-bar [data-trend]").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-trend") === trendState.metric);
    });
  }

  function openOverviewTrend(metric, label, scroll) {
    if (!window.BoardTerm) return;
    if (metric) trendState.metric = metric;
    if (label) trendState.label = label;
    syncTrendBar();
    var filters = BoardMetrics.getFilters();
    var termId = filters.term || BoardTerm.defaultTermId();
    var note = document.getElementById("overview-trend-note");
    var host = document.getElementById("overview-trend-chart");
    note.textContent = (trendState.label || "指标") + " · 期次 " + ((BoardTerm.getTermById(termId) || {}).name || termId) +
      "（未选期次时默认当前经营期次）";
    var series = BoardTerm.buildTrendSeries(termId, trendState.metric, filters);
    BoardTerm.renderTrendChart(host, series);
    if (scroll) {
      var card = document.getElementById("overview-trend-card");
      if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  function renderCrossFilters() {
    var st = BoardInsights.getAnalyticsState();
    var el = document.getElementById("cross-filters");
    if (!el) return;
    if (!st.crossFilter) {
      el.style.display = "none";
      return;
    }
    el.style.display = "block";
    el.innerHTML = '<span class="muted">图表联动：</span><span class="badge">' + st.crossFilter.label +
      '</span> <button type="button" class="btn btn-sm" id="clear-cross">清除选择</button>';
    document.getElementById("clear-cross").onclick = function () {
      BoardInsights.setAnalyticsState({ crossFilter: null });
      sync(null, BoardMetrics.aggregateLeadMetrics());
    };
  }

  function sync(k, d, filters) {
    filters = filters || BoardMetrics.getFilters();
    d = BoardMetrics.applyRange(filters.range);
    try {
      renderCoreKpis(d, filters);
      openOverviewTrend();
      var termId = (window.BoardTerm && BoardTerm.defaultTermId()) || "";
      renderMetricDetail(termId, filters);
      renderCrossFilters();
      BoardMetrics.wireBoardLinks();
    } catch (err) {
      console.error("[board-overview sync]", err);
    }
  }

  BoardMetrics.setFilters({ channel: "", term: "" }, { push: false });
  BoardMetrics.bindRange("range-seg", sync);
  BoardTools.init({
    onApply: sync,
    collectExtra: function () {
      var st = BoardInsights.getAnalyticsState();
      return {
        selected_channel: st.selectedChannel || "",
        selected_term: st.selectedTerm || "",
        selected_owner: st.selectedOwner || "",
        selected_live: st.selectedLive || ""
      };
    },
    getExportTable: function () {
      var table = lastDetailRows;
      if (!table && window.BoardTerm) {
        var filters = BoardMetrics.getFilters();
        var termId = BoardTerm.defaultTermId();
        table = buildMetricDetailTable(termId, filters);
      }
      var name = "经营总览_指标明细";
      var headers = ["日期"].concat(METRICS.map(function (m) { return m.label; }));
      if (!table || !table.rows || !table.rows.length) {
        return {
          name: name,
          filename: BoardMetrics.exportFileName(name),
          headers: headers,
          rows: []
        };
      }
      return {
        name: name,
        filename: BoardMetrics.exportFileName(name),
        headers: headers,
        rows: table.rows.map(function (r) {
          return [r.label].concat(METRICS.map(function (m) {
            return fmtDetailCell(r.cells[m.trendKey], m.kind);
          }));
        })
      };
    }
  });
  renderTrendBar();
  sync(null, BoardMetrics.aggregateLeadMetrics());
})();
</script>
</body>
</html>
