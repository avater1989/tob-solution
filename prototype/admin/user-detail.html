<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>用户详情 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
</head>
<body class="admin-body" data-module="user" data-nav="users" data-title="用户详情" data-crumb="用户 / 用户管理 / 用户详情">
<div id="header-actions">
  <button class="btn" id="btn-tag" type="button">打标</button>
  <button class="btn" id="btn-assign" type="button">调整归属</button>
  <a class="btn btn-primary" id="btn-scrm" href="leads.html">去SCRM跟进</a>
  <button class="btn btn-ghost" id="btn-back" type="button">← 返回列表</button>
</div>

<div id="page-content" style="display:none">
  <div id="page-empty" style="display:none">
    <div class="card" style="max-width:520px;margin:48px auto;text-align:center">
      <div class="card-bd" style="padding:40px 24px">
        <h2 style="margin:0 0 8px;font-size:18px">未找到该用户</h2>
        <p class="muted" style="margin:0 0 20px">该用户可能已被移除，或当前链接已失效。</p>
        <a class="btn btn-primary" id="ud-empty-back" href="users.html">返回用户列表</a>
      </div>
    </div>
  </div>

  <div id="page-main">
    <div class="ud-layout">
      <div class="ud-side">
        <div class="card">
          <div class="card-bd ud-profile-card">
            <div class="ud-avatar-lg" id="pf-avatar">—</div>
            <h2 id="pf-name" style="margin:12px 0 4px;font-size:18px">—</h2>
            <p class="muted" id="pf-nick" style="margin:0 0 4px;font-size:13px;display:none"></p>
            <p class="muted mono" id="pf-id" style="margin:0 0 10px;font-size:12px">—</p>
            <div id="pf-marketing" style="display:none;margin-bottom:10px">
              <span class="badge badge-warn">已停止主动营销</span>
            </div>
            <div class="ud-meta" id="pf-meta"></div>
            <div class="ud-tags-mini" id="pf-tags"></div>
          </div>
        </div>

        <div class="card" style="margin-top:12px">
          <div class="card-hd"><h2>账户信息</h2></div>
          <div class="card-bd" style="padding:0">
            <div class="acc-card">
              <div class="muted">累计订单数</div>
              <div class="acc-value" id="acc-orders">0</div>
            </div>
            <div class="acc-card">
              <div class="muted">累计实付</div>
              <div class="acc-value" id="acc-paid">¥0</div>
            </div>
            <div class="acc-card">
              <div class="muted">已购课程数</div>
              <div class="acc-value" id="acc-courses">0</div>
            </div>
            <div class="acc-card">
              <div class="muted">有效权益数</div>
              <div class="acc-value" id="acc-valid">0</div>
            </div>
            <div class="acc-card">
              <div class="muted">异常权益数</div>
              <div class="acc-value" id="acc-abnormal">0</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card ud-main">
        <div class="ud-tabs" id="ud-tabs">
          <a href="#" data-tab="overview" class="active">概览</a>
          <a href="#" data-tab="rights">课程与权益</a>
          <a href="#" data-tab="orders">订单记录</a>
          <a href="#" data-tab="learn">学习与直播</a>
          <a href="#" data-tab="service">服务记录</a>
          <a href="#" data-tab="account">账户明细</a>
        </div>

        <div class="ud-pane" id="pane-overview"></div>
        <div class="ud-pane" id="pane-rights" style="display:none"></div>
        <div class="ud-pane" id="pane-orders" style="display:none"></div>
        <div class="ud-pane" id="pane-learn" style="display:none"></div>
        <div class="ud-pane" id="pane-service" style="display:none"></div>
        <div class="ud-pane" id="pane-account" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<div class="proto-mask" id="mask"></div>

<!-- 权益详情抽屉 -->
<div class="proto-drawer" id="drawer-right" style="width:600px;max-width:94vw">
  <div class="proto-drawer-hd">
    <h3>权益详情</h3>
    <button class="btn btn-sm btn-ghost" type="button" data-close>×</button>
  </div>
  <div class="proto-drawer-bd" id="drawer-right-bd"></div>
  <div class="proto-drawer-ft" id="drawer-right-ft"></div>
</div>

<!-- 重试开通 -->
<div class="proto-modal" id="modal-reopen" style="width:520px">
  <div class="proto-modal-hd">
    <h3 style="font-size:16px;font-weight:600">重试开通课程权益</h3>
    <button class="btn btn-sm btn-ghost" type="button" data-close>×</button>
  </div>
  <div class="proto-modal-bd">
    <div class="ud-info-box" id="reopen-summary"></div>
    <div class="field" style="margin-top:14px">
      <label>处理备注 <span style="color:var(--color-danger)">*</span></label>
      <textarea id="reopen-remark" rows="3" placeholder="请填写重试开通原因与处理说明"></textarea>
    </div>
  </div>
  <div class="proto-modal-ft" style="border-top:1px solid var(--color-border);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" type="button" data-close>取消</button>
    <button class="btn btn-primary" type="button" id="reopen-submit">确认重试开通</button>
  </div>
</div>

<!-- 延长有效期 -->
<div class="proto-modal" id="modal-extend" style="width:520px">
  <div class="proto-modal-hd">
    <h3 style="font-size:16px;font-weight:600">延长有效期</h3>
    <button class="btn btn-sm btn-ghost" type="button" data-close>×</button>
  </div>
  <div class="proto-modal-bd">
    <div class="form-grid">
      <div class="field full"><label>课程</label><div id="extend-course">—</div></div>
      <div class="field"><label>当前到期时间</label><div id="extend-old">—</div></div>
      <div class="field"><label>新到期时间 <span style="color:var(--color-danger)">*</span></label>
        <input type="date" id="extend-new" />
      </div>
      <div class="field full"><label>延长原因 <span style="color:var(--color-danger)">*</span></label>
        <textarea id="extend-reason" rows="2" placeholder="请填写延长原因"></textarea>
      </div>
      <div class="field full">
        <label><input type="checkbox" id="extend-notify" checked /> 通知用户有效期已延长</label>
      </div>
    </div>
  </div>
  <div class="proto-modal-ft" style="border-top:1px solid var(--color-border);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" type="button" data-close>取消</button>
    <button class="btn btn-primary" type="button" id="extend-submit">确认延长</button>
  </div>
</div>

<!-- 退款补开（管理员） -->
<div class="proto-modal" id="modal-regrant" style="width:520px">
  <div class="proto-modal-hd">
    <h3 style="font-size:16px;font-weight:600">补开已退款回收权益</h3>
    <button class="btn btn-sm btn-ghost" type="button" data-close>×</button>
  </div>
  <div class="proto-modal-bd">
    <div class="ud-diag fail" style="margin-bottom:12px">
      <h4>风险提示</h4>
      <div>该权益因退款已回收。补开将重新授予课程访问权，请确认业务合规并填写原因。</div>
    </div>
    <div class="ud-info-box" id="regrant-summary"></div>
    <div class="field" style="margin-top:14px">
      <label>补开原因 <span style="color:var(--color-danger)">*</span></label>
      <textarea id="regrant-reason" rows="3" placeholder="请填写补开原因（将写入操作日志）"></textarea>
    </div>
  </div>
  <div class="proto-modal-ft" style="border-top:1px solid var(--color-border);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" type="button" data-close>取消</button>
    <button class="btn btn-primary" type="button" id="regrant-submit">确认补开</button>
  </div>
</div>

<!-- 调整归属 -->
<div class="proto-modal" id="modal-assign" style="width:520px">
  <div class="proto-modal-hd">
    <h3 style="font-size:16px;font-weight:600">调整归属</h3>
    <button class="btn btn-sm btn-ghost" type="button" data-close>×</button>
  </div>
  <div class="proto-modal-bd">
    <div class="form-grid">
      <div class="field"><label>当前部门</label><div id="assign-cur-dept">—</div></div>
      <div class="field"><label>当前归属人</label><div id="assign-cur-owner">—</div></div>
      <div class="field"><label>新部门</label>
        <select id="assign-dept">
          <option value="">未分配</option>
          <option>销售部</option>
          <option>运营部</option>
          <option>内容部</option>
          <option>客服部</option>
        </select>
      </div>
      <div class="field"><label>新归属人（助教）</label>
        <select id="assign-owner">
          <option value="未分配">未分配</option>
          <option>赵老师</option>
          <option>周销售</option>
          <option>王助教</option>
          <option>阮荣均</option>
        </select>
      </div>
      <div class="field full"><label>调整原因 <span style="color:var(--color-danger)">*</span></label>
        <textarea id="assign-reason" rows="2" placeholder="请填写调整原因"></textarea>
      </div>
      <div class="field full">
        <label><input type="checkbox" id="assign-transfer" checked /> 同步转移未完成跟进任务</label>
      </div>
      <div class="field full">
        <label><input type="checkbox" id="assign-notify" checked /> 通知新负责人</label>
      </div>
    </div>
  </div>
  <div class="proto-modal-ft" style="border-top:1px solid var(--color-border);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" type="button" data-close>取消</button>
    <button class="btn btn-primary" type="button" id="assign-submit">保存</button>
  </div>
</div>

<!-- 打标 -->
<div class="proto-modal" id="modal-tag" style="width:480px">
  <div class="proto-modal-hd">
    <h3 style="font-size:16px;font-weight:600">用户打标</h3>
    <button class="btn btn-sm btn-ghost" type="button" data-close>×</button>
  </div>
  <div class="proto-modal-bd">
    <div class="field" style="margin-bottom:10px"><label>用户</label><div id="tag-user-name">—</div></div>
    <div class="field"><label>选择标签（可多选）</label>
      <div class="tag-pick" id="tag-pick"></div>
    </div>
    <p class="muted" style="margin:8px 0 0;font-size:12px">选项来自 <a href="user-tags.html">标签管理</a> 启用中的手动标签</p>
  </div>
  <div class="proto-modal-ft" style="border-top:1px solid var(--color-border);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" type="button" data-close>取消</button>
    <button class="btn btn-primary" type="button" id="tag-save">保存</button>
  </div>
</div>

<!-- 手机号解密 -->
<div class="proto-modal" id="modal-phone" style="width:480px">
  <div class="proto-modal-hd">
    <h3 style="font-size:16px;font-weight:600">查看完整手机号</h3>
    <button class="btn btn-sm btn-ghost" type="button" data-close>×</button>
  </div>
  <div class="proto-modal-bd">
    <p class="muted" style="margin:0 0 12px;font-size:13px">请确认查看原因。操作将被记录。</p>
    <div class="field">
      <label>查看原因 <span style="color:var(--color-danger)">*</span></label>
      <select id="phone-reason">
        <option value="">请选择</option>
        <option>客服核实身份</option>
        <option>售后处理</option>
        <option>订单核对</option>
        <option>其他</option>
      </select>
    </div>
    <div class="field" id="phone-reason-other-wrap" style="display:none;margin-top:10px">
      <label>补充说明</label>
      <input id="phone-reason-other" placeholder="请填写具体原因" />
    </div>
  </div>
  <div class="proto-modal-ft" style="border-top:1px solid var(--color-border);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" type="button" data-close>取消</button>
    <button class="btn btn-primary" type="button" id="phone-submit">确认查看</button>
  </div>
</div>

<style>

.ud-side { display: flex; flex-direction: column; gap: 0; }
.ud-main { padding: 0; overflow: hidden; }
.ud-profile-card { text-align: center; padding: 24px 16px 18px; }
.ud-avatar-lg {
  width: 80px; height: 80px; border-radius: 50%; background: #e8f3ff; color: #165dff;
  font-size: 30px; display: flex; align-items: center; justify-content: center; margin: 0 auto;
}
.ud-meta { text-align: left; font-size: 12px; color: var(--color-text-secondary); line-height: 1.7; }
.ud-meta .ud-meta-row { display: flex; gap: 6px; margin-bottom: 4px; }
.ud-meta .ud-meta-k { color: var(--color-text-muted); min-width: 72px; flex-shrink: 0; }
.ud-tags-mini { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
.acc-card {
  padding: 12px 16px; border-bottom: 1px solid var(--color-border); font-size: 13px;
}
.acc-card:last-child { border-bottom: none; }
.acc-card .muted { font-size: 12px; margin-bottom: 4px; }
.acc-value { font-size: 18px; font-weight: 600; color: var(--color-text); }

.ud-tabs {
  display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--color-border);
  overflow-x: auto; white-space: nowrap; background: #fafbfc;
}
.ud-tabs a {
  padding: 6px 12px; font-size: 13px; color: var(--color-text-secondary);
  text-decoration: none; border-radius: 4px;
}
.ud-tabs a:hover { background: #f0f5ff; color: var(--color-primary); }
.ud-tabs a.active { background: var(--color-primary); color: #fff; }
.ud-pane { padding: 16px; }

.ud-tip {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 12px 14px; margin-bottom: 14px; border-radius: 6px;
  background: #fff7e8; border: 1px solid #ffe4ba; font-size: 13px;
}
.ud-tip.ok {
  background: #e8ffea; border-color: #b7eb8f;
}
.ud-tip-title { font-weight: 600; color: #d25f00; margin-bottom: 4px; }
.ud-tip.ok .ud-tip-title { color: #009a29; }
.ud-tip-actions { display: flex; flex-wrap: wrap; gap: 8px; flex-shrink: 0; }
.ud-stats {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px;
}
.ud-stat {
  border: 1px solid var(--color-border); border-radius: 6px; padding: 12px;
  background: #fafbfc;
}
.ud-stat .muted { font-size: 12px; margin-bottom: 6px; }
.ud-stat .v { font-size: 18px; font-weight: 600; }
.ud-sec-hd {
  display: flex; align-items: center; justify-content: space-between;
  margin: 18px 0 10px; font-size: 14px; font-weight: 600;
}
.ud-sec-hd:first-of-type { margin-top: 4px; }
.ud-summary-card {
  border: 1px solid var(--color-border); border-radius: 6px; padding: 12px 14px;
  font-size: 13px; line-height: 1.6; background: #fafbfc;
}
.ud-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.ud-chip {
  padding: 4px 12px; border: 1px solid var(--color-border); border-radius: 16px;
  font-size: 12px; background: #fff; cursor: pointer; color: var(--color-text-secondary);
}
.ud-chip.active { border-color: var(--color-primary); color: var(--color-primary); background: #f0f5ff; }
.ud-empty { text-align: center; padding: 40px 16px; }
.ud-empty h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
.ud-info-box {
  background: #f7f8fa; border: 1px solid var(--color-border); border-radius: 6px;
  padding: 12px 14px; font-size: 13px; line-height: 1.7;
}
.ud-diag {
  border-radius: 6px; padding: 12px 14px; margin-bottom: 16px; border: 1px solid;
}
.ud-diag.ok { background: #e8ffea; border-color: #b7eb8f; }
.ud-diag.fail { background: #ffece8; border-color: #f3aea4; }

.ud-diag.ok h4 { color: #009a29; }
.ud-diag.fail h4 { color: #cb2634; }
.ud-sec { margin-bottom: 16px; }
.ud-sec h4 {
  margin: 0 0 8px; font-size: 13px; font-weight: 600;
  padding-bottom: 6px; border-bottom: 1px solid var(--color-border);
}
.check-list { display: flex; flex-direction: column; gap: 8px; }
.check-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 6px; font-size: 13px;
}
.tr-hl { background: #fff7e8 !important; outline: 1px solid #ffcf8b; }
.tag-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.tp-item {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
  border: 1px solid var(--color-border); border-radius: 6px; font-size: 13px; cursor: pointer;
}
.tp-item:has(input:checked) { border-color: var(--color-primary); color: var(--color-primary); background: #f0f5ff; }
.timeline { position: relative; padding-left: 18px; }
.tl-item { position: relative; padding-bottom: 14px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before {
  content: ""; position: absolute; left: -14px; top: 8px; bottom: -6px;
  width: 1px; background: var(--color-border);
}
.tl-item:last-child::before { display: none; }
.tl-dot {
  position: absolute; left: -18px; top: 4px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--color-primary); border: 2px solid #fff;
  box-shadow: 0 0 0 1px var(--color-border);
}
.tl-time { font-size: 12px; color: var(--color-text-muted); margin-bottom: 2px; }
.tl-text { font-size: 13px; line-height: 1.5; }
.tl-type { font-size: 11px; color: var(--color-text-secondary); margin-left: 6px; }

@media (max-width: 1200px) {
  .ud-stats { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 1100px) {
  .ud-stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 1024px) {
  .ud-layout { grid-template-columns: 1fr; }
}
</style>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/user-tags.js"></script>
<script src="../assets/js/user-store.js?v=3"></script>
<script src="../assets/js/admin-shell.js?v=14"></script>
<script>
(function () {
  var US = window.UserStore;
  var params = new URLSearchParams(location.search);
  var uid = String(params.get("id") || "").trim();
  var returnTo = "";
  try {
    returnTo = params.get("returnTo") || params.get("return_to") || "";
    if (returnTo) {
      try { returnTo = decodeURIComponent(returnTo); } catch (eRt) {}
    }
  } catch (eRt2) {}
  var user = null;
  var currentTab = "overview";
  var rightsFilter = "all";
  var activeRightId = null;
  var phoneRevealed = false;
  var highlightRightId = null;
  var modalRightId = null;
  var urlBootstrapped = false;

  var TAB_IDS = ["overview", "rights", "orders", "learn", "service", "account"];
  var TAB_MAP = {
    overview: "overview",
    rights: "rights",
    orders: "orders",
    order: "orders",
    learn: "learn",
    live: "learn",
    service: "service",
    follow: "service",
    consult: "service",
    account: "account"
  };

  var CHECK_LABELS = [
    { key: "paid", label: "1. 订单是否支付" },
    { key: "generated", label: "2. 是否成功生成权益" },
    { key: "bound", label: "3. 权益是否绑定当前用户" },
    { key: "effective", label: "4. 权益是否已生效" },
    { key: "validity", label: "5. 权益是否过期或被回收" },
    { key: "course", label: "6. 课程自身是否允许访问" }
  ];

  function isAbnormalListReturn() {
    try {
      var q = returnTo.indexOf("?") >= 0 ? returnTo.split("?")[1] : "";
      var sp = new URLSearchParams(q);
      return sp.get("rightsStatus") === "存在异常";
    } catch (e) {
      return /rightsStatus=%E5%AD%98%E5%9C%A8%E5%BC%82%E5%B8%B8|rightsStatus=存在异常/.test(returnTo || "");
    }
  }

  function listReturnLabel() {
    return isAbnormalListReturn() ? "返回异常用户列表" : "返回用户列表";
  }

  function courseConfigHref(r) {
    var cid = (r && (r.courseId || "")) || "";
    if (!cid) {
      if (r && r.course === "引流体验课") cid = "S003";
      else cid = "S002";
    }
    var href = "content-series-detail.html?id=" + encodeURIComponent(cid) +
      "&from=user&user=" + encodeURIComponent(uid) + "&tab=rights";
    if (returnTo) href += "&returnTo=" + encodeURIComponent(returnTo);
    return href;
  }

  function showPostActionBar(msg) {
    var bar = el("ud-post-bar");
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "ud-post-bar";
      bar.className = "alert alert-info";
      bar.style.cssText = "margin:0 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap";

  var REF_TODAY = "2026-09-11";

  function el(id) {

  function setHtml(node, html) {
    if (node) node.innerHTML = html;
  }

  function setText(node, text) {
    if (node) node.textContent = text;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function money(n) {
    var v = Number(n) || 0;
    return "¥" + (Math.round(v * 100) / 100);
  }

  function initial(name) {
    var s = String(name || "").trim();
    return s ? s.charAt(0) : "用";
  }

  function hideHeaderButtons() {
    ["btn-tag", "btn-assign", "btn-scrm", "btn-back"].forEach(function (id) {
      setDisplay(el(id), "none");
    });
  }

  function showHeaderButtons() {
    ["btn-tag", "btn-assign", "btn-scrm", "btn-back"].forEach(function (id) {
      setDisplay(el(id), "");
    });
  }

  function tagHtml(tags) {
    if (!tags || !tags.length) return '<span class="muted" style="font-size:12px">暂无标签</span>';
    return tags.map(function (t) {
      var cls = (window.UserTags && UserTags.colorClass(t.color)) || "tag-blue";
      return '<span class="tag ' + cls + '">' + esc(t.name) + "</span>";
    }).join("");
  }

  function displayRightStatus(st) {
    if (st === "未生效") return "待生效(未生效)";
    if (st === "手动停用" || st === "已冻结") return "手动停用";
    return st || "—";
  }

  function statusBadge(st) {
    var display = displayRightStatus(st);
    var key = st || "";
    var map = {
      "有效": "badge-success",
      "已支付": "badge-success",
      "可访问": "badge-success",
      "学习中": "badge-info",
      "已学完": "badge-info",
      "未学习": "badge-info",
      "开通失败": "badge-danger",
      "已到期": "badge-warn",
      "已退款回收": "badge-danger",
      "已冻结": "badge-danger",
      "手动停用": "badge-danger",
      "待开通": "badge-warn",
      "未生效": "badge-warn",
      "待生效(未生效)": "badge-warn",
      "绑定到其他家庭成员": "badge-warn",
      "不可学习": "badge-danger",
      "不可访问": "badge-danger",
      "已退款": "badge-danger",
      "无": "badge-info",
      "处理中": "badge-warn",
      "已完结": "badge-success"
    };
    return '<span class="badge ' + (map[key] || map[display] || "badge-info") + '">' + esc(display) + "</span>";
  }

  function checkBadge(v) {
    if (v === "未检查" || v === "不适用") {
      return '<span class="badge">' + esc(v) + "</span>";
    }
    if (v === "正常") return '<span class="badge badge-success">正常</span>';
    if (v === "异常") return '<span class="badge badge-danger">异常</span>';
    return '<span class="badge badge-warn">待处理</span>';
  }

  function paidTotal(u) {
    var sum = 0;
    (u.orders || []).forEach(function (o) {
      if (o.payStatus === "已支付") sum += Number(o.amount) || 0;
    });
    return sum;
  }

  function purchasedCourseCount(u) {
    var set = {};
    (u.orders || []).forEach(function (o) {
      if (o.product) set[o.product] = true;
    });
    return Object.keys(set).length;
  }

  function accountStats(u) {
    var sum = US.rightsSummary(u);
    return {
      orders: (u.orders || []).length,
      paid: paidTotal(u),
      courses: purchasedCourseCount(u),
      valid: sum.valid,
      abnormal: sum.abnormal
    };
  }

  function isExpiringSoon(r) {
    if (!r || r.status !== "有效" || !r.endAt || r.endAt === "—") return false;
    var end = new Date(r.endAt.replace(/-/g, "/") + " 23:59:59");
    var now = new Date(REF_TODAY.replace(/-/g, "/") + " 00:00:00");
    var diff = (end - now) / (24 * 3600 * 1000);
    return diff >= 0 && diff <= 90;
  }

  function sortRights(list) {
    return list.slice().sort(function (a, b) {
      var aa = US.isAbnormalStatus(a.status) ? 0 : 1;
      var bb = US.isAbnormalStatus(b.status) ? 0 : 1;
      if (aa !== bb) return aa - bb;
      return String(b.acquireAt || "").localeCompare(String(a.acquireAt || ""));
    });
  }

  function filterRights(list, f) {
    if (f === "valid") return list.filter(function (r) { return r.status === "有效"; });
    if (f === "expiring") return list.filter(isExpiringSoon);
    if (f === "abnormal") return list.filter(function (r) { return US.isAbnormalStatus(r.status); });
    return list;
  }

  function validityText(r) {
    var s = r.startAt || "—";
    var e = r.endAt || "—";
    if (s === "—" && e === "—") return "—";
    return s + " ~ " + e;
  }

  function accessResultText(r) {
    if (r.access === "可访问") return "可正常访问";
    if (r.diagnose && r.diagnose.desc) return r.diagnose.desc;
    if (r.failReason) return r.failReason;
    return r.access || "不可访问";
  }

  function orderLink(orderId, tab) {
    if (!orderId) return "—";
    var t = tab || currentTab;
    var href = "order-detail.html?id=" + encodeURIComponent(orderId) +
      "&from=user&user=" + encodeURIComponent(uid) + "&tab=" + encodeURIComponent(t);
    if (returnTo) href += "&returnTo=" + encodeURIComponent(returnTo);
    return '<a class="mono" href="' + href + '">' + esc(orderId) + "</a>";
  }

  function aftersaleLink(refundId) {
    if (!refundId) return "";
    var href = "aftersale-detail.html?id=" + encodeURIComponent(refundId) +
      "&from=user&user=" + encodeURIComponent(uid);
    if (returnTo) href += "&returnTo=" + encodeURIComponent(returnTo);
    return href;
  }

  function orderDetailHref(orderId, tab) {
    var href = "order-detail.html?id=" + encodeURIComponent(orderId) +
      "&from=user&user=" + encodeURIComponent(uid) +
      "&tab=" + encodeURIComponent(tab || "rights");
    if (returnTo) href += "&returnTo=" + encodeURIComponent(returnTo);
    return href;
  }

  function emptyBlock(title, sub) {
    return '<div class="ud-empty"><h3>' + esc(title) + "</h3>" +
      (sub ? '<p class="muted" style="margin:0">' + esc(sub) + "</p>" : "") + "</div>";
  }

  function metaRow(k, vHtml) {
    return '<div class="ud-meta-row"><span class="ud-meta-k">' + esc(k) + "</span><span>" + vHtml + "</span></div>";
  }

  function buildServiceRecords(u) {
    var items = [];
    (u.logs || []).forEach(function (log) {
      items.push({
        time: log.time || "",
        type: "权益操作",
        text: (log.operator || "操作人") + " · " + (log.action || "操作") +
          (log.object ? " · 对象：" + log.object : "") +
          (log.from ? " · " + log.from + " → " + log.to : "") +
          (log.reason ? " · 原因：" + log.reason : ""),
        kind: "log"
      });
    });
    (u.follows || []).forEach(function (f) {
      if (f.type === "客服处理" && (u.logs || []).length) return;
      items.push({
        time: f.time || "",
        type: f.type || "跟进",
        text: f.text || "",
        kind: "follow"
      });
    });
    (u.consults || []).forEach(function (c) {
      items.push({
        time: c.time || "",
        type: "咨询 · " + (c.channel || "客服"),
        text: (c.summary || "") + (c.status ? "（" + c.status + "）" : ""),
        kind: "consult"
      });
    });
    items.sort(function (a, b) {
      return String(b.time).localeCompare(String(a.time));
    });
    return items;
  }

  /* ---------- modal / drawer ---------- */
  var mask = el("mask");
  function closeAll() {
    if (mask) mask.classList.remove("open");
    document.querySelectorAll(".proto-modal").forEach(function (n) { n.classList.remove("open"); });
    document.querySelectorAll(".proto-drawer").forEach(function (n) { n.classList.remove("open"); });
  }
  function openModal(node) {
    if (!node) return;
    if (mask) mask.classList.add("open");
    document.querySelectorAll(".proto-drawer").forEach(function (n) { n.classList.remove("open"); });
    document.querySelectorAll(".proto-modal").forEach(function (n) { n.classList.remove("open"); });
    node.classList.add("open");
  }
  function openDrawer(node) {
    if (!node) return;
    if (mask) mask.classList.add("open");
    document.querySelectorAll(".proto-modal").forEach(function (n) { n.classList.remove("open"); });
    node.classList.add("open");
  }
  if (mask) mask.addEventListener("click", closeAll);
  document.querySelectorAll("[data-close]").forEach(function (n) {
    n.addEventListener("click", closeAll);
  });

  function normalizeTab(raw) {
    var t = String(raw || "").toLowerCase();
    return TAB_MAP[t] || "overview";
  }

  function tabUrl(tab) {
    var url = new URL(location.href);
    url.searchParams.set("id", uid);
    url.searchParams.set("tab", tab);
    return url.pathname + "?" + url.searchParams.toString();
  }

  function setTab(tab, opts) {
    opts = opts || {};
    currentTab = normalizeTab(tab);
    document.querySelectorAll("#ud-tabs a").forEach(function (a) {
      a.classList.toggle("active", a.getAttribute("data-tab") === currentTab);
    });
    TAB_IDS.forEach(function (id) {
      setDisplay(el("pane-" + id), id === currentTab ? "block" : "none");
    });

    if (!opts.skipUrl) {
      var href = tabUrl(currentTab);
      if (opts.replace || !urlBootstrapped) {
        history.replaceState({ tab: currentTab, id: uid }, "", href);
        urlBootstrapped = true;
      } else {
        history.pushState({ tab: currentTab, id: uid }, "", href);
      }
    }
    renderActivePane();
  }

  function reloadUser() {
    user = US.byId(uid);
    return !!user;
  }

  function showEmptyState() {
    setDisplay(el("page-empty"), "block");
    setDisplay(el("page-main"), "none");

  function showMainState() {
    setDisplay(el("page-empty"), "none");
    setDisplay(el("page-main"), "block");
    showHeaderButtons();
  }

      showEmptyState();

  function renderProfile() {
    var stats = accountStats(user);
    setText(el("pf-avatar"), initial(user.name));

    var nickNode = el("pf-nick");

      metaRow("最近活跃", esc(user.activeAt || "—"))

    setHtml(el("pf-tags"), tagHtml(user.tags));

  function renderActivePane() {
    if (!user) return;
    if (currentTab === "overview") renderOverview();
    else if (currentTab === "rights") renderRights();

  /* ---------- overview ---------- */
  function renderOverview() {
    var pane = el("pane-overview");
    if (!pane) return;
    var stats = accountStats(user);
    var abn = (user.rights || []).filter(function (r) { return US.isAbnormalStatus(r.status); });
    var lastOrder = (user.orders || [])[0];
    var lastLive = (user.lives || [])[0];
    var services = buildServiceRecords(user);
    var lastService = services[0];

    var html = "";
    if (abn.length) {
      var top = abn[0];
      var why = (top.diagnose && top.diagnose.desc) || top.failReason || ("当前状态：" + top.status);
      html += '<div class="ud-tip"><div><div class="ud-tip-title">课程访问异常</div>' +
        '<div>课程：' + esc(top.course) + "</div>" +
        "<div>状态：" + statusBadge(top.status) + "</div>" +
        '<div class="muted" style="margin-top:4px">无法观看原因：' + esc(why) + "</div></div>" +
        '<div class="ud-tip-actions">' +

        '<button class="btn" type="button" id="ov-goto-orders">查看订单</button>' +
        (top.status === "开通失败" && US.canReopenRight()
          ? '<button class="btn btn-primary" type="button" id="ov-retry-open">重试开通</button>'
          : "") +
        "</div></div>";
    } else {
      html += '<div class="ud-tip ok"><div><div class="ud-tip-title">课程权益正常</div>' +
        '<div class="muted">当前无异常课程权益，用户可按有效权益正常访问课程。</div></div></div>';
    }

    html += '<div class="ud-stats">' +
      ovStat("累计订单数", String(stats.orders)) +
      ovStat("累计实付", money(stats.paid)) +
      ovStat("已购课程数", String(stats.courses)) +
      ovStat("有效权益数", String(stats.valid)) +
      ovStat("异常权益数", String(stats.abnormal)) +
      "</div>";

    html += sectionHead("最近订单", "orders") + summaryCard(

          (lastLive.watchMin != null ? " · 观看 " + esc(lastLive.watchMin) + " 分钟" : "") +
          "</div>")
        : '<span class="muted">暂无学习 / 直播记录</span>'
    );

    html += sectionHead("最近服务跟进", "service") + summaryCard(
      lastService
        ? ('<div class="muted">' + esc(lastService.time) +
          (lastService.type ? ' · ' + esc(lastService.type) : "") + "</div>" +
          '<div style="margin-top:4px">' + esc(lastService.text) + "</div>")
        : '<span class="muted">暂无服务记录</span>'

  function rightActionsHtml(r) {
    var parts = ['<a href="#" class="open-right" data-rid="' + esc(r.id) + '">详情</a>'];
    if (r.status === "开通失败" && US.canReopenRight()) {
      parts.push('<a href="#" class="act-reopen" data-rid="' + esc(r.id) + '">重试开通</a>');
    }
    if (r.status === "已到期" && US.canExtendRight()) {
      parts.push('<a href="#" class="act-extend" data-rid="' + esc(r.id) + '">延长有效期</a>');
    }
    if (r.status === "已退款回收") {
      if (r.orderId) {
        parts.push('<a href="' + orderDetailHref(r.orderId, "rights") + '">查看订单</a>');
      }
      if (r.refundId) {
        parts.push('<a href="' + aftersaleLink(r.refundId) + '">查看退款单</a>');

        parts.push('<a href="#" class="act-regrant" data-rid="' + esc(r.id) + '">补开权益</a>');
      }
    }
    if (r.status === "已停用") {
      parts.push('<a href="#" class="act-reopen" data-rid="' + esc(r.id) + '">重新启用</a>');
    }
    if (r.status === "有效") {
      parts.push('<a href="' + courseConfigHref(r) + '">查看课程配置</a>');

    var impact = dig.impact || ((r.course || "课程") + (ok ? "可访问" : "无法访问"));
    var action = dig.action || (r.status === "开通失败" ? "重试开通" : r.status === "已到期" ? "延长有效期" : r.status === "已退款回收" ? "查看退款单" : "查看课程配置");
    setHtml(bd,
      '<div class="ud-diag ' + (ok ? "ok" : "fail") + '">' +

      '<div class="ud-diag-grid" style="display:grid;gap:6px;margin-top:8px;font-size:13px">' +

      '<div class="ud-sec"><h4>课程信息</h4><dl class="detail-grid">' +

      "<dt>访问说明</dt><dd>" + esc(reason) + "</dd>" +
      "</dl></div>" +

      '<div class="ud-sec"><h4>获取与关联</h4><dl class="detail-grid">' +
      "<dt>权益类型</dt><dd>" + esc(r.rightType || "正式课") + "</dd>" +

      "<dt>到期时间</dt><dd>" + esc(r.endAt || "—") + "</dd>" +
      "<dt>当前状态</dt><dd>" + statusBadge(r.status) + "</dd>" +
      "<dt>最近状态变化</dt><dd>" + esc(r.lastChange || "—") + "</dd>" +
      "</dl></div>" +

      '<div class="ud-sec"><h4>访问检查</h4><div class="check-list">' +
      CHECK_LABELS.map(function (c) {

        return '<div class="check-row"><span>' + esc(c.label) + "</span>" + checkBadge(v) + "</div>";
      }).join("") +
      "</div></div>"
    );

    acts.push('<button class="btn" type="button" data-close>关闭</button>');

  /* ---------- modals ---------- */
  function openReopenModal(rid) {
    var r = findRight(rid);
    if (!r) return;
    modalRightId = rid;
    setHtml(el("reopen-summary"),
      "<div>用户：" + esc(user.name) + "</div>" +
      "<div>课程：" + esc(r.course) + "</div>" +
      "<div>关联订单：" + esc(r.orderId || "—") + "</div>" +
      "<div>当前问题：" + esc(r.failReason || (r.diagnose && r.diagnose.desc) || r.status) + "</div>"
    );
    var remark = el("reopen-remark");
    if (remark) remark.value = "";
    var btn = el("reopen-submit");
    if (btn) {
      btn.disabled = false;
      btn.textContent = "确认重试开通";
    }
    openModal(el("modal-reopen"));
  }

  var reopenSubmit = el("reopen-submit");
  if (reopenSubmit) {
    reopenSubmit.addEventListener("click", function () {
      var remarkNode = el("reopen-remark");
      var remark = remarkNode ? remarkNode.value.trim() : "";
      if (!remark) {
        Proto.toast("请填写处理备注");
        return;
      }
      reopenSubmit.disabled = true;
      reopenSubmit.textContent = "处理中…";
      setTimeout(function () {
        try {
          US.reopenRight(uid, modalRightId, remark);
          Proto.toast("权益已成功开通");
          closeAll();
          renderAll();
          showPostActionBar("权益已成功开通");
          if (activeRightId === modalRightId) openRightDrawer(modalRightId);
        } catch (err) {
          reopenSubmit.disabled = false;
          reopenSubmit.textContent = "确认重试开通";
          Proto.toast("开通失败，请稍后重试");
        }
      }, 450);
    });
  }

  function openExtendModal(rid) {
    var r = findRight(rid);
    if (!r) return;
    modalRightId = rid;
    setText(el("extend-course"), r.course);
    setText(el("extend-old"), r.endAt || "—");
    var newEnd = el("extend-new");
    if (newEnd) newEnd.value = "";
    var reason = el("extend-reason");
    if (reason) reason.value = "";
    var notify = el("extend-notify");
    if (notify) notify.checked = true;
    var btn = el("extend-submit");
    if (btn) {
      btn.disabled = false;
      btn.textContent = "确认延长";
    }
    openModal(el("modal-extend"));
  }

  var extendSubmit = el("extend-submit");
  if (extendSubmit) {
    extendSubmit.addEventListener("click", function () {
      var newEndNode = el("extend-new");
      var reasonNode = el("extend-reason");
      var newEnd = newEndNode ? newEndNode.value : "";
      var reason = reasonNode ? reasonNode.value.trim() : "";
      if (!newEnd) {
        Proto.toast("请选择新到期时间");
        return;
      }
      if (!reason) {
        Proto.toast("请填写延长原因");
        return;
      }
      extendSubmit.disabled = true;
      extendSubmit.textContent = "处理中…";
      var notifyNode = el("extend-notify");
      var notify = notifyNode ? notifyNode.checked : false;
      setTimeout(function () {
        try {
          US.extendRight(uid, modalRightId, newEnd, reason, notify);
          Proto.toast("权益有效期已调整");
          closeAll();
          renderAll();
          showPostActionBar("有效期已延长");
          if (activeRightId === modalRightId) openRightDrawer(modalRightId);

          extendSubmit.disabled = false;
          extendSubmit.textContent = "确认延长";
          Proto.toast("延长失败，请稍后重试");

      }, 450);
    });

    a.addEventListener("click", function (e) {
      e.preventDefault();
      setTab(a.getAttribute("data-tab"));
    });
  });

  window.addEventListener("popstate", function (e) {
    if (!user) return;
    var tab = (e.state && e.state.tab) || normalizeTab(new URLSearchParams(location.search).get("tab"));
    setTab(tab, { skipUrl: true });
  });

  /* ---------- boot ---------- */
  if (!uid || !US.byId(uid)) {
    setDisplay(el("page-empty"), "block");
    setDisplay(el("page-main"), "none");
    hideHeaderButtons();
    var emptyBack = el("ud-empty-back");
    if (emptyBack && returnTo) emptyBack.href = returnTo;
    return;
  }

  currentTab = normalizeTab(params.get("tab"));
  if (params.get("focus") === "abn") {
    var u0 = US.byId(uid);
    var abn0 = ((u0 && u0.rights) || []).filter(function (r) { return US.isAbnormalStatus(r.status); })[0];
    if (abn0) highlightRightId = abn0.id;
  }
  renderAll();
  setTab(currentTab, { replace: true });
})();
</script>
</body>
</html>
