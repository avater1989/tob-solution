<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>配置题目 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/assess.css?v=4" />
</head>
<body class="admin-body" data-module="content" data-nav="assess-questions" data-title="题库" data-crumb="内容 / 测评中心 / 题库">

<div id="header-actions">
  <a class="btn" id="btn-back-assess" href="assess-projects.html" style="display:none">返回测评</a>
  <a class="btn" id="btn-flow" href="#" style="display:none">打开流程画布</a>
  <button class="btn btn-primary" id="btn-new-q">+ 新建题目</button>
</div>

<div id="page-content" style="display:none">
  <div id="bank-banner" class="as-banner" style="background:#f0f5ff;border:1px solid #bedaff;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px">
    题库为可复用基础资产。测评项目内的作答顺序与分支请在「流程画布」配置（选项 → 下一题 / 题组 / 结束）。
  </div>
  <a class="cm-back" id="back-link" href="assess-projects.html" style="display:none;color:#165dff;font-size:13px;margin-bottom:12px;text-decoration:none">← 返回测评列表</a>
  <div id="sync-banner" style="display:none"></div>

  <div class="cm-hero" id="project-hero" style="display:none;gap:16px;align-items:center;background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:16px 18px;margin-bottom:14px">
    <div style="width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#165dff,#4080ff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700" id="av">亲</div>
    <div style="flex:1">
      <div style="font-size:16px;font-weight:600" id="p-name">—</div>
      <div style="font-size:13px;color:#8c8c8c;margin-top:4px"><span id="p-desc">—</span> · <b id="p-cnt" style="color:#165dff">0</b> 道题目 · 分支在流程画布</div>
    </div>
    <span class="as-tag gray" id="p-status">草稿</span>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <h2 style="margin:0;font-size:15px" id="list-title">题目资产列表</h2>
  </div>
  <div id="q-list"></div>
</div>

<div class="proto-modal" id="modal-q">
  <div style="background:#fff;border-radius:10px;width:560px;max-width:94vw;max-height:88vh;overflow:auto">
    <div class="proto-modal-hd"><h3 style="margin:0;font-size:16px" id="q-modal-title">新建题目</h3><button class="ctrl-icon-btn" data-close>×</button></div>
    <div class="proto-modal-bd">
      <p class="muted" style="margin:0 0 12px;font-size:12px">配置题目内容与选项；跳转分支请到流程画布</p>
      <div class="field"><label>题目内容 *</label><input class="input" id="q-text" placeholder="请输入题目内容" /></div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr">
        <div class="field"><label>题目类型 *</label>
          <select class="input" id="q-type"><option>单选题</option><option>多选题</option><option>量表题</option><option>文本题</option></select>
        </div>
        <div class="field"><label>题目分类</label><input class="input" id="q-dim" placeholder="如：倾听表达" /></div>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr">
        <div class="field"><label>题目权重 *</label><input class="input" id="q-weight" type="number" value="1" /></div>
        <div class="field" style="padding-top:28px">
          <label style="display:flex;align-items:center;gap:8px;font-weight:400"><input type="checkbox" id="q-req" checked> 此题为必答题</label>
        </div>
      </div>
      <div class="field" id="opts-field">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <label style="margin:0">选项与分值</label>
          <button type="button" class="btn" id="btn-add-opt">+ 添加选项</button>
        </div>
        <div id="opt-rows"></div>
      </div>
    </div>
    <div class="proto-modal-ft" style="justify-content:flex-end;gap:8px">
      <button class="btn" data-close>取消</button>
      <button class="btn btn-primary" id="btn-save-q">保存</button>
    </div>
  </div>
</div>

<div class="proto-mask" id="mask"></div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/assess-flow-store.js?v=1"></script>
<script src="../assets/js/admin-shell.js?v=16"></script>
<script>
var Store = window.AssessFlowStore;
var META = {
  MP01:{ name:"亲子沟通能力测评", desc:"评估家长与孩子的沟通模式与冲突处理", status:"已发布", source:"self" },
  MP02:{ name:"家庭规则与边界测评", desc:"识别家庭教养风格与边界设定倾向", status:"草稿", source:"self" },
  PP01:{ name:"情绪健康筛查", desc:"综合情绪健康评估", status:"已发布", source:"platform" },
  P001:{ name:"情绪健康筛查（运营）", desc:"运营侧示例", status:"已发布", source:"self" }
};
var qs = new URLSearchParams(location.search);
var bankMode = !qs.get("id") || qs.get("bank") === "1";
var id = qs.get("id") || "MP01";
var meta = META[id] || { name: bankMode ? "题库" : id, desc: "", status: "草稿", source: "self" };
var SYNC = meta.source === "platform" || qs.get("sync") === "1";
var flow = null;
var list = [];
var editIdx = -1;

if (bankMode) {
  document.getElementById("project-hero").style.display = "none";
  document.getElementById("list-title").textContent = "题目资产列表（可被多测评引用）";
  document.title = "题库 · 商家管理后台";
  list = Store.getBank();
} else {
  document.getElementById("project-hero").style.display = "flex";
  document.getElementById("bank-banner").style.display = "none";
  document.getElementById("back-link").style.display = "inline-flex";
  document.getElementById("btn-back-assess").style.display = "";
  document.getElementById("btn-flow").style.display = "";
  document.getElementById("btn-flow").href = "assess-flow.html?id=" + encodeURIComponent(id);
  document.getElementById("list-title").textContent = "本测评题目（内容）";
  document.body.setAttribute("data-nav", "assess-projects");
  document.body.setAttribute("data-title", "配置题目");
  document.body.setAttribute("data-crumb", "内容 / 测评中心 / 测评项目 / 配置题目");
  flow = Store.getAssessmentFlow(id) || Store.ensureAssessment(id, meta);
  list = flow.questions || [];
  document.getElementById("p-name").textContent = flow.name || meta.name;
  document.getElementById("p-desc").textContent = meta.desc || "";
  document.getElementById("p-status").textContent = meta.status;
  document.getElementById("av").textContent = (flow.name || meta.name || "?").charAt(0);
}

if (SYNC && !bankMode) {
  document.getElementById("sync-banner").style.display = "";
  document.getElementById("sync-banner").innerHTML =
    '<div class="as-banner" style="background:#f9f0ff;border-color:#d3adf7;color:#531dab">平台同步测评，题目只读；流程由平台维护。</div>';
  document.getElementById("btn-new-q").disabled = true;
  document.getElementById("btn-new-q").style.opacity = ".5";
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

function edgeCount(qid) {
  if (!flow) return 0;
  var node = (flow.nodes || []).find(function (n) { return n.type === "question" && n.questionId === qid; });
  if (!node) return 0;
  return (flow.edges || []).filter(function (e) { return e.fromNodeId === node.id; }).length;
}

function renderOptRows(opts) {
  opts = opts && opts.length ? opts : [{ id: "O1", t: "选项1", s: 0 }, { id: "O2", t: "选项2", s: 1 }];
  document.getElementById("opt-rows").innerHTML = opts.map(function (o, i) {
    return '<div class="as-opt-row">' +
      '<input class="input" data-ot="' + i + '" value="' + esc(o.t) + '" placeholder="选项内容" />' +
      '<input class="input score" data-os="' + i + '" type="number" value="' + o.s + '" placeholder="分数" />' +
      '<input type="hidden" data-oid="' + i + '" value="' + esc(o.id || "") + '" />' +
      '<button type="button" class="btn" data-rm-opt="' + i + '" style="color:#f53f3f">删</button></div>';
  }).join("");
}

function readOptRows() {
  var texts = document.querySelectorAll("[data-ot]");
  var scores = document.querySelectorAll("[data-os]");
  var ids = document.querySelectorAll("[data-oid]");
  var out = [];
  texts.forEach(function (inp, i) {
    var t = inp.value.trim();
    if (!t) return;
    out.push(Store.normalizeOpt({
      id: ids[i] && ids[i].value,
      t: t,
      s: +(scores[i] && scores[i].value) || 0
    }, i));
  });
  return out.length ? out : [Store.normalizeOpt({ t: "选项A", s: 0 }, 0), Store.normalizeOpt({ t: "选项B", s: 1 }, 1)];
}

function persist() {
  if (bankMode) return;
  flow.questions = list;
  Store.saveAssessmentFlow(flow);
}

function render() {
  if (!bankMode) document.getElementById("p-cnt").textContent = list.length;
  document.getElementById("q-list").innerHTML = list.map(function (q, i) {
    var opts = q.opts || [];
    var ec = edgeCount(q.id);
    var acts = SYNC
      ? '<span class="as-tag gray">只读</span>'
      : '<button class="btn" data-edit="' + i + '">编辑题目</button>' +
        '<button class="btn" style="color:#f53f3f;border-color:#ffa39e" data-del="' + i + '">删除</button>';
    return '<div class="as-q-card">' +
      '<div class="as-q-ord"><div class="as-q-num">' + (i + 1) + "</div></div>" +
      '<div class="as-q-bd">' +
        '<div class="as-q-title">' + esc(q.text) + "</div>" +
        "<div>" +
          '<span class="as-tag blue">' + esc(q.type || "单选题") + "</span>" +
          (q.req ? '<span class="as-tag red">必答</span>' : "") +
          '<span class="as-tag gray">' + esc(q.dim || "未分类") + "</span>" +
          '<span class="as-tag blue">权重: ' + (q.weight || 1) + "</span>" +
          (!bankMode ? '<span class="as-tag purple">流程出边 ' + ec + "</span>" : "") +
        "</div>" +
        '<div class="as-q-opts">选项：' + esc(opts.map(function (o) { return o.t + "(" + o.s + "分)"; }).join(" / ")) + "</div>" +
      "</div>" +
      '<div class="as-acts">' + acts + "</div></div>";
  }).join("") || '<div class="card"><div class="card-bd" style="text-align:center;color:#bfbfbf;padding:32px">暂无题目</div></div>';
}

var mask = document.getElementById("mask");
function closeAll() {
  mask.classList.remove("open");
  document.querySelectorAll(".proto-modal").forEach(function (n) { n.classList.remove("open"); });
}
function openM(el) { mask.classList.add("open"); el.classList.add("open"); }

function openEditor(idx) {
  if (SYNC) { Proto.toast("只读"); return; }
  editIdx = idx;
  document.getElementById("q-modal-title").textContent = idx < 0 ? "新建题目" : "编辑题目";
  if (idx < 0) {
    document.getElementById("q-text").value = "";
    document.getElementById("q-type").value = "单选题";
    document.getElementById("q-dim").value = "";
    document.getElementById("q-weight").value = "1";
    document.getElementById("q-req").checked = true;
    renderOptRows(null);
  } else {
    var q = list[idx];
    document.getElementById("q-text").value = q.text;
    document.getElementById("q-type").value = q.type || "单选题";
    document.getElementById("q-dim").value = q.dim || "";
    document.getElementById("q-weight").value = q.weight || 1;
    document.getElementById("q-req").checked = !!q.req;
    renderOptRows(q.opts);
  }
  document.getElementById("opts-field").style.display = document.getElementById("q-type").value === "文本题" ? "none" : "";
  openM(document.getElementById("modal-q"));
}

document.getElementById("q-type").onchange = function () {
  document.getElementById("opts-field").style.display = this.value === "文本题" ? "none" : "";
};
document.getElementById("btn-add-opt").onclick = function () {
  var cur = readOptRows();
  cur.push(Store.normalizeOpt({ t: "选项" + (cur.length + 1), s: cur.length }, cur.length));
  renderOptRows(cur);
};
document.getElementById("opt-rows").addEventListener("click", function (e) {
  var rm = e.target.closest("[data-rm-opt]");
  if (!rm) return;
  var cur = readOptRows();
  cur.splice(+rm.getAttribute("data-rm-opt"), 1);
  renderOptRows(cur);
});
document.getElementById("btn-new-q").onclick = function () { openEditor(-1); };
document.getElementById("btn-save-q").onclick = function () {
  var text = document.getElementById("q-text").value.trim();
  if (!text) { Proto.toast("请填写题目内容"); return; }
  var type = document.getElementById("q-type").value;
  var item = Store.normalizeQuestion({
    id: editIdx >= 0 ? list[editIdx].id : Store.uid("Q"),
    text: text,
    type: type,
    dim: document.getElementById("q-dim").value.trim() || "未分类",
    weight: +document.getElementById("q-weight").value || 1,
    req: document.getElementById("q-req").checked,
    opts: type === "文本题" ? [] : readOptRows()
  }, editIdx >= 0 ? editIdx : list.length);
  if (editIdx < 0) list.push(item);
  else list[editIdx] = item;
  persist();
  closeAll();
  render();
  Proto.toast("题目已保存");
};

document.addEventListener("click", function (e) {
  var ed = e.target.closest("[data-edit]");
  if (ed) { openEditor(+ed.getAttribute("data-edit")); return; }
  var del = e.target.closest("[data-del]");
  if (del) {
    if (SYNC) return;
    list.splice(+del.getAttribute("data-del"), 1);
    persist();
    render();
    Proto.toast("已删除");
  }
});
mask.addEventListener("click", closeAll);
document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", closeAll); });
render();
</script>
</body>
</html>
