<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>线上课 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<style>
.cs-row { background:#fff;border:1px solid #e8e8e8;border-radius:8px;margin-bottom:12px;padding:14px 16px;display:flex;align-items:center;gap:14px; }
.cs-row:hover { border-color:#165dff; box-shadow:0 4px 14px rgba(22,93,255,.1); }
.cs-cover { width:128px;height:80px;border-radius:6px;background:#f2f3f5;overflow:hidden;flex-shrink:0; }
.cs-cover img { width:100%;height:100%;object-fit:cover;display:block; }
.cs-info { flex:1;min-width:0; }
.cs-title { font-size:15px;font-weight:600;color:#1d2129;display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap; }
.cs-desc { font-size:12px;color:#8c8c8c;line-height:1.6;margin-bottom:8px; }
.cs-stats { display:flex;gap:14px;font-size:12px;color:#595959;flex-wrap:wrap; }
.cs-stats b { color:#165dff;font-weight:600; }
.cs-badge { font-size:11px;padding:1px 6px;border-radius:3px;background:#fff7e6;color:#d46b08;font-weight:500; }
.cs-badge.premium { background:#f9f0ff;color:#722ed1; }
.cs-actions { display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:400px; }
</style>
</head>
<body class="admin-body" data-module="content" data-nav="content-video" data-title="线上课" data-crumb="内容 / 内容资产 / 线上课">

<div id="header-actions">
  <a class="btn btn-primary" href="content-video-edit.html">+ 新建线上课</a>
</div>

<div id="page-content" style="display:none">
  <div class="card" style="margin-bottom:14px"><div class="card-bd" style="padding:12px 16px">
    <div class="toolbar" style="border:none;padding:0;background:transparent;flex-wrap:wrap">
      <input class="input" id="f-kw" placeholder="搜索课程名称 / 讲师 / 期数" style="width:220px" />
      <div id="f-tag" style="width:200px;display:inline-block;vertical-align:middle"></div>
      <select class="input" id="f-teacher" style="width:150px"><option value="">全部讲师</option></select>
      <select class="input" id="f-badge" style="width:120px">
        <option value="">全部角标</option>
        <option value="hot">热门课</option>
        <option value="premium">精品课</option>
      </select>
      <select class="input" id="f-status" style="width:140px">
        <option value="">全部状态</option>
        <option value="draft">草稿</option>
        <option value="pending_audit">待平台审核</option>
        <option value="enabled">已上架</option>
        <option value="disabled">已下架</option>
        <option value="rejected">已驳回</option>
      </select>
      <button class="btn btn-primary" id="btn-query">查询</button>
      <button class="btn" id="btn-reset">重置</button>
    </div>
  </div></div>
  <p style="font-size:12px;color:#8c8c8c;margin:0 0 12px">系列课已并入线上课。<b>内容不承载价格</b>，价格只在「商品列表」维护；同一内容可建多个商品。已上架时章节锁定，须先下架再改。</p>
  <div id="legacy-banner" style="display:none;margin-bottom:12px"></div>
  <div id="list"></div>
  <div style="margin-top:12px;font-size:12px;color:#8c8c8c">共 <b id="count">0</b> 条</div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/content-tags.js?v=2"></script>
<script src="../assets/js/teachers-store.js?v=2"></script>
<script src="../assets/js/course-store.js?v=2"></script>
<script src="../assets/js/goods-store.js?v=1"></script>
<script src="../assets/js/share-modal.js?v=1"></script>
<script src="../assets/js/admin-shell.js?v=23"></script>
<script>
var Store = window.CourseStore;
var Goods = window.GoodsStore;
var Tags = window.ContentTags;
var Teachers = window.Teachers;

document.getElementById("f-teacher").insertAdjacentHTML("beforeend", Teachers.optionsHtml());
var tagFilter = Tags.mountTreeSelect("#f-tag", {
  placeholder: "内容标签（可多选）",
  compact: true,
  width: "200px",
  onChange: function () { /* 点查询生效 */ }
});

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

function render() {
  var rows = Store.list({
    keyword: document.getElementById("f-kw").value.trim() || undefined,
    tagIds: tagFilter.getSelected().length ? tagFilter.getSelected() : undefined,
    teacherId: document.getElementById("f-teacher").value || undefined,
    badge: document.getElementById("f-badge").value || undefined,
    status: document.getElementById("f-status").value || undefined
  });
  document.getElementById("count").textContent = rows.length;
  document.getElementById("list").innerHTML = rows.map(function (c) {
    var badge = "";
    if (c.badge === "hot") badge = '<span class="cs-badge">热门课</span>';
    else if (c.badge === "premium") badge = '<span class="cs-badge premium">精品课</span>';
    var st = Store.STATUS_LABEL[c.status] || c.status;
    var acts = "";
    acts += '<a class="btn" href="content-video-detail.html?id=' + encodeURIComponent(c.id) + '">查看</a>';
    acts += '<a class="btn" href="content-video-outline.html?id=' + encodeURIComponent(c.id) + '">章节</a>';
    if (c.source !== "platform" && c.status !== Store.STATUS.enabled && c.status !== Store.STATUS.pending_audit) {
      acts += '<a class="btn" href="content-video-edit.html?id=' + encodeURIComponent(c.id) + '">编辑</a>';
    }
    if (c.status === Store.STATUS.enabled) {
      acts += '<button class="btn" data-act="disable" data-id="' + c.id + '">下架</button>';
      if (Store.canCreateGoods(c)) acts += '<a class="btn btn-primary" href="goods-edit.html?create_mode=from_content&content_type=online_course&content_id=' + encodeURIComponent(c.id) + '">创建商品</a>';
    } else if (c.status === Store.STATUS.disabled) {
      acts += '<button class="btn btn-primary" data-act="enable" data-id="' + c.id + '">上架</button>';
      acts += '<a class="btn" href="goods-edit.html?create_mode=from_content&content_type=online_course&content_id=' + encodeURIComponent(c.id) + '">创建商品</a>';
    } else if (Store.canSubmitAudit(c)) {
      acts += '<button class="btn btn-primary" data-act="submit" data-id="' + c.id + '">提交审核</button>';
    }
    if (c.status === Store.STATUS.rejected) {
      acts += '<button class="btn" data-act="enable-draft" data-id="' + c.id + '">恢复草稿</button>';
    }
    return '<div class="cs-row">' +
      '<div class="cs-cover"><img src="' + esc(c.cover) + '" alt="" /></div>' +
      '<div class="cs-info">' +
        '<div class="cs-title">' + esc(c.name) + badge +
          ' <span class="muted" style="font-size:12px;font-weight:400">' + esc(c.term || "") + "</span>" +
          " " + Proto.shelfTag(st) + "</div>" +
        '<div class="cs-desc">' + esc(c.intro || "") + "</div>" +
        '<div class="cs-stats">' +
          "<span>讲师 " + Teachers.avatarHtml(c.teacherId, { size: 22 }) + " <b>" + esc(Store.teacherName(c)) + "</b></span>" +
          "<span>标签 " + Tags.labelsHtml(c.tagIds) + "</span>" +
          "<span>关联商品 <b>" + Goods.listByContent(c.id).length + "</b></span>" +
          "<span>总时长 <b>" + Store.durationSummary(c) + "</b></span>" +
          "<span>章节 <b>" + Store.chapterCount(c) + "</b></span>" +
          "<span>观看 <b>" + (c.views || 0) + "</b></span>" +
        "</div>" +
      "</div>" +
      '<div class="cs-actions">' + acts + "</div>" +
    "</div>";
  }).join("") || '<div class="muted" style="padding:32px;text-align:center;border:1px dashed #e8e8e8;border-radius:8px">暂无线上课</div>';
}

document.getElementById("btn-query").addEventListener("click", render);document.getElementById("btn-reset").addEventListener("click", function () {
  document.getElementById("f-kw").value = "";
  document.getElementById("f-teacher").value = "";
  document.getElementById("f-badge").value = "";
  document.getElementById("f-status").value = "";
  tagFilter.clear();
  render();
});

document.getElementById("list").addEventListener("click", function (e) {
  var btn = e.target.closest("[data-act]");
  if (!btn) return;
  var id = btn.getAttribute("data-id");
  var act = btn.getAttribute("data-act");
  if (act === "submit") {
    var r = Store.submitAudit(id);
    Proto.toast(r.ok ? "已提交平台审核" : r.msg);
  } else if (act === "disable") {
    Store.setStatus(id, Store.STATUS.disabled);
    Proto.toast("已下架");
  } else if (act === "enable") {
    var r2 = Store.enableDirect(id);
    Proto.toast(r2 && r2.ok === false ? (r2.msg || "上架失败") : "已上架");
  } else if (act === "enable-draft") {
    Store.setStatus(id, Store.STATUS.draft);
    Proto.toast("已恢复为草稿");
  }
  render();
});

/* 待补建商品提示（v3 迁移遗留：内容旧价尚无关联商品） */
(function () {
  var need = Store.listNeedingGoods();
  var el = document.getElementById("legacy-banner");
  if (!need.length) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.innerHTML = '<div class="card" style="border-color:#ffd591;background:#fff7e6"><div class="card-bd" style="padding:12px 16px">' +
    '<b style="color:#ad6800">有 ' + need.length + ' 个内容待补建商品</b>' +
    '<div style="font-size:12px;color:#ad6800;margin-top:4px;line-height:1.7">内容已不再承载价格，以下内容在旧版本中带有价格但尚无关联商品，无法上架售卖：' +
    need.map(function (c) {
      return '<a href="content-video-edit.html?id=' + encodeURIComponent(c.id) + '">' + esc(c.name) + "（原 ¥" + c._legacyPrice + '）</a>';
    }).join("、") +
    '。请进入内容编辑页的「关联商品」页签补建商品。</div></div></div>';
})();

render();
</script>
</body>
</html>
