<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>店铺设置 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/assess.css?v=3" />
</head>
<body class="admin-body" data-module="trade" data-nav="mp-settings" data-title="店铺设置" data-crumb="交易 / 店铺运营 / 店铺设置">

<div id="header-actions">
  <button class="btn" onclick="window.open('../miniprogram/home.html','_blank')">预览 C 端</button>
  <button class="btn btn-primary" id="btn-save">保存设置</button>
</div>

<div id="page-content" style="display:none">
  <div class="as-banner">店铺级基础信息，仅保留 C 端真实承载的配置项。<b>已按端侧实际结构调整：</b>「搜索热词」因 C 端无搜索框已移除；「支付成功页文案」移至 <a href="mp-pay.html">支付结果页</a>；「课程试看策略」移入 <a href="mp-course.html">课程与学习页</a>。</div>

  <!-- 店铺信息 -->
  <div class="card" style="margin-bottom:14px">
    <div class="card-hd"><h2>店铺信息</h2><span class="muted" style="margin-left:10px">对应 C 端小程序顶部店铺标识与私域承接入口</span></div>
    <div class="card-bd">
      <div class="form-grid">
        <div class="field"><label>店铺名称 *</label><input class="input" id="s-name" value="星启家庭教育" maxlength="12" /><div class="muted">展示在 C 端各页面顶部导航栏（首页为「星启家庭教育」），2-12 个字符</div></div>
        <div class="field"><label>客服企微</label><input class="input" id="s-kf" value="星启小助手（qixiao-01）" /><div class="muted">用于 C 端「添加老师企业微信」（我的页）按钮，点击后唤起企微</div></div>
      </div>
      <div class="muted" style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--color-border)">
        端侧当前未展示店铺 Logo 与店铺简介，相关字段已移除；待 C 端页面支持展示后可再行开放。
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/admin-shell.js?v=14"></script>
<script>
document.getElementById("btn-save").onclick = function(){
  if (!document.getElementById("s-name").value.trim()) { Proto.toast("请填写店铺名称"); return; }
  Proto.toast("店铺设置已保存，C 端即时生效（演示）");
};
</script>
</body>
</html>
