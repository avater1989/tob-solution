<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文章 · 艺博 To-B</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=17" />
<style>
.ca-list { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; overflow: hidden; }
.ca-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-bottom: 1px solid #f0f0f0;
  transition: background .12s;
}
.ca-row:last-child { border-bottom: 0; }
.ca-row:hover { background: #fafbff; }
.ca-cover {
  width: 96px; height: 64px; border-radius: 6px; flex-shrink: 0;
  background: #f2f3f5; overflow: hidden;
}
.ca-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ca-info { flex: 1; min-width: 0; }
.ca-title {
  font-size: 14px; font-weight: 500; color: #1d2129;
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 10px;
}
.ca-meta {
  font-size: 12px; color: #8c8c8c;
  display: flex; gap: 14px; flex-wrap: wrap;
}
.ca-meta b { color: #595959; font-weight: 500; }
.ca-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.ca-goods { color: var(--color-primary); text-decoration: none; }
.ca-goods:hover { text-decoration: underline; }
</style>
</head>
<body class="admin-body" data-module="content" data-nav="content-article" data-title="文章" data-crumb="内容 / 内容资产 / 文章">

<div id="header-actions">
  <a class="btn btn-primary" href="content-article-edit.html">+ 新增图文</a>
</div>

<div id="page-content" style="display:none">
  <div class="card" style="margin-bottom:14px"><div class="card-bd" style="padding:12px 16px">
    <div class="toolbar" style="border:none;padding:0;background:transparent">
      <input class="input" type="text" id="ca-keyword" placeholder="搜索图文名称或简介..." style="width:240px" />
      <div id="ca-tag" style="width:200px;display:inline-block;vertical-align:middle"></div>
      <select class="input" id="ca-status" style="width:140px">
        <option value="">全部上下架</option><option>已上架</option><option>已下架</option>
      </select>
      <button class="btn btn-primary">查询</button>
      <button class="btn">重置</button>
    </div>
  </div></div>

  <div class="ca-list" id="ca-list"></div>

  <div style="display:flex;align-items:center;gap:8px;margin-top:16px">
    <span style="color:#8c8c8c;font-size:12px">共 <b id="ca-count">3</b> 条</span>
    <div style="margin-left:auto;display:flex;gap:6px">
      <button class="btn" disabled>上一页</button>
      <button class="btn btn-primary">1</button>
      <button class="btn" disabled>下一页</button>
    </div>
  </div>
</div>

<!-- 弹窗遮罩 -->
<div class="proto-mask" id="mask"></div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/content-tags.js?v=3"></script>
<script src="../assets/js/goods-store.js?v=2"></script>
<script src="../assets/js/share-modal.js?v=1"></script>
<script src="../assets/js/admin-shell.js?v=28"></script>
<script>
setTimeout(function() {
  if (document.documentElement.getAttribute('data-shell-ready') === '1') return;
  if (document.querySelector('aside.sidebar')) return;
  var err = document.createElement('div');
  err.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fff1f0;color:#f53f3f;padding:12px 20px;border-bottom:1px solid #ffa39e;z-index:99999;font-size:13px;font-family:system-ui;';
  err.innerHTML = '<b>⚠ 页面初始化失败</b>：请按 <kbd style="background:#fff;padding:2px 6px;border-radius:3px;border:1px solid #ffa39e;font-family:monospace;">Ctrl+Shift+R</kbd> 强制刷新';
  document.body.appendChild(err);
}, 1500);

var ARTICLES = [
  { id: "A001", title: "9 月新学期家长指南", cover: "../assets/img/covers/term.jpg",
    author: "编辑部", tagIds: ["TG04"], date: "2026-08-25", reads: 2340, words: 1280,
    status: "已上架", onShelf: true },
  { id: "A002", title: "孩子注意力训练方法论", cover: "../assets/img/covers/focus.jpg",
    author: "张老师", tagIds: ["TG06", "TG04"], date: "2026-08-30", reads: 1560, words: 980,
    status: "已上架", onShelf: true },
  { id: "A003", title: "家庭情绪急救指南", cover: "../assets/img/covers/emotion.jpg",
    author: "李老师", tagIds: ["TG03", "TG01"], date: "—", reads: 0, words: 320,
    status: "已下架", onShelf: false }
];

var filterTagIds = [];
var filterStatus = "";
var filterKeyword = "";
var Tags = window.ContentTags;
var Goods = window.GoodsStore;
if (Goods.ensureDemoGoods) Goods.ensureDemoGoods();

var tagFilter = Tags.mountTreeSelect("#ca-tag", {
  placeholder: "内容标签（可多选）",
  compact: true,
  width: "200px",
  onChange: function (ids) { filterTagIds = ids; renderList(); }
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

function filteredArticles() {
  return ARTICLES.filter(function(a) {
    if (filterTagIds.length) {
      var ids = a.tagIds || [];
      if (!filterTagIds.some(function (t) { return ids.indexOf(t) >= 0; })) return false;
    }
    if (filterStatus && a.status !== filterStatus) return false;
    if (filterKeyword && a.title.toLowerCase().indexOf(filterKeyword.toLowerCase()) === -1) return false;
    return true;
  });
}

function renderList() {
  var html = filteredArticles().map(function(a) {
    return '' +
      '<div class="ca-row">' +
        '<div class="ca-cover"><img src="' + a.cover + '" alt="" /></div>' +
        '<div class="ca-info">' +
          '<div class="ca-title">' + esc(a.title) +
            Tags.labelsHtml(a.tagIds) +
            Proto.shelfTag(a.status) +
          '</div>' +
          '<div class="ca-meta">' +
            '<span><b>ID:</b> ' + esc(a.id) + '</span>' +
            '<span><b>作者:</b> ' + esc(a.author) + '</span>' +
            '<span><b>上架:</b> ' + esc(a.date) + '</span>' +
            '<span><b>阅读:</b> ' + a.reads.toLocaleString() + '</span>' +
            '<span><b>字数:</b> ' + a.words.toLocaleString() + '</span>' +
            '<a class="ca-goods" href="#" data-goods-of="' + a.id + '"><b>关联商品:</b> ' + Goods.listByContent(a.id).length + '</a>' +
          '</div>' +
        '</div>' +
        '<div class="ca-actions">' +
          '<button class="btn" data-share="' + a.id + '" data-phase2-only="1"' + (a.onShelf ? '' : ' disabled') + '>分享设置</button>' +
          '<a class="btn" href="content-article-detail.html?id=' + a.id + '">查看</a>' +
          (a.onShelf
            ? '<button class="btn" data-shelf-off="' + a.id + '">下架</button>'
            : '<a class="btn btn-primary" href="content-article-edit.html?id=' + a.id + '">编辑</a>' +
              '<button class="btn" data-shelf-on="' + a.id + '">上架</button>') +
        '</div>' +
      '</div>';
  }).join("");
  document.getElementById("ca-list").innerHTML = html;
  document.getElementById("ca-count").textContent = filteredArticles().length;
}

var mask = document.getElementById("mask");
function closeAll() {
  mask.classList.remove("open");
  document.querySelectorAll(".proto-modal").forEach(function(n) { n.classList.remove("open"); });
}
function openShare(id) {
  var a = ARTICLES.find(function(x){ return x.id === id; });
  XiboShare.open({ type: "图文", url: "https://yibo.app/a/" + id, cover: a ? a.cover : "", name: a ? a.title : "", desc: "" });
}
document.addEventListener("click", function(e) {
  /* 关联商品：点击跳到商品列表并按当前内容筛选；无商品时提示 */
  var goods = e.target.closest("[data-goods-of]");
  if (goods) {
    e.preventDefault();
    var cid = goods.getAttribute("data-goods-of");
    if (!Goods.listByContent(cid).length) { Proto.toast("还没有商品"); return; }
    location.href = "goods.html?content_id=" + encodeURIComponent(cid);
    return;
  }
  var share = e.target.closest("[data-share]");
  if (share && !share.disabled) {
    openShare(share.getAttribute("data-share"));
    return;
  }
  var off = e.target.closest("[data-shelf-off]");
  if (off) {
    var a = ARTICLES.find(function(x){ return x.id === off.getAttribute("data-shelf-off"); });
    if (a) { a.onShelf = false; a.status = "已下架"; renderList(); Proto.toast("已下架"); }
    return;
  }
  var on = e.target.closest("[data-shelf-on]");
  if (on) {
    var a2 = ARTICLES.find(function(x){ return x.id === on.getAttribute("data-shelf-on"); });
    if (a2) { a2.onShelf = true; a2.status = "已上架"; renderList(); Proto.toast("已上架"); }
    return;
  }
});
mask && mask.addEventListener("click", closeAll);
document.querySelectorAll("[data-close]").forEach(function(b) { b.addEventListener("click", closeAll); });

// 内容标签树状多选筛选
document.getElementById("ca-status").addEventListener("change", function(){ filterStatus = this.value; renderList(); });
document.getElementById("ca-keyword").addEventListener("input", function(){ filterKeyword = this.value.trim(); renderList(); });
var caQuery = document.getElementById("ca-query");
if (caQuery) caQuery.addEventListener("click", renderList);

function tryRender() {
  if (document.getElementById("page-content").style.display !== "none") renderList();
  else setTimeout(tryRender, 80);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tryRender);
else tryRender();
</script>
</body>
</html>
