<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>系列课详情 · 艺博 To-B</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/content-mgmt.css?v=4" />
</head>
<body class="admin-body" data-module="content" data-nav="content-series" data-title="系列课详情" data-crumb="内容 / 内容管理 / 系列课 / 详情">

<div id="header-actions">
  <button class="btn" id="btn-share">分享</button>
  <a class="btn" id="btn-outline" href="content-series-outline.html">查看目录</a>
  <a class="btn btn-primary" id="btn-edit" href="content-series-edit.html">编辑</a>
</div>

<div id="page-content" style="display:none">
  <a class="cm-back" href="content-series.html">← 返回系列课列表</a>

  <div id="cs-from-banner" class="card" style="display:none;margin-bottom:12px"><div class="card-bd" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <span style="font-size:13px">来自用户权益</span>
    <a class="btn btn-sm btn-primary" id="cs-back-rights" href="users.html">返回用户权益</a>
  </div></div>

  <div id="cs-empty" class="card" style="display:none"><div class="card-bd" style="padding:48px;text-align:center">
    <p style="font-size:15px;margin:0 0 16px">未找到课程</p>
    <a class="btn" href="content-series.html">返回系列课列表</a>
  </div></div>

  <div id="cs-found">
  <div class="cm-page-hd">
    <div>
      <h1 id="d-name">—</h1>
      <p class="sub">系列课详情</p>
    </div>
  </div>

  <div class="cm-hero">
    <div class="cm-avatar" id="d-avatar">课</div>
    <div class="cm-hero-bd">
      <div class="cm-hero-title">
        <span id="d-name2">—</span>
        <span class="cm-pill" id="d-source">自建</span>
        <span class="cm-pill" id="d-shelf">—</span>
      </div>
      <div class="cm-hero-desc" id="d-desc">—</div>
    </div>
  </div>

  <div class="cm-section">
    <div class="cm-section-hd"><h2>内容信息</h2></div>
    <div class="cm-dl">
      <div class="item"><span class="k">内容类型</span><span class="v">系列课</span></div>
      <div class="item"><span class="k">内容分类</span><span class="v" id="d-cat">—</span></div>
      <div class="item"><span class="k">内容摘要</span><span class="v" id="d-summary">—</span></div>
      <div class="item"><span class="k">更新时间</span><span class="v" id="d-updated">—</span></div>
      <div class="item"><span class="k">讲师</span><span class="v" id="d-teacher">—</span></div>
      <div class="item"><span class="k">总时长</span><span class="v" id="d-duration">—</span></div>
      <div class="item"><span class="k">关联商品</span><span class="v" id="d-goods">—</span></div>
    </div>
  </div>

  <div class="cm-section" id="d-reject-sec" style="display:none">
    <div class="cm-section-hd"><h2>驳回信息</h2></div>
    <p id="d-reject" style="margin:0;color:#f53f3f;font-size:13px"></p>
  </div>

  <div class="cm-section">
    <div class="cm-section-hd">
      <h2>系列课目录</h2>
      <a class="btn btn-primary" id="d-outline-link" href="#">查看目录</a>
    </div>
    <div id="d-outline-preview" style="font-size:13px;color:#595959"></div>
  </div>
  </div>
</div>

<div class="proto-mask" id="mask"></div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/share-modal.js?v=1"></script>
<script src="../assets/js/series-store.js?v=1"></script>
<script src="../assets/js/admin-shell.js?v=15"></script>
<script>
var Store = window.SeriesStore;
var ALIASES = {
  CS_TRAIN: "S002",
  "训练营主课": "S002",
  "引流体验课": "S003"
};

var q = new URLSearchParams(location.search);
var rawId = q.get("id") || q.get("courseId") || "";
var id = ALIASES[rawId] || rawId || "";
var d = Store.get(id);

var from = q.get("from") || "";
var userId = q.get("user") || "";
var returnTo = "";
try {
  returnTo = q.get("returnTo") || q.get("return_to") || "";
  if (returnTo) { try { returnTo = decodeURIComponent(returnTo); } catch (eRt) {} }
} catch (eQ) {}

if (from === "user" || userId) {
  var banner = document.getElementById("cs-from-banner");
  var back = document.getElementById("cs-back-rights");
  if (banner) banner.style.display = "";
  if (back) {
    back.href = "user-detail.html?id=" + encodeURIComponent(userId || "") + "&tab=rights" +
      (returnTo ? "&returnTo=" + encodeURIComponent(returnTo) : "");
  }
}

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }

function apply() {
  var label = Store.STATUS_LABEL[d.status] || d.status;
  document.getElementById("d-name").textContent = d.name;
  document.getElementById("d-name2").textContent = d.name;
  document.getElementById("d-avatar").textContent = d.name.charAt(0);
  document.getElementById("d-desc").textContent = d.intro;
  document.getElementById("d-cat").textContent = d.cat;
  document.getElementById("d-summary").textContent = Store.chapterCount(d) + " 章 · " + Store.chapterCount(d) + " 视频";
  document.getElementById("d-updated").textContent = d.updatedAt || "—";
  document.getElementById("d-teacher").textContent = d.teacher || "—";
  document.getElementById("d-duration").textContent = Store.durationSummary(d);
  document.getElementById("d-goods").textContent = d.goodsId || "未绑定";
  document.getElementById("d-shelf").textContent = label;
  document.getElementById("d-shelf").className = "cm-pill" + (d.status === Store.STATUS.enabled ? "" : " off");
  document.getElementById("d-source").textContent = d.source === "platform" ? "平台" : "自建";

  if (d.status === Store.STATUS.rejected && d.rejectReason) {
    document.getElementById("d-reject-sec").style.display = "";
    document.getElementById("d-reject").textContent = d.rejectReason;
  }

  var outlineHref = "content-series-outline.html?id=" + encodeURIComponent(id);
  document.getElementById("d-outline-link").href = outlineHref;
  document.getElementById("btn-outline").href = outlineHref;
  document.getElementById("btn-edit").href = "content-series-edit.html?id=" + encodeURIComponent(id);
  if (!Store.canEditContent(d)) {
    document.getElementById("btn-edit").textContent = "查看编辑页";
  }

  var preview = (d.chapters || []).map(function(ch, i) {
    return '<div style="padding:8px 0;border-bottom:1px solid #f3f4f6">' +
      (i + 1) + ". " + esc(ch.title) + " · " + esc(ch.videoName) +
      (ch.trial ? ' <span style="color:#165dff">试看</span>' : "") +
      "</div>";
  }).join("");
  document.getElementById("d-outline-preview").innerHTML = preview || '<span style="color:#bfbfbf">暂无章节</span>';
}

var emptyEl = document.getElementById("cs-empty");
var foundEl = document.getElementById("cs-found");
if (!d) {
  if (emptyEl) emptyEl.style.display = "";
  if (foundEl) foundEl.style.display = "none";
  document.getElementById("btn-share").style.display = "none";
  document.getElementById("btn-outline").style.display = "none";
  document.getElementById("btn-edit").style.display = "none";
} else {
  if (emptyEl) emptyEl.style.display = "none";
  if (foundEl) foundEl.style.display = "";
  apply();
}

document.getElementById("btn-share").addEventListener("click", function(){
  if (!d) return;
  XiboShare.open({
    type: "系列课",
    url: "https://yibo.app/s/" + id,
    cover: d.cover,
    name: d.shareTitle || d.name,
    desc: d.shareDesc || d.intro
  });
});
</script>
</body>
</html>
