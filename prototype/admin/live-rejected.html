<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>内部复核记录 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
</head>
<body class="admin-body" data-module="live" data-nav="live-rejected" data-title="内部复核记录" data-crumb="直播 / 内部复核 / 内部复核记录">
<div id="header-actions">
  <button class="btn" id="btn-refresh">刷新</button>
  <a class="btn btn-primary" href="live-edit.html">+ 新建直播</a>
</div>
<div id="page-content" style="display:none">

  <!-- 顶部 3 个统计卡片 -->
  <div class="stat-cards" style="margin-bottom:8px">
    <div class="stat-card">
      <div class="stat-label">累计内部驳回</div>
      <div class="stat-value" id="stat-total" style="color:#f53f3f">0</div>
      <div class="stat-hint">含历史日志</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">当前驳回中</div>
      <div class="stat-value" id="stat-current">0</div>
      <div class="stat-hint">待修改重提</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">驳回后重新提交率</div>
      <div class="stat-value" style="color:#00b42a">—</div>
      <div class="stat-hint">以 ProtoBiz 日志为准</div>
    </div>
  </div>

  <!-- 筛选 -->
  <div class="card" style="margin-bottom:8px"><div class="card-bd">
    <div class="form-grid" style="grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 12px">
      <input id="f-name" placeholder="请输入直播名称" />
      <select id="f-course">
        <option value="">全部课程</option>
        <option>店铺课程</option>
        <option>转播课程</option>
      </select>
      <select id="f-auditor">
        <option value="">全部审核人</option>
        <option>刘管理</option>
        <option>李管理</option>
        <option>王管理</option>
      </select>
      <select id="f-dimension">
        <option value="">驳回维度</option>
        <option>内容合规</option>
        <option>主讲资质</option>
        <option>商品合规</option>
        <option>直播间设置</option>
      </select>
      <select id="f-status">
        <option value="">处理状态</option>
        <option value="current">当前驳回中</option>
        <option value="history">历史记录</option>
      </select>
      <select id="f-date">
        <option value="">全部时间</option>
        <option>今日</option>
        <option>近 7 天</option>
        <option>近 30 天</option>
      </select>
    </div>
    <div class="toolbar" style="margin-top:8px">
      <button class="btn btn-primary" id="btn-query">查询</button>
      <button class="btn" id="btn-reset">重置</button>
      <div class="spacer"></div>
      <button class="btn" id="btn-export">导出</button>
    </div>
  </div></div>

  <!-- 表格 -->
  <div class="card"><div class="card-bd" style="padding:0">
    <table class="data">
      <thead>
        <tr>
          <th>直播名称</th><th>关联课程</th><th>模式</th>
          <th>主讲老师</th><th>开始时间</th>
          <th>驳回人</th><th>驳回时间</th>
          <th>驳回维度</th>
          <th>处理状态</th>
          <th style="width:200px">操作</th>
        </tr>
      </thead>
      <tbody id="rej-tbody"></tbody>
    </table>
  </div></div>

  <!-- 分页 -->
  <div class="toolbar" style="margin-top:8px">
    <span class="muted" id="rej-count">共 <b>0</b> 条</span>
    <div class="spacer"></div>
    <select><option>10条/页</option><option>20条/页</option><option>50条/页</option></select>
    <button class="btn btn-sm" disabled>上一页</button>
    <button class="btn btn-sm" disabled>1</button>
    <button class="btn btn-sm" disabled>下一页</button>
  </div>

</div>

<!-- ============ 抽屉 ============ -->
<div class="proto-mask" id="mask"></div>

<div class="proto-drawer" id="drawer-reject">
  <div class="proto-drawer-hd">
    <h3 id="dr-title">驳回详情</h3>
    <button class="btn btn-sm btn-ghost" data-close>×</button>
  </div>
  <div class="proto-drawer-bd">
    <h4 style="margin-bottom:8px">直播信息</h4>
    <div class="form-grid readonly" style="grid-template-columns:1fr 1fr;margin-bottom:16px">
      <div class="field"><label>直播名称</label><div id="dr-name">—</div></div>
      <div class="field"><label>关联课程</label><div id="dr-course">—</div></div>
      <div class="field"><label>主讲老师</label><div id="dr-teacher">—</div></div>
      <div class="field"><label>开始时间</label><div id="dr-start">—</div></div>
    </div>

    <h4 style="margin-bottom:8px">本次驳回</h4>
    <div class="form-grid readonly" style="grid-template-columns:1fr 1fr;margin-bottom:16px">
      <div class="field"><label>驳回人</label><div id="dr-auditor">—</div></div>
      <div class="field"><label>驳回时间</label><div id="dr-time">—</div></div>
      <div class="field" style="grid-column:1/-1"><label>驳回维度</label>
        <div id="dr-dims" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      </div>
      <div class="field" style="grid-column:1/-1"><label>驳回理由</label>
        <div id="dr-reason" style="background:#fff5f5;border:1px solid #ffccc7;border-radius:4px;padding:12px;color:#cf1322"></div>
      </div>
    </div>

    <h4 style="margin-bottom:8px">修改建议</h4>
    <div id="dr-suggest" style="background:#f7f8fa;border:1px solid var(--color-border);border-radius:4px;padding:12px;color:#4e5969;font-size:13px;line-height:22px"></div>

    <h4 style="margin:16px 0 8px">处理记录</h4>
    <div id="dr-history" class="audit-history"></div>
  </div>
  <div class="proto-drawer-ft">
    <button class="btn" data-close>关闭</button>
    <a class="btn btn-primary" id="dr-edit-link" href="live-edit.html">去编辑</a>
  </div>
</div>

<style>
.stat-cards {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
}
.stat-card {
  background: #fff; border: 1px solid var(--color-border);
  border-radius: 8px; padding: 14px 18px;
}
.stat-label { font-size: 13px; color: var(--color-text-muted); margin-bottom: 6px; }
.stat-value { font-size: 24px; font-weight: 700; color: var(--color-text); line-height: 1.2; }
.stat-hint  { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }
.stat-hint .up   { color: #00b42a; margin-right: 4px; }
.stat-hint .down { color: #f53f3f; margin-right: 4px; }

.form-grid.readonly .field > div {
  padding: 6px 0; color: var(--color-text); font-size: 13px;
}

.audit-badge {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: 12px; line-height: 18px; font-weight: 500;
}
.audit-approved { background: #e8f5e9; color: #00b42a; }
.audit-rejected { background: #fff1f0; color: #cf1322; }
.audit-pending  { background: #fff7e6; color: #d48806; border: 1px solid #ffd591; }

.audit-tag {
  display: inline-block; padding: 2px 10px; border-radius: 4px;
  font-size: 12px; line-height: 20px;
}
.audit-tag.pass { background: #e8f5e9; color: #00b42a; }
.audit-tag.fail { background: #fff1f0; color: #cf1322; }

.row-actions a { margin-right: 8px; }

.audit-history { display: flex; flex-direction: column; gap: 12px; }
.audit-history-item { display: flex; gap: 10px; position: relative; }
.audit-history-item:not(:last-child)::before {
  content: ""; position: absolute; left: 5px; top: 18px; bottom: -12px;
  width: 1px; background: var(--color-border);
}
.audit-history-dot {
  width: 12px; height: 12px; border-radius: 50%;
  flex-shrink: 0; margin-top: 4px; border: 2px solid #fff;
  box-shadow: 0 0 0 1px var(--color-border);
}
.dot-submit   { background: #165dff; }
.dot-rejected { background: #f53f3f; }
.dot-edit     { background: #faad14; }
.dot-approved { background: #00b42a; }
.audit-history-bd { flex: 1; min-width: 0; }
.audit-history-title { font-size: 13px; font-weight: 500; }
.audit-history-meta  { font-size: 12px; color: var(--color-text-muted); }
.audit-history-reason {
  margin-top: 4px; font-size: 12px; padding: 6px 8px;
  background: #fff5f5; border-radius: 3px; color: #4e5969;
}
</style>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/prototype-business-store.js"></script>
<script src="../assets/js/admin-shell.js?v=13"></script>
<script>
(function () {
  var Biz = window.ProtoBiz;
  var rowsCache = [];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function buildRows() {
    var lives = Biz.getLives() || [];
    var logs = (Biz.getReviewLogs() || []).filter(function (r) {
      return r.status === "internal_rejected";
    });
    var byLive = {};
    lives.forEach(function (l) { byLive[l.id] = l; });

    var rows = [];
    var seen = {};

    lives.filter(function (l) { return l.auditStatus === "internal_rejected"; }).forEach(function (l) {
      rows.push({
        liveId: l.id,
        name: l.name,
        startAt: l.startAt,
        auditor: "刘管理",
        time: l.internalApprovedAt || Biz.DEMO_NOW,
        reason: l.rejectReason || "内部复核驳回",
        current: true
      });
      seen[l.id] = true;
    });

    logs.slice().reverse().forEach(function (r) {
      if (seen[r.liveId]) return;
      var live = byLive[r.liveId];
      rows.push({
        liveId: r.liveId,
        name: live ? live.name : r.liveId,
        startAt: live ? live.startAt : "—",
        auditor: r.by || "刘管理",
        time: r.at || "—",
        reason: r.reason || "内部复核驳回",
        current: !!(live && live.auditStatus === "internal_rejected")
      });
      seen[r.liveId] = true;
    });

    return rows;
  }

  function render() {
    var kw = (document.getElementById("f-name").value || "").trim();
    var st = document.getElementById("f-status").value;
    rowsCache = buildRows().filter(function (r) {
      if (kw && r.name.indexOf(kw) < 0 && String(r.liveId).indexOf(kw) < 0) return false;
      if (st === "current" && !r.current) return false;
      if (st === "history" && r.current) return false;
      return true;
    });

    var currentCount = buildRows().filter(function (r) { return r.current; }).length;
    var totalLogs = (Biz.getReviewLogs() || []).filter(function (r) { return r.status === "internal_rejected"; }).length;
    document.getElementById("stat-total").textContent = String(Math.max(totalLogs, rowsCache.length));
    document.getElementById("stat-current").textContent = String(currentCount);
    document.getElementById("rej-count").innerHTML = "共 <b>" + rowsCache.length + "</b> 条";

    var tbody = document.getElementById("rej-tbody");
    if (!rowsCache.length) {
      tbody.innerHTML = '<tr><td colspan="10" class="muted" style="text-align:center;padding:24px">暂无内部复核驳回记录</td></tr>';
      return;
    }
    tbody.innerHTML = rowsCache.map(function (r, idx) {
      return "<tr data-idx=\"" + idx + "\">" +
        '<td><a href="live-audit-detail.html?live_id=' + encodeURIComponent(r.liveId) + '" class="link-blue">' + esc(r.name) + "</a>" +
        '<div class="muted" style="font-size:11px">' + esc(r.liveId) + "</div></td>" +
        "<td>" + esc(r.name) + "</td><td>视频直播</td><td>阮荣均</td>" +
        "<td>" + esc(r.startAt || "—") + "</td>" +
        "<td>" + esc(r.auditor) + "</td><td>" + esc(r.time) + "</td>" +
        '<td><span class="audit-tag fail">内容合规 ✕</span></td>' +
        '<td><span class="audit-badge ' + (r.current ? "audit-rejected" : "audit-pending") + '">' +
        (r.current ? "未重新提交" : "历史驳回") + "</span></td>" +
        '<td class="row-actions">' +
          '<a href="#" data-row-act="view-reason">查看驳回理由</a>' +
          (r.current
            ? '<a href="live-edit.html?live_id=' + encodeURIComponent(r.liveId) + '">去编辑</a>'
            : '<a href="live-audit-detail.html?live_id=' + encodeURIComponent(r.liveId) + '">查看进度</a>') +
        "</td></tr>";
    }).join("");

    tbody.querySelectorAll("[data-row-act=view-reason]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        var idx = Number(a.closest("tr").getAttribute("data-idx"));
        var r = rowsCache[idx];
        if (!r) return;
        document.getElementById("dr-title").textContent = "驳回详情 · " + r.name;
        document.getElementById("dr-name").textContent = r.name;
        document.getElementById("dr-course").textContent = r.name;
        document.getElementById("dr-teacher").textContent = "阮荣均";
        document.getElementById("dr-start").textContent = r.startAt || "—";
        document.getElementById("dr-auditor").textContent = r.auditor;
        document.getElementById("dr-time").textContent = r.time;
        document.getElementById("dr-dims").innerHTML = '<span class="audit-tag fail">内容合规 ✕</span>';
        document.getElementById("dr-reason").textContent = r.reason;
        document.getElementById("dr-suggest").textContent = "请按驳回理由修改后重新提交内部复核。";
        document.getElementById("dr-edit-link").href = "live-edit.html?live_id=" + encodeURIComponent(r.liveId);
        var histLogs = Biz.getReviewLogs(r.liveId);
        document.getElementById("dr-history").innerHTML = histLogs.length
          ? histLogs.slice().reverse().map(function (h) {
              return '<div class="audit-history-item"><div class="audit-history-dot ' +
                (h.status.indexOf("reject") >= 0 ? "dot-rejected" : "dot-submit") + '"></div>' +
                '<div class="audit-history-bd"><div class="audit-history-title">' +
                esc((Biz.AUDIT_LABEL && Biz.AUDIT_LABEL[h.status]) || h.status) + "</div>" +
                '<div class="audit-history-meta">' + esc((h.by || "") + " · " + (h.at || "")) + "</div>" +
                (h.reason ? '<div class="audit-history-reason">' + esc(h.reason) + "</div>" : "") +
                "</div></div>";
            }).join("")
          : '<p class="muted">暂无记录</p>';
        open(document.getElementById("drawer-reject"));
      });
    });
  }

  var mask = document.getElementById("mask");
  function closeAll() {
    mask.classList.remove("open");
    document.querySelectorAll(".proto-modal, .proto-drawer").forEach(function (n) { n.classList.remove("open"); });
  }
  function open(node) { mask.classList.add("open"); node.classList.add("open"); }
  mask.addEventListener("click", closeAll);
  document.querySelectorAll("[data-close]").forEach(function (n) { n.addEventListener("click", closeAll); });

  document.getElementById("btn-refresh").addEventListener("click", function () { location.reload(); });
  document.getElementById("btn-export").addEventListener("click", function () { Proto.toast("已导出（原型）"); });
  document.getElementById("btn-query").addEventListener("click", render);
  document.getElementById("btn-reset").addEventListener("click", function () {
    document.getElementById("f-name").value = "";
    ["f-course","f-auditor","f-dimension","f-status","f-date"].forEach(function (id) { document.getElementById(id).value = ""; });
    render();
    Proto.toast("已重置");
  });

  render();
})();
</script>
</body>
</html>
