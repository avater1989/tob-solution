<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>定制化计划 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/assess.css?v=3" />
</head>
<body class="admin-body" data-module="content" data-nav="assess-plans" data-title="定制化计划" data-crumb="商家管理后台 / 内容 / 学习服务 / 定制化计划">

<div id="header-actions">
  <button class="btn btn-primary" id="btn-new">+ 新建计划</button>
</div>

<div id="page-content" style="display:none">
  <div class="as-banner">统一结构：<b>计划 → 关卡 → 任务</b>（任务可含线上课 / 测评 / <b>智能体</b>；智能体不单独售卖，只出现在关卡任务中）。两种创建方式写入同一数据结构。下一步：配置关卡 → 配置任务 → 上架 → 创建计划商品。</div>

  <div class="card" style="margin-bottom:14px"><div class="card-bd" style="padding:12px 16px">
    <div class="toolbar" style="border:none;padding:0;background:transparent">
      <input class="input" id="f-q" placeholder="搜索计划名称或描述..." style="width:260px" />
      <select class="input" id="f-status" style="width:130px">
        <option value="">全部状态</option>
        <option>草稿</option><option>已上架</option><option>进行中</option><option>已完成</option><option>已终止</option>
      </select>
      <button class="btn btn-primary" id="btn-query">查询</button>
    </div>
  </div></div>

  <table class="as-table">
    <thead>
      <tr>
        <th>计划名称</th>
        <th>计划描述</th>
        <th style="width:120px">创建方式</th>
        <th style="width:110px">关联商品数</th>
        <th style="width:90px">状态</th>
        <th style="width:320px">操作</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div style="margin-top:12px;font-size:12px;color:#8c8c8c">共 <b id="cnt">0</b> 条</div>
</div>

<div class="proto-modal" id="modal-edit">
  <div style="background:#fff;border-radius:10px;width:560px;max-width:94vw;max-height:88vh;overflow:auto">
    <div class="proto-modal-hd"><h3 style="margin:0;font-size:16px" id="m-title">新建计划</h3><button class="ctrl-icon-btn" data-close>×</button></div>
    <div class="proto-modal-bd">
      <div class="field"><label>计划名称 *</label><input class="input" id="m-name" placeholder="如：亲子沟通 21 天训练营计划" /></div>
      <div class="field"><label>计划描述</label><textarea class="input" id="m-desc" rows="2"></textarea></div>
      <div class="field">
        <label>创建方式 *</label>
        <div>
          <label style="margin-right:14px"><input type="radio" name="m-mode" value="关联测评" checked> 关联测评</label>
          <label><input type="radio" name="m-mode" value="直接选择任务"> 选择任务</label>
        </div>
      </div>
      <div class="field" id="wrap-assess">
        <label>关联测评（可多选）</label>
        <div id="m-assess" style="border:1px solid #e8e8e8;border-radius:6px;padding:10px;max-height:160px;overflow:auto"></div>
      </div>
      <div class="field" id="wrap-direct-hint" style="display:none">
        <div class="as-banner" style="margin:0;background:#f0f5ff;border-color:#bedaff">选择任务：保存后进入「关卡配置」，按关卡添加任务（类型 → 任务 → 权重）。</div>
      </div>
    </div>
    <div class="proto-modal-ft" style="justify-content:flex-end;gap:8px">
      <button class="btn" data-close>取消</button>
      <button class="btn btn-primary" id="btn-save">保存草稿</button>
    </div>
  </div>
</div>

<div class="proto-modal" id="modal-view">
  <div style="background:#fff;border-radius:10px;width:560px;max-width:94vw;max-height:88vh;overflow:auto">
    <div class="proto-modal-hd"><h3 style="margin:0;font-size:16px">计划详情</h3><button class="ctrl-icon-btn" data-close>×</button></div>
    <div class="proto-modal-bd" id="view-bd"></div>
    <div class="proto-modal-ft" style="justify-content:flex-end;gap:8px">
      <a class="btn btn-primary" id="view-stages" href="#" style="display:none">去配置关卡</a>
      <button class="btn" data-close>关闭</button>
    </div>
  </div>
</div>

<div class="proto-mask" id="mask"></div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/admin-shell.js?v=25"></script>
<script>
var ASSESS_POOL = ["亲子沟通能力测评","家庭教育风格测评","心理健康测评","情绪调节问卷","新生入学心理系列"];
var PLAN_KEY = "tob_assess_plans_v1";
var STAGES_SEED = {
  MPL1:[{ name:"认知觉察", fileType:"", summary:"", tasks:[{ id:"T3", name:"亲子沟通能力测评", type:"测评", weight:1 }] }],
  MPL2:[
    { name:"学习基础", fileType:"视频", summary:"", tasks:[{ id:"T2", name:"亲子沟通基础 · 第1章", type:"线上课", weight:1 }] },
    { name:"实践应用", fileType:"文档", summary:"", tasks:[{ id:"T5", name:"家庭会议练习", type:"文章", weight:1 }] }
  ],
  PPL1:[{ name:"关卡 1", fileType:"", summary:"", tasks:[{ id:"T3", name:"心理健康测评", type:"测评", weight:1 }] }],
  MPL3:[],
  MPL4:[]
};
var PLANS_SEED = [
  { id:"MPL1", name:"亲子沟通 21 天训练营计划", desc:"测评切入 + 课程学习的组合训练计划", mode:"关联测评", status:"进行中", goods:3, links:["亲子沟通能力测评"], source:"self" },
  { id:"MPL2", name:"家庭教育风格改进计划", desc:"基于教养风格测评结果安排学习任务", mode:"直接选择任务", status:"草稿", goods:0, links:[], source:"self" },
  { id:"PPL1", name:"2025春季心理健康定制化计划", desc:"面向全体学员的春季心理健康评估", mode:"关联测评", status:"进行中", goods:1, links:["心理健康测评"], source:"platform" },
  { id:"MPL3", name:"青春期沟通能力提升计划", desc:"针对 12-16 岁家庭的沟通训练", mode:"关联测评", status:"草稿", goods:0, links:["亲子沟通能力测评","家庭教育风格测评"], source:"self" },
  { id:"MPL4", name:"新手家长引导计划（草稿）", desc:"通过体验课与测评完成新手家长转化", mode:"直接选择任务", status:"草稿", goods:0, links:[], source:"self" }
];

function loadDb() {
  try {
    var raw = localStorage.getItem(PLAN_KEY);
    if (raw) {
      var db = JSON.parse(raw);
      if (db && Array.isArray(db.plans)) return db;
    }
  } catch (e) {}
  return { plans: JSON.parse(JSON.stringify(PLANS_SEED)), stages: JSON.parse(JSON.stringify(STAGES_SEED)) };
}
function saveDb() {
  localStorage.setItem(PLAN_KEY, JSON.stringify({ plans: PLANS, stages: STAGES }));
}
var _db = loadDb();
var PLANS = _db.plans;
var STAGES = _db.stages || {};
var editing = null;

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }
function stTag(s){
  var map={草稿:"gray",已上架:"blue",进行中:"green",已完成:"purple",已终止:"orange"};
  return '<span class="as-tag '+(map[s]||"gray")+'">'+esc(s)+'</span>';
}
function isDraft(s){ return s==="草稿"; }
function canTerminate(s){ return s==="已上架"||s==="进行中"; }

function render(){
  var q=(document.getElementById("f-q").value||"").trim();
  var st=document.getElementById("f-status").value;
  var list=PLANS.filter(function(p){
    if (st && p.status!==st) return false;
    if (q && (p.name+p.desc).indexOf(q)<0) return false;
    return true;
  });
  document.getElementById("cnt").textContent=list.length;
  document.getElementById("tbody").innerHTML = list.map(function(p){
    var acts = '<button class="btn" data-view="'+p.id+'">查看计划</button>';
    if (isDraft(p.status)) {
      acts += '<a class="btn" href="assess-plan-stages.html?id='+p.id+'">配置关卡</a>' +
        '<button class="btn" data-edit="'+p.id+'">编辑计划</button>' +
        '<button class="btn btn-primary" data-pub="'+p.id+'">上架计划</button>' +
        '<button class="btn" style="color:#f53f3f;border-color:#ffa39e" data-del="'+p.id+'">删除计划</button>';
    } else if (p.status === "已上架") {
      acts += '<a class="btn" href="goods-edit.html?create_mode=from_content&content_type=plan&content_id='+encodeURIComponent(p.id)+'&title='+encodeURIComponent(p.name)+'&desc='+encodeURIComponent(p.desc)+'">创建商品</a>' +
        '<button class="btn" data-unpub="'+p.id+'">下架</button>' +
        '<button class="btn" style="color:#f53f3f;border-color:#ffa39e" data-stop="'+p.id+'">终止计划</button>';
    } else if (canTerminate(p.status)) {
      acts += '<a class="btn" href="goods-edit.html?create_mode=from_content&content_type=plan&content_id='+encodeURIComponent(p.id)+'&title='+encodeURIComponent(p.name)+'&desc='+encodeURIComponent(p.desc)+'">创建商品</a>' +
        '<button class="btn" style="color:#f53f3f;border-color:#ffa39e" data-stop="'+p.id+'">终止计划</button>';
    }
    return '<tr>' +
      '<td><div class="as-name">'+esc(p.name)+'</div></td>' +
      '<td><div class="as-desc" style="white-space:normal">'+esc(p.desc)+'</div></td>' +
      '<td><span class="as-tag '+(p.mode==="关联测评"?"blue":"purple")+'">'+esc(p.mode)+'</span></td>' +
      '<td>'+(p.goods ? '<b>'+p.goods+'</b> 个' : '<span class="muted">0 个</span>')+'</td>' +
      '<td>'+stTag(p.status)+'</td>' +
      '<td><div class="as-acts">'+acts+'</div></td></tr>';
  }).join("");
}

var mask = document.getElementById("mask");
function closeAll(){ mask.classList.remove("open"); document.querySelectorAll(".proto-modal").forEach(function(n){n.classList.remove("open");}); }
function openM(mid){ mask.classList.add("open"); document.getElementById(mid).classList.add("open"); }

function syncModeUI(){
  var mode = document.querySelector('input[name="m-mode"]:checked').value;
  var isDirect = mode === "直接选择任务";
  document.getElementById("wrap-assess").style.display = isDirect ? "none" : "";
  document.getElementById("wrap-direct-hint").style.display = isDirect ? "" : "none";
  document.getElementById("btn-save").textContent = isDirect ? "保存并配置关卡" : "保存草稿";
}

function fillChecks(elId, pool, selected){
  selected = selected || [];
  document.getElementById(elId).innerHTML = pool.map(function(n){
    var ck = selected.indexOf(n)>=0 ? " checked" : "";
    return '<label style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px"><input type="checkbox" value="'+esc(n)+'"'+ck+'> '+esc(n)+'</label>';
  }).join("");
}

function stageTaskCount(s) {
  var tasks = s && s.tasks;
  if (!tasks) return 0;
  return tasks.length;
}

function openEdit(pid){
  editing = pid;
  var p = pid ? PLANS.find(function(x){return x.id===pid;}) : null;
  document.getElementById("m-title").textContent = p ? "编辑计划" : "新建计划";
  document.getElementById("m-name").value = p ? p.name : "";
  document.getElementById("m-desc").value = p ? p.desc : "";
  var mode = p ? p.mode : "关联测评";
  document.querySelectorAll('input[name="m-mode"]').forEach(function(r){ r.checked = r.value===mode; });
  fillChecks("m-assess", ASSESS_POOL, p && p.mode==="关联测评" ? p.links : []);
  syncModeUI();
  openM("modal-edit");
}

document.querySelectorAll('input[name="m-mode"]').forEach(function(r){ r.addEventListener("change", syncModeUI); });
document.getElementById("btn-new").onclick = function(){ openEdit(null); };
document.getElementById("btn-query").onclick = render;
document.getElementById("btn-save").onclick = function(){
  var name=document.getElementById("m-name").value.trim();
  if (!name) { Proto.toast("请填写计划名称"); return; }
  var mode=document.querySelector('input[name="m-mode"]:checked').value;
  var desc=document.getElementById("m-desc").value.trim();
  var links = [];
  if (mode === "关联测评") {
    links = Array.from(document.querySelectorAll("#m-assess input:checked")).map(function(c){return c.value;});
    if (!links.length) { Proto.toast("请选择关联测评"); return; }
  }
  var planId = editing;
  if (editing) {
    var p=PLANS.find(function(x){return x.id===editing;});
    p.name=name; p.desc=desc; p.mode=mode; p.links=links;
    if (mode === "直接选择任务" && !STAGES[p.id]) STAGES[p.id] = [];
  } else {
    planId = "MPL"+Date.now().toString().slice(-4);
    PLANS.unshift({ id:planId, name:name, desc:desc, mode:mode, status:"草稿", goods:0, links:links, source:"self" });
    STAGES[planId] = STAGES[planId] || [];
  }
  saveDb();
  closeAll();
  if (mode === "直接选择任务") {
    Proto.toast("草稿已保存，进入关卡配置");
    location.href = "assess-plan-stages.html?id=" + encodeURIComponent(planId);
    return;
  }
  render();
  Proto.toast("草稿已保存");
};

document.addEventListener("click", function(e){
  var view=e.target.closest("[data-view]");
  if (view) {
    var p=PLANS.find(function(x){return x.id===view.getAttribute("data-view");});
    var stages = STAGES[p.id] || [];
    document.getElementById("view-bd").innerHTML =
      '<div class="as-name" style="font-size:16px;margin-bottom:6px">'+esc(p.name)+'</div>' +
      '<div style="font-size:13px;line-height:1.9;margin-bottom:12px">' +
        '<div>当前状态：'+stTag(p.status)+'</div>' +
        '<div>创建方式：'+esc(p.mode)+'</div>' +
      '</div>' +
      '<div class="muted" style="font-size:12px;margin-bottom:4px">计划说明</div>' +
      '<div style="font-size:13px;margin-bottom:14px;line-height:1.6">'+esc(p.desc||"—")+'</div>' +
      '<div class="muted" style="font-size:12px;margin-bottom:6px">'+(p.mode==="关联测评"?"关联测评":"关卡任务（选择任务）")+'</div>' +
      (p.mode==="关联测评"
        ? (p.links||[]).map(function(n){ return '<div class="as-preview-item">'+esc(n)+'</div>'; }).join("") || '<div class="muted">未选择</div>'
        : '') +
      '<div class="muted" style="font-size:12px;margin:14px 0 6px">关卡配置</div>' +
      (stages.length
        ? stages.map(function(s,i){ return '<div class="as-preview-item"><b>'+esc(s.name)+'</b> · '+stageTaskCount(s)+' 个任务'+(i===0?' · 默认解锁':'')+'</div>'; }).join("")
        : '<div class="as-banner" style="margin:0">尚未配置关卡'+(isDraft(p.status)?'，可在草稿态进入「配置关卡」':'')+'</div>');
    var btn = document.getElementById("view-stages");
    if (isDraft(p.status)) {
      btn.style.display = "";
      btn.href = "assess-plan-stages.html?id="+p.id;
    } else {
      btn.style.display = "none";
    }
    openM("modal-view"); return;
  }
  var ed=e.target.closest("[data-edit]"); if (ed) { openEdit(ed.getAttribute("data-edit")); return; }
  var pub=e.target.closest("[data-pub]");
  if (pub) {
    var p2=PLANS.find(function(x){return x.id===pub.getAttribute("data-pub");});
    var st=(STAGES[p2.id]||[]);
    if (!st.length) { Proto.toast("请先配置关卡再上架"); return; }
    p2.status="已上架"; saveDb(); render(); Proto.toast("计划已上架"); return;
  }
  var unpub=e.target.closest("[data-unpub]");
  if (unpub) {
    var pu=PLANS.find(function(x){return x.id===unpub.getAttribute("data-unpub");});
    if (pu) { pu.status="草稿"; saveDb(); render(); Proto.toast("已下架"); }
    return;
  }
  var stop=e.target.closest("[data-stop]");
  if (stop) {
    var p3=PLANS.find(function(x){return x.id===stop.getAttribute("data-stop");});
    p3.status="已终止"; saveDb(); render(); Proto.toast("计划已终止"); return;
  }
  var del=e.target.closest("[data-del]");
  if (del) {
    var pd=PLANS.find(function(x){return x.id===del.getAttribute("data-del");});
    PLANS=PLANS.filter(function(x){return x.id!==pd.id;});
    delete STAGES[pd.id];
    saveDb();
    render(); Proto.toast("已删除"); return;
  }
});
mask.addEventListener("click", closeAll);
document.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeAll); });
render();
</script>
</body>
</html>
