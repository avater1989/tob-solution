<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>编辑线上课 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/content-mgmt.css?v=4" />
</head>
<body class="admin-body" data-module="content" data-nav="content-video" data-title="编辑线上课" data-crumb="内容 / 内容资产 / 线上课 / 编辑">

<div id="header-actions">
  <a class="btn" href="content-video.html">返回列表</a>
  <button class="btn" id="btn-draft">保存草稿</button>
  <button class="btn btn-primary" id="btn-save-chapters">保存并配置章节</button>
</div>

<div id="page-content" style="display:none">
  <a class="cm-back" href="content-video.html">← 返回线上课列表</a>
  <div id="edit-lock" class="cm-alert" style="display:none;margin-bottom:12px"></div>

  <div class="cm-tabs" id="anchors">
    <button class="btn active" data-tab="sec-base">基础信息</button>
    <button class="btn" data-tab="sec-goods">关联商品</button>
    <button class="btn" data-tab="sec-status">状态与分享</button>
  </div>

  <div class="cm-section tab-panel active" id="sec-base">
    <div class="cm-section-hd"><h2>基础信息 <span class="hint">配置完基础字段后继续配置章节</span></h2></div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field" style="grid-column:1/-1">
        <label>课程名称 * <span style="float:right;color:#8c8c8c;font-weight:400" id="name-cnt">0/45</span></label>
        <input class="input" id="f-name" maxlength="45" placeholder="建议 14 字内" />
      </div>
      <div class="field">
        <label>期数</label>
        <input class="input" id="f-term" placeholder="如：春启 03 期" />
      </div>
      <div class="field">
        <label>讲师 *</label>
        <select class="input" id="f-teacher"></select>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>内容标签 <span style="float:right;color:#8c8c8c;font-weight:400">树状多选，取值于「内容标签」</span></label>
        <div id="f-tags"></div>
      </div>
      <div class="field">
        <label>课程角标</label>
        <select class="input" id="f-badge">
          <option value="">无</option>
          <option value="hot">热门课</option>
          <option value="premium">精品课</option>
        </select>
      </div>
      <div class="field">
        <label>封面图</label>
        <div class="cm-cover-up has-img" id="f-cover-box"><img id="f-cover-img" src="../assets/img/covers/reading.jpg" alt="" /><span class="cm-cover-tip">更换封面</span></div>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>课程简介 <span style="float:right;color:#8c8c8c;font-weight:400" id="intro-cnt">0/256</span></label>
        <textarea class="input" id="f-intro" rows="3" maxlength="256"></textarea>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>课程大纲（概要）</label>
        <textarea class="input" id="f-outline" rows="2" placeholder="课程结构概要，与下方章节列表互补"></textarea>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>课程详情</label>
        <div class="rt-editor">
          <div class="rt-toolbar">
            <button type="button" class="rt-btn"><b>B</b></button>
            <button type="button" class="rt-btn"><i>I</i></button>
          </div>
          <div class="rt-body" id="f-detail" contenteditable="true"><span class="rt-placeholder">输入课程详情（富文本）</span></div>
        </div>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>购买须知</label>
        <textarea class="input" id="f-notes" rows="2" placeholder="如：购买后永久观看；不支持转让"></textarea>
      </div>
    </div>
  </div>

  <div class="cm-section tab-panel" id="sec-goods">
    <div class="cm-section-hd">
      <h2>关联商品 <span class="hint">内容不含价格；价格与售卖在「商品列表」维护，同一内容可建多个商品（1:N）</span></h2>
      <a class="btn" id="btn-create-goods" href="goods-edit.html?create_mode=from_content&content_type=online_course">+ 新建商品</a>
    </div>
    <div class="cm-alert" id="legacy-warn" style="display:none;margin-bottom:12px"></div>
    <table class="data">
      <thead>
        <tr><th>商品</th><th style="width:110px">价格</th><th style="width:110px">审核</th><th style="width:100px">上架</th><th>已上架模块</th><th style="width:110px">操作</th></tr>
      </thead>
      <tbody id="goods-tbody"></tbody>
    </table>
    <p class="muted" style="font-size:12px;margin:10px 0 0">
      「允许试看」在章节里勾选，是内容结构声明；实际开放多少试看、免费还是付费、付费后跳商品还是直接下单，都在 <a href="mp-home.html">交易 · 店铺运营 · 首页装修</a> 的上架配置里决定。
    </p>
  </div>

  <div class="cm-section tab-panel" id="sec-status">
    <div class="cm-section-hd"><h2>状态与分享</h2></div>
    <div class="field">
      <label>店铺显示</label>
      <div class="cm-choice">
        <label><input type="radio" name="store" value="1" checked> 显示</label>
        <label><input type="radio" name="store" value="0"> 隐藏</label>
      </div>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field">
        <label>分享标题</label>
        <input class="input" id="f-share-title" maxlength="30" />
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>分享描述</label>
        <textarea class="input" id="f-share-desc" rows="2" maxlength="60"></textarea>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/content-tags.js?v=2"></script>
<script src="../assets/js/teachers-store.js?v=2"></script>
<script src="../assets/js/course-store.js?v=2"></script>
<script src="../assets/js/goods-store.js?v=1"></script>
<script src="../assets/js/listing-store.js?v=1"></script>
<script src="../assets/js/admin-shell.js?v=23"></script>
<script>
var Store = window.CourseStore;
var Goods = window.GoodsStore;
var Listing = window.ListingStore;
var Tags = window.ContentTags;
var Teachers = window.Teachers;

var id = new URLSearchParams(location.search).get("id") || "";
var course = id ? Store.get(id) : null;
if (!course) {
  course = Store.createBlank({ source: "self" });
  id = course.id;
}

document.getElementById("f-teacher").innerHTML = Teachers.optionsHtml({ emptyLabel: "请选择讲师" });
var tagPicker = Tags.mountTreeSelect("#f-tags", {
  selectedIds: course.tagIds || [],
  placeholder: "请选择内容标签（可多选）"
});

var locked = !Store.canEditContent(course);
var lockEl = document.getElementById("edit-lock");
if (locked) {
  lockEl.style.display = "block";
  lockEl.textContent = course.source === "platform"
    ? "平台下发内容，商家侧不可编辑。"
    : (course.status === Store.STATUS.enabled ? "内容已上架，请先下架后再编辑。" : "审核中不可编辑。");
  document.querySelectorAll("#page-content input, #page-content textarea, #page-content select, #page-content [contenteditable]").forEach(function (el) {
    el.disabled = true;
    if (el.isContentEditable) el.contentEditable = "false";
  });
  document.getElementById("btn-draft").disabled = true;
  document.getElementById("btn-save-chapters").textContent = "查看章节";
}

document.getElementById("f-name").value = course.name || "";
document.getElementById("f-term").value = course.term || "";
document.getElementById("f-teacher").value = course.teacherId || "";
document.getElementById("f-badge").value = course.badge || "";
document.getElementById("f-cover-img").src = course.cover || "../assets/img/covers/reading.jpg";
document.getElementById("f-intro").value = course.intro || "";
document.getElementById("f-outline").value = course.outlineText || "";
document.getElementById("f-notes").value = course.purchaseNotes || "";
document.getElementById("f-share-title").value = course.shareTitle || "";
document.getElementById("f-share-desc").value = course.shareDesc || "";
if (course.detail) {
  document.getElementById("f-detail").innerHTML = course.detail;
}
if (course.storeVisible === false) {
  document.querySelector('input[name="store"][value="0"]').checked = true;
}

function updCnt() {
  document.getElementById("name-cnt").textContent = (document.getElementById("f-name").value || "").length + "/45";
  document.getElementById("intro-cnt").textContent = (document.getElementById("f-intro").value || "").length + "/256";
}
["f-name", "f-intro"].forEach(function (fid) {
  document.getElementById(fid).addEventListener("input", updCnt);
});
updCnt();

/* ---------- 关联商品（内容不含价格，价格只在商品维护） ---------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}
/* 上架 / 审核状态徽标统一走 Proto.shelfTag（R-UI-010 全局配色一致） */
function auditTag(a) { return Proto.shelfTag(a); }
function shelfTag(s) { return Proto.shelfTag(s); }

function renderGoods() {
  var gid = id;
  var rows = Goods ? Goods.listByContent(gid) : [];

  document.getElementById("btn-create-goods").href =
    "goods-edit.html?create_mode=from_content&content_type=online_course&content_id=" + encodeURIComponent(gid);

  var warn = document.getElementById("legacy-warn");
  if (course._legacyPrice > 0 && !rows.length) {
    warn.style.display = "block";
    warn.innerHTML = "本内容在旧版本中带有价格 <b>¥" + course._legacyPrice +
      "</b>，内容已不再承载价格，请到「商品列表」补建商品后再上架售卖。";
  } else {
    warn.style.display = "none";
  }

  document.getElementById("goods-tbody").innerHTML = rows.length ? rows.map(function (g) {
    var href = "goods-edit.html?create_mode=" + encodeURIComponent(g.create_mode || "from_content") +
      "&goods_id=" + encodeURIComponent(g.goods_id) +
      "&content_type=" + encodeURIComponent(g.content_type || "") +
      "&content_id=" + encodeURIComponent(g.content_id || "");
    var usedBy = "";
    if (Listing) {
      var hit = Listing.listByContent(gid).filter(function (r) {
        return r.default_goods_id === g.goods_id;
      });
      usedBy = hit.length ? hit.map(function (r) { return Listing.SLOT_LABEL[r.slot] || r.slot; }).join("、") : "";
    }
    return "<tr>" +
      '<td><a href="' + href + '">' + esc(g.name) + '</a><br><span class="muted" style="font-family:ui-monospace,monospace;font-size:12px">' + esc(g.goods_id) + "</span></td>" +
      "<td><b>¥" + Number(g.price || 0).toFixed(2) + "</b></td>" +
      "<td>" + auditTag(g.audit_status) + "</td>" +
      "<td>" + shelfTag(g.status) + "</td>" +
      "<td>" + (usedBy ? esc(usedBy) + " · 成交商品" : '<span class="muted">—</span>') + "</td>" +
      '<td class="row-actions"><a href="' + href + '">编辑</a></td>' +
      "</tr>";
  }).join("") : '<tr><td colspan="6" class="muted" style="text-align:center;padding:24px">尚未关联商品，点右上角「+ 新建商品」创建</td></tr>';
}
renderGoods();

document.getElementById("anchors").addEventListener("click", function (e) {
  var b = e.target.closest("[data-tab]");
  if (!b) return;
  document.querySelectorAll("#anchors .btn").forEach(function (x) { x.classList.remove("active"); });
  b.classList.add("active");
  document.querySelectorAll(".tab-panel").forEach(function (p) {
    p.classList.toggle("active", p.id === b.getAttribute("data-tab"));
  });
});

document.getElementById("f-cover-box").addEventListener("click", function () {
  if (locked) return;
  Proto.toast("已选择封面（原型）");
});

function selectedTagIds() {
  return tagPicker.getSelected();
}

function collect() {
  var name = document.getElementById("f-name").value.trim();
  if (!name) { Proto.toast("请填写课程名称"); return null; }
  var teacherId = document.getElementById("f-teacher").value;
  if (!teacherId) { Proto.toast("请选择讲师"); return null; }
  var detailEl = document.getElementById("f-detail");
  var detailHtml = detailEl.querySelector(".rt-placeholder") ? "" : detailEl.innerHTML;
  course.name = name;
  course.term = document.getElementById("f-term").value.trim();
  course.teacherId = teacherId;
  course.teacher = Teachers.nameOf(teacherId);
  course.tagIds = selectedTagIds();
  course.badge = document.getElementById("f-badge").value;
  course.cover = document.getElementById("f-cover-img").src;
  course.intro = document.getElementById("f-intro").value.trim();
  course.outlineText = document.getElementById("f-outline").value.trim();
  course.detail = detailHtml;
  course.purchaseNotes = document.getElementById("f-notes").value.trim();
  course.shareTitle = document.getElementById("f-share-title").value.trim();
  course.shareDesc = document.getElementById("f-share-desc").value.trim();
  course.storeVisible = document.querySelector('input[name="store"]:checked').value === "1";
  if (course.status !== Store.STATUS.enabled && course.status !== Store.STATUS.pending_audit) {
    course.status = Store.STATUS.draft;
  }
  return course;
}

document.getElementById("btn-draft").addEventListener("click", function () {
  if (locked) return;
  var c = collect();
  if (!c) return;
  Store.save(c);
  Proto.toast("草稿已保存");
  history.replaceState(null, "", "content-video-edit.html?id=" + encodeURIComponent(c.id));
});

document.getElementById("btn-save-chapters").addEventListener("click", function () {
  if (locked) {
    location.href = "content-video-outline.html?id=" + encodeURIComponent(id);
    return;
  }
  var c = collect();
  if (!c) return;
  Store.save(c);
  location.href = "content-video-outline.html?id=" + encodeURIComponent(c.id);
});
</script>
</body>
</html>
