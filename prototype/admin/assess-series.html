<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>测评包 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/assess.css?v=5" />
</head>
<body class="admin-body" data-module="content" data-nav="assess-series" data-title="测评包" data-crumb="内容 / 测评中心 / 测评包">

<div id="header-actions">
  <a class="btn" href="assess-projects.html">管理单测评</a>
  <button class="btn btn-primary" id="btn-new">+ 新建测评包</button>
</div>

<div id="page-content" style="display:none">
  <div class="as-banner" style="background:#f0f5ff;border:1px solid #bedaff;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px">
    <b>测评包</b> = 用 <strong>LogicFlow</strong> 编排「分流问题」与「测评项目」。单测评内部跳转在题目选项上配置；包级只负责把用户路由到哪一份测评。
  </div>

  <div class="card" style="margin-bottom:14px"><div class="card-bd" style="padding:12px 16px">
    <div class="toolbar" style="border:none;padding:0;background:transparent">
      <input class="input" id="f-q" placeholder="搜索测评包名称或描述..." style="width:240px" />
      <select class="input" id="f-shelf" style="width:130px">
        <option value="">全部上下架</option><option>已上架</option><option>已下架</option>
      </select>
      <button class="btn btn-primary" id="btn-query">查询</button>
    </div>
  </div></div>

  <table class="as-table">
    <thead>
      <tr>
        <th style="width:48px">序号</th>
        <th>测评包</th>
        <th style="width:160px">流程摘要</th>
        <th style="width:160px">报告模板</th>
        <th style="width:80px">上下架</th>
        <th style="width:320px">操作</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div style="margin-top:12px;font-size:12px;color:#8c8c8c">共 <b id="cnt">0</b> 条</div>
</div>

<div class="proto-modal" id="modal-edit">
  <div style="background:#fff;border-radius:10px;width:520px;max-width:94vw;overflow:hidden">
    <div class="proto-modal-hd"><h3 style="margin:0;font-size:16px" id="m-title">新建测评包</h3><button class="ctrl-icon-btn" data-close>×</button></div>
    <div class="proto-modal-bd">
      <div class="field"><label>测评包名称 *</label><input class="input" id="m-name" placeholder="如：家庭教育入门测评包" /></div>
      <div class="field"><label>描述</label><textarea class="input" id="m-desc" rows="2" placeholder="说明适用对象与分流逻辑"></textarea></div>
      <div class="field"><label>报告模板 * <span class="muted" style="font-weight:400">每个测评包仅可关联一份</span></label>
        <select class="input" id="m-tpl"></select>
        <p class="muted" style="font-size:12px;margin:6px 0 0">包级报告在用户完成包流程后按此模板 + 智能体生成。</p>
      </div>
      <p class="muted" style="font-size:12px;margin:0">保存后默认已下架；配置流程后可在列表操作上架。进入 LogicFlow 编排：添加分流题 / 测评节点并连线。</p>
    </div>
    <div class="proto-modal-ft" style="justify-content:flex-end;gap:8px">
      <button class="btn" data-close>取消</button>
      <button class="btn btn-primary" id="btn-save">保存并配置流程</button>
    </div>
  </div>
</div>

<div class="proto-modal" id="modal-view">
  <div style="background:#fff;border-radius:10px;width:560px;max-width:94vw;overflow:hidden">
    <div class="proto-modal-hd"><h3 style="margin:0;font-size:16px">测评包详情</h3><button class="ctrl-icon-btn" data-close>×</button></div>
    <div class="proto-modal-bd" id="view-bd"></div>
    <div class="proto-modal-ft" style="justify-content:flex-end;gap:8px">
      <a class="btn btn-primary" id="view-flow" href="#">流程配置</a>
      <button class="btn" data-close>关闭</button>
    </div>
  </div>
</div>

<div class="proto-mask" id="mask"></div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/assess-flow-store.js?v=2"></script>
<script src="../assets/js/assess-report-store.js?v=2"></script>
<script src="../assets/js/admin-shell.js?v=23"></script>
<script>
var Store = window.AssessFlowStore;
var ReportStore = window.AssessReportStore;
var editing = null;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

function list() { return Store.listPackages(); }

function render() {
  var q = (document.getElementById("f-q").value || "").trim();
  var shelf = document.getElementById("f-shelf").value;
  var rows = list().filter(function (s) {
    if (shelf && s.shelf !== shelf) return false;
    if (q && ((s.name || "") + (s.desc || "")).indexOf(q) < 0) return false;
    return true;
  });
  document.getElementById("cnt").textContent = rows.length;
  document.getElementById("tbody").innerHTML = rows.map(function (s, i) {
    var acts =
      '<button class="btn" data-view="' + s.ownerId + '">查看</button>' +
      '<a class="btn btn-primary" href="assess-flow.html?scope=package&id=' + encodeURIComponent(s.ownerId) + '">流程配置</a>' +
      '<button class="btn" data-edit="' + s.ownerId + '">编辑信息</button>' +
      '<a class="btn" href="goods-edit.html?type=assess&content_id=' + s.ownerId + '">创建商品</a>' +
      (s.shelf === "已上架"
        ? '<button class="btn" data-shelf="' + s.ownerId + '">下架</button>'
        : '<button class="btn" data-shelf="' + s.ownerId + '">上架</button>') +
      '<button class="btn" style="color:#f53f3f;border-color:#ffa39e" data-del="' + s.ownerId + '">删除</button>';
    return "<tr>" +
      '<td style="color:#8c8c8c">' + (i + 1) + "</td>" +
      "<td><div class=\"as-name\">" + esc(s.name) + "</div>" +
      "<div class=\"as-desc\">" + esc(s.desc || "") + "</div></td>" +
      "<td style=\"font-size:12px\">" + esc(Store.packageSummary(s)) + "</td>" +
      "<td style=\"font-size:12px\">" + esc(ReportStore.templateLabel(s.reportTemplateId)) + "</td>" +
      '<td><span class="as-tag ' + (s.shelf === "已上架" ? "green" : "orange") + '">' + esc(s.shelf || "已下架") + "</span></td>" +
      '<td><div class="as-acts">' + acts + "</div></td></tr>";
  }).join("") || '<tr><td colspan="6" style="text-align:center;color:#bfbfbf;padding:28px">暂无测评包</td></tr>';
}

var mask = document.getElementById("mask");
function closeAll() {
  mask.classList.remove("open");
  document.querySelectorAll(".proto-modal").forEach(function (n) { n.classList.remove("open"); });
}
function openM(mid) {
  mask.classList.add("open");
  document.getElementById(mid).classList.add("open");
}

function openEdit(sid) {
  editing = sid;
  var s = sid ? Store.getPackageFlow(sid) : null;
  document.getElementById("m-title").textContent = s ? "编辑测评包" : "新建测评包";
  document.getElementById("m-name").value = s ? s.name : "";
  document.getElementById("m-desc").value = s ? (s.desc || "") : "";
  document.getElementById("m-tpl").innerHTML = ReportStore.templateOptionsHtml(s ? s.reportTemplateId : "RT01");
  openM("modal-edit");
}

document.getElementById("btn-new").onclick = function () { openEdit(null); };
document.getElementById("btn-query").onclick = render;

document.getElementById("btn-save").onclick = function () {
  var name = document.getElementById("m-name").value.trim();
  var tpl = document.getElementById("m-tpl").value;
  if (!name) { Proto.toast("请填写测评包名称"); return; }
  if (!tpl) { Proto.toast("请选择报告模板"); return; }
  var id = editing || ("MS" + Date.now().toString().slice(-4));
  var prev = Store.getPackageFlow(id);
  var flow = prev || {
    scope: "package",
    ownerId: id,
    questions: [],
    entryNodeId: "N_start",
    nodes: [{ id: "N_start", type: "start", x: 40, y: 160 }, { id: "N_end", type: "end", endKind: "normal", x: 400, y: 160 }],
    edges: []
  };
  flow.ownerId = id;
  flow.name = name;
  flow.desc = document.getElementById("m-desc").value.trim();
  flow.reportTemplateId = tpl;
  flow.shelf = prev ? (prev.shelf || "已下架") : "已下架";
  flow.enabled = flow.shelf === "已上架";
  Store.savePackageFlow(flow);
  closeAll();
  location.href = "assess-flow.html?scope=package&id=" + encodeURIComponent(id);
};

document.addEventListener("click", function (e) {
  var view = e.target.closest("[data-view]");
  if (view) {
    var s = Store.getPackageFlow(view.getAttribute("data-view"));
    document.getElementById("view-bd").innerHTML =
      '<div class="as-name" style="font-size:16px;margin-bottom:6px">' + esc(s.name) + "</div>" +
      '<div class="as-desc" style="margin-bottom:12px">' + esc(s.desc || "") + "</div>" +
      "<div style=\"font-size:13px\">" + esc(Store.packageSummary(s)) + " · " + esc(s.shelf || "") + "</div>" +
      "<div style=\"font-size:13px;margin-top:8px\">报告模板：" + esc(ReportStore.templateLabel(s.reportTemplateId)) + "</div>" +
      '<p class="muted" style="font-size:12px;margin-top:12px">在流程画布中配置：分流问题选项 → 问题或测评。</p>';
    document.getElementById("view-flow").href = "assess-flow.html?scope=package&id=" + encodeURIComponent(s.ownerId);
    openM("modal-view");
    return;
  }
  var ed = e.target.closest("[data-edit]");
  if (ed) { openEdit(ed.getAttribute("data-edit")); return; }
  var shelf = e.target.closest("[data-shelf]");
  if (shelf) {
    var s2 = Store.getPackageFlow(shelf.getAttribute("data-shelf"));
    s2.shelf = s2.shelf === "已上架" ? "已下架" : "已上架";
    s2.enabled = s2.shelf === "已上架";
    Store.savePackageFlow(s2);
    Proto.toast(s2.shelf === "已上架" ? "已上架" : "已下架");
    render();
    return;
  }
  var del = e.target.closest("[data-del]");
  if (del) {
    var db = JSON.parse(localStorage.getItem("tob_assess_flow_v1") || "{}");
    if (db.packages) {
      delete db.packages[del.getAttribute("data-del")];
      localStorage.setItem("tob_assess_flow_v1", JSON.stringify(db));
    }
    render();
    Proto.toast("已删除");
    return;
  }
  if (e.target.hasAttribute("data-close") || e.target === mask) closeAll();
});

render();
</script>
</body>
</html>
