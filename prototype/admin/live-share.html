<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>分享邀请 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
</head>
<body class="admin-body" data-module="live" data-nav="lives" data-title="分享邀请" data-crumb="直播 / 直播管理 / 分享邀请">
<div id="header-actions">
  <a class="btn" id="btn-back" href="lives.html">返回</a>
</div>
<div id="page-content" style="display:none">
  <div class="card"><div class="card-bd" style="padding:32px;text-align:center">
    <p style="margin:0 0 12px;font-size:14px;color:#4e5969">分享已改为弹窗交互（小程序短链 / 小程序码 / 海报），不再提供独立数据与排行页。</p>
    <button type="button" class="btn btn-primary" id="btn-open-share">打开分享弹窗</button>
  </div></div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/prototype-business-store.js"></script>
<script src="../assets/js/live-ops.js?v=4"></script>
<script src="../assets/js/admin-shell.js?v=17"></script>
<script>
(function () {
  var liveId = LiveOps.idFromSearch();
  var live = liveId ? LiveOps.getLive(liveId) : null;
  var back = document.getElementById("btn-back");
  if (live) {
    back.href = LiveOps.viewLiveUrl(live.liveId);
    back.textContent = "返回直播详情";
    document.title = "分享邀请 · " + live.liveName + " · 商家管理后台";
    LiveOps.renderContextBanner({ live: live, backHref: back.href });
    document.getElementById("btn-open-share").onclick = function () {
      LiveOps.openShareModal(live);
    };
    setTimeout(function () { LiveOps.openShareModal(live); }, 80);
  } else {
    LiveOps.renderEmptyLive(
      document.getElementById("page-content"),
      liveId
        ? ("未找到直播 " + liveId + "。")
        : "分享邀请需指定直播。请从直播列表或直播详情进入。"
    );
  }
})();
</script>
</body>
</html>
