<script>
var DATA = {
  V001: { name:"如何让孩子爱上阅读", cat:"K12 教育", teacher:"张老师", desc:"通过一个短视频掌握亲子阅读引导方法。", summary:"如何让孩子爱上阅读 · reading.mp4 · 8分钟", size:"156 MB", shelf:"已上架", updated:"2026-09-01" },

};
var id = new URLSearchParams(location.search).get("id") || "V001";
var d = DATA[id] || DATA.V001;
["d-name","d-name2"].forEach(function(k){ document.getElementById(k).textContent = d.name; });
document.getElementById("d-avatar").textContent = d.name.charAt(0);
document.getElementById("d-avatar").className = "cm-avatar " + (d.color||"");
document.getElementById("d-desc").textContent = d.desc;
document.getElementById("d-cat").textContent = d.cat;
document.getElementById("d-summary").textContent = d.summary;
document.getElementById("d-updated").textContent = d.updated;
document.getElementById("d-teacher").textContent = d.teacher;
document.getElementById("d-size").textContent = d.size;
document.getElementById("d-shelf").textContent = d.shelf;
document.getElementById("d-shelf").className = "cm-pill" + (d.shelf === "已上架" ? "" : " off");
var shelfmode = document.getElementById("d-shelfmode");
if (shelfmode) shelfmode.textContent = (d.shelf === "草稿" || d.shelf === "转码中") ? "暂存草稿" : "立即上架（保存后提交内容审核队列）";

var mask = document.getElementById("mask");
function closeAll(){ mask.classList.remove("open"); document.querySelectorAll(".proto-modal,.proto-drawer").forEach(function(n){ n.classList.remove("open"); }); }
document.getElementById("btn-share").onclick = function(){
  XiboShare.open({ type: "视频", url: "https://yibo.app/v/" + id, cover: "../assets/img/covers/" + (id === "V001" ? "reading" : id === "V002" ? "comm" : "ai") + ".jpg", name: d.name, desc: d.desc });
};
mask && mask.addEventListener("click", closeAll);
document.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeAll); });
</script>
