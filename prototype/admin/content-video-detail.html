<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>线上课详情 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/content-mgmt.css?v=4" />
</head>
<body class="admin-body" data-module="content" data-nav="content-video" data-title="线上课详情" data-crumb="内容 / 内容资产 / 线上课 / 详情">

<div id="header-actions">
  <a class="btn" id="btn-outline" href="#">章节管理</a>
  <a class="btn" id="btn-edit" href="#">编辑</a>
  <a class="btn" href="content-video.html">返回列表</a>
</div>

<div id="page-content" style="display:none">
  <a class="cm-back" href="content-video.html">← 返回线上课列表</a>
  <div id="empty" style="display:none" class="card"><div class="card-bd" style="padding:48px;text-align:center">未找到课程</div></div>
  <div id="main">
    <div class="cm-hero" style="margin-bottom:16px">
      <div class="cm-avatar" id="o-avatar">课</div>
      <div class="cm-hero-bd">
        <div class="cm-hero-title">
          <span id="o-name">—</span>
          <span class="cm-pill" id="o-status">—</span>
          <span class="tag" id="o-badge" style="display:none"></span>
        </div>
        <div class="cm-hero-desc" id="o-intro">—</div>
        <div class="cm-hero-meta">
          <span>期数 <b id="o-term">—</b></span>
          <span>讲师 <span id="o-teacher-av" style="display:inline-flex;align-items:center;gap:6px"></span></span>
          <span>价格 <b id="o-price">—</b></span>
          <span>章节 <b id="o-ch">0</b></span>
        </div>
      </div>
    </div>

    <div class="grid-3" style="margin-bottom:16px">
      <div class="stat"><div class="label">观看人数</div><div class="value" id="s-views">0</div></div>
      <div class="stat"><div class="label">评论数</div><div class="value" id="s-comments">0</div></div>
      <div class="stat"><div class="label">收藏数</div><div class="value" id="s-fav">0</div></div>
    </div>

    <div class="card" style="margin-bottom:14px"><div class="card-bd">
      <h3 style="margin:0 0 10px;font-size:14px">内容标签</h3>
      <div id="o-tags"></div>
      <h3 style="margin:16px 0 8px;font-size:14px">课程大纲</h3>
      <p id="o-outline" class="muted" style="margin:0;white-space:pre-wrap">—</p>
      <h3 style="margin:16px 0 8px;font-size:14px">购买须知</h3>
      <p id="o-notes" class="muted" style="margin:0;white-space:pre-wrap">—</p>
      <h3 style="margin:16px 0 8px;font-size:14px">课程详情</h3>
      <div id="o-detail" style="font-size:13px;line-height:1.7">—</div>
    </div></div>

    <div class="card" style="margin-bottom:14px"><div class="card-bd" style="padding:0">
      <div style="padding:12px 16px;border-bottom:1px solid #f0f0f0;font-weight:600;font-size:14px">章节列表</div>
      <table class="data">
        <thead>
          <tr>
            <th>#</th>
            <th>章节名称</th>
            <th>是否免费</th>
            <th>标签</th>
            <th>视频</th>
            <th>思维导图</th>
            <th>课件 PPT</th>
            <th>观看人数</th>
          </tr>
        </thead>
        <tbody id="ch-body"></tbody>
      </table>
    </div></div>

    <div class="card"><div class="card-bd">
      <h3 style="margin:0 0 10px;font-size:14px">最新评论</h3>
      <div id="comments"></div>
    </div></div>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/content-tags.js?v=2"></script>
<script src="../assets/js/teachers-store.js?v=2"></script>
<script src="../assets/js/course-store.js?v=1"></script>
<script src="../assets/js/admin-shell.js?v=16"></script>
<script>
var Store = window.CourseStore;
var Tags = window.ContentTags;
var Teachers = window.Teachers;
var id = new URLSearchParams(location.search).get("id") || "";
var course = Store.get(id);

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

if (!course) {
  document.getElementById("empty").style.display = "";
  document.getElementById("main").style.display = "none";
} else {
  document.getElementById("btn-outline").href = "content-video-outline.html?id=" + encodeURIComponent(id);
  document.getElementById("btn-edit").href = "content-video-edit.html?id=" + encodeURIComponent(id);
  document.getElementById("o-avatar").textContent = (course.name || "课").charAt(0);
  document.getElementById("o-name").textContent = course.name;
  document.getElementById("o-status").textContent = Store.STATUS_LABEL[course.status] || course.status;
  document.getElementById("o-intro").textContent = course.intro || "—";
  document.getElementById("o-term").textContent = course.term || "—";
  document.getElementById("o-teacher-av").innerHTML =
    Teachers.avatarHtml(course.teacherId, { size: 28 }) + " <b>" + esc(Store.teacherName(course)) + "</b>";
  document.getElementById("o-price").textContent = "¥" + (course.price || 0);
  document.getElementById("o-ch").textContent = Store.chapterCount(course);
  document.getElementById("s-views").textContent = course.views || 0;
  document.getElementById("s-comments").textContent = course.comments || 0;
  document.getElementById("s-fav").textContent = course.favorites || 0;
  document.getElementById("o-tags").innerHTML = Tags.labelsHtml(course.tagIds);
  document.getElementById("o-outline").textContent = course.outlineText || "—";
  document.getElementById("o-notes").textContent = course.purchaseNotes || "—";
  document.getElementById("o-detail").innerHTML = course.detail || "—";
  if (course.badge) {
    var b = document.getElementById("o-badge");
    b.style.display = "";
    b.textContent = Store.badgeLabel(course.badge);
  }
  document.getElementById("ch-body").innerHTML = (course.chapters || []).map(function (ch, i) {
    return "<tr>" +
      "<td>" + (i + 1) + "</td>" +
      "<td>" + esc(ch.title) + "</td>" +
      "<td>" + (ch.free ? "免费" : "付费") + "</td>" +
      "<td>" + Tags.labelsHtml(ch.tagIds) + "</td>" +
      "<td>" + esc(ch.videoName || "—") + "</td>" +
      "<td>" + esc(ch.mindmapName || "—") + "</td>" +
      "<td>" + esc(ch.pptName || "—") + "</td>" +
      "<td><b>" + (ch.views || 0) + "</b></td>" +
    "</tr>";
  }).join("") || "<tr><td colspan='8' class='muted'>暂无章节</td></tr>";

  var comments = course.commentList || [];
  document.getElementById("comments").innerHTML = comments.length
    ? comments.map(function (c) {
        return '<div style="padding:10px 0;border-bottom:1px solid #f0f0f0"><b>' + esc(c.user) +
          '</b> <span class="muted" style="font-size:12px">' + esc(c.at) + "</span><div style='margin-top:4px'>" +
          esc(c.text) + "</div></div>";
      }).join("")
    : '<span class="muted">暂无评论</span>';
}
</script>
</body>
</html>
