<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>新建商品 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/content-mgmt.css?v=3" />
</head>
<body class="admin-body" data-module="trade" data-nav="goods-edit" data-title="新建商品" data-crumb="交易 / 商品管理 / 新建商品">
<div id="header-actions">
  <button class="btn" onclick="location.href='goods.html'">返回列表</button>
  <button class="btn" id="btn-save-draft">存草稿</button>
  <button class="btn btn-primary" id="btn-submit">保存并上架</button>
</div>
<div id="page-content" style="display:none">

  <!-- 商品类型 -->
  <div class="cm-section">
    <div class="cm-section-hd"><h3>商品类型</h3><span class="muted">知识商品在「内容」模块创建；此处创建实物 / 服务 / 组合商品</span></div>
    <div class="cm-choice" id="gd-type">
      <label class="cm-choice-item active"><input type="radio" name="gtype" value="physical" checked /><b>实物商品</b><span>教辅周边、礼品实物，支持库存/物流/售后</span></label>
      <label class="cm-choice-item"><input type="radio" name="gtype" value="service" /><b>服务商品</b><span>到店服务、咨询服务等线下履约</span></label>
      <label class="cm-choice-item"><input type="radio" name="gtype" value="combo" /><b>组合商品</b><span>将多个在售商品打包售卖</span></label>
    </div>
  </div>

  <!-- 基本信息 -->
  <div class="cm-section">
    <div class="cm-section-hd"><h3>基本信息</h3></div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:12px 16px">
      <div class="field" style="grid-column:1/-1"><label>商品名称 *</label><input placeholder="请输入商品名称，建议不超过 40 字" value="青春期沟通家长手册（纸书）" /></div>
      <div class="field"><label>商品类目 *</label>
        <select style="width:100%;padding:7px 8px;border:1px solid var(--color-border);border-radius:6px">
          <option>图书 / 教辅周边</option><option>文具 / 文创</option><option>日用百货</option><option>食品（需资质）</option>
        </select>
      </div>
      <div class="field"><label>所属分组</label>
        <select style="width:100%;padding:7px 8px;border:1px solid var(--color-border);border-radius:6px">
          <option>教辅周边</option><option>学科提分</option><option>家长课堂</option><option>未分组</option>
        </select>
      </div>
      <div class="field" style="grid-column:1/-1"><label>商品标签</label><input placeholder="多个标签用「,」分隔，例如：热卖, 新课, 限量" value="热卖, 新课" /></div>
      <div class="field" style="grid-column:1/-1"><label>商品卖点</label><textarea rows="2" style="width:100%;padding:8px;border:1px solid var(--color-border);border-radius:6px">樊登式家长共读手册 · 配套 9.9 引流课使用，随书附赠配套练习页。</textarea></div>
    </div>
    <div class="field" style="margin-top:12px"><label>商品主图（封面图）*</label>
      <div class="gd-uploader"><span class="gd-upload-add">＋<br><em>上传图片</em></span><span class="muted" style="font-size:12px">建议 1:1，≤ 5MB，支持 JPG/PNG/WebP</span></div>
    </div>
    <div class="field" style="margin-top:12px"><label>商品详情</label><textarea rows="4" style="width:100%;padding:8px;border:1px solid var(--color-border);border-radius:6px">此处为富文本详情编辑区（原型示意）：可插入图文、规格表、发货说明等。</textarea></div>
  </div>

  <!-- 规格与库存 -->
  <div class="cm-section">
    <div class="cm-section-hd"><h3>规格与库存</h3><span class="muted">不设置规格即为单规格默认 SKU</span></div>
    <table class="data" style="margin-bottom:10px">
      <thead><tr><th>规格项</th><th>SKU</th><th>价格</th><th>划线价</th><th>库存</th><th style="width:60px"></th></tr></thead>
      <tbody>
        <tr>
          <td>默认规格（单规格）</td>
          <td><span class="mono">SKU-001</span></td>
          <td><input type="number" value="39.00" style="width:110px;padding:5px 8px;border:1px solid var(--color-border);border-radius:6px" /> 元</td>
          <td><input type="number" value="49.00" style="width:110px;padding:5px 8px;border:1px solid var(--color-border);border-radius:6px" /> 元</td>
          <td><input type="number" value="120" style="width:90px;padding:5px 8px;border:1px solid var(--color-border);border-radius:6px" /> 件</td>
          <td><a href="#" data-toast="删除规格（原型）" style="color:#f53f3f">删除</a></td>
        </tr>
        <tr>
          <td>默认规格（单规格）</td>
          <td><span class="mono">SKU-002</span></td>
          <td><input type="number" value="39.00" style="width:110px;padding:5px 8px;border:1px solid var(--color-border);border-radius:6px" /> 元</td>
          <td><input type="number" value="49.00" style="width:110px;padding:5px 8px;border:1px solid var(--color-border);border-radius:6px" /> 元</td>
          <td><input type="number" value="94" style="width:90px;padding:5px 8px;border:1px solid var(--color-border);border-radius:6px" /> 件</td>
          <td><a href="#" data-toast="删除规格（原型）" style="color:#f53f3f">删除</a></td>
        </tr>
      </tbody>
    </table>
    <button class="btn btn-sm" id="btn-add-sku">＋ 添加规格</button>
    <div class="cm-check" style="margin-top:10px">
      <label><input type="checkbox" /> 商品详情页不展示剩余件数</label>
      <label><input type="checkbox" /> 销量仅在店铺配置开启后展示（设置-功能配置）</label>
    </div>
  </div>

  <!-- 价格与优惠 -->
  <div class="cm-section">
    <div class="cm-section-hd"><h3>价格与限购</h3></div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;gap:12px 16px">
      <div class="field"><label>售卖价 *</label><input type="number" value="39.00" /><span class="muted" style="font-size:12px">实际按规格价</span></div>
      <div class="field"><label>划线价</label><input type="number" value="49.00" /><span class="muted" style="font-size:12px">仅展示用</span></div>
      <div class="field"><label>优惠券最大抵扣</label><input type="number" value="5" /><span class="muted" style="font-size:12px">元，超过不可用券</span></div>
      <div class="field"><label>每人限购</label>
        <select style="width:100%;padding:7px 8px;border:1px solid var(--color-border);border-radius:6px"><option>不限购</option><option>每单限 1 件</option><option>每人限 5 件</option><option>自定义</option></select>
      </div>
      <div class="field"><label>起购数量</label><input type="number" value="1" /><span class="muted" style="font-size:12px">≥1</span></div>
    </div>
  </div>

  <!-- 物流与售后 -->
  <div class="cm-section">
    <div class="cm-section-hd"><h3>物流与售后服务</h3></div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:12px 16px">
      <div class="field"><label>运费设置</label>
        <select style="width:100%;padding:7px 8px;border:1px solid var(--color-border);border-radius:6px">
          <option>全国包邮（偏远除外）</option><option>统一运费 ¥6</option><option>使用运费模板</option>
        </select>
        <a href="freight.html" class="link" style="font-size:12px">管理运费模板 →</a>
      </div>
      <div class="field"><label>发货方式</label>
        <select style="width:100%;padding:7px 8px;border:1px solid var(--color-border);border-radius:6px">
          <option>快递发货</option><option>到店自提</option><option>快递 + 自提</option>
        </select>
      </div>
    </div>
    <div class="cm-check" style="margin-top:12px">
      <label><input type="checkbox" checked /> 支持 7 天无理由退货（图书类目默认支持，规则见售后设置）</label>
      <label><input type="checkbox" checked /> 买家可申请换货</label>
      <label><input type="checkbox" /> 支持上门取件退货（需开通运费险/上门取件服务）</label>
    </div>
    <div class="field" style="margin-top:12px"><label>退货收货地址</label>
      <textarea rows="2" style="width:100%;padding:8px;border:1px solid var(--color-border);border-radius:6px">广东省深圳市南山区 ×××大厦 8 楼 收件人：艺博教务 138****0000</textarea>
    </div>
  </div>

  <!-- 上架设置 -->
  <div class="cm-section">
    <div class="cm-section-hd"><h3>上架设置</h3></div>
    <div class="cm-check">
      <label><input type="radio" name="shelf" checked /> 立即上架（保存后提交内容审核队列）</label>
      <label><input type="radio" name="shelf" /> 定时上架 <input type="datetime-local" style="border:1px solid var(--color-border);border-radius:6px;padding:4px 8px" /></label>
      <label><input type="radio" name="shelf" /> 暂存草稿</label>
    </div>
  </div>
</div>

<style>
.cm-section { background:#fff; border:1px solid var(--color-border); border-radius:8px; padding:16px; margin-bottom:12px; }
.cm-section-hd { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
.cm-section-hd h3 { font-size:15px; margin:0; }
.cm-choice { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.cm-choice-item { border:1px solid var(--color-border); border-radius:8px; padding:14px; cursor:pointer; display:block; }
.cm-choice-item.active { border-color:var(--color-primary); box-shadow:0 0 0 1px var(--color-primary) inset; background:var(--color-primary-soft); }
.cm-choice-item b { display:block; margin-bottom:4px; }
.cm-choice-item span { font-size:12px; color:var(--color-text-secondary); }
.gd-uploader { display:flex; align-items:center; gap:14px; }
.gd-upload-add { width:88px; height:88px; border:1px dashed #c9cdd4; border-radius:8px; display:inline-flex; flex-direction:column; align-items:center; justify-content:center; color:var(--color-text-muted); font-size:20px; background:#fafbfc; }
.gd-upload-add em { font-style:normal; font-size:12px; }
.mono { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--color-text-secondary); }
.link { color:var(--color-primary); text-decoration:none; }
</style>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/admin-shell.js?v=13"></script>
<script>
(function () {
  // 商品类型单选高亮
  document.querySelectorAll("#gd-type input[name=gtype]").forEach(function(r){
    r.addEventListener("change", function(){
      document.querySelectorAll("#gd-type .cm-choice-item").forEach(function(n){ n.classList.remove("active"); });
      r.closest(".cm-choice-item").classList.add("active");
      Proto.toast("商品类型切换为「"+r.parentNode.querySelector("b").textContent+"」（原型）");
    });
  });
  document.getElementById("btn-add-sku").addEventListener("click", function(){ Proto.toast("已添加一条规格行（原型）"); });
  document.getElementById("btn-save-draft").addEventListener("click", function(){ Proto.toast("草稿已保存（原型）"); });
  document.getElementById("btn-submit").addEventListener("click", function(){ Proto.toast("保存成功，已提交内容审核队列（原型）"); setTimeout(function(){ location.href="goods.html"; }, 1200); });
})();
</script>
</body>
</html>
