<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>新建店铺商品 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/content-mgmt.css?v=3" />
<style>
.cm-section { background:#fff; border:1px solid var(--color-border); border-radius:8px; padding:16px; margin-bottom:12px; }
.cm-section-hd { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
.cm-section-hd h3 { font-size:15px; margin:0; }
.cm-choice { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.cm-choice-item { border:1px solid var(--color-border); border-radius:8px; padding:14px; cursor:pointer; display:block; }
.cm-choice-item.active { border-color:var(--color-primary); box-shadow:0 0 0 1px var(--color-primary) inset; background:var(--color-primary-soft); }
.cm-choice-item b { display:block; margin-bottom:4px; }
.cm-choice-item span { font-size:12px; color:var(--color-text-secondary); }
.gd-uploader { display:flex; align-items:center; gap:14px; }
.gd-upload-add { width:88px; height:88px; border:1px dashed #c9cdd4; border-radius:8px; display:inline-flex; flex-direction:column; align-items:center; justify-content:center; color:var(--color-text-muted); font-size:20px; background:#fafbfc; }
.gd-upload-add em { font-style:normal; font-size:12px; }
.mono { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--color-text-secondary); }
.linked-card { background:#f7f8fa; border:1px solid var(--color-border); border-radius:8px; padding:12px 14px; }
.tag-checks { display:flex; flex-wrap:wrap; gap:8px 14px; }
.readonly-banner { background:#fff7e6; border:1px solid #ffd591; color:#ad6800; border-radius:8px; padding:10px 14px; margin-bottom:12px; font-size:13px; }
.form-locked input, .form-locked select, .form-locked textarea { pointer-events:none; background:#f5f5f5; opacity:.9; }
</style>
</head>
<body class="admin-body" data-module="trade" data-nav="goods" data-title="新建店铺商品" data-crumb="交易 / 商品管理 / 店铺商品 / 新建">
<div id="header-actions">
  <button class="btn" onclick="location.href='goods.html'">返回店铺商品</button>
  <button class="btn" id="btn-save-draft">存草稿</button>
  <button class="btn btn-primary" id="btn-submit">保存</button>
</div>
<div id="page-content" style="display:none">


  <div class="cm-section" id="sec-mode" style="display:none">
    <input type="hidden" name="create_mode" value="from_content" />
  </div>

  <!-- Path A: content -->
  <div id="path-content">
    <div class="cm-section">
      <div class="cm-section-hd"><h3>选择内容 *</h3><span class="muted">选择自有内容资产；同一内容可创建多个商品（1:N）</span></div>
      <div class="cm-choice" id="gd-ctype" style="grid-template-columns:repeat(4,minmax(0,1fr))">
        <label class="cm-choice-item active"><input type="radio" name="ctype" value="online_course" checked /><b>线上课</b><span>购买后按章节解锁</span></label>
        <label class="cm-choice-item"><input type="radio" name="ctype" value="offline" /><b>线下课</b><span>购买后生成门票</span></label>
        <label class="cm-choice-item"><input type="radio" name="ctype" value="article" /><b>文章</b><span>付费阅读权限</span></label>
        <label class="cm-choice-item"><input type="radio" name="ctype" value="live" /><b>直播</b><span>付费场次观看资格</span></label>
      </div>
      <div class="field" style="margin-top:12px">
        <label>具体内容 *</label>
        <select id="f-content" style="width:100%;padding:7px 8px;border:1px solid var(--color-border);border-radius:6px"></select>
        <div class="muted" style="font-size:12px;margin-top:4px" id="f-content-hint">选择后自动填充名称与详情</div>
      </div>
      <div class="linked-card" id="linked-card" style="margin-top:12px;display:none">
        <div style="font-size:13px;margin-bottom:4px"><b>已关联内容</b> <span class="muted" id="linked-meta"></span></div>
        <div id="linked-title"></div>
        <div class="muted" style="font-size:12px;margin-top:6px" id="linked-goods"></div>
      </div>
    </div>
  </div>

  <div id="form-body">
    <div class="cm-section">
      <div class="cm-section-hd"><h3>基本信息</h3></div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:12px 16px">
        <div class="field" style="grid-column:1/-1"><label>商品名称 *</label><input id="f-gname" placeholder="请输入商品名称，建议不超过 40 字" /></div>
        <div class="field"><label>商品类目 *</label>
          <select id="f-category" style="width:100%;padding:7px 8px;border:1px solid var(--color-border);border-radius:6px"></select>
        </div>
        <div class="field"><label>内容来源</label>
          <input id="f-source" readonly style="width:100%;padding:7px 8px;border:1px solid var(--color-border);border-radius:6px;background:#f5f5f5" value="商家自建 (self)" />
        </div>
        <div class="field" style="grid-column:1/-1"><label>商品标签</label>
          <div class="tag-checks" id="f-tags"></div>
        </div>
        <div class="field" style="grid-column:1/-1"><label>商品卖点</label><textarea id="f-sell" rows="2" style="width:100%;padding:8px;border:1px solid var(--color-border);border-radius:6px"></textarea></div>
      </div>
      <div class="field" style="margin-top:12px"><label>商品主图（封面图）*</label>
        <div class="gd-uploader"><span class="gd-upload-add">＋<br><em>上传图片</em></span><span class="muted" style="font-size:12px">建议 1:1，≤ 5MB</span></div>
      </div>
      <div class="field" style="margin-top:12px"><label>商品详情</label><textarea id="f-gdetail" rows="4" style="width:100%;padding:8px;border:1px solid var(--color-border);border-radius:6px"></textarea></div>
    </div>

    <div class="cm-section">
      <div class="cm-section-hd"><h3>规格与价格</h3></div>
      <table class="data" style="margin-bottom:10px">
        <thead><tr><th>规格项</th><th>SKU</th><th>价格</th><th>划线价</th></tr></thead>
        <tbody>
          <tr>
            <td>默认规格（单规格）</td>
            <td><span class="mono">SKU-001</span></td>
            <td><input id="f-price" type="number" value="199.00" style="width:110px;padding:5px 8px;border:1px solid var(--color-border);border-radius:6px" /> 元</td>
            <td><input id="f-olist" type="number" value="299.00" style="width:110px;padding:5px 8px;border:1px solid var(--color-border);border-radius:6px" /> 元</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="cm-section">
      <div class="cm-section-hd"><h3>交付与售后</h3><span class="muted">虚拟商品无物流，支付成功后自动开通</span></div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:12px 16px">
        <div class="field"><label>交付方式</label>
          <select style="width:100%;padding:7px 8px;border:1px solid var(--color-border);border-radius:6px">
            <option>支付后自动开通（线上内容）</option>
            <option>支付后开通服务额度（学员预约）</option>
            <option>人工开通（对公转账场景）</option>
          </select>
        </div>
        <div class="field"><label>退款规则</label>
          <select style="width:100%;padding:7px 8px;border:1px solid var(--color-border);border-radius:6px">
            <option>未使用可退</option>
            <option>按已使用比例退款</option>
            <option>不支持退款</option>
          </select>
        </div>
      </div>
    </div>

    <div class="cm-section" id="sec-shelf">
      <div class="cm-section-hd"><h3>上架设置</h3><span class="muted">最简版免审：保存后即可上架售卖</span></div>
      <div class="cm-check">
        <label><input type="radio" name="shelf" value="onsale" checked /> 保存并立即上架</label>
        <label><input type="radio" name="shelf" value="schedule" /> 定时上架 <input type="datetime-local" style="border:1px solid var(--color-border);border-radius:6px;padding:4px 8px" /></label>
        <label><input type="radio" name="shelf" value="draft" /> 仅存草稿（不上架）</label>
      </div>
      <p class="muted" style="font-size:12px;margin:10px 0 0">基于自有内容创建；违规由运营「强制下架」处置。</p>
    </div>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/teachers-store.js?v=1"></script>
<script src="../assets/js/course-store.js?v=1"></script>
<script src="../assets/js/goods-taxonomy.js?v=1"></script>
<script src="../assets/js/prototype-business-store.js"></script>
<script src="../assets/js/admin-shell.js?v=26"></script>
<script>
(function () {
  var Store = window.CourseStore;
  var Tax = window.GoodsTaxonomy;
  var Biz = window.ProtoBiz;
  var q = new URLSearchParams(location.search);
  var createMode = "from_content";
  var readonly = false;
  var boundContentId = q.get("content_id") || q.get("id") || "";
  var boundType = q.get("content_type") || q.get("type") || q.get("from") || "online_course";
  if (boundType === "series" || boundType === "plan") boundType = "online_course";

  var CONTENT_POOL = {
    online_course: function () {
      return Store.list({ status: Store.STATUS.enabled }).map(function (c) {
        return { id: c.id, name: c.name, intro: c.intro || "", source: c.source || "self", goodsIds: c.goodsIds || [] };
      });
    },
    offline: function () {
      return [
        { id: "O001", name: "卓越家族培养计划 · 线下工作坊", intro: "线下核销门票", source: "self", goodsIds: [] },
        { id: "O002", name: "亲子沟通实战 · 线下沙龙", intro: "", source: "self", goodsIds: [] }
      ];
    },
    article: function () {
      return [
        { id: "A001", name: "9 月新学期家长指南", intro: "付费文章示例", source: "self", goodsIds: [] },
        { id: "A002", name: "孩子注意力训练方法论", intro: "", source: "self", goodsIds: [] }
      ];
    },
    live: function () {
      return [
        { id: "L001", name: "春启 03 期家长公开课（付费）", intro: "直播观看资格", source: "self", goodsIds: [] },
        { id: "L002", name: "午间答疑 · 付费直播", intro: "", source: "self", goodsIds: [] }
      ];
    }
  };

  document.getElementById("f-category").innerHTML = Tax.catOptionsHtml();
  document.getElementById("f-tags").innerHTML = Tax.listTags({ enabledOnly: true }).map(function (t) {
    return '<label><input type="checkbox" name="gtag" value="' + Tax.esc(t.id) + '" /> ' + Tax.esc(t.name) + "</label>";
  }).join("") || '<span class="muted">暂无标签，请先在「商品标签」维护</span>';

  function setMode(mode) {
    createMode = "from_content";
    readonly = false;
    var pc = document.getElementById("path-content");
    if (pc) pc.style.display = "";
    document.getElementById("form-body").classList.remove("form-locked");
    document.getElementById("btn-save-draft").style.display = "";
    document.getElementById("btn-submit").textContent = "保存";
    document.querySelector("#sec-shelf .cm-section-hd span").textContent = "最简版免审：保存后即可上架售卖";
    document.getElementById("sec-shelf").style.display = "";
    document.getElementById("f-source").value = "商家自建 (self)";
    fillContentList();
  }

  function selectedCtype() {
    var el = document.querySelector("#gd-ctype input[name=ctype]:checked");
    return el ? el.value : "online_course";
  }

  function fillContentList() {
    var type = selectedCtype();
    var list = (CONTENT_POOL[type] || function () { return []; })();
    var sel = document.getElementById("f-content");
    sel.innerHTML = list.map(function (n) {
      var selAttr = boundContentId && n.id === boundContentId ? " selected" : "";
      return '<option value="' + Tax.esc(n.id) + '"' + selAttr + ">" + Tax.esc(n.name) + "（" + Tax.esc(n.id) + "）</option>";
    }).join("") || '<option value="">暂无可选内容</option>';
    document.getElementById("f-content-hint").textContent =
      "取值于「" + Tax.contentTypeLabel(type) + "」已上架列表；同一内容可关联多个店铺商品";
    applyContentPrefill();
  }

  function applyContentPrefill() {
    var type = selectedCtype();
    var id = document.getElementById("f-content").value;
    var list = (CONTENT_POOL[type] || function () { return []; })();
    var hit = list.find(function (n) { return n.id === id; });
    var card = document.getElementById("linked-card");
    if (!hit) {
      card.style.display = "none";
      return;
    }
    card.style.display = "";
    document.getElementById("linked-meta").textContent = Tax.contentTypeLabel(type) + " · " + hit.id + " · 来源 自建";
    document.getElementById("linked-title").innerHTML = "<b>" + Tax.esc(hit.name) + "</b>";
    var gids = hit.goodsIds || [];
    if (type === "online_course" && Store.listGoodsIds) gids = Store.listGoodsIds(hit.id);
    document.getElementById("linked-goods").textContent = gids.length
      ? ("已关联 " + gids.length + " 个商品：" + gids.join("、") + "（可继续创建）")
      : "尚未关联店铺商品";
    if (!q.get("goods_id")) {
      document.getElementById("f-gname").value = hit.name;
      document.getElementById("f-gdetail").value = hit.intro || "";
      document.getElementById("f-sell").value = hit.intro || "";
      document.getElementById("f-source").value = "商家自建 (self)";
    }
  }


  /* init mode from query */
  if (q.get("create_mode") || q.get("content_id") || q.get("type") || q.get("from")) {
    document.getElementById("sec-mode").style.display = "none";
  }
  if (boundType && document.querySelector('#gd-ctype input[value="' + boundType + '"]')) {
    document.querySelector('#gd-ctype input[value="' + boundType + '"]').checked = true;
    document.querySelectorAll("#gd-ctype .cm-choice-item").forEach(function (n) {
      n.classList.toggle("active", n.querySelector("input").value === boundType);
    });
  }
  setMode("from_content");
  document.querySelectorAll("#gd-ctype input[name=ctype]").forEach(function (r) {
    r.addEventListener("change", function () {
      document.querySelectorAll("#gd-ctype .cm-choice-item").forEach(function (n) { n.classList.remove("active"); });
      r.closest(".cm-choice-item").classList.add("active");
      boundContentId = "";
      fillContentList();
    });
  });
  document.getElementById("f-content").addEventListener("change", applyContentPrefill);

  document.getElementById("btn-save-draft").addEventListener("click", function () {
    if (readonly) return;
    Proto.toast("草稿已保存（未提审）");
  });
  document.getElementById("btn-submit").addEventListener("click", function () {
    var goodsId = "G" + Date.now().toString().slice(-8);
    var ctype = selectedCtype();
    var cid = document.getElementById("f-content").value;
    if (!cid) { Proto.toast("请选择内容"); return; }
    if (!document.getElementById("f-gname").value.trim()) { Proto.toast("请填写商品名称"); return; }
    var shelf = (document.querySelector("input[name=shelf]:checked") || {}).value || "onsale";
    if (ctype === "online_course" && Store.addGoodsId) Store.addGoodsId(cid, goodsId);
    var onSale = shelf === "onsale" || shelf === "schedule" || shelf === "submit";
    try {
      if (Biz && Biz.load && Biz.save) {
        var data2 = Biz.load();
        data2.goodsDemo = data2.goodsDemo || [];
        data2.goodsDemo.unshift({
          goods_id: goodsId,
          channel: "store",
          create_mode: "from_content",
          content_source: "self",
          content_type: ctype,
          content_id: cid,
          category_id: document.getElementById("f-category").value,
          tag_ids: Array.from(document.querySelectorAll("input[name=gtag]:checked")).map(function (x) { return x.value; }),
          name: document.getElementById("f-gname").value.trim(),
          status: onSale ? "on_sale" : "draft",
          audit_status: "approved",
          reject_reason: "",
          submitted_at: "",
          price: parseFloat(document.getElementById("f-price").value) || 0
        });
        Biz.save(data2);
      }
    } catch (eSave2) {}
    Proto.toast(onSale ? ("商品 " + goodsId + " 已上架") : ("草稿已保存 " + goodsId));
    setTimeout(function () { location.href = "goods.html"; }, 1000);
  });
})();
</script>
</body>
</html>
