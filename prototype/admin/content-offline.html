<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>线下课 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<style>
.cs-row { background:#fff;border:1px solid #e8e8e8;border-radius:8px;margin-bottom:12px;padding:14px 16px;display:flex;align-items:center;gap:14px; }
.cs-row:hover { border-color:#165dff; box-shadow:0 4px 14px rgba(22,93,255,.1); }
.cs-cover { width:128px;height:80px;border-radius:6px;background:#f2f3f5;overflow:hidden;flex-shrink:0; }
.cs-cover img { width:100%;height:100%;object-fit:cover;display:block; }
.cs-info { flex:1;min-width:0; }
.cs-title { font-size:15px;font-weight:600;color:#1d2129;display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap; }
.cs-desc { font-size:12px;color:#8c8c8c;line-height:1.6;margin-bottom:8px; }
.cs-stats { display:flex;gap:14px;font-size:12px;color:#595959;flex-wrap:wrap; }
.cs-stats b { color:#165dff;font-weight:600; }
.cs-actions { display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:360px; }
.phase-pill { font-size:11px;padding:1px 6px;border-radius:3px;font-weight:500;background:#f2f3f5;color:#4e5969; }
.phase-pill.open { background:#e8ffea;color:#00b42a; }
.phase-pill.soon { background:#fff7e6;color:#d48806; }
.phase-pill.ended { background:#f2f3f5;color:#86909c; }
.phase-pill.live { background:#fff1f0;color:#f53f3f; }
</style>
</head>
<body class="admin-body" data-module="content" data-nav="content-offline" data-title="线下课" data-crumb="内容 / 内容资产 / 线下课">

<div id="header-actions">
  <a class="btn btn-primary" href="content-offline-edit.html">+ 新建线下课</a>
</div>

<div id="page-content" style="display:none">
  <div class="card" style="margin-bottom:14px"><div class="card-bd" style="padding:12px 16px">
    <div class="toolbar" style="border:none;padding:0;background:transparent;flex-wrap:wrap">
      <input class="input" id="f-kw" placeholder="搜索课程名称 / 讲师 / 期数 / 地址" style="width:240px" />
      <div id="f-tag" style="width:200px;display:inline-block;vertical-align:middle"></div>
      <select class="input" id="f-teacher" style="width:150px"><option value="">全部讲师</option></select>
      <select class="input" id="f-badge" style="width:120px">
        <option value="">全部角标</option>
        <option value="hot">热门课</option>
        <option value="premium">精品课</option>
      </select>
      <select class="input" id="f-status" style="width:140px">
        <option value="">全部状态</option>
        <option value="已上架">已上架</option>
        <option value="已下架">已下架</option>
        <option value="草稿">草稿</option>
      </select>
      <button class="btn btn-primary" id="btn-query">查询</button>
      <button class="btn" id="btn-reset">重置</button>
    </div>
  </div></div>
  <p style="font-size:12px;color:#8c8c8c;margin:0 0 12px">线下课字段与线上课对齐，无章节；额外维护报名 / 课程 / 签到时间、预计人数、名额与上课地址。</p>
  <div id="list"></div>
  <div style="margin-top:12px;font-size:12px;color:#8c8c8c">共 <b id="count">0</b> 条</div>
</div>

<div class="proto-mask" id="mask"></div>
<div class="proto-modal" id="modal-del" style="width:440px">
  <div class="proto-modal-hd"><h3 style="font-size:16px;font-weight:600">删除线下课</h3><button class="btn btn-sm btn-ghost" data-close>×</button></div>
  <div class="proto-modal-bd"><p>确定删除《<b id="del-name"></b>》？删除后无法恢复。</p></div>
  <div style="border-top:1px solid var(--color-border);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" data-close>取消</button>
    <button class="btn btn-primary" id="del-confirm" style="background:#f53f3f;border-color:#f53f3f">确认删除</button>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/content-tags.js?v=2"></script>
<script src="../assets/js/teachers-store.js?v=2"></script>
<script src="../assets/js/goods-store.js?v=1"></script>
<script src="../assets/js/admin-shell.js?v=23"></script>
<script>
var Tags = window.ContentTags;
var Teachers = window.Teachers;
var Goods = window.GoodsStore;

document.getElementById("f-teacher").insertAdjacentHTML("beforeend", Teachers.optionsHtml());
var tagFilter = Tags.mountTreeSelect("#f-tag", {
  placeholder: "内容标签（可多选）",
  compact: true,
  width: "200px"
});

var OFFLINES = [
  {
    id: "O001", name: "卓越家族培养计划 · 线下工作坊", term: "秋启 01 期",
    teacherId: "TCH02", tagIds: ["TG01", "TG02"], badge: "hot",
    cover: "../assets/img/covers/classroom.jpg",
    intro: "两天沉浸式工作坊，聚焦家族沟通与边界。",
    address: "上海市浦东新区陆家嘴环路 1000 号 3F",
    signupStart: "2026-09-01 10:00", signupEnd: "2026-09-25 23:59",
    courseStart: "2026-09-28 09:30", courseEnd: "2026-09-29 17:00",
    checkinStart: "2026-09-28 08:30", checkinEnd: "2026-09-28 09:20",
    expected: 80, capacity: 100, signed: 86,
    status: "已上架", onShelf: true
  },
  {
    id: "O002", name: "亲子沟通实战 · 线下沙龙", term: "周末场",
    teacherId: "TCH01", tagIds: ["TG02", "TG04"], badge: "premium",
    cover: "../assets/img/covers/talk.jpg",
    intro: "半天沙龙，现场演练亲子对话。",
    address: "深圳市南山区科技园南路 8 号活动厅",
    signupStart: "2026-09-10 09:00", signupEnd: "2026-10-05 18:00",
    courseStart: "2026-10-12 14:00", courseEnd: "2026-10-12 17:30",
    checkinStart: "2026-10-12 13:30", checkinEnd: "2026-10-12 13:55",
    expected: 35, capacity: 40, signed: 32,
    status: "已上架", onShelf: true
  },
  {
    id: "O003", name: "学习习惯养成 · 线下营", term: "冬令营",
    teacherId: "TCH03", tagIds: ["TG06", "TG04"], badge: "",
    cover: "../assets/img/covers/parent.jpg",
    intro: "三天两夜集训，培养自主学习习惯。",
    address: "北京市海淀区中关村大街 1 号营地",
    signupStart: "2026-11-01 10:00", signupEnd: "2026-11-20 23:59",
    courseStart: "2026-11-28 09:00", courseEnd: "2026-11-30 16:00",
    checkinStart: "2026-11-28 08:00", checkinEnd: "2026-11-28 08:50",
    expected: 25, capacity: 30, signed: 0,
    status: "已下架", onShelf: false
  }
];

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

function parseTs(s) {
  return new Date(String(s).replace(/-/g, "/")).getTime();
}

function derivePhase(o) {
  var now = Date.now();
  var ss = parseTs(o.signupStart), se = parseTs(o.signupEnd);
  var cs = parseTs(o.courseStart), ce = parseTs(o.courseEnd);
  if (now < ss) return { label: "报名未开始", cls: "soon" };
  if (now <= se) return { label: "报名中", cls: "open" };
  if (now < cs) return { label: "报名截止", cls: "ended" };
  if (now <= ce) return { label: "开课中", cls: "live" };
  return { label: "已结束", cls: "ended" };
}

function filtered() {
  var kw = document.getElementById("f-kw").value.trim().toLowerCase();
  var tags = tagFilter.getSelected();
  var teacherId = document.getElementById("f-teacher").value;
  var badge = document.getElementById("f-badge").value;
  var status = document.getElementById("f-status").value;
  return OFFLINES.filter(function (o) {
    if (status && o.status !== status) return false;
    if (teacherId && o.teacherId !== teacherId) return false;
    if (badge && (o.badge || "") !== badge) return false;
    if (tags.length && !tags.some(function (t) { return (o.tagIds || []).indexOf(t) >= 0; })) return false;
    if (kw) {
      var blob = (o.name + " " + Teachers.nameOf(o.teacherId) + " " + (o.term || "") + " " + (o.address || "") + " " + (o.intro || "")).toLowerCase();
      if (blob.indexOf(kw) < 0) return false;
    }
    return true;
  });
}

function render() {
  var rows = filtered();
  document.getElementById("count").textContent = rows.length;
  document.getElementById("list").innerHTML = rows.map(function (o) {
    var phase = derivePhase(o);
    var goodsRows = Goods.listByContent(o.id);
    var acts =
      '<a class="btn" href="content-offline-signups.html?id=' + encodeURIComponent(o.id) + '">报名记录</a>' +
      '<a class="btn" href="content-offline-edit.html?id=' + encodeURIComponent(o.id) + '">编辑</a>' +
      (o.onShelf
        ? '<button class="btn" data-shelf-off="' + o.id + '">下架</button>'
        : '<button class="btn" data-shelf-on="' + o.id + '">上架</button>') +
      '<button class="btn" style="color:#f53f3f;border-color:#ffa39e" data-del="' + o.id + '">删除</button>';
    return '<div class="cs-row">' +
      '<div class="cs-cover"><img src="' + esc(o.cover) + '" alt="" /></div>' +
      '<div class="cs-info">' +
        '<div class="cs-title">' + esc(o.name) +
          ' <span class="muted" style="font-size:12px;font-weight:400">' + esc(o.term || "") + "</span>" +
          ' <span class="phase-pill ' + phase.cls + '">' + phase.label + "</span>" +
          " " + Proto.shelfTag(o.status) + "</div>" +
        '<div class="cs-desc">' + esc(o.intro || "") + "</div>" +
        '<div class="cs-stats">' +
          "<span>讲师 " + Teachers.avatarHtml(o.teacherId, { size: 22 }) + " <b>" + esc(Teachers.nameOf(o.teacherId)) + "</b></span>" +
          "<span>标签 " + Tags.labelsHtml(o.tagIds) + "</span>" +
          "<span>关联商品 <b>" + goodsRows.length + "</b></span>" +
          "<span>报名 <b>" + esc(o.signupStart) + " ~ " + esc(o.signupEnd) + "</b></span>" +
          "<span>课程 <b>" + esc(o.courseStart) + " ~ " + esc(o.courseEnd) + "</b></span>" +
          "<span>签到 <b>" + esc(o.checkinStart) + " ~ " + esc(o.checkinEnd) + "</b></span>" +
          "<span>预计 <b>" + (o.expected || 0) + "</b> / 名额 <b>" + (o.capacity || "不限") + "</b>（已报 " + (o.signed || 0) + "）</span>" +
          "<span>地址 <b>" + esc(o.address || "—") + "</b></span>" +
        "</div>" +
      "</div>" +
      '<div class="cs-actions">' + acts + "</div>" +
    "</div>";
  }).join("") || '<div class="muted" style="padding:32px;text-align:center;border:1px dashed #e8e8e8;border-radius:8px">暂无线下课</div>';
}

document.getElementById("btn-query").addEventListener("click", render);
document.getElementById("btn-reset").addEventListener("click", function () {
  document.getElementById("f-kw").value = "";
  document.getElementById("f-teacher").value = "";
  document.getElementById("f-badge").value = "";
  document.getElementById("f-status").value = "";
  tagFilter.clear();
  render();
});

var pendingDelId = null;
var mask = document.getElementById("mask");
function closeAll() {
  mask.classList.remove("open");
  document.getElementById("modal-del").classList.remove("open");
}
document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", closeAll); });
mask.addEventListener("click", closeAll);

document.getElementById("list").addEventListener("click", function (e) {
  var off = e.target.closest("[data-shelf-off]");
  if (off) {
    var o = OFFLINES.find(function (x) { return x.id === off.getAttribute("data-shelf-off"); });
    if (o) { o.onShelf = false; o.status = "已下架"; render(); Proto.toast("已下架"); }
    return;
  }
  var on = e.target.closest("[data-shelf-on]");
  if (on) {
    var o2 = OFFLINES.find(function (x) { return x.id === on.getAttribute("data-shelf-on"); });
    if (o2) { o2.onShelf = true; o2.status = "已上架"; render(); Proto.toast("已上架"); }
    return;
  }
  var del = e.target.closest("[data-del]");
  if (del) {
    pendingDelId = del.getAttribute("data-del");
    var da = OFFLINES.find(function (x) { return x.id === pendingDelId; });
    document.getElementById("del-name").textContent = da ? da.name : pendingDelId;
    mask.classList.add("open");
    document.getElementById("modal-del").classList.add("open");
  }
});

document.getElementById("del-confirm").addEventListener("click", function () {
  if (!pendingDelId) return;
  OFFLINES = OFFLINES.filter(function (x) { return x.id !== pendingDelId; });
  pendingDelId = null;
  closeAll();
  Proto.toast("已删除");
  render();
});

render();
</script>
</body>
</html>
