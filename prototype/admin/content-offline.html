<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>线下课 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<style>
.ca-list { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; overflow: hidden; }
.ca-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-bottom: 1px solid #f0f0f0;
  transition: background .12s;
}
.ca-row:last-child { border-bottom: 0; }
.ca-row:hover { background: #fafbff; }
.ca-cover {
  width: 96px; height: 64px; border-radius: 6px; flex-shrink: 0;
  background: #f2f3f5; overflow: hidden;
}
.ca-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ca-info { flex: 1; min-width: 0; }
.ca-title {
  font-size: 14px; font-weight: 500; color: #1d2129;
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 10px;
}
.ca-meta {
  font-size: 12px; color: #8c8c8c;
  display: flex; gap: 14px; flex-wrap: wrap;
}
.ca-meta b { color: #595959; font-weight: 500; }
.ca-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.ca-cat { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: #e8f3ff; color: #165dff; font-weight: 500; flex-shrink: 0; }
</style>
</head>
<body class="admin-body" data-module="content" data-nav="content-offline" data-title="线下课" data-crumb="内容 / 内容管理 / 线下课">

<div id="header-actions">
  <button class="btn" data-toast="批量操作待完善（原型）">批量删除</button>
  <button class="btn btn-primary" data-toast="新增线下课待完善（原型）">+ 新增线下课</button>
</div>

<div id="page-content" style="display:none">
  <div class="card" style="margin-bottom:14px;border-color:#ffd591;background:#fff7e6"><div class="card-bd" style="padding:10px 16px;font-size:13px;color:#d48806">
    <b>本模块待完善</b>：线下课（场地排课、到店核销）为后续能力，当前仅提供列表骨架与上下架，页面形态参照「图文」；
    排课、报名名额、签到核销、退款规则等尚未定义。
  </div></div>

  <div class="card" style="margin-bottom:14px"><div class="card-bd" style="padding:12px 16px">
    <div class="toolbar" style="border:none;padding:0;background:transparent">
      <input class="input" type="text" id="co-keyword" placeholder="搜索线下课名称或简介..." style="width:240px" />
      <select class="input" id="co-cat" style="width:160px">
        <option value="">全部内容分类</option>
      </select>
      <select class="input" id="co-status" style="width:140px">
        <option value="">全部上下架</option><option>已上架</option><option>已下架</option>
      </select>
      <button class="btn btn-primary">查询</button>
      <button class="btn">重置</button>
    </div>
  </div></div>

  <div class="ca-list" id="co-list"></div>

  <div style="display:flex;align-items:center;gap:8px;margin-top:16px">
    <span style="color:#8c8c8c;font-size:12px">共 <b id="co-count">3</b> 条</span>
    <div style="margin-left:auto;display:flex;gap:6px">
      <button class="btn" disabled>上一页</button>
      <button class="btn btn-primary">1</button>
      <button class="btn" disabled>下一页</button>
    </div>
  </div>
</div>

<!-- 弹窗遮罩 -->
<div class="proto-mask" id="mask"></div>

<!-- 删除二次确认 -->
<div class="proto-modal" id="modal-del" style="width:440px">
  <div class="proto-modal-hd"><h3 style="font-size:16px;font-weight:600">删除线下课</h3><button class="btn btn-sm btn-ghost" data-close>×</button></div>
  <div class="proto-modal-bd">
    <p>确定删除《<b id="del-name"></b>》？删除后学员端将不再展示，且无法恢复。</p>
  </div>
  <div class="proto-drawer-ft" style="border-top:1px solid var(--color-border);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" data-close>取消</button>
    <button class="btn btn-primary" id="del-confirm" style="background:#f53f3f;border-color:#f53f3f">确认删除</button>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/content-cats.js?v=1"></script>
<script src="../assets/js/admin-shell.js?v=19"></script>
<script>
var OFFLINES = [
  { id: "O001", title: "卓越家族培养计划 · 线下工作坊", cover: "../assets/img/covers/classroom.jpg",
    teacher: "赵老师", cat: "家庭教育", city: "上海", sessions: 2, signed: 86,
    status: "已上架", statusType: "pass", onShelf: true },
  { id: "O002", title: "亲子沟通实战 · 线下沙龙", cover: "../assets/img/covers/talk.jpg",
    teacher: "阮荣均", cat: "K12 教育", city: "深圳", sessions: 1, signed: 32,
    status: "已上架", statusType: "pass", onShelf: true },
  { id: "O003", title: "学习习惯养成 · 线下营（筹备中）", cover: "../assets/img/covers/parent.jpg",
    teacher: "王助教", cat: "K12 教育", city: "北京", sessions: 0, signed: 0,
    status: "已下架", statusType: "review", onShelf: false }
];

var filterCat = "", filterStatus = "", filterKeyword = "";

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

function filteredOfflines() {
  return OFFLINES.filter(function(o) {
    if (filterCat && o.cat !== filterCat) return false;
    if (filterStatus && o.status !== filterStatus) return false;
    if (filterKeyword && o.title.toLowerCase().indexOf(filterKeyword.toLowerCase()) === -1) return false;
    return true;
  });
}

function renderList() {
  var html = filteredOfflines().map(function(o) {
    return '' +
      '<div class="ca-row">' +
        '<div class="ca-cover"><img src="' + o.cover + '" alt="" /></div>' +
        '<div class="ca-info">' +
          '<div class="ca-title">' + esc(o.title) +
            '<span class="ca-cat">' + esc(o.cat) + '</span>' +
            '<span class="audit-badge ' + o.statusType + '">' + esc(o.status) + '</span>' +
          '</div>' +
          '<div class="ca-meta">' +
            '<span><b>ID:</b> ' + esc(o.id) + '</span>' +
            '<span><b>讲师:</b> ' + esc(o.teacher) + '</span>' +
            '<span><b>城市:</b> ' + esc(o.city) + '</span>' +
            '<span><b>场次:</b> ' + o.sessions + '</span>' +
            '<span><b>报名:</b> ' + o.signed + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="ca-actions">' +
          '<button class="btn" data-toast="分享待完善（原型）"' + (o.onShelf ? '' : ' disabled') + '>分享</button>' +
          '<button class="btn" data-toast="线下课详情待完善（原型）">查看线下课</button>' +
          (o.onShelf
            ? '<button class="btn" data-shelf-off="' + o.id + '">下架</button>'
            : '<button class="btn btn-primary" data-toast="线下课编辑待完善（原型）">编辑</button>' +
              '<button class="btn" data-shelf-on="' + o.id + '">上架</button>') +
          '<button class="btn" style="color:#f53f3f;border-color:#ffa39e" data-del="' + o.id + '">删除</button>' +
          '<button class="btn" data-toast="已复制线下课（演示）">复制</button>' +
        '</div>' +
      '</div>';
  }).join("");
  document.getElementById("co-list").innerHTML = html ||
    '<div style="padding:32px;text-align:center;color:#8c8c8c;font-size:13px">暂无线下课</div>';
  document.getElementById("co-count").textContent = filteredOfflines().length;
}

var mask = document.getElementById("mask");
function closeAll() {
  mask.classList.remove("open");
  document.querySelectorAll(".proto-modal").forEach(function(n) { n.classList.remove("open"); });
}
function openModal(el) {
  if (!el) return;
  mask.classList.add("open");
  el.classList.add("open");
}
var pendingDelId = null;
document.getElementById("del-confirm").addEventListener("click", function () {
  if (!pendingDelId) return;
  OFFLINES = OFFLINES.filter(function (x) { return x.id !== pendingDelId; });
  pendingDelId = null;
  closeAll();
  renderList();
  Proto.toast("已删除");
});

document.addEventListener("click", function(e) {
  var off = e.target.closest("[data-shelf-off]");
  if (off) {
    var o = OFFLINES.find(function(x){ return x.id === off.getAttribute("data-shelf-off"); });
    if (o) { o.onShelf = false; o.status = "已下架"; o.statusType = "review"; renderList(); Proto.toast("已下架"); }
    return;
  }
  var on = e.target.closest("[data-shelf-on]");
  if (on) {
    var o2 = OFFLINES.find(function(x){ return x.id === on.getAttribute("data-shelf-on"); });
    if (o2) { o2.onShelf = true; o2.status = "已上架"; o2.statusType = "pass"; renderList(); Proto.toast("已上架"); }
    return;
  }
  var del = e.target.closest("[data-del]");
  if (del) {
    pendingDelId = del.getAttribute("data-del");
    var do_ = OFFLINES.find(function (x) { return x.id === pendingDelId; });
    document.getElementById("del-name").textContent = do_ ? do_.title : pendingDelId;
    openModal(document.getElementById("modal-del"));
    return;
  }
});
mask && mask.addEventListener("click", closeAll);
document.querySelectorAll("[data-close]").forEach(function(b) { b.addEventListener("click", closeAll); });

// 内容分类下拉取值于「内容分类」页面列表
document.getElementById("co-cat").insertAdjacentHTML("beforeend", window.ContentCats.optionsHtml());
document.getElementById("co-cat").addEventListener("change", function(){ filterCat = this.value; renderList(); });
document.getElementById("co-status").addEventListener("change", function(){ filterStatus = this.value; renderList(); });
document.getElementById("co-keyword").addEventListener("input", function(){ filterKeyword = this.value.trim(); renderList(); });

function tryRender() {
  if (document.getElementById("page-content").style.display !== "none") renderList();
  else setTimeout(tryRender, 80);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tryRender);
else tryRender();
</script>
</body>
</html>
