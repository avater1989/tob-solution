<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>权限配置 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
</head>
<body class="admin-body" data-module="sys" data-nav="permissions" data-title="权限配置" data-crumb="系统管理 / 系统用户管理 / 权限配置">
<div id="header-actions">
  <button class="btn btn-primary" id="btn-save">保存配置</button>
</div>
<div id="page-content" style="display:none">

  <!-- 角色切换 -->
  <div class="card" style="margin-bottom:8px"><div class="card-bd">
    <div class="role-chips" id="role-chips">
      <span class="muted" style="margin-right:8px;font-size:13px">选择角色：</span>
      <button class="role-chip active" data-role="销售顾问">销售顾问</button>
      <button class="role-chip" data-role="内容运营">内容运营</button>
      <button class="role-chip" data-role="财务">财务</button>
      <button class="role-chip" data-role="主播">主播</button>
      <button class="role-chip" data-role="商户管理员">商户管理员</button>
    </div>
  </div></div>

  <!-- 功能权限矩阵 -->
  <div class="card" style="margin-bottom:8px">
    <div class="card-hd">
      <h2>功能权限 · <span id="cur-role">销售顾问</span></h2>
      <span class="muted" style="font-size:12px">勾选后该角色可执行对应操作，保存后即时生效</span>
    </div>
    <div class="card-bd" style="padding:0">
      <table class="data">
        <thead>
          <tr>
            <th style="width:220px">模块 / 功能</th>
            <th style="width:90px">查看</th>
            <th style="width:90px">编辑</th>
            <th style="width:90px">审核/操作</th>
            <th style="width:90px">导出</th>
          </tr>
        </thead>
        <tbody id="perm-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- 数据范围 -->
  <div class="card" style="margin-bottom:8px">
    <div class="card-hd"><h2>数据范围权限</h2></div>
    <div class="card-bd">
      <div class="scope-options" id="scope-options">
        <label class="tp-item"><input type="radio" name="scope" value="self" /> 仅本人数据</label>
        <label class="tp-item"><input type="radio" name="scope" value="team" checked /> 本人及下级数据</label>
        <label class="tp-item"><input type="radio" name="scope" value="dept" /> 本部门数据</label>
        <label class="tp-item"><input type="radio" name="scope" value="all" /> 全部数据</label>
      </div>
      <p class="muted" style="margin-top:10px;font-size:12px">数据范围作用于线索、客户、订单、看板等模块的默认筛选；敏感字段（手机号解密）单独受「查看」权限控制。</p>
    </div>
  </div>

  <!-- 敏感操作 -->
  <div class="card">
    <div class="card-hd"><h2>敏感操作权限</h2></div>
    <div class="card-bd">
      <table class="data">
        <thead><tr><th>敏感操作</th><th style="width:120px">是否允许</th><th>说明</th></tr></thead>
        <tbody>
          <tr><td>手机号解密</td><td><input type="checkbox" class="sens" /></td><td class="muted">解密需二次确认并记录审计日志</td></tr>
          <tr><td>退款审核</td><td><input type="checkbox" class="sens" /></td><td class="muted">退款单审核通过与驳回</td></tr>
          <tr><td>结算确认</td><td><input type="checkbox" class="sens" /></td><td class="muted">结算单确认后触发打款流程</td></tr>
          <tr><td>客户导出</td><td><input type="checkbox" class="sens" /></td><td class="muted">导出含手机号的客户明细</td></tr>
          <tr><td>成员与角色管理</td><td><input type="checkbox" class="sens" /></td><td class="muted">邀请成员、分配角色、配置权限</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<style>
.role-chips { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.role-chip {
  padding:6px 16px; border:1px solid var(--color-border); border-radius:16px;
  background:#fff; font-size:13px; cursor:pointer; font-family:inherit; color:var(--color-text);
}
.role-chip:hover { border-color:var(--color-primary); color:var(--color-primary); }
.role-chip.active { background:var(--color-primary); border-color:var(--color-primary); color:#fff; }
.tp-item {
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px; margin-right:8px;
  border:1px solid var(--color-border); border-radius:6px; font-size:13px; cursor:pointer;
}
.tp-item:has(input:checked) { border-color:var(--color-primary); color:var(--color-primary); background:#f0f5ff; }
.scope-options { display:flex; flex-wrap:wrap; }
.perm-mod-label { font-weight:600; }
.perm-mod-label .muted { font-weight:400; }
</style>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/admin-shell.js?v=14"></script>
<script>
(function () {
  // 权限点定义：[模块, 功能, 查看, 编辑, 审核/操作, 导出]
  var perms = [
    ["工作台", "工作台概览", 1, 0, 0, 0],
    ["SCRM", "线索池", 1, 1, 0, 0],
    ["SCRM", "跟进管理 / 企微群跟进", 1, 1, 0, 0],
    ["SCRM", "客户群发 / 朋友圈", 1, 1, 0, 0],
    ["SCRM", "手机号解密（敏感）", 1, 0, 0, 0],
    ["直播", "直播列表 / 创建直播", 1, 0, 0, 0],
    ["直播", "中控台 / 开播", 0, 0, 1, 0],
    ["直播", "直播审核", 0, 0, 1, 0],
    ["直播", "直播数据", 1, 0, 0, 1],
    ["内容", "课程列表 / 创建课程", 1, 0, 0, 0],
    ["内容", "课程上下架", 0, 1, 0, 0],
    ["交易", "订单列表 / 详情", 1, 0, 0, 0],
    ["交易", "退款 / 售后审核", 0, 0, 1, 0],
    ["交易", "对账单", 0, 0, 0, 0],
    ["交易", "结算单确认", 0, 0, 1, 0],
    ["用户", "用户列表 / 详情", 1, 0, 0, 0],
    ["用户", "用户打标", 0, 1, 0, 0],
    ["用户", "成员与角色管理", 0, 0, 0, 0],
    ["数据", "获客 / 直播 / 转化看板", 1, 0, 0, 1],
  ];

  // 各角色配置（布尔矩阵，与 perms 行对齐）
  var roleConf = {
    "销售顾问": perms.map(function (p, i) { return [1, 1, 0, 0]; }),
    "内容运营": perms.map(function (p, i) {
      return p[0] === "交易" || p[1].indexOf("成员与角色") > -1 ? [0, 0, 0, 0] : [1, 1, p[2] || 0, p[1].indexOf("数据") > -1 ? 1 : 0];
    }),
    "财务": perms.map(function (p, i) {
      if (p[0] === "交易") return [1, 0, p[1].indexOf("审核") > -1 || p[1].indexOf("确认") > -1 ? 1 : 0, 1];
      return [p[0] === "用户" ? 1 : 0, 0, 0, p[0] === "交易" ? 1 : 0];
    }),
    "主播": perms.map(function (p, i) {
      if (p[0] === "直播") return [1, p[1].indexOf("创建") > -1 ? 1 : 0, p[1].indexOf("中控") > -1 || p[1].indexOf("开播") > -1 ? 1 : 0, 0];
      if (p[0] === "内容") return [1, 0, 0, 0];
      return [0, 0, 0, 0];
    }),
    "商户管理员": perms.map(function (p, i) { return [1, 1, 1, 1]; }),
  };

  var tbody = document.getElementById("perm-tbody");
  var curRole = "销售顾问";
  var dirty = false;

  function render() {
    document.getElementById("cur-role").textContent = curRole;
    var conf = roleConf[curRole];
    var html = "";
    var lastMod = "";
    perms.forEach(function (p, i) {
      var modCell = p[0] !== lastMod
        ? '<td class="perm-mod-label">' + p[0] + '</td>'
        : '<td class="muted" style="font-weight:400">"</td>';
      lastMod = p[0];
      html += "<tr>" + modCell + "<td>" + p[1] + "</td>" +
        [0, 1, 2, 3].map(function (c) {
          return '<td><input type="checkbox" data-r="' + i + '" data-c="' + c + '"' + (conf[i][c] ? " checked" : "") + " /></td>";
        }).join("") + "</tr>";
    });
    tbody.innerHTML = html;
    tbody.querySelectorAll('input[type="checkbox"]').forEach(function (ck) {
      ck.addEventListener("change", function () {
        roleConf[curRole][ck.getAttribute("data-r")][ck.getAttribute("data-c")] = ck.checked ? 1 : 0;
        dirty = true;
      });
    });
  }

  document.querySelectorAll(".role-chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      if (dirty && !confirm("当前角色配置已修改未保存，切换角色将丢失修改，确认切换？")) return;
      document.querySelectorAll(".role-chip").forEach(function (n) { n.classList.remove("active"); });
      chip.classList.add("active");
      curRole = chip.getAttribute("data-role");
      dirty = false;
      render();
      Proto.toast("已切换到「" + curRole + "」的权限配置");
    });
  });

  document.getElementById("btn-save").addEventListener("click", function () {
    dirty = false;
    Proto.toast("「" + curRole + "」权限配置已保存并即时生效（原型）");
  });

  render();
})();
</script>
</body>
</html>
