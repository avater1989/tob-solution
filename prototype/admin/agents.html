<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智能体 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
</head>
<body class="admin-body" data-module="content" data-nav="agents" data-title="智能体" data-crumb="内容 / 学习服务 / 智能体">

<div id="header-actions">
  <button class="btn" data-toast="已同步智言系统（原型）">同步智言</button>
</div>

<div id="page-content" style="display:none">
  <div class="as-banner" style="background:#f0f5ff;border:1px solid #bedaff;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#1d2129">
    智能体是能力资产（对接智言），<strong>不可单独商品化售卖</strong>。可编入<a href="assess-plans.html">定制化计划</a>任务；具备「报告生成」能力的智能体可被<a href="assess-report-templates.html">报告模板</a>关联，用于生成测评报告解读。
  </div>

  <div class="card" style="margin-bottom:14px"><div class="card-bd" style="padding:12px 16px">
    <div class="toolbar" style="border:none;padding:0;background:transparent">
      <input class="input" id="f-q" placeholder="搜索名称 / 能力 / 来源" style="width:240px" />
      <select class="input" id="f-taskable" style="width:160px">
        <option value="">全部</option>
        <option value="1">可编入计划任务</option>
        <option value="0">不可任务化</option>
      </select>
      <select class="input" id="f-status" style="width:120px">
        <option value="">全部状态</option>
        <option>上架</option>
        <option>下架</option>
      </select>
      <button class="btn btn-primary" id="btn-query">查询</button>
    </div>
  </div></div>

  <div class="card"><div class="card-bd" style="padding:0">
    <table class="data">
      <thead>
        <tr>
          <th>名称</th>
          <th>描述</th>
          <th>能力</th>
          <th>来源</th>
          <th>可任务化</th>
          <th>输入</th>
          <th>输出</th>
          <th>状态</th>
          <th style="width:240px">操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div></div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/admin-shell.js?v=23"></script>
<script>
var AGENTS = [
  { id: "AG01", name: "亲子沟通辅导助手", desc: "计划关卡对话辅导；亦可用于报告解读", capability: "对话辅导 / 报告生成", source: "智言", taskable: true, input: "用户画像+关卡目标/测评结果", output: "建议文本", status: "上架" },
  { id: "AG02", name: "家庭教育顾问", desc: "关卡练习建议与报告解读", capability: "对话辅导 / 报告生成", source: "智言", taskable: true, input: "用户画像+关卡目标/测评结果", output: "建议文本", status: "上架" },
  { id: "AG05", name: "测评报告解读引擎", desc: "专用于测评报告内容生成", capability: "报告生成", source: "智言", taskable: false, input: "测评结果+模板变量", output: "报告解读 HTML 片段", status: "上架" },
  { id: "AG03", name: "情绪识别助手", desc: "关卡练习中识别情绪倾向", capability: "情绪分析", source: "智言", taskable: true, input: "用户文本", output: "标签+建议", status: "上架" },
  { id: "AG04", name: "旧版闲聊助手", desc: "已下架，不可编入计划", capability: "闲聊", source: "智言", taskable: false, input: "文本", output: "回复", status: "下架" }
];

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }

function filtered() {
  var q = (document.getElementById("f-q").value || "").trim();
  var t = document.getElementById("f-taskable").value;
  var st = document.getElementById("f-status").value;
  return AGENTS.filter(function (a) {
    if (t === "1" && !a.taskable) return false;
    if (t === "0" && a.taskable) return false;
    if (st && a.status !== st) return false;
    if (q && (a.name + a.desc + a.capability + a.source).indexOf(q) < 0) return false;
    return true;
  });
}

function render() {
  document.getElementById("tbody").innerHTML = filtered().map(function (a) {
    var shelfBtn = a.status === "上架"
      ? "<button class='btn' data-shelf='" + a.id + "'>下架</button>"
      : "<button class='btn btn-primary' data-shelf='" + a.id + "'>上架</button>";
    return "<tr>" +
      "<td><b>" + esc(a.name) + "</b><br><span class='muted' style='font-size:12px'>" + esc(a.id) + "</span></td>" +
      "<td style='max-width:200px;font-size:13px'>" + esc(a.desc) + "</td>" +
      "<td>" + esc(a.capability) + "</td>" +
      "<td>" + esc(a.source) + "</td>" +
      "<td>" + (a.taskable ? "<span class='badge badge-success'>是</span>" : "<span class='badge'>否</span>") + "</td>" +
      "<td style='font-size:12px'>" + esc(a.input) + "</td>" +
      "<td style='font-size:12px'>" + esc(a.output) + "</td>" +
      "<td><span class='as-tag " + (a.status === "上架" ? "green" : "gray") + "'>" + esc(a.status) + "</span></td>" +
      "<td class='row-actions' style='display:flex;gap:6px;flex-wrap:wrap;align-items:center'>" +
        (a.taskable
          ? "<a class='btn' href='content-tasks.html?type=agent&agent_id=" + a.id + "'>生成任务</a>"
          : "<span class='muted' style='font-size:12px'>不可任务化</span>") +
        shelfBtn +
      "</td></tr>";
  }).join("") || "<tr><td colspan='9' style='text-align:center;color:#bfbfbf;padding:28px'>暂无智能体</td></tr>";
}

document.getElementById("btn-query").addEventListener("click", render);
document.getElementById("tbody").addEventListener("click", function (e) {
  var btn = e.target.closest("[data-shelf]");
  if (!btn) return;
  var row = AGENTS.find(function (x) { return x.id === btn.getAttribute("data-shelf"); });
  if (!row) return;
  row.status = row.status === "上架" ? "下架" : "上架";
  render();
  Proto.toast(row.status === "上架" ? "已上架" : "已下架");
});
render();
</script>
</body>
</html>
