<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>直播列表 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<style>
.status-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 4px; vertical-align: middle;
}
.status-living { background: #f53f3f; animation: live-pulse 1.5s infinite; }
.status-pending { background: #ff7d00; }
.status-finished { background: #86909c; }
.status-ok { background: #00b42a; }
@keyframes live-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.live-more { position: relative; display: inline-block; vertical-align: baseline; margin-right: 8px; }
.live-more > a.row-more {
  cursor: pointer;
  color: var(--color-primary, #165dff);
  font-size: 13px;
  text-decoration: none;
  white-space: nowrap;
  font-weight: 400;
}
.live-more > a.row-more:hover { text-decoration: underline; }
.live-more-menu {
  display: none;
  position: absolute;
  right: 0;
  top: calc(100% + 4px);
  z-index: 30;
  background: #fff;
  border: 1px solid var(--color-border, #e5e6eb);
  border-radius: 4px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
  min-width: 132px;
  padding: 4px 0;
}
.live-more.open .live-more-menu { display: block; }
.live-more-menu a,
.live-more-menu button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 6px 12px;
  font-size: 13px;
  color: var(--color-primary, #165dff);
  background: none;
  border: 0;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  box-sizing: border-box;
  font-weight: 400;
  line-height: 1.4;
}
.live-more-menu a:hover,
.live-more-menu button:hover { background: #f2f3f5; text-decoration: underline; }
.live-more-menu .danger { color: #f53f3f; }
.row-actions {
  white-space: nowrap;
  line-height: 22px;
}
.row-actions > a,
.row-actions > button.act-btn {
  display: inline-block;
  margin-right: 8px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--color-primary, #165dff);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  text-decoration: none;
  vertical-align: baseline;
  font-weight: 400;
  line-height: 22px;
}
.row-actions > a:hover,
.row-actions > button.act-btn:hover { text-decoration: underline; }
.row-actions > a.is-primary,
.row-actions > button.act-btn.is-primary { font-weight: 600; }
.row-actions a.danger,
.row-actions button.danger { color: #f53f3f; }
tr.live-highlight { background: #f0f5ff; }
.audit-stack { line-height: 1.6; }
.pub-stack { line-height: 1.6; font-size: 12px; }
</style>
</head>
<body class="admin-body" data-module="live" data-nav="lives" data-title="直播列表" data-crumb="直播 / 直播管理 / 直播列表">
<div id="header-actions">
  <button type="button" class="btn" id="btn-tutorial">使用教程</button>
  <a class="btn btn-primary" href="live-edit.html" id="btn-create">+ 新建直播</a>
</div>
<div id="page-content" style="display:none">

  <div class="stat-cards" style="margin:0 0 8px">
    <div class="stat-card">
      <div class="stat-label">待提交平台审核</div>
      <div class="stat-value" id="stat-draft" style="color:#d48806">0</div>
      <div class="stat-hint">草稿 / 可提交</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">平台审核中</div>
      <div class="stat-value" id="stat-platform-pending">0</div>
      <div class="stat-hint">等待平台结果</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">已上架待开播</div>
      <div class="stat-value" id="stat-upcoming" style="color:#165dff">0</div>
      <div class="stat-hint">已上架 · 未开始</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">直播中</div>
      <div class="stat-value" id="stat-living" style="color:#f53f3f">0</div>
      <div class="stat-hint">进行中场次</div>
    </div>
  </div>

  <div class="card" style="margin-bottom:8px"><div class="card-bd">
    <div class="form-grid" style="grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 12px">
      <input id="f-name" type="text" placeholder="直播名称 / ID" />
      <select id="f-mode">
        <option value="">全部模式</option>
        <option value="视频直播">视频直播</option>
        <option value="语音直播">语音直播</option>
        <option value="录播直播">录播直播</option>
      </select>
      <select id="f-platform">
        <option value="">平台审核状态</option>
      </select>
      <select id="f-shelf">
        <option value="">上架状态</option>
      </select>
      <select id="f-runtime">
        <option value="">直播状态</option>
      </select>
    </div>
    <div class="toolbar" style="margin-top:8px">
      <button type="button" class="btn btn-primary" id="btn-query">查询</button>
      <button type="button" class="btn" id="btn-reset">重置</button>
      <div class="spacer"></div>
      <button type="button" class="btn" id="btn-batch-publish" disabled>上架</button>
      <button type="button" class="btn" id="btn-batch-unpublish" disabled>下架</button>
      <button type="button" class="btn" id="btn-batch-delete" disabled>删除</button>
    </div>
  </div></div>

  <div class="card"><div class="card-bd" style="padding:0">
    <table class="data">
      <thead>
        <tr>
          <th style="width:36px"><input type="checkbox" id="check-all" /></th>
          <th>直播ID</th>
          <th>课程/期次</th>
          <th>直播名称</th>
          <th>模式</th>
          <th>开播时间</th>
          <th>负责人</th>
          <th>审核状态</th>
          <th>发布状态</th>
          <th style="width:240px">操作</th>
        </tr>
      </thead>
      <tbody id="lv-tbody"></tbody>
    </table>
  </div></div>

  <div class="toolbar" style="margin-top:8px">
    <span class="muted" id="pager-hint">共 <b>0</b> 条</span>
    <div class="spacer"></div>
    <select disabled><option>全部</option></select>
  </div>

</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/prototype-business-store.js"></script>
<script src="../assets/js/live-ops.js?v=9"></script>
<script src="../assets/js/admin-shell.js?v=19"></script>
<script>
(function () {
  var LO = window.LiveOps;
  if (!LO) return;

  var tbody = document.getElementById("lv-tbody");
  var checkAll = document.getElementById("check-all");
  var pagerHint = document.getElementById("pager-hint");
  var selected = {};
  var currentRows = [];
  var filters = {
    name: "",
    mode: "",
    platform: "",
    shelf: "",
    runtime: ""
  };

  function toast(msg) {
    if (window.Proto && typeof Proto.toast === "function") Proto.toast(msg);
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function fillSelect(sel, map, placeholder) {
    var html = '<option value="">' + esc(placeholder) + "</option>";
    Object.keys(map).forEach(function (k) {
      html += '<option value="' + esc(k) + '">' + esc(map[k]) + "</option>";
    });
    sel.innerHTML = html;
  }

  fillSelect(document.getElementById("f-platform"), LO.PLATFORM_LABEL, "平台审核状态");
  fillSelect(document.getElementById("f-shelf"), LO.SHELF_LABEL, "上架状态");
  fillSelect(document.getElementById("f-runtime"), LO.RUNTIME_LABEL, "直播状态");

  function readFiltersFromUI() {
    return {
      name: (document.getElementById("f-name").value || "").trim(),
      mode: document.getElementById("f-mode").value || "",
      platform: document.getElementById("f-platform").value || "",
      shelf: document.getElementById("f-shelf").value || "",
      runtime: document.getElementById("f-runtime").value || ""
    };
  }

  function applyFiltersToUI(f) {
    f = f || {};
    document.getElementById("f-name").value = f.name || "";
    document.getElementById("f-mode").value = f.mode || "";
    document.getElementById("f-platform").value = f.platform || "";
    document.getElementById("f-shelf").value = f.shelf || "";
    document.getElementById("f-runtime").value = f.runtime || "";
  }

  function matchFilters(v, f) {
    if (f.name) {
      var q = f.name.toLowerCase();
      var hay = ((v.liveName || v.name || "") + " " + (v.liveId || v.id || "")).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    if (f.mode && (v.liveMode || "") !== f.mode) return false;
    if (f.platform && v.platformReviewStatus !== f.platform) return false;
    if (f.shelf && v.shelfStatus !== f.shelf) return false;
    if (f.runtime && v.runtimeStatus !== f.runtime) return false;
    return true;
  }

  function auditBadgeClass(status) {
    if (status === "pending" || status === "reviewing") return "audit-pending";
    if (status === "passed") return "audit-approved";
    if (status === "rejected") return "audit-rejected";
    if (status === "withdrawn") return "audit-cancelled";
    return "";
  }

  function runtimeDotClass(runtime) {
    if (runtime === "living") return "status-living";
    if (runtime === "ended" || runtime === "cancelled") return "status-finished";
    if (runtime === "not_started") return "status-pending";
    return "status-pending";
  }

  function saveCtx(extra) {
    var ctx = {
      filters: readFiltersFromUI(),
      scrollY: window.scrollY || 0,
      highlightId: (extra && extra.highlightId) || ""
    };
    LO.saveListContext(ctx);
  }

  function detailHref(id) {
    return LO.viewLiveUrl ? LO.viewLiveUrl(id) : LO.buildUrl("live-edit.html", { live_id: id, mode: "view" });
  }

  function actionHandlers() {
    return {
      submit_platform: function (id) {
        LO.openSubmitPlatformModal(id, {
          reload: false,
          onSuccess: function () {
            selected = {};
            render();
          }
        });
        return false;
      },
      withdraw_platform: function (id) {
        if (!confirm("确认撤回平台审核？撤回后将变为未提交草稿。")) return false;
        LO.withdrawPlatform(id);
        LO.patchLive(id, { platformReviewStatus: "not_submitted" });
        toast("已撤回平台审核");
      },
      withdraw_edit: function (id) {
        if (!confirm("当前直播正在平台审核中，编辑前需要撤回审核。撤回后直播将变为草稿，需要修改并重新提交。\n\n确认撤回并编辑？")) return false;
        LO.withdrawAndEdit(id);
        saveCtx({ highlightId: id });
        location.href = LO.editLiveUrl(id);
        return false;
      },
      publish: function (id) {
        LO.publish(id);
        toast("已上架");
      },
      unpublish: function (id) {
        if (!confirm("确认取消上架？")) return false;
        LO.unpublish(id);
        toast("已下架");
      },
      force_offline: function (id) {
        if (!confirm("确认强制下架该直播？")) return false;
        LO.forceOffline(id);
        toast("已强制下架");
      },
      copy: function (id) {
        location.href = LO.buildUrl("live-edit.html", { copy_from: id });
        return false;
      },
      share: function (id) {
        LO.openShareModal(id);
        return false;
      },
      delete: function (id) {
        if (!confirm("确认删除该直播？仅草稿/已取消可删。")) return false;
        var ok = LO.deleteLive(id);
        toast(ok ? "已删除" : "当前状态不可删除");
      }
    };
  }

  function runAction(type, liveId) {
    var map = actionHandlers();
    var fn = map[type];
    if (!fn) return;
    var ret = fn(liveId);
    if (ret === false) return;
    selected = {};
    render();
  }

  function actionNode(item, liveId, asButton) {
    var danger = item.action === "delete" || item.action === "force_offline" || item.action === "unpublish";
    var cls = danger ? " danger" : "";
    if (item.href) {
      return '<a href="' + esc(item.href) + '" data-nav-live="' + esc(liveId) + '"' +
        (danger ? ' class="danger"' : "") + ">" + esc(item.label) + "</a>";
    }
    if (item.action) {
      if (asButton) {
        return '<button type="button" class="act-btn' + cls + '" data-act="' + esc(item.action) +
          '" data-live-id="' + esc(liveId) + '">' + esc(item.label) + "</button>";
      }
      return '<button type="button" class="' + (danger ? "danger" : "") + '" data-act="' +
        esc(item.action) + '" data-live-id="' + esc(liveId) + '">' + esc(item.label) + "</button>";
    }
    return "";
  }

  function renderActions(v) {
    var pack = LO.buildActions(v);
    var id = v.liveId || v.id;
    var html = "";
    if (pack.primary) {
      if (pack.primary.href) {
        html += '<a class="is-primary" href="' + esc(pack.primary.href) + '" data-nav-live="' + esc(id) +
          '">' + esc(pack.primary.label) + "</a>";
      } else if (pack.primary.action) {
        html += '<button type="button" class="act-btn is-primary" data-act="' +
          esc(pack.primary.action) + '" data-live-id="' + esc(id) + '">' +
          esc(pack.primary.label) + "</button>";
      }
    }
    var secs = (pack.secondary || []).filter(function (s) {
      if (!pack.primary) return true;
      if (pack.primary.label && s.label === pack.primary.label) return false;
      if (pack.primary.href && s.href === pack.primary.href) return false;
      return true;
    });
    var visible = [];
    var more = secs;
    visible.forEach(function (s) {
      html += actionNode(s, id, true);
    });
    if (more.length) {
      html += '<span class="live-more"><a href="javascript:;" class="row-more" data-more-toggle>更多</a>';
      html += '<div class="live-more-menu">';
      more.forEach(function (s) {
        html += actionNode(s, id, false);
      });
      html += "</div></span>";
    }
    return html;
  }

  function renderEmpty() {
    tbody.innerHTML =
      '<tr><td colspan="10" style="padding:48px;text-align:center;color:#86909c">暂无符合条件的直播</td></tr>';
    pagerHint.innerHTML = "共 <b>0</b> 条";
    checkAll.checked = false;
    updateBatchButtons();
  }

  function updateStats(all) {
    var draft = 0;
    var platformPending = 0;
    var upcoming = 0;
    var living = 0;
    all.forEach(function (v) {
      var key = LO.scenarioKey(v);
      if (key === "draft" || key === "platform_rejected") draft++;
      if (key === "platform_pending") platformPending++;
      if (key === "upcoming") upcoming++;
      if (key === "living") living++;
    });
    document.getElementById("stat-draft").textContent = String(draft);
    document.getElementById("stat-platform-pending").textContent = String(platformPending);
    document.getElementById("stat-upcoming").textContent = String(upcoming);
    document.getElementById("stat-living").textContent = String(living);
  }

  function updateBatchButtons() {
    var n = Object.keys(selected).length;
    document.getElementById("btn-batch-publish").disabled = n === 0;
    document.getElementById("btn-batch-unpublish").disabled = n === 0;
    document.getElementById("btn-batch-delete").disabled = n === 0;
  }

  function courseTerm(v) {
    var course = v.courseName || "—";
    var term = v.termName || "";
    if (term) return esc(course) + '<div class="muted">' + esc(term) + "</div>";
    return esc(course);
  }

  function render() {
    var all = LO.getLives() || [];
    updateStats(all);
    filters = readFiltersFromUI();
    currentRows = all.filter(function (v) { return matchFilters(v, filters); });
    if (!currentRows.length) {
      renderEmpty();
      return;
    }
    var html = "";
    currentRows.forEach(function (v) {
      var id = v.liveId || v.id;
      var checked = selected[id] ? " checked" : "";
      html += '<tr data-live-id="' + esc(id) + '">';
      html += '<td><input type="checkbox" class="row-check" data-live-id="' + esc(id) + '"' + checked + " /></td>";
      html += "<td>" + esc(id) + "</td>";
      html += "<td>" + courseTerm(v) + "</td>";
      html += '<td><a href="' + esc(detailHref(id)) + '" data-nav-live="' + esc(id) + '">' +
        esc(v.liveName || v.name || "—") + "</a></td>";
      html += "<td>" + esc(v.liveMode || "—") + "</td>";
      html += "<td>" + esc(v.startAt || "—") + "</td>";
      html += "<td>" + esc(v.owner || v.creator || "—") + "</td>";
      html += '<td class="audit-stack">';
      html += '<span class="audit-badge ' + auditBadgeClass(v.platformReviewStatus) + '">' +
        esc(v.platformReviewStatusLabel || "—") + "</span>";
      html += "</td>";
      html += '<td class="pub-stack">';
      html += '<span class="status-dot ' + runtimeDotClass(v.runtimeStatus) + '"></span>' +
        esc(v.runtimeStatusLabel || "—") + "<br/>";
      html += '<span class="muted">上架：' + esc(v.shelfStatusLabel || "—") + "</span>";
      html += "</td>";
      html += '<td class="row-actions">' + renderActions(v) + "</td>";
      html += "</tr>";
    });
    tbody.innerHTML = html;
    pagerHint.innerHTML = "共 <b>" + currentRows.length + "</b> 条";
    checkAll.checked = currentRows.length > 0 &&
      currentRows.every(function (v) { return selected[v.liveId || v.id]; });
    updateBatchButtons();
  }

  function selectedLives() {
    var map = {};
    (LO.getLives() || []).forEach(function (v) { map[v.liveId || v.id] = v; });
    return Object.keys(selected).map(function (id) { return map[id]; }).filter(Boolean);
  }

  function runBatch(action, label) {
    var lives = selectedLives();
    var gate = LO.canBatch(action, lives);
    if (!lives.length) {
      toast("请先选择直播");
      return;
    }
    if (!gate.okList || !gate.okList.length) {
      toast(gate.reason || ("选中项均不支持" + label));
      return;
    }
    if (gate.failList && gate.failList.length) {
      toast((gate.reason || "部分不可操作") + "，将对 " + gate.okList.length + " 场执行" + label);
    }
    if (action === "delete" && !confirm("确认删除 " + gate.okList.length + " 场直播？")) return;
    gate.okList.forEach(function (v) {
      var id = v.liveId || v.id;
      if (action === "publish") LO.publish(id);
      else if (action === "unpublish") LO.unpublish(id);
      else if (action === "delete") LO.deleteLive(id);
    });
    selected = {};
    toast("已对 " + gate.okList.length + " 场执行" + label);
    render();
  }

  /* events */
  document.getElementById("btn-tutorial").addEventListener("click", function () {
    toast("打开使用教程（原型）");
  });

  document.getElementById("btn-create").addEventListener("click", function () {
    saveCtx({});
  });

  document.getElementById("btn-query").addEventListener("click", function () {
    selected = {};
    render();
  });

  document.getElementById("btn-reset").addEventListener("click", function () {
    applyFiltersToUI({});
    selected = {};
    render();
    toast("已重置筛选");
  });

  document.getElementById("btn-batch-publish").addEventListener("click", function () {
    runBatch("publish", "上架");
  });
  document.getElementById("btn-batch-unpublish").addEventListener("click", function () {
    runBatch("unpublish", "下架");
  });
  document.getElementById("btn-batch-delete").addEventListener("click", function () {
    runBatch("delete", "删除");
  });

  checkAll.addEventListener("change", function () {
    var on = checkAll.checked;
    currentRows.forEach(function (v) {
      var id = v.liveId || v.id;
      if (on) selected[id] = true;
      else delete selected[id];
    });
    tbody.querySelectorAll(".row-check").forEach(function (c) { c.checked = on; });
    updateBatchButtons();
  });

  tbody.addEventListener("change", function (e) {
    var t = e.target;
    if (!t.classList || !t.classList.contains("row-check")) return;
    var id = t.getAttribute("data-live-id");
    if (t.checked) selected[id] = true;
    else delete selected[id];
    checkAll.checked = currentRows.length > 0 &&
      currentRows.every(function (v) { return selected[v.liveId || v.id]; });
    updateBatchButtons();
  });

  tbody.addEventListener("click", function (e) {
    var moreToggle = e.target.closest("[data-more-toggle]");
    if (moreToggle) {
      e.preventDefault();
      e.stopPropagation();
      var wrap = moreToggle.closest(".live-more");
      document.querySelectorAll(".live-more.open").forEach(function (n) {
        if (n !== wrap) n.classList.remove("open");
      });
      wrap.classList.toggle("open");
      return;
    }

    var actEl = e.target.closest("[data-act]");
    if (actEl) {
      e.preventDefault();
      e.stopPropagation();
      runAction(actEl.getAttribute("data-act"), actEl.getAttribute("data-live-id"));
      return;
    }

    var nav = e.target.closest("[data-nav-live]");
    if (nav) {
      saveCtx({ highlightId: nav.getAttribute("data-nav-live") });
    }
  });

  document.addEventListener("click", function (e) {
    if (!e.target.closest(".live-more")) {
      document.querySelectorAll(".live-more.open").forEach(function (n) {
        n.classList.remove("open");
      });
    }
  });

  /* restore context */
  var ctx = LO.loadListContext() || {};
  try {
    var urlParams = new URLSearchParams(location.search);
    var fromUrl = {
      name: urlParams.get("name") || "",
      mode: urlParams.get("mode") || "",
      platform: urlParams.get("platform") || "",
      shelf: urlParams.get("shelf") || "",
      runtime: urlParams.get("runtime") || ""
    };
    if (fromUrl.name || fromUrl.mode || fromUrl.platform || fromUrl.shelf || fromUrl.runtime) {
      ctx.filters = Object.assign({}, ctx.filters || {}, fromUrl);
    }
  } catch (e) {}
  if (ctx.filters) applyFiltersToUI(ctx.filters);
  render();
  if (ctx.highlightId) {
    var row = tbody.querySelector('tr[data-live-id="' + ctx.highlightId + '"]');
    if (row) {
      row.classList.add("live-highlight");
      try { row.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (err) {}
    }
  } else if (typeof ctx.scrollY === "number" && ctx.scrollY > 0) {
    window.scrollTo(0, ctx.scrollY);
  }
})();
</script>
</body>
</html>
