<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>商品分析 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=14" />
<style>
.trade-zone { scroll-margin-top: 72px; }
.trade-zone.is-highlight { outline: 2px solid var(--color-primary); outline-offset: 2px; border-radius: 8px; }
#active-filters { margin: 0 0 12px; font-size: 12px; }
</style>
</head>
<body class="admin-body" data-module="data" data-nav="board-c" data-title="商品与交易" data-crumb="数据 / 商品与交易" data-assist="1">
<div id="header-actions">
  <span class="muted" id="board-updated" style="margin-right:8px;font-size:12px"></span>
  <button class="btn" id="btn-export">导出</button>
</div>
<div id="page-content" style="display:none">

  <div class="board-tip">
    <b>商品分析：</b>按支付事件看全量成交结果与商品排行；不受获客渠道筛选影响。
    <span class="muted" id="scope-help-brief"></span>
  </div>

  <div class="board-filter">
    <div class="segmented" id="range-seg">
      <button type="button" class="active" data-range="7d">近7日</button>
      <button type="button" data-range="30d">近30日</button>
      <button type="button" data-range="today">今日</button>
      <button type="button" data-range="yesterday">昨日</button>
    </div>
    <select id="f-src"></select>
    <button class="btn" id="btn-reset">重置筛选</button>
    <span class="muted" style="font-size:12px;margin-left:8px">筛选变更后立即生效</span>
    <a class="btn" data-board-link="orders.html" href="orders.html">订单列表</a>
  </div>
  <div id="active-filters"></div>

  <div class="trade-zone" id="zone-full" style="margin-top:8px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px">
      <h2 style="margin:0;font-size:14px">成交结果分析 <span class="board-scope aux">支付事件</span></h2>
      <span class="muted" style="font-size:12px" id="full-caliber">受 range / 成交类型</span>
    </div>
    <div class="stat-cards board-stats" style="grid-template-columns:repeat(4,1fr)">
      <a class="stat-card" data-board-link="orders.html" data-board-attribution="full" href="orders.html">
        <div class="stat-label">全量支付订单</div>
        <div class="stat-value" id="full-orders">428</div>
        <div class="stat-hint">支付用户 <span id="full-pay-users">286</span></div>
      </a>
      <div class="stat-card">
        <div class="stat-label">全量 GMV</div>
        <div class="stat-value" style="font-size:22px" id="full-gmv">¥96,430</div>
        <div class="stat-hint">客单价 <span id="full-aov">¥225</span></div>
      </div>
      <a class="stat-card" href="refunds.html">
        <div class="stat-label">全量退款</div>
        <div class="stat-value" style="color:#f53f3f;font-size:20px" id="full-refund-amount">—</div>
        <div class="stat-hint">率 <span id="full-refund-rate">3.2%</span></div>
      </a>
      <div class="stat-card">
        <div class="stat-label">成交类型</div>
        <div class="stat-value" style="font-size:18px" id="full-src-label">全部</div>
        <div class="stat-hint">仅作用于本页</div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-hd">
        <h2>商品成交排行（全量）</h2>
        <span class="muted" style="font-size:12px;font-weight:400">订单 <b id="goods-orders">428</b> · GMV <b id="goods-gmv">¥96,430</b></span>
      </div>
      <div class="card-bd" style="padding:0">
        <table class="data">
          <thead><tr><th>商品</th><th>类型</th><th>订单</th><th>GMV</th><th>客单价</th><th>退款率</th></tr></thead>
          <tbody id="goods-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
<script src="../assets/js/proto.js"></script>
<script src="../assets/js/board-data.js?v=11"></script>
<script src="../assets/js/term-store.js?v=1"></script>
<script src="../assets/js/board-metrics.js?v=17"></script>
<script src="../assets/js/board-insights.js?v=11"></script>
<script src="../assets/js/board-term.js?v=1"></script>
<script src="../assets/js/board-dictionary.js?v=4"></script>
<script src="../assets/js/board-tools.js?v=6"></script>
<script src="../assets/js/admin-shell.js?v=28"></script>
<script>
(function () {
  BoardMetrics.ensureCaliberUI();
  BoardMetrics.setUpdatedNow();
  BoardMetrics.fillAttr();
  var brief = document.getElementById("scope-help-brief");
  if (brief) brief.textContent = " · 全量成交按支付事件统计";

  function highlightSection() {
    var q = new URLSearchParams(location.search);
    var section = q.get("section") || "";
    if (section === "full" || section === "attributed" || section === "attr") {
      var zf = document.getElementById("zone-full");
      if (zf) { zf.classList.add("is-highlight"); zf.scrollIntoView({ behavior: "smooth", block: "start" }); }
    }
  }

  function renderDetails(d, filters) {
    filters = filters || BoardMetrics.getFilters();
    var f = Object.assign({}, filters, { applySrc: true, channel: "" });
    d = BoardMetrics.aggregateLeadMetrics(f);

    document.getElementById("full-orders").textContent = BoardMetrics.fmt(d.fullOrders);
    document.getElementById("full-pay-users").textContent = BoardMetrics.fmt(d.fullPayUsers);
    document.getElementById("full-gmv").textContent = d.fullGmvDisplay != null ? BoardMetrics.fmt(d.fullGmvDisplay) : BoardMetrics.money(d.fullGmv);
    document.getElementById("full-aov").textContent = BoardMetrics.fmt(d.fullAov);
    document.getElementById("full-refund-amount").textContent = BoardMetrics.money(d.fullRefundAmount);
    document.getElementById("full-refund-rate").textContent = d.fullRefundRate || "—";
    var srcOpt = (BoardData.srcOptions || []).find(function (o) { return o.value === (f.src || ""); });
    document.getElementById("full-src-label").textContent = f.src ? (srcOpt ? srcOpt.label : f.src) : "全部";

    var products = BoardMetrics.getFullProductRows(f);
    var tbody = document.getElementById("goods-tbody");
    var po = 0, pg = 0;
    if (!products.length) {
      BoardMetrics.renderEmpty(tbody, 6);
      document.getElementById("goods-orders").textContent = "—";
      document.getElementById("goods-gmv").textContent = "—";
    } else {
      tbody.innerHTML = products.map(function (p) {
        po += p.orders || 0;
        pg += p.gmv || 0;
        var aov = p.orders ? Math.round(p.gmv / p.orders) : null;
        return "<tr><td>" + p.name + "</td><td>" + p.type + "</td><td>" + BoardMetrics.fmt(p.orders) +
          "</td><td>" + BoardMetrics.money(p.gmv) + "</td><td>" + (aov == null ? "—" : BoardMetrics.money(aov)) +
          "</td><td>" + p.refundRate + "</td></tr>";
      }).join("");
      document.getElementById("goods-orders").textContent = BoardMetrics.fmt(po);
      document.getElementById("goods-gmv").textContent = BoardMetrics.money(pg);
    }

    BoardMetrics.renderActiveFilters({ showSrc: true });
    BoardMetrics.wireBoardLinks();
  }

  function onChange(k, d, f) { renderDetails(d, f); }
  BoardMetrics.setFilters({ channel: "" }, { push: false });
  BoardMetrics.bindRange("range-seg", onChange);
  BoardMetrics.bindFilterBar({ onApply: onChange, showSrc: true, autoApply: true });
  highlightSection();
  document.getElementById("btn-export").style.display = "none";
  BoardTools.init({
    onApply: onChange,
    collectExtra: function () {
      return { section: "full" };
    },
    getExportTable: function () {
      var products = BoardMetrics.getFullProductRows(Object.assign({}, BoardMetrics.getFilters(), { applySrc: true }));
      if (!products.length) return { reason: "暂无商品成交数据", rows: [] };
      return {
        name: "商品成交排行",
        filename: BoardMetrics.exportFileName("商品成交排行"),
        headers: ["商品", "类型", "订单", "GMV", "客单价", "退款率"],
        rows: products.map(function (p) {
          var aov = p.orders ? Math.round(p.gmv / p.orders) : "—";
          return [p.name, p.type, p.orders, p.gmv, aov, p.refundRate];
        })
      };
    }
  });
})();
</script>
</body>
</html>
