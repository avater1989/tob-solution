<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>配置关卡 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/assess.css?v=3" />
<style>
.active-filter { background:#165dff !important; color:#fff !important; border-color:#165dff !important; }
.stage-tab { padding:6px 12px; border:1px solid #e8e8e8; border-radius:6px; background:#fff; cursor:pointer; font-size:12px; }
.stage-tab.on { border-color:#165dff; color:#165dff; background:#f0f5ff; font-weight:600; }
.st-card {
  background:#f7f8fa; border:1px solid #e8e8e8; border-radius:10px;
  padding:16px; margin-bottom:14px;
}
.st-card-hd {
  display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;
  margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid #e5e6eb;
}
.st-card-hd .field { margin:0; flex:1; min-width:140px; }
.st-card-hd .field label { font-size:12px; color:#4e5969; }
.st-add-row {
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  margin-bottom:12px;
}
.st-add-row .input { width:180px; }
.st-table { width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; }
.st-table th, .st-table td { padding:10px 12px; border-bottom:1px solid #f0f0f0; font-size:13px; text-align:left; }
.st-table th { background:#fafafa; color:#86909c; font-weight:500; }
.st-table tr:last-child td { border-bottom:0; }
.st-del { color:#f53f3f; cursor:pointer; font-size:13px; border:none; background:none; padding:0; }
.st-type-bar { display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin-bottom:14px; font-size:13px; }
.st-type-bar label { display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
</style>
</head>
<body class="admin-body" data-module="content" data-nav="assess-plans" data-title="配置关卡" data-crumb="商家管理后台 / 内容 / 学习服务 / 配置关卡">

<div id="header-actions">
  <a class="btn" href="assess-plans.html">返回计划列表</a>
  <button class="btn btn-primary" id="btn-save">保存配置</button>
</div>

<div id="page-content" style="display:none">
  <a href="assess-plans.html" style="display:inline-flex;color:#165dff;font-size:13px;margin-bottom:12px;text-decoration:none">← 返回计划列表</a>

  <div id="sync-banner" style="display:none"></div>

  <div style="margin-bottom:14px">
    <h1 style="margin:0 0 4px;font-size:22px">配置关卡</h1>
    <p class="muted" style="margin:0;font-size:13px"><b id="plan-name">—</b> · <span id="plan-mode">—</span></p>
  </div>

  <!-- 直接配置：关卡卡片 -->
  <div id="ui-direct" style="display:none">
    <div class="card" style="margin-bottom:14px"><div class="card-bd">
      <div class="st-type-bar">
        <span style="color:#4e5969"><b style="color:#f53f3f">*</b> 计划类型</span>
        <label><input type="radio" name="plan-type-show" disabled> 关联测评</label>
        <label><input type="radio" name="plan-type-show" checked disabled> 选择任务</label>
        <button class="btn btn-primary" id="btn-add-direct" style="margin-left:auto">添加关卡</button>
      </div>
      <div id="direct-stages"></div>
      <div id="direct-empty" class="muted" style="padding:28px;text-align:center;border:1px dashed #e8e8e8;border-radius:8px;display:none">
        暂无关卡，点击「添加关卡」开始配置
      </div>
    </div></div>

    <div class="card"><div class="card-bd">
      <h3 style="margin:0 0 8px;font-size:14px">解锁规则</h3>
      <p class="muted" style="font-size:12px;margin:0 0 10px">任务完成数据由外部执行模块提供，这里只定义下一关的判断条件</p>
      <label class="as-seg" style="display:block;cursor:pointer">
        <input type="radio" name="unlock" value="task-count" checked /> 完成任务数量
        <div class="muted" style="font-size:11px;margin:4px 0 6px 20px">完成指定数量的任务后解锁下一关</div>
        <div style="margin-left:20px"><input class="input" type="number" id="unlock-n" value="2" style="width:80px;display:inline-block" /> 个</div>
      </label>
      <label class="as-seg" style="display:block;cursor:pointer"><input type="radio" name="unlock" value="task-ratio" /> 完成任务占比</label>
    </div></div>
  </div>

  <!-- 关联测评：原三栏 -->
  <div id="ui-assess" style="display:none">
    <div class="card" style="margin-bottom:14px"><div class="card-bd">
      <h3 style="margin:0 0 8px;font-size:14px">1. 划分方式</h3>
      <p class="muted" style="font-size:12px;margin:0 0 10px">根据计划创建方式配置关卡内容</p>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-bottom:8px" id="divide-task">
        <input type="radio" name="divide" value="task" style="margin-top:3px" />
        <span><b>手动分配任务到关卡</b><br><span class="muted">将计划已选择的任务分配到不同关卡</span></span>
      </label>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px" id="divide-assess">
        <input type="radio" name="divide" value="assess" checked style="margin-top:3px" />
        <span><b>按关联测评划分关卡</b><br><span class="muted">每个测评可独立成关，或合并到同一关卡</span></span>
      </label>
    </div></div>

    <div class="as-stage-col">
      <div class="as-panel">
        <h3>可选任务</h3>
        <input class="input" id="task-q" placeholder="搜索任务名称..." style="margin-bottom:8px;width:100%" />
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px" id="task-filters">
          <button class="btn active-filter" data-filter="全部">全部</button>
          <button class="btn" data-filter="智能体">智能体</button>
          <button class="btn" data-filter="线上课">线上课</button>
          <button class="btn" data-filter="测评">测评</button>
          <button class="btn" data-filter="文章">文章</button>
        </div>
        <div id="task-pool"></div>
      </div>

      <div class="as-panel">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <h3 style="margin:0">关卡列表</h3>
          <div style="display:flex;gap:6px">
            <button class="btn" id="btn-add-stage">+ 添加关卡</button>
            <button class="btn" id="btn-del-stage" style="color:#f53f3f;border-color:#ffa39e">− 删除关卡</button>
          </div>
        </div>
        <div id="stage-tabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>
        <div class="field"><label>关卡名称</label><input class="input" id="stage-name" /></div>
        <div style="font-size:12px;color:#8c8c8c;margin-bottom:6px">已分配任务</div>
        <div id="stage-tasks"></div>
        <div style="margin-top:8px;font-size:12px" class="muted">在左侧选择任务后点「分配」加入当前关卡</div>
      </div>

      <div>
        <div class="as-panel" style="margin-bottom:14px">
          <h3>2. 解锁规则</h3>
          <p class="muted" style="font-size:12px;margin:0 0 10px">任务完成数据由外部执行模块提供</p>
          <label class="as-seg" style="display:block;cursor:pointer">
            <input type="radio" name="unlock-assess" value="task-count" checked /> 完成任务数量
            <div style="margin-left:20px;margin-top:6px"><input class="input" type="number" id="unlock-n-assess" value="2" style="width:80px;display:inline-block" /> 个</div>
          </label>
          <label class="as-seg" style="display:block;cursor:pointer"><input type="radio" name="unlock-assess" value="point-value" /> 完成积分值</label>
        </div>
        <div class="as-panel">
          <h3>配置预览</h3>
          <div id="preview"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/admin-shell.js?v=25"></script>
<script>
var PLAN_KEY = "tob_assess_plans_v1";
var FILE_TYPES = ["", "文档", "视频", "音频", "其它"];
var TASK_TYPES = ["线上课", "文章", "测评", "智能体"];
var TASK_POOL = [
  { id: "T1", name: "AI 助手自我介绍", type: "智能体" },
  { id: "T2", name: "亲子沟通基础 · 第1章", type: "线上课" },
  { id: "T3", name: "亲子沟通能力测评", type: "测评" },
  { id: "T4", name: "三分钟呼吸放松", type: "线上课" },
  { id: "T5", name: "家庭会议练习", type: "文章" },
  { id: "T6", name: "学习习惯打卡", type: "文章" },
  { id: "T7", name: "家庭教育顾问对话", type: "智能体" },
  { id: "T8", name: "心理健康测评", type: "测评" },
  { id: "T9", name: "阅读新学期家长指南", type: "文章" },
  { id: "T10", name: "情绪调节问卷", type: "测评" }
];

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

function loadDb() {
  try {
    var raw = localStorage.getItem(PLAN_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { plans: [], stages: {} };
}
function saveDb(db) {
  localStorage.setItem(PLAN_KEY, JSON.stringify(db));
}

var qs = new URLSearchParams(location.search);
var id = qs.get("id") || "MPL1";
var db = loadDb();
if (!db.plans || !db.plans.length) {
  db = {
    plans: [
      { id: "MPL1", name: "亲子沟通 21 天训练营计划", mode: "关联测评", source: "self", status: "进行中", links: [] },
      { id: "MPL2", name: "家庭教育风格改进计划", mode: "直接选择任务", source: "self", status: "草稿", links: [] },
      { id: "PPL1", name: "2025春季心理健康定制化计划", mode: "关联测评", source: "platform", status: "进行中", links: [] },
      { id: "MPL3", name: "青春期沟通能力提升计划", mode: "关联测评", source: "self", status: "草稿", links: [] },
      { id: "MPL4", name: "新手家长引导计划（草稿）", mode: "直接选择任务", source: "self", status: "草稿", links: [] }
    ],
    stages: {
      MPL1: [{ name: "认知觉察", fileType: "", summary: "", tasks: [{ id: "T3", name: "亲子沟通能力测评", type: "测评", weight: 1 }] }],
      MPL2: [
        { name: "学习基础", fileType: "视频", summary: "", tasks: [{ id: "T2", name: "亲子沟通基础 · 第1章", type: "线上课", weight: 1 }] },
        { name: "实践应用", fileType: "文档", summary: "", tasks: [{ id: "T5", name: "家庭会议练习", type: "文章", weight: 1 }] }
      ],
      PPL1: [{ name: "关卡 1", fileType: "", summary: "", tasks: [{ id: "T8", name: "心理健康测评", type: "测评", weight: 1 }] }],
      MPL3: [],
      MPL4: []
    }
  };
  saveDb(db);
}
var plan = (db.plans || []).find(function (p) { return p.id === id; }) || null;
var meta = plan || {
  id: id,
  name: "未命名计划",
  mode: "直接选择任务",
  source: "self"
};
var SYNC = meta.source === "platform" || qs.get("sync") === "1";
var isDirect = meta.mode === "直接选择任务";

document.getElementById("plan-name").textContent = meta.name || id;
document.getElementById("plan-mode").textContent = isDirect ? "选择任务" : (meta.mode || "关联测评");

if (SYNC) {
  document.getElementById("sync-banner").style.display = "";
  document.getElementById("sync-banner").innerHTML =
    '<div class="as-banner" style="background:#f9f0ff;border-color:#d3adf7;color:#531dab">「' +
    esc(meta.name) + '」由运营后台同步下发，关卡配置只读，仅可查看。</div>';
  document.getElementById("btn-save").disabled = true;
  document.getElementById("btn-save").style.opacity = ".5";
}

function normalizeStages(raw) {
  return (raw || []).map(function (s, i) {
    var tasks = (s.tasks || []).map(function (t) {
      if (typeof t === "string") {
        var hit = TASK_POOL.find(function (x) { return x.id === t || x.name === t; });
        return hit
          ? { id: hit.id, name: hit.name, type: hit.type, weight: 1 }
          : { id: t, name: t, type: "其它", weight: 1 };
      }
      return {
        id: t.id,
        name: t.name || t.id,
        type: t.type || "其它",
        weight: typeof t.weight === "number" ? t.weight : 1
      };
    });
    return {
      name: s.name || ("关卡 " + (i + 1)),
      fileType: s.fileType || "",
      summary: s.summary || "",
      tasks: tasks
    };
  });
}

var stages = normalizeStages(db.stages && db.stages[id]);
if (!stages.length && isDirect) {
  stages = [];
} else if (!stages.length && !isDirect) {
  stages = [{ name: "关卡 1", fileType: "", summary: "", tasks: [] }];
}

/* ========== 直接配置 UI ========== */
function taskOptionsHtml(type, selectedId) {
  return '<option value="">请选择任务</option>' + TASK_POOL.filter(function (t) {
    return !type || t.type === type;
  }).map(function (t) {
    return '<option value="' + esc(t.id) + '"' + (t.id === selectedId ? " selected" : "") + ">" + esc(t.name) + "</option>";
  }).join("");
}

function renderDirect() {
  var box = document.getElementById("direct-stages");
  var empty = document.getElementById("direct-empty");
  empty.style.display = stages.length ? "none" : "";
  document.getElementById("btn-add-direct").disabled = SYNC;
  if (SYNC) document.getElementById("btn-add-direct").style.opacity = ".5";

  box.innerHTML = stages.map(function (s, si) {
    var typeSel = '<select class="input" data-pick-type="' + si + '" ' + (SYNC ? "disabled" : "") + ">" +
      '<option value="">请选择任务类型</option>' +
      TASK_TYPES.map(function (tp) {
        return '<option value="' + esc(tp) + '">' + esc(tp) + "</option>";
      }).join("") + "</select>";
    var taskSel = '<select class="input" data-pick-task="' + si + '" ' + (SYNC ? "disabled" : "") + ">" +
      '<option value="">请选择任务</option></select>';
    var rows = s.tasks.map(function (t, ti) {
      return "<tr>" +
        "<td>" + (ti + 1) + "</td>" +
        "<td>" + esc(t.name) + ' <span class="as-tag blue" style="margin-left:4px">' + esc(t.type) + "</span></td>" +
        '<td><input class="input" type="number" min="1" style="width:72px" data-weight="' + si + '" data-ti="' + ti + '" value="' + (t.weight || 1) + '" ' + (SYNC ? "disabled" : "") + " /></td>" +
        "<td>" + (SYNC ? "—" : '<button type="button" class="st-del" data-rm-task="' + si + '" data-ti="' + ti + '">移除</button>') + "</td>" +
        "</tr>";
    }).join("") || '<tr><td colspan="4" class="muted" style="text-align:center">暂无任务，请选择类型与任务后添加</td></tr>';

    return '<div class="st-card" data-stage-card="' + si + '">' +
      '<div class="st-card-hd">' +
        '<div class="field" style="flex:0 0 160px"><label><span style="color:#f53f3f">*</span> 关卡' + (si + 1) + "</label>" +
          '<input class="input" data-name="' + si + '" value="' + esc(s.name) + '" ' + (SYNC ? "disabled" : "") + " /></div>" +
        '<div class="field" style="flex:0 0 160px"><label>文件类型</label>' +
          '<select class="input" data-filetype="' + si + '" ' + (SYNC ? "disabled" : "") + ">" +
            FILE_TYPES.map(function (ft) {
              return '<option value="' + esc(ft) + '"' + (s.fileType === ft ? " selected" : "") + ">" +
                (ft || "请选择文件类型") + "</option>";
            }).join("") +
          "</select></div>" +
        '<div class="field" style="flex:1"><label>阶段总结</label>' +
          '<input class="input" data-summary="' + si + '" placeholder="请输入阶段总结" value="' + esc(s.summary) + '" ' + (SYNC ? "disabled" : "") + " /></div>" +
        (SYNC ? "" : '<button type="button" class="st-del" data-rm-stage="' + si + '" style="margin-bottom:4px">删除</button>') +
      "</div>" +
      '<div class="st-add-row">' +
        "<span style=\"font-size:13px;color:#4e5969\">任务</span>" +
        typeSel + taskSel +
        (SYNC ? "" : '<button type="button" class="btn btn-primary" data-add-task="' + si + '">添加</button>') +
      "</div>" +
      '<table class="st-table"><thead><tr><th style="width:64px">序号</th><th>任务</th><th style="width:100px">权重</th><th style="width:80px">操作</th></tr></thead>' +
      "<tbody>" + rows + "</tbody></table>" +
    "</div>";
  }).join("");
}

document.getElementById("ui-direct").addEventListener("click", function (e) {
  if (SYNC) return;
  var addStage = e.target.closest("#btn-add-direct");
  if (addStage || e.target.id === "btn-add-direct") return;
  var rmStage = e.target.closest("[data-rm-stage]");
  if (rmStage) {
    stages.splice(+rmStage.getAttribute("data-rm-stage"), 1);
    renderDirect();
    return;
  }
  var addTask = e.target.closest("[data-add-task]");
  if (addTask) {
    var si = +addTask.getAttribute("data-add-task");
    var card = document.querySelector('[data-stage-card="' + si + '"]');
    var typeEl = card.querySelector("[data-pick-type]");
    var taskEl = card.querySelector("[data-pick-task]");
    var tid = taskEl.value;
    if (!typeEl.value) { Proto.toast("请选择任务类型"); return; }
    if (!tid) { Proto.toast("请选择任务"); return; }
    var t = TASK_POOL.find(function (x) { return x.id === tid; });
    if (!t) return;
    if (stages[si].tasks.some(function (x) { return x.id === tid; })) {
      Proto.toast("该任务已在本关卡中");
      return;
    }
    stages[si].tasks.push({ id: t.id, name: t.name, type: t.type, weight: 1 });
    renderDirect();
    Proto.toast("已添加任务");
    return;
  }
  var rmTask = e.target.closest("[data-rm-task]");
  if (rmTask) {
    var s2 = +rmTask.getAttribute("data-rm-task");
    var ti = +rmTask.getAttribute("data-ti");
    stages[s2].tasks.splice(ti, 1);
    renderDirect();
  }
});

document.getElementById("btn-add-direct").onclick = function () {
  if (SYNC) { Proto.toast("平台同步计划的关卡由平台维护"); return; }
  stages.push({ name: "关卡" + (stages.length + 1), fileType: "", summary: "", tasks: [] });
  renderDirect();
};

document.getElementById("ui-direct").addEventListener("change", function (e) {
  if (SYNC) return;
  var t = e.target;
  if (t.hasAttribute("data-pick-type")) {
    var si = +t.getAttribute("data-pick-type");
    var card = document.querySelector('[data-stage-card="' + si + '"]');
    var taskEl = card.querySelector("[data-pick-task]");
    taskEl.innerHTML = taskOptionsHtml(t.value, "");
    return;
  }
  if (t.hasAttribute("data-name")) {
    stages[+t.getAttribute("data-name")].name = t.value;
    return;
  }
  if (t.hasAttribute("data-filetype")) {
    stages[+t.getAttribute("data-filetype")].fileType = t.value;
    return;
  }
  if (t.hasAttribute("data-summary")) {
    stages[+t.getAttribute("data-summary")].summary = t.value;
    return;
  }
  if (t.hasAttribute("data-weight")) {
    var wsi = +t.getAttribute("data-weight");
    var wti = +t.getAttribute("data-ti");
    stages[wsi].tasks[wti].weight = Math.max(1, +t.value || 1);
    return;
  }
});

document.getElementById("ui-direct").addEventListener("input", function (e) {
  if (SYNC) return;
  var t = e.target;
  if (t.hasAttribute("data-name")) {
    stages[+t.getAttribute("data-name")].name = t.value;
  }
  if (t.hasAttribute("data-summary")) {
    stages[+t.getAttribute("data-summary")].summary = t.value;
  }
});

/* ========== 关联测评 UI（原逻辑，任务对象化） ========== */
var filter = "全部";
var cur = 0;
var TASKS = TASK_POOL.slice();

function taskById(tid) { return TASKS.find(function (t) { return t.id === tid; }); }
function assignedIds() {
  var set = {};
  stages.forEach(function (s) {
    s.tasks.forEach(function (t) { set[t.id || t] = 1; });
  });
  return set;
}

function renderPool() {
  var el = document.getElementById("task-pool");
  if (!el) return;
  var q = (document.getElementById("task-q").value || "").trim();
  var used = assignedIds();
  el.innerHTML = TASKS.filter(function (t) {
    if (filter !== "全部" && t.type !== filter) return false;
    if (q && t.name.indexOf(q) < 0) return false;
    return true;
  }).map(function (t) {
    var disabled = used[t.id] ? " opacity:.45" : "";
    var action = used[t.id] ? '<span class="muted">已分配</span>'
      : SYNC ? '<span class="as-tag gray">只读</span>'
      : '<select class="input" style="width:90px;padding:2px 6px;font-size:12px" data-assign="' + t.id + '">' +
          '<option value="">分配</option>' +
          stages.map(function (s, i) { return '<option value="' + i + '">' + esc(s.name) + "</option>"; }).join("") +
        "</select>";
    return '<div class="as-task" style="' + disabled + '">' +
      '<span class="as-tag blue">' + esc(t.type) + "</span>" +
      '<span style="flex:1">' + esc(t.name) + "</span>" +
      action +
    "</div>";
  }).join("") || '<div class="muted" style="padding:12px;text-align:center">无匹配任务</div>';
}

function renderAssessStages() {
  document.getElementById("stage-tabs").innerHTML = stages.map(function (s, i) {
    return '<button type="button" class="stage-tab' + (i === cur ? " on" : "") + '" data-stage="' + i + '">' + esc(s.name) + "</button>";
  }).join("");
  var s = stages[cur];
  if (!s) return;
  document.getElementById("stage-name").value = s.name;
  document.getElementById("btn-del-stage").disabled = SYNC || stages.length <= 1;
  document.getElementById("stage-tasks").innerHTML = s.tasks.map(function (t) {
    var tid = t.id || t;
    var row = typeof t === "object" ? t : taskById(tid);
    if (!row) return "";
    return '<div class="as-task"><span class="as-tag blue">' + esc(row.type) + '</span><span style="flex:1">' + esc(row.name) + "</span>" +
      (SYNC ? "" : '<button class="btn" data-unassign="' + esc(tid) + '" style="padding:0 6px;color:#f53f3f">移除</button>') + "</div>";
  }).join("") || '<div class="muted" style="padding:10px;border:1px dashed #e8e8e8;border-radius:6px;text-align:center">暂无任务</div>';
  renderAssessPreview();
}

function renderAssessPreview() {
  var n = +document.getElementById("unlock-n-assess").value || 2;
  document.getElementById("preview").innerHTML = stages.map(function (s, i) {
    return '<div class="as-preview-item"><b>' + esc(s.name) + '</b> · ' + s.tasks.length + ' 个任务' +
      (i === 0 ? " · 默认解锁" : " · 完成 " + n + " 个任务后解锁") + "</div>";
  }).join("");
}

if (!isDirect) {
  document.getElementById("task-filters").addEventListener("click", function (e) {
    var b = e.target.closest("[data-filter]"); if (!b) return;
    document.querySelectorAll("#task-filters .btn").forEach(function (x) { x.classList.remove("active-filter"); });
    b.classList.add("active-filter");
    filter = b.getAttribute("data-filter");
    renderPool();
  });
  document.getElementById("task-q").addEventListener("input", renderPool);
  document.getElementById("btn-add-stage").onclick = function () {
    if (SYNC) { Proto.toast("平台同步计划的关卡由平台维护"); return; }
    stages.push({ name: "关卡 " + (stages.length + 1), fileType: "", summary: "", tasks: [] });
    cur = stages.length - 1;
    renderAssessStages();
    renderPool();
  };
  document.getElementById("btn-del-stage").onclick = function () {
    if (SYNC || stages.length <= 1) return;
    stages.splice(cur, 1);
    cur = Math.max(0, cur - 1);
    renderAssessStages();
    renderPool();
  };
  document.getElementById("stage-name").addEventListener("input", function () {
    if (SYNC || !stages[cur]) return;
    stages[cur].name = this.value;
    renderAssessStages();
    renderPool();
  });
  document.getElementById("stage-tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-stage]"); if (!b) return;
    cur = +b.getAttribute("data-stage");
    renderAssessStages();
  });
  document.addEventListener("change", function (e) {
    var sel = e.target.closest("[data-assign]");
    if (sel && sel.value !== "") {
      if (SYNC) return;
      var tid = sel.getAttribute("data-assign");
      var si = +sel.value;
      var t = taskById(tid);
      if (!t) return;
      stages[si].tasks.push({ id: t.id, name: t.name, type: t.type, weight: 1 });
      renderAssessStages();
      renderPool();
      Proto.toast("已分配到 " + stages[si].name);
    }
    if (e.target.name === "unlock-assess" || e.target.id === "unlock-n-assess") renderAssessPreview();
  });
  document.addEventListener("click", function (e) {
    var u = e.target.closest("[data-unassign]");
    if (!u || isDirect) return;
    if (SYNC) return;
    var tid = u.getAttribute("data-unassign");
    stages[cur].tasks = stages[cur].tasks.filter(function (x) { return (x.id || x) !== tid; });
    renderAssessStages();
    renderPool();
  });
}

document.getElementById("btn-save").onclick = function () {
  if (SYNC) { Proto.toast("平台同步计划的关卡由平台维护"); return; }
  if (isDirect && !stages.length) {
    Proto.toast("请至少添加 1 个关卡");
    return;
  }
  if (isDirect && stages.some(function (s) { return !s.tasks.length; })) {
    Proto.toast("每个关卡至少添加 1 个任务");
    return;
  }
  db = loadDb();
  if (!db.stages) db.stages = {};
  db.stages[id] = stages;
  if (plan) {
    var idx = (db.plans || []).findIndex(function (p) { return p.id === id; });
    if (idx >= 0) {
      var links = [];
      stages.forEach(function (s) {
        s.tasks.forEach(function (t) {
          if (links.indexOf(t.name) < 0) links.push(t.name);
        });
      });
      db.plans[idx].links = links;
    }
  }
  saveDb(db);
  Proto.toast("关卡配置已保存");
  setTimeout(function () { location.href = "assess-plans.html"; }, 400);
};

if (isDirect) {
  document.getElementById("ui-direct").style.display = "";
  renderDirect();
} else {
  document.getElementById("ui-assess").style.display = "";
  if (SYNC) {
    var aS = document.getElementById("btn-add-stage");
    var dS = document.getElementById("btn-del-stage");
    if (aS) { aS.disabled = true; aS.style.opacity = ".5"; }
    if (dS) { dS.disabled = true; dS.style.opacity = ".5"; }
  }
  renderPool();
  renderAssessStages();
}
</script>
</body>
</html>
