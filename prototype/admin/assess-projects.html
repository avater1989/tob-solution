<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>测评 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/assess.css?v=6" />
</head>
<body class="admin-body" data-module="content" data-nav="assess-projects" data-title="测评" data-crumb="内容 / 测评中心 / 测评">

<div id="header-actions">
  <button class="btn btn-primary" id="btn-new">+ 新建项目</button>
</div>

<div id="page-content" style="display:none">
  <div class="as-banner">管理本店铺的测评项目。每个测评<strong>仅关联一份</strong>报告模板（在新建/编辑中设置），用于生成学员测评报告。</div>

  <div class="card" style="margin-bottom:14px"><div class="card-bd" style="padding:12px 16px">
    <div class="toolbar" style="border:none;padding:0;background:transparent">
      <input class="input" id="f-q" placeholder="搜索项目名称、描述..." style="width:240px" />
      <select class="input" id="f-shelf" style="width:130px">
        <option value="">全部上下架</option><option>已上架</option><option>已下架</option>
      </select>
      <button class="btn btn-primary" id="btn-query">查询</button>
      <button class="btn" id="btn-reset">重置</button>
    </div>
  </div></div>

  <table class="as-table">
    <thead>
      <tr>
        <th style="width:56px">序号</th>
        <th>项目名称</th>
        <th style="width:70px">题目数</th>
        <th style="width:180px">报告模板</th>
        <th style="width:80px">状态</th>
        <th style="width:80px">上下架</th>
        <th style="width:110px">创建时间</th>
        <th style="width:280px">操作</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div style="display:flex;align-items:center;gap:8px;margin-top:14px">
    <span style="color:#8c8c8c;font-size:12px">共 <b id="cnt">0</b> 条</span>
  </div>
</div>

<div class="proto-modal" id="modal-edit">
  <div style="background:#fff;border-radius:10px;width:520px;max-width:94vw;overflow:hidden">
    <div class="proto-modal-hd"><h3 style="margin:0;font-size:16px" id="m-title">新建测评项目</h3><button class="ctrl-icon-btn" data-close>×</button></div>
    <div class="proto-modal-bd">
      <div class="field"><label>项目名称 *</label><input class="input" id="np-name" placeholder="如：亲子沟通能力测评" /></div>
      <div class="field"><label>项目描述</label><textarea class="input" id="np-desc" rows="2" placeholder="简要说明测评目的"></textarea></div>
      <div class="field"><label>报告模板 * <span class="muted" style="font-weight:400">每个测评仅可关联一份</span></label>
        <select class="input" id="np-tpl"></select>
        <p class="muted" style="font-size:12px;margin:6px 0 0">模板在 <a href="assess-report-templates.html" target="_blank">报告模板</a> 中维护，并绑定智能体生成解读。</p>
      </div>
    </div>
    <div class="proto-modal-ft" style="justify-content:flex-end;gap:8px">
      <button class="btn" data-close>取消</button>
      <button class="btn btn-primary" id="btn-save">保存</button>
    </div>
  </div>
</div>

<div class="proto-modal" id="modal-view">
  <div style="background:#fff;border-radius:10px;width:520px;max-width:94vw;max-height:88vh;overflow:hidden;display:flex;flex-direction:column">
    <div class="proto-modal-hd"><h3 style="margin:0;font-size:16px">测评项目详情</h3><button class="ctrl-icon-btn" data-close>×</button></div>
    <div class="proto-modal-bd" id="view-bd" style="overflow:auto"></div>
    <div class="proto-modal-ft" style="justify-content:flex-end;gap:8px">
      <button class="btn" data-close>关闭</button>
    </div>
  </div>
</div>

<div class="proto-mask" id="mask"></div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/assess-report-store.js?v=2"></script>
<script src="../assets/js/admin-shell.js?v=25"></script>
<script>
var ReportStore = window.AssessReportStore;
var editingId = null;
var PROJECTS = [
  { id:"MP01", name:"亲子沟通能力测评", desc:"评估家长与孩子的沟通模式与冲突处理", questions:12, status:"已上架", shelf:"已上架", created:"2026-08-12", rules:2, reportTemplateId:"RT01" },
  { id:"MP02", name:"家庭教育风格测评", desc:"识别家庭教养风格与边界设定倾向", questions:8, status:"草稿", shelf:"已下架", created:"2026-09-02", rules:0, reportTemplateId:"RT02" },
  { id:"PP01", name:"心理健康测评", desc:"综合心理健康评估", questions:1, status:"已上架", shelf:"已上架", created:"2024-11-15", rules:3, reportTemplateId:"RT03" },
  { id:"PP02", name:"学习能力诊断", desc:"评估学习风格与能力结构", questions:12, status:"已上架", shelf:"已上架", created:"2026-08-20", rules:2, reportTemplateId:"RT01" },
  { id:"PP03", name:"情绪调节问卷", desc:"评估情绪调节能力与压力应对", questions:5, status:"草稿", shelf:"已下架", created:"2026-09-01", rules:0, reportTemplateId:"" }
];

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }
function filtered() {
  var q = (document.getElementById("f-q").value||"").trim();
  var shelf = document.getElementById("f-shelf").value;
  return PROJECTS.filter(function(p){
    if (shelf && p.shelf !== shelf) return false;
    if (q && (p.name+p.desc).indexOf(q) < 0) return false;
    return true;
  });
}

function render() {
  var list = filtered();
  document.getElementById("cnt").textContent = list.length;
  document.getElementById("tbody").innerHTML = list.map(function(p,i){
    var acts = '<button class="btn" data-view="'+p.id+'">查看</button>' +
      '<button class="btn" data-edit="'+p.id+'">编辑</button>' +
      '<a class="btn" href="assess-questions.html?id='+p.id+'">配置题目/跳转</a>' +
      '<a class="btn" href="assess-scoring.html?id='+p.id+'">计分规则</a>' +
      '<a class="btn" href="assess-task-rules.html?id='+p.id+'">任务触发规则</a>' +
      '<a class="btn" href="assess-results.html?assess_id='+p.id+'">测评报告</a>' +
      '<a class="btn" href="assess-series.html">加入测评包</a>' +
      '<a class="btn" href="goods-edit.html?content_id='+p.id+'&type=assess">创建商品</a>' +
      '<a class="btn" href="assess-plans.html?from=assess&id='+p.id+'">生成计划</a>' +
      (p.shelf==='已上架'
        ? '<button class="btn" data-shelf="'+p.id+'">下架</button>'
        : '<button class="btn btn-primary" data-shelf="'+p.id+'">上架</button>') +
      '<button class="btn" style="color:#f53f3f;border-color:#ffa39e" data-del="'+p.id+'">删除</button>';
    return '<tr>' +
      '<td style="color:#8c8c8c">'+(i+1)+'</td>' +
      '<td><div class="as-name">'+esc(p.name)+'</div><div class="as-desc">'+esc(p.desc)+'</div></td>' +
      '<td>'+p.questions+'</td>' +
      '<td style="font-size:12px">'+esc(ReportStore.templateLabel(p.reportTemplateId))+'</td>' +
      '<td><span class="as-tag '+(p.status==='已上架'?'green':'gray')+'">'+esc(p.status)+'</span></td>' +
      '<td><span class="as-tag '+(p.shelf==='已上架'?'green':'orange')+'">'+esc(p.shelf)+'</span></td>' +
      '<td style="font-size:12px;color:#8c8c8c">'+esc(p.created)+'</td>' +
      '<td><div class="as-acts">' + acts + '</div></td></tr>';
  }).join("") || '<tr><td colspan="8" style="text-align:center;color:#bfbfbf;padding:28px">暂无项目</td></tr>';
}

var mask = document.getElementById("mask");
function closeAll(){ mask.classList.remove("open"); document.querySelectorAll(".proto-modal").forEach(function(n){n.classList.remove("open");}); }
function openM(id){ mask.classList.add("open"); document.getElementById(id).classList.add("open"); }

function openEdit(id) {
  editingId = id;
  var p = id ? PROJECTS.find(function(x){ return x.id === id; }) : null;
  document.getElementById("m-title").textContent = p ? "编辑测评项目" : "新建测评项目";
  document.getElementById("np-name").value = p ? p.name : "";
  document.getElementById("np-desc").value = p ? p.desc : "";
  document.getElementById("np-tpl").innerHTML = ReportStore.templateOptionsHtml(p ? p.reportTemplateId : "");
  openM("modal-edit");
}

document.getElementById("btn-query").onclick = render;
document.getElementById("btn-reset").onclick = function(){ document.getElementById("f-q").value=""; document.getElementById("f-shelf").value=""; render(); };
document.getElementById("btn-new").onclick = function(){ openEdit(null); };

document.getElementById("btn-save").onclick = function(){
  var name = document.getElementById("np-name").value.trim();
  var tpl = document.getElementById("np-tpl").value;
  if (!name) { Proto.toast("请填写项目名称"); return; }
  if (!tpl) { Proto.toast("请选择报告模板"); return; }
  if (editingId) {
    var p = PROJECTS.find(function(x){ return x.id === editingId; });
    p.name = name;
    p.desc = document.getElementById("np-desc").value.trim() || "暂无项目描述";
    p.reportTemplateId = tpl;
    closeAll();
    render();
    Proto.toast("已保存");
    return;
  }
  var nid = "MP" + Date.now().toString().slice(-4);
  PROJECTS.unshift({
    id:nid, name:name, desc:document.getElementById("np-desc").value.trim()||"暂无项目描述",
    questions:0, status:"草稿", shelf:"已下架",
    created:new Date().toISOString().slice(0,10), rules:0, reportTemplateId:tpl
  });
  closeAll();
  location.href = "assess-questions.html?id=" + nid;
};

document.addEventListener("click", function(e){
  var edit = e.target.closest("[data-edit]");
  if (edit) { openEdit(edit.getAttribute("data-edit")); return; }
  var view = e.target.closest("[data-view]");
  if (view) {
    var p0 = PROJECTS.find(function(x){return x.id===view.getAttribute("data-view");});
    document.getElementById("view-bd").innerHTML =
      '<div class="as-name" style="font-size:16px;margin-bottom:10px">'+esc(p0.name)+'</div>' +
      '<div style="font-size:13px;line-height:2">' +
        '<div>描述：'+esc(p0.desc)+'</div>' +
        '<div>题目数：'+p0.questions+' · 状态：'+esc(p0.status)+' · '+esc(p0.shelf)+'</div>' +
        '<div>报告模板：'+esc(ReportStore.templateLabel(p0.reportTemplateId))+'</div>' +
        '<div>关联规则：'+p0.rules+' 条</div>' +
      '</div>';
    openM("modal-view"); return;
  }
  var shelf = e.target.closest("[data-shelf]");
  if (shelf) {
    var p3 = PROJECTS.find(function(x){return x.id===shelf.getAttribute("data-shelf");});
    if (p3.shelf==="已上架") { p3.shelf="已下架"; Proto.toast("已下架"); }
    else { p3.shelf="已上架"; p3.status="已上架"; Proto.toast("已上架"); }
    render(); return;
  }
  var del = e.target.closest("[data-del]");
  if (del) {
    var pd = PROJECTS.find(function(x){return x.id===del.getAttribute("data-del");});
    PROJECTS = PROJECTS.filter(function(x){return x.id!==pd.id;}); render(); Proto.toast("已删除"); return;
  }
});

mask.addEventListener("click", closeAll);
document.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeAll); });
render();
</script>
</body>
</html>
