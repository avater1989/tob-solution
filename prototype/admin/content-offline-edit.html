<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>编辑线下课 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
<link rel="stylesheet" href="../assets/css/content-mgmt.css?v=3" />
<style>
.goods-sale { display:flex; gap:16px; flex-wrap:wrap; }
.goods-sale label { display:inline-flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; }
.paid-box { display:none; margin-top:12px; padding:12px 14px; background:#f7f8fa; border-radius:6px; }
.paid-box.show { display:block; }
.paid-hint { font-size:12px; color:#86909c; margin-top:8px; line-height:1.5; }
</style>
</head>
<body class="admin-body" data-module="content" data-nav="content-offline" data-title="编辑线下课" data-crumb="内容 / 内容管理 / 线下课 / 编辑">

<div id="header-actions">
  <a class="btn" href="content-offline.html">返回列表</a>
  <button class="btn" id="btn-draft">保存草稿</button>
  <button class="btn" id="btn-preview">用户端预览</button>
  <button class="btn btn-primary" id="btn-publish">保存并上架</button>
</div>

<div id="page-content" style="display:none">
  <a class="cm-back" href="content-offline.html">← 返回线下课列表</a>
  <div class="cm-page-hd">
    <div>
      <h1 id="e-title">新建线下课</h1>
      <p class="sub">一场一课：配置报名窗口、开课时间与免费/付费报名资格；付费将生成本场线下门票商品</p>
    </div>
  </div>

  <div class="cm-anchor" id="anchors">
    <button class="btn active" data-goto="sec-content">内容信息</button>
    <button class="btn" data-goto="sec-time">时间与名额</button>
    <button class="btn" data-goto="sec-access">报名资格</button>
  </div>

  <div class="cm-section" id="sec-content">
    <div class="cm-section-hd"><h2>内容信息</h2></div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field" style="grid-column:1/-1">
        <label>线下课名称 * <span style="float:right;color:#8c8c8c;font-weight:400" id="name-cnt">0/45</span></label>
        <input class="input" id="f-name" maxlength="45" placeholder="建议 14 字内" />
      </div>
      <div class="field">
        <label>内容分类</label>
        <select class="input" id="f-cat"></select>
      </div>
      <div class="field">
        <label>讲师</label>
        <input class="input" id="f-teacher" placeholder="如：赵老师" />
      </div>
      <div class="field"><label>封面</label><div class="cm-cover-up has-img"><img id="f-cover" src="../assets/img/covers/classroom.jpg" alt="" /><span class="cm-cover-tip">更换封面</span></div></div>
      <div class="field">
        <label>城市</label>
        <input class="input" id="f-city" placeholder="如：上海" />
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>地址</label>
        <input class="input" id="f-address" placeholder="详细场地地址" />
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>简介 <span style="float:right;color:#8c8c8c;font-weight:400">≤256 字</span></label>
        <textarea class="input" id="f-intro" rows="2" maxlength="256" placeholder="一句话介绍本场线下课"></textarea>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>详情</label>
        <textarea class="input" id="f-detail" rows="4" placeholder="课程安排、适合人群、注意事项等"></textarea>
      </div>
    </div>
  </div>

  <div class="cm-section" id="sec-time">
    <div class="cm-section-hd"><h2>时间与名额 <span class="hint">报名窗外不可报名；课程时间用于列表派生状态</span></h2></div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field">
        <label>报名开始 *</label>
        <input class="input" type="datetime-local" id="f-signup-start" />
      </div>
      <div class="field">
        <label>报名截止 *</label>
        <input class="input" type="datetime-local" id="f-signup-end" />
      </div>
      <div class="field">
        <label>课程开始 *</label>
        <input class="input" type="datetime-local" id="f-course-start" />
      </div>
      <div class="field">
        <label>课程结束 *</label>
        <input class="input" type="datetime-local" id="f-course-end" />
      </div>
      <div class="field">
        <label>名额</label>
        <input class="input" type="number" id="f-capacity" min="1" placeholder="不填则不限" />
      </div>
    </div>
    <p class="paid-hint" id="time-hint">校验：报名截止 ≥ 报名开始；课程结束 ≥ 课程开始；课程开始 ≥ 报名开始为软提示。</p>
  </div>

  <div class="cm-section" id="sec-access">
    <div class="cm-section-hd"><h2>报名资格 <span class="hint">付费购买的是本场报名资格，不是挂载课</span></h2></div>
    <div class="field">
      <label>获取方式 *</label>
      <div class="goods-sale" id="access-modes">
        <label><input type="radio" name="access" value="free" checked /><span>免费</span></label>
        <label><input type="radio" name="access" value="paid" /><span>付费</span></label>
      </div>
      <div class="paid-box" id="paid-box">
        <div class="field" style="margin:0">
          <label>门票价格（元）*</label>
          <input class="input" type="number" id="f-price" min="0.01" step="0.01" placeholder="如 99" style="max-width:200px" />
        </div>
        <p class="paid-hint">选择付费后，会生成一款「线下门票」商品，需上架后对 C 端生效。购买获得的是本场报名资格（按线下课 ID 隔离）。</p>
      </div>
    </div>
    <div class="field" style="margin-top:16px">
      <label>退款规则</label>
      <div class="cm-choice col">
        <label><input type="radio" name="refund" value="before" checked> 未开课可退</label>
        <label><input type="radio" name="refund" value="none"> 不支持退款</label>
      </div>
    </div>
    <div class="field">
      <label>上架设置</label>
      <div class="cm-choice col">
        <label><input type="radio" name="shelf" value="now" checked> 立即上架（保存后提交内容审核队列）</label>
        <label><input type="radio" name="shelf" value="schedule"> 定时上架 <input type="datetime-local" class="input" style="width:200px;margin-left:8px" /></label>
        <label><input type="radio" name="shelf" value="draft"> 暂存草稿</label>
      </div>
    </div>
    <div class="field">
      <label>店铺显示</label>
      <div class="cm-choice">
        <label><input type="radio" name="store" value="show" checked> 显示</label>
        <label><input type="radio" name="store" value="hide"> 隐藏（仅可通过链接访问）</label>
      </div>
    </div>
  </div>

  <div class="cm-sticky-ft">
    <a class="btn" href="content-offline.html">取消</a>
    <button class="btn" id="btn-draft2">保存草稿</button>
    <button class="btn" id="btn-preview2">用户端预览</button>
    <button class="btn btn-primary" id="btn-publish2">保存并上架</button>
  </div>
</div>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/content-cats.js?v=1"></script>
<script src="../assets/js/admin-shell.js?v=20"></script>
<script>
var PRESET = {
  O001: {
    name: "卓越家族培养计划 · 线下工作坊",
    cat: "家庭教育",
    teacher: "赵老师",
    city: "上海",
    address: "浦东新区陆家嘴环路 1000 号 3F 会议室",
    intro: "两天沉浸式工作坊，聚焦家族沟通与边界。",
    detail: "Day1 家庭系统觉察；Day2 沟通实操与复盘。请提前 15 分钟到场。",
    signupStart: "2026-09-01T10:00",
    signupEnd: "2026-09-25T23:59",
    courseStart: "2026-09-28T09:30",
    courseEnd: "2026-09-29T17:00",
    capacity: 100,
    access: "paid",
    price: 299,
    cover: "../assets/img/covers/classroom.jpg"
  },
  O002: {
    name: "亲子沟通实战 · 线下沙龙",
    cat: "K12 教育",
    teacher: "阮荣均",
    city: "深圳",
    address: "南山区科技园南路 8 号活动厅",
    intro: "半天沙龙，现场演练亲子对话。",
    detail: "含破冰、案例演练、答疑。名额有限。",
    signupStart: "2026-09-10T09:00",
    signupEnd: "2026-10-05T18:00",
    courseStart: "2026-10-12T14:00",
    courseEnd: "2026-10-12T17:30",
    capacity: 40,
    access: "free",
    price: 0,
    cover: "../assets/img/covers/talk.jpg"
  },
  O003: {
    name: "学习习惯养成 · 线下营（筹备中）",
    cat: "K12 教育",
    teacher: "王助教",
    city: "北京",
    address: "朝阳区望京街道待定",
    intro: "三日营，筹备中。",
    detail: "筹备中，报名窗尚未开放。",
    signupStart: "2026-11-01T10:00",
    signupEnd: "2026-11-20T23:59",
    courseStart: "2026-11-28T09:00",
    courseEnd: "2026-11-30T16:00",
    capacity: 30,
    access: "paid",
    price: 999,
    cover: "../assets/img/covers/parent.jpg"
  }
};

var catSel = document.getElementById("f-cat");
catSel.insertAdjacentHTML("beforeend", window.ContentCats.optionsHtml({ emptyLabel: "未分类" }));

var id = new URLSearchParams(location.search).get("id") || "";
var isNew = !id || !PRESET[id];
document.getElementById("e-title").textContent = isNew ? "新建线下课" : "编辑线下课";

function fill(p) {
  document.getElementById("f-name").value = p.name || "";
  document.getElementById("f-teacher").value = p.teacher || "";
  document.getElementById("f-city").value = p.city || "";
  document.getElementById("f-address").value = p.address || "";
  document.getElementById("f-intro").value = p.intro || "";
  document.getElementById("f-detail").value = p.detail || "";
  document.getElementById("f-signup-start").value = p.signupStart || "";
  document.getElementById("f-signup-end").value = p.signupEnd || "";
  document.getElementById("f-course-start").value = p.courseStart || "";
  document.getElementById("f-course-end").value = p.courseEnd || "";
  document.getElementById("f-capacity").value = p.capacity || "";
  document.getElementById("f-price").value = p.price || "";
  if (p.cover) document.getElementById("f-cover").src = p.cover;
  catSel.value = p.cat || "";
  if (catSel.selectedIndex < 0) catSel.selectedIndex = 0;
  var access = p.access || "free";
  var radio = document.querySelector('input[name="access"][value="' + access + '"]');
  if (radio) radio.checked = true;
  syncPaid();
  document.getElementById("name-cnt").textContent = (p.name || "").length + "/45";
}

if (!isNew) fill(PRESET[id]);
else {
  document.getElementById("f-signup-start").value = "2026-09-20T10:00";
  document.getElementById("f-signup-end").value = "2026-10-10T23:59";
  document.getElementById("f-course-start").value = "2026-10-18T09:30";
  document.getElementById("f-course-end").value = "2026-10-18T17:00";
}

function syncPaid() {
  var paid = document.querySelector('input[name="access"]:checked').value === "paid";
  document.getElementById("paid-box").classList.toggle("show", paid);
}
document.querySelectorAll('input[name="access"]').forEach(function (r) {
  r.addEventListener("change", syncPaid);
});
syncPaid();

document.getElementById("f-name").addEventListener("input", function () {
  document.getElementById("name-cnt").textContent = this.value.length + "/45";
});

document.getElementById("anchors").addEventListener("click", function (e) {
  var b = e.target.closest("[data-goto]");
  if (!b) return;
  document.querySelectorAll("#anchors .btn").forEach(function (x) { x.classList.remove("active"); });
  b.classList.add("active");
  var el = document.getElementById(b.getAttribute("data-goto"));
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
});

function validateTimes() {
  var ss = document.getElementById("f-signup-start").value;
  var se = document.getElementById("f-signup-end").value;
  var cs = document.getElementById("f-course-start").value;
  var ce = document.getElementById("f-course-end").value;
  if (!ss || !se || !cs || !ce) {
    Proto.toast("请填写完整的报名与课程时间");
    return false;
  }
  if (se < ss) {
    Proto.toast("报名截止须 ≥ 报名开始");
    return false;
  }
  if (ce < cs) {
    Proto.toast("课程结束须 ≥ 课程开始");
    return false;
  }
  if (cs < ss) {
    Proto.toast("提示：课程开始早于报名开始（软提示，仍可保存）");
  }
  var access = document.querySelector('input[name="access"]:checked').value;
  if (access === "paid") {
    var price = parseFloat(document.getElementById("f-price").value);
    if (!(price > 0)) {
      Proto.toast("付费模式请填写有效价格");
      return false;
    }
  }
  return true;
}

function draft() {
  if (!document.getElementById("f-name").value.trim()) {
    Proto.toast("请填写线下课名称");
    return;
  }
  Proto.toast("草稿已保存");
}
function preview() {
  var oid = id || "O001";
  window.open("../miniprogram/offline-detail.html?id=" + encodeURIComponent(oid), "_blank");
}
function publish() {
  if (!document.getElementById("f-name").value.trim()) {
    Proto.toast("请填写线下课名称");
    return;
  }
  if (!validateTimes()) return;
  var access = document.querySelector('input[name="access"]:checked').value;
  Proto.toast(access === "paid" ? "已保存并上架 · 线下门票商品已生成（示意）" : "已保存并上架");
  setTimeout(function () { location.href = "content-offline.html"; }, 600);
}

["btn-draft", "btn-draft2"].forEach(function (x) {
  document.getElementById(x).addEventListener("click", draft);
});
["btn-preview", "btn-preview2"].forEach(function (x) {
  document.getElementById(x).addEventListener("click", preview);
});
["btn-publish", "btn-publish2"].forEach(function (x) {
  document.getElementById(x).addEventListener("click", publish);
});
</script>
</body>
</html>
