<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>内部复核工作台 · 商家管理后台</title>
<link rel="stylesheet" href="../assets/css/proto.css?v=9" />
</head>
<body class="admin-body" data-module="live" data-nav="live-audit" data-title="内部复核工作台" data-crumb="直播 / 内部复核工作台">
<div id="header-actions">
  <button class="btn" id="btn-refresh">刷新</button>
  <button class="btn" id="btn-export">导出</button>
  <button class="btn btn-primary" id="btn-batch-approve">批量通过</button>
</div>
<div id="page-content" style="display:none">

  <!-- 顶部 4 个统计卡片 -->
  <div class="stat-cards" style="margin-bottom:8px">
    <div class="stat-card">
      <div class="stat-label">待我复核</div>
      <div class="stat-value" id="stat-pending" style="color:#d48806">0</div>
      <div class="stat-hint">当前队列</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">今日已复核</div>
      <div class="stat-value" id="stat-done">0</div>
      <div class="stat-hint" id="stat-done-hint">通过 0 · 驳回 0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">平均复核时长</div>
      <div class="stat-value">14<span style="font-size:14px;color:#86909c;font-weight:400;margin-left:2px">分钟</span></div>
      <div class="stat-hint"><span class="down">-3 分钟</span> 较上周</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">驳回率</div>
      <div class="stat-value" id="stat-reject-rate">0<span style="font-size:14px;color:#86909c;font-weight:400;margin-left:2px">%</span></div>
      <div class="stat-hint">本周数据</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="audit-tabs">
    <a class="active" href="#pending" data-tab="pending">待我复核 <span class="tab-badge" id="tab-pending-badge">0</span></a>
    <a href="#audited" data-tab="audited">我已复核</a>
    <a href="#all" data-tab="all">全部</a>
  </div>

  <!-- 筛选 -->
  <div class="card" style="margin-bottom:8px"><div class="card-bd">
    <div class="form-grid" style="grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 12px">
      <input id="f-name" placeholder="请输入直播名称" />
      <select id="f-course">
        <option value="">全部课程</option>
        <option>店铺课程</option>
        <option>转播课程</option>
      </select>
      <select id="f-mode">
        <option value="">全部模式</option>
        <option>视频直播</option>
        <option>语音直播</option>
        <option>录播直播</option>
      </select>
      <select id="f-creator">
        <option value="">全部创建人</option>
        <option>阮荣均</option>
        <option>赵老师</option>
        <option>王助教</option>
      </select>
      <select id="f-date">
        <option value="">全部时间</option>
        <option>今日</option>
        <option>近 7 天</option>
        <option>近 30 天</option>
      </select>
      <input id="f-range" type="datetime-local" placeholder="提交时间" />
    </div>
    <div class="toolbar" style="margin-top:8px">
      <button class="btn btn-primary" id="btn-query">查询</button>
      <button class="btn" id="btn-reset">重置</button>
      <div class="spacer"></div>
      <span class="muted" style="font-size:12px">提示：批量操作仅支持「通过」，驳回需进入详情填写理由</span>
    </div>
  </div></div>

  <!-- 表格 -->
  <div class="card"><div class="card-bd" style="padding:0">
    <table class="data">
      <thead>
        <tr>
          <th style="width:36px"><input type="checkbox" id="check-all" /></th>
          <th>直播名称</th><th>关联课程</th><th>模式</th><th>主讲老师</th>
          <th>开始时间</th><th>创建人</th><th>提交时间</th>
          <th>等待时长</th>
          <th style="width:160px">操作</th>
        </tr>
      </thead>
      <tbody id="audit-tbody"></tbody>
    </table>
  </div></div>

  <!-- 分页 -->
  <div class="toolbar" style="margin-top:8px">
    <span class="muted" id="audit-pager-hint">共 <b>0</b> 条待复核 · 共 <b>0</b> 条已复核</span>
    <div class="spacer"></div>
    <select><option>10条/页</option><option>20条/页</option><option>50条/页</option></select>
    <button class="btn btn-sm" disabled>上一页</button>
    <button class="btn btn-sm" disabled>1</button>
    <button class="btn btn-sm" disabled>下一页</button>
  </div>

</div>

<!-- ============ 弹窗 ============ -->
<div class="proto-mask" id="mask"></div>

<!-- 批量通过确认 -->
<div class="proto-modal" id="modal-batch-approve">
  <div class="proto-modal-hd">
    <h3>批量通过</h3>
    <button class="btn btn-sm btn-ghost" data-close>×</button>
  </div>
  <div class="proto-modal-bd">
    <p>即将内部复核通过 <b id="batch-count">0</b> 个直播的审核，通过后可提交平台审核；平台通过后上架：</p>
    <ul id="batch-list" style="background:#f7f8fa;border-radius:4px;padding:12px 24px;margin:8px 0;color:#4e5969"></ul>
    <div class="field"><label>备注（选填）</label>
      <textarea rows="2" placeholder="如有补充说明请填写"></textarea>
    </div>
  </div>
  <div class="proto-modal-ft">
    <button class="btn" data-close>取消</button>
    <button class="btn btn-primary" id="btn-confirm-batch">确认通过</button>
  </div>
</div>

<style>
.stat-cards {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
.stat-card {
  background: #fff; border: 1px solid var(--color-border);
  border-radius: 8px; padding: 14px 18px;
}
.stat-label { font-size: 13px; color: var(--color-text-muted); margin-bottom: 6px; }
.stat-value { font-size: 24px; font-weight: 700; color: var(--color-text); line-height: 1.2; }
.stat-hint  { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }
.stat-hint .up   { color: #00b42a; margin-right: 4px; }
.stat-hint .down { color: #f53f3f; margin-right: 4px; }

.tab-badge {
  display: inline-block; margin-left: 4px;
  min-width: 18px; height: 16px; line-height: 16px;
  padding: 0 6px; border-radius: 8px;
  background: #f53f3f; color: #fff; font-size: 11px;
  font-weight: 600; vertical-align: middle;
}
.tabs a.active .tab-badge { background: #fff; color: #f53f3f; }

.wait-badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 12px; line-height: 18px; font-weight: 500;
}
.wait-fresh   { background: #f0f9ff; color: #165dff; }
.wait-warn    { background: #fffbe6; color: #d48806; }
.wait-overdue { background: #fff1f0; color: #cf1322; }

.audit-badge {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: 12px; line-height: 18px; font-weight: 500;
}
.audit-approved { background: #e8f5e9; color: #00b42a; }
.audit-rejected { background: #fff1f0; color: #cf1322; }
.audit-pending  { background: #fff7e6; color: #d48806; }
.audit-draft    { background: #f0f1f3; color: #4e5969; }
.audit-cancelled{ background: #f5f5f5; color: #86909c; }

.row-actions a { margin-right: 8px; }
</style>

<script src="../assets/js/proto.js"></script>
<script src="../assets/js/prototype-business-store.js"></script>
<script src="../assets/js/admin-shell.js?v=13"></script>
<script>
(function () {
  var Biz = window.ProtoBiz;
  var currentTab = "pending";
  var batchIds = [];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function tabOf(live) {
    return live.auditStatus === "pending_internal_review" ? "pending" : "audited";
  }

  function waitHtml(live) {
    if (live.auditStatus !== "pending_internal_review") {
      var cls = "audit-approved";
      var label = live.auditStatusLabel || (Biz.AUDIT_LABEL[live.auditStatus] || live.auditStatus);
      if (live.auditStatus === "internal_rejected" || live.auditStatus === "platform_rejected") {
        cls = "audit-rejected";
      } else if (live.auditStatus === "pending_platform_submit" || live.auditStatus === "pending_platform_review") {
        cls = "audit-pending";
      }
      return '<span class="audit-badge ' + cls + '">' + esc(label) + "</span>";
    }
    var h = Biz.waitHours(live.submittedInternalAt);
    var wcls = h >= 12 ? "wait-overdue" : h >= 2 ? "wait-warn" : "wait-fresh";
    var text = h < 1 ? "不足 1 小时" : (h + " 小时");
    return '<span class="wait-badge ' + wcls + '">' + text + "</span>";
  }

  function rowHtml(live) {
    var tab = tabOf(live);
    var href = "live-audit-detail.html?live_id=" + encodeURIComponent(live.id);
    var pending = live.auditStatus === "pending_internal_review";
    var actions = pending
      ? '<a href="' + href + '" data-row-act="audit">内部复核</a><a href="#" data-row-act="preview">预览</a>'
      : '<a href="' + href + '">查看</a>';
    return '<tr data-tab="' + tab + '" data-id="' + esc(live.id) + '" data-name="' + esc(live.name) + '">' +
      '<td><input type="checkbox" class="row-check" ' + (pending ? "" : "disabled") + ' data-id="' + esc(live.id) + '" /></td>' +
      '<td><a href="' + href + '" class="link-blue">' + esc(live.name) + '</a><div class="muted" style="font-size:11px">' + esc(live.id) + "</div></td>" +
      "<td>" + esc(live.name) + "</td>" +
      "<td>视频直播</td>" +
      "<td>阮荣均</td>" +
      "<td>" + esc(live.startAt || "—") + "</td>" +
      "<td>赵老师</td>" +
      "<td>" + esc(live.submittedInternalAt || live.createdAt || "—") + "</td>" +
      "<td>" + waitHtml(live) + "</td>" +
      '<td class="row-actions">' + actions + "</td></tr>";
  }

  function render() {
    var lives = Biz.getLives() || [];
    var kw = (document.getElementById("f-name").value || "").trim();
    if (kw) {
      lives = lives.filter(function (l) {
        return (l.name || "").indexOf(kw) >= 0 || (l.id || "").indexOf(kw) >= 0;
      });
    }
    var pending = lives.filter(function (l) { return l.auditStatus === "pending_internal_review"; });
    var audited = lives.filter(function (l) { return l.auditStatus !== "pending_internal_review"; });
    var logs = Biz.getReviewLogs();
    var passed = logs.filter(function (r) { return r.status === "pending_platform_submit"; }).length;
    var rejected = logs.filter(function (r) { return r.status === "internal_rejected"; }).length;

    document.getElementById("stat-pending").textContent = String(pending.length);
    document.getElementById("tab-pending-badge").textContent = String(pending.length);
    document.getElementById("stat-done").textContent = String(passed + rejected || audited.length);
    document.getElementById("stat-done-hint").textContent = "通过 " + passed + " · 驳回 " + rejected;
    var rateEl = document.getElementById("stat-reject-rate");
    var totalDone = passed + rejected;
    rateEl.innerHTML = (totalDone ? Math.round(rejected * 1000 / totalDone) / 10 : 0) +
      '<span style="font-size:14px;color:#86909c;font-weight:400;margin-left:2px">%</span>';
    document.getElementById("audit-pager-hint").innerHTML =
      "共 <b>" + pending.length + "</b> 条待复核 · 共 <b>" + audited.length + "</b> 条已复核";

    var show = currentTab === "pending" ? pending : currentTab === "audited" ? audited : lives;
    var tbody = document.getElementById("audit-tbody");
    tbody.innerHTML = show.length ? show.map(rowHtml).join("") : '<tr><td colspan="10" class="muted" style="text-align:center;padding:24px">暂无数据</td></tr>';

    tbody.querySelectorAll("[data-row-act=preview]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        Proto.toast("打开预览（原型）");
      });
    });
  }

  document.querySelectorAll("#audit-tabs a[data-tab]").forEach(function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      document.querySelectorAll("#audit-tabs a").forEach(function (x) { x.classList.remove("active"); });
      a.classList.add("active");
      currentTab = a.getAttribute("data-tab");
      render();
    });
  });

  var mask = document.getElementById("mask");
  function closeAll() {
    mask.classList.remove("open");
    document.querySelectorAll(".proto-modal").forEach(function (n) { n.classList.remove("open"); });
  }
  function open(node) { mask.classList.add("open"); node.classList.add("open"); }
  mask.addEventListener("click", closeAll);
  document.querySelectorAll("[data-close]").forEach(function (n) { n.addEventListener("click", closeAll); });

  document.getElementById("check-all").addEventListener("change", function () {
    var c = this;
    document.querySelectorAll(".row-check").forEach(function (x) {
      if (!x.disabled) x.checked = c.checked;
    });
  });

  document.getElementById("btn-batch-approve").addEventListener("click", function () {
    var checks = Array.from(document.querySelectorAll(".row-check:checked"));
    if (!checks.length) { Proto.toast("请先选择要通过的直播"); return; }
    batchIds = checks.map(function (c) { return c.getAttribute("data-id"); });
    document.getElementById("batch-count").textContent = batchIds.length;
    document.getElementById("batch-list").innerHTML = checks.map(function (c) {
      var tr = c.closest("tr");
      return "<li>" + esc(tr.getAttribute("data-name") || c.getAttribute("data-id")) + "</li>";
    }).join("");
    open(document.getElementById("modal-batch-approve"));
  });

  document.getElementById("btn-confirm-batch").addEventListener("click", function () {
    batchIds.forEach(function (id) {
      Biz.setAuditStatus(id, "pending_platform_submit", { by: "刘管理", side: "merchant" });
    });
    closeAll();
    Proto.toast("已批量内部复核通过");
    render();
  });

  document.getElementById("btn-refresh").addEventListener("click", function () { location.reload(); });
  document.getElementById("btn-export").addEventListener("click", function () { Proto.toast("已导出（原型）"); });
  document.getElementById("btn-query").addEventListener("click", render);
  document.getElementById("btn-reset").addEventListener("click", function () {
    document.getElementById("f-name").value = "";
    ["f-course","f-mode","f-creator","f-date"].forEach(function (id) { document.getElementById(id).value = ""; });
    document.getElementById("f-range").value = "";
    render();
    Proto.toast("已重置");
  });

  try {
    var q = new URLSearchParams(location.search);
    if (q.get("status") === "pending") currentTab = "pending";
  } catch (e) {}
  document.querySelectorAll("#audit-tabs a").forEach(function (a) {
    a.classList.toggle("active", a.getAttribute("data-tab") === currentTab);
  });
  render();
})();
</script>
</body>
</html>
