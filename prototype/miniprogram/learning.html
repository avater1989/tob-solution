<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学习 · To-B 小程序</title>
  <link rel="stylesheet" href="../assets/css/proto.css" />
  <link rel="stylesheet" href="../assets/css/mp.css?v=19" />
</head>
<body class="mp-page" data-tab="learn">
  <div class="mp-frame">
    <div class="mp-top" style="height:200px"></div>
    <div class="mp-status"><span>9:41</span><span>学习</span><span>100%</span></div>
    <div class="mp-nav">学习</div>
    <div class="mp-body" id="ln-root" style="padding-bottom:72px"></div>
  </div>
  <p class="mp-hint">
    学习中心 · 仅已购内容 · 演示态
    <a href="?learn=full">多权益</a> ·
    <a href="?learn=one">单权益</a> ·
    <a href="?learn=done">已完成</a> ·
    <a href="?learn=empty">空态</a>
  </p>

  <script src="../assets/js/proto.js"></script>
  <script src="../assets/js/mp-shell.js"></script>
  <script src="../assets/js/mp-learning.js"></script>
  <script>
  (function () {
    var L = window.MpLearning;
    var qs = new URLSearchParams(location.search);
    if (qs.has("learn")) L.resetDemo(qs.get("learn"));
    var mode = L.demoMode();
    var root = document.getElementById("ln-root");

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    }

    function typeTone(t) {
      return (
        {
          plan: "tone-plan",
          online_course: "tone-course",
          offline_course: "tone-offline",
          article: "tone-article",
          assessment: "tone-assess"
        }[t] || "tone-course"
      );
    }

    function raceHtml(growth, animateFrom) {
      var goal = Math.max(1, growth.weekGoal || 5);
      var done = Math.min(goal, growth.weekDone || 0);
      var left = Math.max(0, goal - done);
      var pct = Math.round((done / goal) * 100);
      /* 轨道可视进度：终点旗占右侧，跑者最多到 88%，便于看清「还差几站」 */
      var visual = done >= goal ? 88 : Math.max(6, Math.round((done / goal) * 78));
      var fromVisual = typeof animateFrom === "number"
        ? Math.max(6, Math.min(88, animateFrom))
        : Math.max(6, visual - 14);
      var title = left === 0
        ? "本周目标已冲线"
        : "本周冲刺 · 还差 <b>" + left + "</b> 站到终点";
      var markers = "";
      for (var i = 1; i <= goal; i++) {
        var reached = i <= done;
        var markLeft = Math.round((i / goal) * 78);
        markers +=
          '<span class="ln-race-mark' + (reached ? " is-on" : "") + (i === goal ? " is-goal" : "") + '" style="left:' + markLeft + '%">' +
            '<i></i><em>' + i + '</em>' +
          '</span>';
      }
      return (
        '<div class="ln-growth ln-race" data-pct="' + visual + '" data-done="' + done + '">' +
          '<div class="ln-race-hd">' +
            '<div class="ln-race-title">' + title + '</div>' +
            '<div class="ln-race-stars">★ ' + growth.stars + '</div>' +
          '</div>' +
          '<div class="ln-race-track' + (left === 0 ? " is-done" : "") + '" style="--race-from:' + fromVisual + '%;--race-to:' + visual + '%">' +
            '<div class="ln-race-road"></div>' +
            '<div class="ln-race-fill"></div>' +
            '<div class="ln-race-marks">' + markers + '</div>' +
            '<div class="ln-race-runner" aria-hidden="true">' +
              '<img src="../assets/img/ip/yibo-face.svg" alt="" />' +
              '<span class="ln-race-legs"></span>' +
            '</div>' +
            '<div class="ln-race-finish" aria-hidden="true">' +
              '<span class="ln-race-flag">' +
                '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="#fff" d="M6.2 3.2h1.6v17.6H6.2z"/><path fill="#FFE08A" d="M8.2 3.6c2.4 1.4 4.2-.2 6.6 1.1 1.6.9 2.8.6 3.8-.2v7.2c-1.2.9-2.6 1.2-4.2.4-2.2-1.1-4 .4-6.2-.8V3.6z"/></svg>' +
              '</span>' +
              '<em>终点</em>' +
            '</div>' +
          '</div>' +
          '<div class="ln-race-ft">' +
            '<span>已跑 <b>' + done + '/' + goal + '</b> 站</span>' +
            '<span>连续学习 <b>' + growth.streak + '</b> 天</span>' +
          '</div>' +
        '</div>'
      );
    }

    function render(opts) {
      var animateFrom = opts && typeof opts.animateFrom === "number" ? opts.animateFrom : null;
      var items = L.listOwned(mode);
      var growth = L.growthSummary();
      var tasks = L.pickTodayTasks(items);
      var cont = L.continueItem(items);
      var groups = L.groupByType(items);

      if (!items.length) {
        root.innerHTML =
          raceHtml(growth, animateFrom) +
          '<div class="ln-empty">' +
            '<div class="ln-empty-ico">学</div>' +
            '<h3>还没有可学习的内容</h3>' +
            '<p>购买或领取课程、文章、测评、计划后，会在这里为你推荐下一步</p>' +
            '<a class="mp-btn" href="home.html">去首页看看</a>' +
            '<a class="mp-btn mp-btn-outline" href="orders.html" style="margin-top:10px">查看订单</a>' +
          '</div>';
        return;
      }

      var html = raceHtml(growth, animateFrom);

      /* 今日任务 */
      html +=
        '<div class="ln-sec">' +
          '<div class="ln-sec-hd"><span>今日任务</span><em>最多 3 项 · 按紧急度推荐</em></div>';
      if (!tasks.length) {
        html += '<div class="ln-done-all">今日推荐已全部完成，去复习巩固吧</div>';
      } else {
        tasks.forEach(function (t) {
          html +=
            '<div class="ln-task ' + (t.todayDone ? "is-done" : "") + '" data-id="' + esc(t.id) + '">' +
              '<button type="button" class="ln-check" aria-label="完成" data-complete="' + esc(t.id) + '">' +
                (t.todayDone ? "✓" : "") +
              '</button>' +
              '<div class="ln-task-bd">' +
                '<div class="ln-task-type ' + typeTone(t.type) + '">' + esc(t.typeLabel) + '</div>' +
                '<div class="ln-task-title">' + esc(t.title) + '</div>' +
                '<div class="ln-task-reason">' + esc(t.reason) +
                  (t.durationMin ? ' · 约 ' + t.durationMin + ' 分钟' : '') +
                '</div>' +
              '</div>' +
              '<a class="ln-task-go" href="' + esc(t.href) + '">' + esc(t.action) + '</a>' +
            '</div>';
        });
      }
      html += '</div>';

      /* 继续学习 */
      if (cont && !cont.todayDone) {
        html +=
          '<div class="ln-sec">' +
            '<div class="ln-sec-hd"><span>继续学习</span></div>' +
            '<a class="ln-continue" href="' + esc(cont.href) + '">' +
              '<div class="ln-continue-kicker">' + esc(cont.typeLabel) + ' · ' + esc(cont.reason) + '</div>' +
              '<div class="ln-continue-title">' + esc(cont.title) + '</div>' +
              '<div class="ln-continue-bar"><b style="width:' + (cont.progress || 8) + '%"></b></div>' +
              '<span class="ln-continue-cta">' + esc(cont.action) + ' →</span>' +
            '</a>' +
          '</div>';
      }

      /* 我的内容 */
      html += '<div class="ln-sec" style="padding-bottom:20px"><div class="ln-sec-hd"><span>我的内容</span><em>仅已购 / 已领取</em></div>';
      groups.forEach(function (g) {
        html += '<div class="ln-group-label">' + esc(g.label) + '</div>';
        g.items.forEach(function (it) {
          var meta =
            it.type === "plan"
              ? (it.stageLabel || "") + (it.currentTask ? " · " + it.currentTask : "")
              : it.type === "offline_course"
                ? (it.city || "") + (it.when ? " · " + it.when : "")
                : it.type === "online_course"
                  ? "进度 " + (it.progress || 0) + "%"
                  : it.type === "article"
                    ? "阅读 " + (it.progress || 0) + "%"
                    : it.status === "done"
                      ? "已完成"
                      : "未开始";
          html +=
            '<a class="ln-row" href="' + esc(it.href) + '">' +
              '<span class="ln-row-badge ' + typeTone(it.type) + '">' + esc(it.typeLabel).slice(0, 2) + '</span>' +
              '<div class="ln-row-bd">' +
                '<div class="ln-row-title">' + esc(it.title) + '</div>' +
                '<div class="ln-row-meta">' + esc(meta) + '</div>' +
              '</div>' +
              '<span class="ln-row-act">' + esc(it.action) + '</span>' +
            '</a>';
        });
      });
      html += '</div>';

      root.innerHTML = html;
      bind();
    }

    function showGain(stars) {
      var tip = document.createElement("div");
      tip.className = "ln-gain";
      tip.textContent = "+" + stars + " ★";
      document.querySelector(".mp-frame").appendChild(tip);
      setTimeout(function () {
        tip.classList.add("out");
      }, 1200);
      setTimeout(function () {
        tip.remove();
      }, 1600);
    }

    function bind() {
      root.querySelectorAll("[data-complete]").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          var id = btn.getAttribute("data-complete");
          var race = root.querySelector(".ln-race");
          var fromPct = race ? Number(race.getAttribute("data-pct") || 0) : 0;
          var res = L.completeTask(id);
          if (!res.ok) return;
          if (res.already) {
            Proto.toast("今日已完成该项");
            return;
          }
          showGain(res.starsGain || 3);
          Proto.toast("前进一站 · 星星 +" + (res.starsGain || 3));
          setTimeout(function () {
            render({ animateFrom: fromPct });
          }, 220);
        });
      });
    }

    render();
  })();
  </script>
</body>
</html>
