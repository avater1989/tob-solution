<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>线下课详情 · To-B 小程序</title>
  <link rel="stylesheet" href="../assets/css/proto.css" />
  <link rel="stylesheet" href="../assets/css/mp.css?v=11" />
  <style>
    .od-row { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid #f3f4f6; font-size:13px; }
    .od-row:last-child { border-bottom:0; }
    .od-k { color:#888; flex-shrink:0; }
    .od-v { color:#1d2129; text-align:right; }
    .od-owned { background:#e8ffea; color:#00b42a; font-size:12px; padding:8px 12px; border-radius:8px; margin-top:10px; }
    .od-reason { font-size:12px; color:#86909c; text-align:center; margin-top:6px; }
    .mp-btn[disabled] { opacity:.45; pointer-events:none; }
  </style>
</head>
<body class="mp-page" data-tabbar="0">
  <div class="mp-frame" style="padding-bottom:72px">
    <div class="mp-top" style="height:190px"></div>
    <div class="mp-status"><span>9:41</span><span>线下课</span><span>100%</span></div>
    <div class="mp-nav"><a class="back" href="offline.html">←</a>课程详情</div>
    <div class="mp-body" id="od-root"></div>
    <div class="mp-bottom-bar">
      <button class="mp-btn" type="button" id="od-cta" style="flex:1">立即报名</button>
    </div>
  </div>
  <p class="mp-hint"><a href="offline.html">线下课列表</a> · <a href="../admin/content-offline-signups.html">管理端报名记录</a></p>

  <script src="../assets/js/proto.js"></script>
  <script src="../assets/js/mp-shell.js"></script>
  <script src="../assets/js/mp-commerce.js"></script>
  <script>
  var COURSES = {
    O001: {
      id: "O001",
      title: "卓越家族培养计划 · 线下工作坊",
      teacher: "赵老师",
      city: "上海",
      address: "浦东新区陆家嘴环路 1000 号 3F 会议室",
      intro: "两天沉浸式工作坊，聚焦家族沟通与边界。",
      signupStart: "2026-09-01T10:00:00",
      signupEnd: "2026-09-25T23:59:00",
      courseStart: "2026-09-28T09:30:00",
      courseEnd: "2026-09-29T17:00:00",
      capacity: 100,
      signed: 86,
      access: "paid",
      price: 299,
      cover: "../assets/img/covers/classroom.jpg"
    },
    O002: {
      id: "O002",
      title: "亲子沟通实战 · 线下沙龙",
      teacher: "阮荣均",
      city: "深圳",
      address: "南山区科技园南路 8 号活动厅",
      intro: "半天沙龙，现场演练亲子对话。",
      signupStart: "2026-09-10T09:00:00",
      signupEnd: "2026-10-05T18:00:00",
      courseStart: "2026-10-12T14:00:00",
      courseEnd: "2026-10-12T17:30:00",
      capacity: 40,
      signed: 32,
      access: "free",
      price: 0,
      cover: "../assets/img/covers/talk.jpg"
    },
    O003: {
      id: "O003",
      title: "学习习惯养成 · 线下营（筹备中）",
      teacher: "王助教",
      city: "北京",
      address: "朝阳区望京街道待定",
      intro: "三日营，筹备中。",
      signupStart: "2026-11-01T10:00:00",
      signupEnd: "2026-11-20T23:59:00",
      courseStart: "2026-11-28T09:00:00",
      courseEnd: "2026-11-30T16:00:00",
      capacity: 30,
      signed: 0,
      access: "paid",
      price: 999,
      cover: "../assets/img/covers/parent.jpg"
    }
  };

  var RIGHTS_KEY = "mp_offline_rights_v1";
  function readRights() {
    try { return JSON.parse(localStorage.getItem(RIGHTS_KEY) || "{}") || {}; }
    catch (e) { return {}; }
  }
  function hasRights(id) {
    var m = readRights();
    return !!(m[id] && m[id].valid);
  }
  function grantRights(id) {
    var m = readRights();
    m[id] = { valid: true, grantedAt: new Date().toISOString() };
    localStorage.setItem(RIGHTS_KEY, JSON.stringify(m));
  }

  function fmt(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    var m = d.getMonth() + 1, day = d.getDate();
    var hh = String(d.getHours()).padStart(2, "0");
    var mm = String(d.getMinutes()).padStart(2, "0");
    return m + "-" + day + " " + hh + ":" + mm;
  }

  function gateState(o) {
    var now = Date.now();
    var ss = new Date(o.signupStart).getTime();
    var se = new Date(o.signupEnd).getTime();
    var ce = new Date(o.courseEnd).getTime();
    if (hasRights(o.id)) return { ok: false, owned: true, reason: "", label: "已报名" };
    if (now > ce) return { ok: false, owned: false, reason: "课程已结束", label: "已结束" };
    if (now < ss) return { ok: false, owned: false, reason: "报名尚未开始", label: "报名未开始" };
    if (now > se) return { ok: false, owned: false, reason: "报名已截止", label: "报名截止" };
    if (o.capacity && o.signed >= o.capacity) return { ok: false, owned: false, reason: "名额已满", label: "已满员" };
    if (o.access === "paid") return { ok: true, owned: false, reason: "", label: "立即购票 ¥" + o.price };
    return { ok: true, owned: false, reason: "", label: "立即报名" };
  }

  var id = new URLSearchParams(location.search).get("id") || "O001";
  var o = COURSES[id] || COURSES.O001;
  var demoPast = new URLSearchParams(location.search).get("demo") === "past";
  if (demoPast) {
    o = Object.assign({}, o, {
      signupStart: "2026-08-01T10:00:00",
      signupEnd: "2026-08-10T23:59:00"
    });
  }

  // If returned from pay success, grant rights
  if (new URLSearchParams(location.search).get("signed") === "1") {
    grantRights(o.id);
  }

  var gate = gateState(o);
  var priceHtml = o.access === "paid"
    ? '<div style="color:#dc2626;font-size:22px;font-weight:700;margin-top:8px">¥' + o.price + '</div>'
    : '<div style="color:#00b42a;font-size:18px;font-weight:700;margin-top:8px">免费报名</div>';

  document.getElementById("od-root").innerHTML =
    '<div style="height:160px;background:url(' + o.cover + ') center/cover"></div>' +
    '<div style="background:#fff;padding:14px 16px">' +
      '<h3 style="font-size:18px">' + o.title + "</h3>" +
      '<p style="font-size:12px;color:#888;margin-top:6px">' + o.teacher + " · " + o.city + "</p>" +
      priceHtml +
      (gate.owned ? '<div class="od-owned">你已获得本场报名资格</div>' : "") +
    "</div>" +
    '<div class="mp-section">' +
      '<div class="mp-section-title">场次信息</div>' +
      '<div style="background:#fff;border-radius:10px;padding:4px 14px">' +
        '<div class="od-row"><span class="od-k">报名窗口</span><span class="od-v">' + fmt(o.signupStart) + " ~ " + fmt(o.signupEnd) + "</span></div>" +
        '<div class="od-row"><span class="od-k">课程时间</span><span class="od-v">' + fmt(o.courseStart) + " ~ " + fmt(o.courseEnd) + "</span></div>" +
        '<div class="od-row"><span class="od-k">地址</span><span class="od-v">' + o.address + "</span></div>" +
        '<div class="od-row"><span class="od-k">名额</span><span class="od-v">' + o.signed + "/" + o.capacity + "</span></div>" +
      "</div>" +
    "</div>" +
    '<div class="mp-section">' +
      '<div class="mp-section-title">简介</div>' +
      '<div style="background:#fff;border-radius:10px;padding:14px;font-size:13px;line-height:1.6;color:#4e5969">' + o.intro + "</div>" +
    "</div>" +
    (gate.reason ? '<p class="od-reason" id="od-reason">' + gate.reason + "</p>" : '<p class="od-reason" id="od-reason" style="display:none"></p>');

  var cta = document.getElementById("od-cta");
  cta.textContent = gate.label;
  if (!gate.ok) {
    cta.disabled = true;
  }

  cta.addEventListener("click", function () {
    if (!gate.ok) return;
    if (o.access === "free") {
      grantRights(o.id);
      Proto.toast("报名成功");
      setTimeout(function () {
        location.href = "offline-detail.html?id=" + encodeURIComponent(o.id) + "&signed=1";
      }, 400);
      return;
    }
    MpCommerce.openBuyNotice({
      catalogId: "offlineTicket",
      from: "offline",
      price: String(o.price),
      returnUrl: "offline-detail.html?id=" + encodeURIComponent(o.id) + "&signed=1",
      course: o.id
    });
  });
  </script>
</body>
</html>
