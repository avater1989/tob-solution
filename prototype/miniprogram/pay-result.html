<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>支付结果 · 星启家庭教育</title>
  <link rel="stylesheet" href="../assets/css/proto.css" />
  <link rel="stylesheet" href="../assets/css/mp.css?v=taste2" />
</head>
<body class="mp-page" data-tabbar="0">
  <div class="mp-frame">
    <div class="mp-status">
      <span>9:41</span>
      <span class="mp-notch" aria-hidden="true"></span>
      <span>100%</span>
    </div>
    <div class="mp-nav">支付结果</div>
    <div class="mp-body">
      <div class="mp-result">
        <div class="mp-result-ico ok">✓</div>
        <h3 style="margin-top:18px;font-size:22px;font-weight:750;letter-spacing:-0.03em;color:var(--mp-ink)">支付成功</h3>
        <p style="font-size:13px;color:var(--mp-muted);margin-top:10px;line-height:1.6" id="pay-desc">
          权益已开通 · 资金进入艺博备付金待分账（示意）
        </p>
        <div style="margin-top:16px;background:#f7f8fa;border-radius:14px;padding:14px 16px;text-align:left;font-size:12px;color:#5c6575;line-height:1.8">
          <div style="display:flex;justify-content:space-between"><span>订单状态</span><span style="color:var(--mp-success);font-weight:650">已支付</span></div>
          <div style="display:flex;justify-content:space-between"><span>支付方式</span><span>微信支付</span></div>
          <div style="display:flex;justify-content:space-between"><span>到账说明</span><span>备付金待分账</span></div>
        </div>
        <div style="margin-top:28px">
          <a class="mp-btn" href="learn.html" id="go-learn">去学习</a>
          <a class="mp-btn mp-btn-outline" href="mine.html" style="margin-top:10px">返回我的</a>
          <a class="mp-btn mp-btn-outline" href="live-room.html" style="margin-top:10px" id="go-live">返回直播间</a>
        </div>
      </div>
    </div>
  </div>
  <p class="mp-hint"><a href="../admin/orders.html">管理端订单</a></p>
  <script src="../assets/js/proto.js"></script>
  <script src="../assets/js/mp-shell.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var from = params.get("from") || "course";
    var desc = document.getElementById("pay-desc");
    var goLive = document.getElementById("go-live");
    var goLearn = document.getElementById("go-learn");
    if (from === "live" || from === "ticket") {
      desc.textContent = "直播/课程权益已开通 · 可返回直播间继续观看";
      goLearn.style.display = from === "live" ? "block" : "none";
    } else {
      goLive.style.display = "none";
    }
  </script>
</body>
</html>
