  <p class="mp-hint">线下课「更多」列表：全量展示 免费/付费 × 已报名/未报名 × 报名中 / 报名截止·待开始 / 进行中 / 已结束 的全部状态；首页露出受「首页装修 → 线下课」控制 · <a href="../admin/content-offline.html">管理端线下课</a></p>

  <script>
  var Teachers = window.Teachers;
  var LS = window.ListingStore;

    },

    },

    }
  ];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  /* 2026-10-02 评审标注（home.html「线下课」）：「更多」列表要把所有状态都展示出来 ——
     本页展示线下课全量，自动补齐 免费/付费 × 已报名/未报名 × 报名中 / 报名截止·待开始 / 进行中 / 已结束；
     「首页装修 → 线下课」的上架位只决定首页露出（前 3 场），已配置的场次在本页优先排序。 */
  function orderedPool() {
    var rows = LS ? LS.listBySlot("offline").filter(function (r) { return r.visible && r.status === "active"; }) : [];
    var ids = rows.map(function (r) { return r.content_id; });
    var head = ids.map(function (id) {
      return ITEMS.filter(function (o) { return o.id === id; })[0];
    }).filter(Boolean);
    var tail = ITEMS.filter(function (o) { return ids.indexOf(o.id) < 0; });
    return head.concat(tail);
  }

  var filter = "";

  function render() {
    var pool = orderedPool();
    var list = pool.filter(function (o) {
      if (!filter) return true;
      if (filter === "open") return o.phase === "open";
      if (filter === "signed") return o.signedUp;
      if (filter === "running") return o.phase === "running";
      if (filter === "closed") return o.phase === "ended" || o.phase === "closed_signup";
      return true;
    });

    document.getElementById("off-list").innerHTML = list.length ? list.map(function (o) {
      var payCls = o.free ? "free" : "pay";
      var phaseCls = o.phase === "open" ? "on" : (o.phase === "ended" ? "done" : "warn");
      var ctaText = o.phase === "ended"
        ? "查看回顾"
        : (o.signedUp ? "查看报名" : (o.phase === "open" ? (o.free ? "免费报名" : "去报名") : "查看详情"));
      var href = "offline-detail.html?id=" + encodeURIComponent(o.id) + (o.signedUp ? "&signed=1" : "");
      return (
        '<div class="mp-live-card" style="margin-top:12px">' +
          '<a href="' + href + '" style="color:inherit">' +
            '<div class="mp-live-cover" style="background:url(' + esc(o.cover) + ') center/cover;min-height:120px">' +
              "<h3>" + esc(o.name) + "</h3>" +
              "<p>" + esc(Teachers.nameOf(o.teacherId)) + " · " + esc(o.term) + " · " + esc(o.city) + "</p>" +
            "</div>" +
          "</a>" +
          '<div style="padding:10px 12px 6px;background:#fff">' +
            '<div class="ol-tags">' +
              '<span class="ol-tag ' + payCls + '">' + (o.free ? "免费" : "付费 " + o.price) + "</span>" +
              '<span class="ol-tag ' + (o.signedUp ? "signed" : "unsigned") + '">' + (o.signedUp ? "已报名" : "未报名") + "</span>" +
              '<span class="ol-tag ' + phaseCls + '">' + esc(o.phaseText) + "</span>" +
            "</div>" +
          "</div>" +
          '<div style="padding:0 12px 10px;font-size:12px;color:#4e5969;line-height:1.7;background:#fff">' +
            "<div>报名 " + esc(o.signup) + " · 开课 " + esc(o.courseStart) + "</div>" +
            "<div>签到 " + esc(o.checkin) + " · 预计 " + o.expected + " / 名额 " + o.capacity + "（已报 " + o.signed + "）</div>" +
            "<div>地址 " + esc(o.address) + "</div>" +
          "</div>" +
          '<div class="mp-live-ft">' +
            '<div class="mp-live-ft-l">' + (o.free ? "免费" : o.price) + "</div>" +
            '<a class="mp-live-ft-btn" href="' + href + '">' + ctaText + "</a>" +
          "</div>" +
        "</div>"
      );
    }).join("") : '<div class="mp-empty"><div class="mp-empty-ico">📍</div>暂无该状态的线下课</div>';
  }

  document.getElementById("off-tabs").addEventListener("click", function (e) {
    var t = e.target.closest(".mp-tab");
    if (!t) return;
    e.preventDefault();
    document.querySelectorAll("#off-tabs .mp-tab").forEach(function (x) { x.classList.remove("active"); });
    t.classList.add("active");
    filter = t.getAttribute("data-state") || "";
    render();
  });

  render();
  </script>
