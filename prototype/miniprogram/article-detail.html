      body: "<p>新学期开始前，建议先和孩子一起对齐三件事：作息、学习节奏、家庭沟通方式。</p><p>1. 提前一周回调作息，避免开学第一周硬着陆。<br>2. 用「本周一件小事」代替宏大目标，降低焦虑。<br>3. 每天留 10 分钟无评判倾听，让孩子感到被看见。</p><p>本文为免费精选内容，可分享给家人一起看。</p>"
