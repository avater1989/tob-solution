<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>联系客服 · 星启家庭教育</title>
  <link rel="stylesheet" href="../assets/css/proto.css" />
  <link rel="stylesheet" href="../assets/css/mp.css?v=taste2" />
  <style>
    .mp-field { margin-bottom: 12px; }
    .mp-field label {
      display: block; font-size: 12px; color: var(--mp-muted);
      margin-bottom: 6px; font-weight: 550;
    }
    .mp-field textarea {
      width: 100%;
      border: 1px solid var(--mp-line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      font-family: inherit;
      min-height: 140px;
      resize: vertical;
      line-height: 1.6;
      color: var(--mp-text);
      background: #fff;
    }
    .mp-ctx-chip {
      display: inline-block;
      font-size: 11px;
      font-weight: 650;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--mp-primary-soft);
      color: var(--mp-primary);
      margin: 0 6px 6px 0;
    }
  </style>
</head>
<body class="mp-page" data-tabbar="0">
  <div class="mp-frame">
    <div class="mp-status">
      <span>9:41</span>
      <span class="mp-notch" aria-hidden="true"></span>
      <span>100%</span>
    </div>
    <div class="mp-nav"><a class="back" href="help.html" aria-label="返回" id="nav-back">‹</a>联系客服</div>
    <div class="mp-body">
      <div style="padding:16px 16px 28px">
        <div style="background:#fff;border-radius:var(--mp-radius);box-shadow:var(--mp-shadow);padding:16px 16px 18px">
          <div style="font-size:15px;font-weight:750;letter-spacing:-0.02em;margin-bottom:6px">给商家留言</div>
          <p style="font-size:12px;color:var(--mp-muted);margin:0 0 12px;line-height:1.55">
            MVP 演示：消息已预填当前订单 / 课程上下文，不做完整客服工单。
          </p>
          <div id="ctx-chips" style="margin-bottom:10px"></div>
          <div class="mp-field">
            <label for="cs-msg">留言内容</label>
            <textarea id="cs-msg"></textarea>
          </div>
          <button type="button" class="mp-btn" id="cs-send">发送给商家</button>
          <a class="mp-btn mp-btn-outline" href="orders.html" style="margin-top:10px">返回我的订单</a>
        </div>
      </div>
    </div>
  </div>
  <p class="mp-hint"><span style="opacity:.75">原型切换</span> · <a href="../admin/dashboard.html">切管理端</a></p>
  <script src="../assets/js/proto.js"></script>
  <script src="../assets/js/mp-shell.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var orderId = params.get("orderId") || "";
    var course = params.get("course") || "";
    var channel = params.get("channel") || "";
    var ctx = params.get("ctx") || "";
    var from = params.get("from") || "";

    var back = document.getElementById("nav-back");
    if (orderId) back.href = "order-detail.html?id=" + encodeURIComponent(orderId);
    else if (from === "help") back.href = "help.html";
    else back.href = "mine.html";

    var chips = document.getElementById("ctx-chips");
    var bits = [];
    if (orderId) bits.push("订单 " + orderId);
    if (course) bits.push(course);
    if (channel) bits.push(channel);
    if (!bits.length && ctx) bits.push(ctx);
    chips.innerHTML = bits.map(function (b) {
      return '<span class="mp-ctx-chip">' + b + "</span>";
    }).join("") || '<span class="mp-ctx-chip">账号帮助</span>';

    var draft = "";
    try {
      draft = sessionStorage.getItem("mp_cs_draft") || "";
      sessionStorage.removeItem("mp_cs_draft");
    } catch (e) {}

    if (!draft) {
      draft =
        "你好，我需要帮助。\n" +
        (ctx ? "问题：" + ctx + "\n" : "") +
        (orderId ? "订单号：" + orderId + "\n" : "") +
        (course ? "课程：" + course + "\n" : "") +
        (channel ? "购买渠道：" + channel + "\n" : "") +
        "用户：李女士 · 138****2610";
    }
    document.getElementById("cs-msg").value = draft;

    document.getElementById("cs-send").addEventListener("click", function () {
      var text = document.getElementById("cs-msg").value.trim();
      if (!text) {
        Proto.toast("请先填写留言");
        return;
      }
      Proto.toast("已发送给商家（原型示意）");
      setTimeout(function () {
        if (orderId) location.href = "order-detail.html?id=" + encodeURIComponent(orderId);
        else location.href = "help.html";
      }, 700);
    });
  </script>
</body>
</html>
