<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>订单详情 · 星启家庭教育</title>
  <link rel="stylesheet" href="../assets/css/proto.css" />
  <link rel="stylesheet" href="../assets/css/mp.css?v=taste2" />
  <style>
    .mp-kv {
      background: #fff;
      border-radius: var(--mp-radius);
      box-shadow: var(--mp-shadow);
      padding: 4px 16px;
      margin-bottom: 12px;
    }
    .mp-kv-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 13px;
    }
    .mp-kv-row:last-child { border-bottom: 0; }
    .mp-kv-row span { color: var(--mp-muted); flex-shrink: 0; }
    .mp-kv-row b { font-weight: 650; color: var(--mp-ink); text-align: right; }
    .mp-callout {
      border-radius: 14px;
      padding: 14px 14px;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .mp-callout.warn {
      background: #fff7e8;
      border: 1px solid #ffcf8b;
      color: #ad6800;
    }
    .mp-callout.info {
      background: #edf3ff;
      border: 1px solid #bedaff;
      color: #1d39c4;
    }
    .mp-callout.ok {
      background: #e8f8ec;
      border: 1px solid #b7eb8f;
      color: #237804;
    }
    .mp-sheet-mask {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 20;
      display: none;
      align-items: flex-end;
    }
    .mp-sheet-mask.open { display: flex; }
    .mp-sheet {
      width: 100%;
      background: #fff;
      border-radius: 18px 18px 0 0;
      padding: 8px 18px 28px;
      max-height: 82%;
      overflow-y: auto;
    }
    .mp-sheet-handle {
      width: 36px; height: 4px; border-radius: 4px;
      background: #e5e6eb; margin: 6px auto 14px;
    }
    .mp-field { margin-bottom: 12px; }
    .mp-field label {
      display: block; font-size: 12px; color: var(--mp-muted);
      margin-bottom: 6px; font-weight: 550;
    }
    .mp-field select,
    .mp-field textarea {
      width: 100%;
      border: 1px solid var(--mp-line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      color: var(--mp-text);
    }
    .mp-field textarea { min-height: 88px; resize: vertical; }
  </style>
</head>
<body class="mp-page" data-tabbar="0">
  <div class="mp-frame">
    <div class="mp-status">
      <span>9:41</span>
      <span class="mp-notch" aria-hidden="true"></span>
      <span>100%</span>
    </div>
    <div class="mp-nav"><a class="back" href="orders.html" aria-label="返回">‹</a>订单详情</div>
    <div class="mp-body">
      <div style="padding:14px 16px 28px" id="detail-root">
        <div class="mp-callout warn">未找到订单，请返回订单列表。</div>
        <a class="mp-btn" href="orders.html">返回我的订单</a>
      </div>
    </div>

    <div class="mp-sheet-mask" id="as-sheet" aria-hidden="true">
      <div class="mp-sheet" role="dialog">
        <div class="mp-sheet-handle"></div>
        <div style="font-size:17px;font-weight:750;margin-bottom:6px;color:var(--mp-ink)">申请售后</div>
        <p style="font-size:12px;color:var(--mp-muted);margin:0 0 14px;line-height:1.55">
          MVP 演示：提交后本地记录状态，不做完整工单流转。
        </p>
        <div class="mp-field">
          <label for="as-reason">售后原因</label>
          <select id="as-reason">
            <option value="无法观看">无法观看 / 权益未开通</option>
            <option value="内容不符">内容与描述不符</option>
            <option value="重复购买">重复购买</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="mp-field">
          <label for="as-desc">问题描述</label>
          <textarea id="as-desc" placeholder="简要说明问题，便于商家处理"></textarea>
        </div>
        <button type="button" class="mp-btn" id="as-submit">提交申请</button>
        <button type="button" class="mp-btn mp-btn-ghost" id="as-cancel" style="margin-top:6px">取消</button>
      </div>
    </div>
  </div>
  <p class="mp-hint"><span style="opacity:.75">原型切换</span> · <a href="../admin/orders.html">管理端订单</a></p>
  <script src="../assets/js/proto.js"></script>
  <script src="../assets/js/mp-shell.js"></script>
  <script>
    var AS_KEY = "mp_aftersale_demo_v1";
    var ORDERS = {
      MP202609080199: {
        id: "MP202609080199",
        channel: "miniprogram",
        channelLabel: "小程序购买",
        product: "亲子沟通基础",
        cover: "../assets/img/covers/comm.jpg",
        payStatus: "已支付",
        amount: 199,
        time: "2026-09-08 20:41",
        payMethod: "微信支付",
        learnHref: "learn.html",
        learnLabel: "去学习"
      },
      VX202603291088: {
        id: "VX202603291088",
        channel: "video",
        channelLabel: "视频号购买",
        product: "家庭教育入门 9.9",
        cover: "../assets/img/covers/trial.jpg",
        payStatus: "已支付",
        amount: 9.9,
        time: "2026-03-29 14:18",
        payMethod: "视频号小店",
        learnHref: "claim.html",
        learnLabel: "去领课"
      }
    };

    function loadAftersales() {
      try {
        return JSON.parse(localStorage.getItem(AS_KEY) || "{}") || {};
      } catch (e) {
        return {};
      }
    }
    function saveAftersales(map) {
      localStorage.setItem(AS_KEY, JSON.stringify(map));
    }

    var params = new URLSearchParams(location.search);
    var orderId = params.get("id") || "";
    var order = ORDERS[orderId];
    var root = document.getElementById("detail-root");
    var sheet = document.getElementById("as-sheet");

    function contactHref(extra) {
      var ctx =
        "订单 " + order.id + " · " + order.product + " · " + order.channelLabel +
        (extra ? " · " + extra : "");
      return "contact.html?orderId=" + encodeURIComponent(order.id) +
        "&course=" + encodeURIComponent(order.product) +
        "&channel=" + encodeURIComponent(order.channelLabel) +
        "&ctx=" + encodeURIComponent(ctx);
    }

    function render() {
      if (!order) return;
      var asMap = loadAftersales();
      var as = asMap[order.id];
      var html = "";

      html +=
        '<div style="display:flex;gap:12px;align-items:center;background:#fff;border-radius:var(--mp-radius);box-shadow:var(--mp-shadow);padding:14px;margin-bottom:12px">' +
          '<div class="mp-cover" style="width:84px;height:63px;border-radius:12px;flex-shrink:0"><img src="' + order.cover + '" alt="" /></div>' +
          "<div>" +
            '<div style="font-size:15px;font-weight:750;color:var(--mp-ink);letter-spacing:-0.02em">' + order.product + "</div>" +
            '<div style="font-size:12px;color:var(--mp-muted);margin-top:6px">' + order.channelLabel + " · " + order.payStatus + "</div>" +
            '<div style="font-size:18px;font-weight:750;margin-top:8px;color:var(--mp-ink)"><small style="font-size:12px">¥</small>' + order.amount + "</div>" +
          "</div>" +
        "</div>";

      html +=
        '<div class="mp-kv">' +
          '<div class="mp-kv-row"><span>订单号</span><b class="mono">' + order.id + "</b></div>" +
          '<div class="mp-kv-row"><span>支付状态</span><b style="color:var(--mp-success)">' + order.payStatus + "</b></div>" +
          '<div class="mp-kv-row"><span>支付方式</span><b>' + order.payMethod + "</b></div>" +
          '<div class="mp-kv-row"><span>下单时间</span><b>' + order.time + "</b></div>" +
        "</div>";

      if (order.channel === "video") {
        html +=
          '<div class="mp-callout warn">' +
            "<strong>视频号订单售后请回原购买渠道</strong><br />" +
            "本单在视频号小店完成支付。退款 / 售后请前往微信「视频号小店 → 订单 → 申请售后」。小程序内不混用售后入口，避免双轨处理。" +
          "</div>" +
          '<div class="mp-callout info">' +
            "学习权益：请先完成领课兑换；领课后可在「我的课程」继续学习。" +
          "</div>" +
          '<a class="mp-btn" href="' + order.learnHref + '">' + order.learnLabel + "</a>" +
          '<a class="mp-btn mp-btn-outline" href="' + contactHref("咨询视频号订单") + '" style="margin-top:10px">联系客服（带订单上下文）</a>' +
          '<button type="button" class="mp-btn mp-btn-outline" id="btn-video-guide" style="margin-top:10px">查看回视频号指引</button>';
      } else {
        if (as) {
          html +=
            '<div class="mp-callout ' + (as.status === "done" ? "ok" : "info") + '">' +
              "<strong>售后进度 · " + (as.statusLabel || "处理中") + "</strong><br />" +
              "原因：" + (as.reason || "—") + "<br />" +
              "说明：" + (as.desc || "—") + "<br />" +
              "提交时间：" + (as.createdAt || "—") +
              (as.note ? "<br />商家备注：" + as.note : "") +
            "</div>";
        } else {
          html +=
            '<div class="mp-callout info">' +
              "小程序购买订单可在此提交售后申请（演示）。商家将在后台售后列表看到对应单。" +
            "</div>";
        }

        html +=
          '<a class="mp-btn" href="' + order.learnHref + '">' + order.learnLabel + "</a>";

        if (!as) {
          html +=
            '<button type="button" class="mp-btn mp-btn-outline" id="btn-as" style="margin-top:10px">申请售后</button>';
        } else if (as.status !== "done") {
          html +=
            '<button type="button" class="mp-btn mp-btn-outline" id="btn-as-refresh" style="margin-top:10px">刷新售后状态</button>';
        }

        html +=
          '<a class="mp-btn mp-btn-outline" href="' + contactHref(as ? "跟进售后" : "咨询订单") + '" style="margin-top:10px">联系客服（带订单上下文）</a>';
      }

      html +=
        '<a class="mp-btn mp-btn-ghost" href="help.html" style="margin-top:8px">账号与帮助</a>';

      root.innerHTML = html;

      var btnAs = document.getElementById("btn-as");
      if (btnAs) {
        btnAs.addEventListener("click", function () {
          sheet.classList.add("open");
          sheet.setAttribute("aria-hidden", "false");
        });
      }
      var btnRefresh = document.getElementById("btn-as-refresh");
      if (btnRefresh) {
        btnRefresh.addEventListener("click", function () {
          var map = loadAftersales();
          var cur = map[order.id];
          if (!cur) return;
          if (cur.status === "pending") {
            cur.status = "reviewing";
            cur.statusLabel = "商家审核中";
            cur.note = "已收到申请，预计 1-2 个工作日反馈";
          } else if (cur.status === "reviewing") {
            cur.status = "done";
            cur.statusLabel = "已处理 · 退款中";
            cur.note = "演示：商家已同意退款，权益将回收";
          }
          map[order.id] = cur;
          saveAftersales(map);
          Proto.toast("售后状态已更新（原型）");
          render();
        });
      }
      var btnVideo = document.getElementById("btn-video-guide");
      if (btnVideo) {
        btnVideo.addEventListener("click", function () {
          Proto.toast("请打开微信 → 视频号小店订单 → 申请售后（原型指引）");
        });
      }
    }

    document.getElementById("as-cancel").addEventListener("click", function () {
      sheet.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");
    });
    sheet.addEventListener("click", function (e) {
      if (e.target === sheet) {
        sheet.classList.remove("open");
        sheet.setAttribute("aria-hidden", "true");
      }
    });
    document.getElementById("as-submit").addEventListener("click", function () {
      if (!order || order.channel !== "miniprogram") return;
      var reason = document.getElementById("as-reason").value;
      var desc = document.getElementById("as-desc").value.trim() || "（未填写详细描述）";
      var map = loadAftersales();
      map[order.id] = {
        orderId: order.id,
        product: order.product,
        reason: reason,
        desc: desc,
        status: "pending",
        statusLabel: "已提交 · 待商家处理",
        createdAt: "2026-09-11 20:05",
        note: ""
      };
      saveAftersales(map);
      sheet.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");
      Proto.toast("售后已提交（原型 · 本地演示）");
      render();
    });

    if (order) render();
  </script>
</body>
</html>
