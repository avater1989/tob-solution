<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的订单 · To-B 小程序</title>
  <link rel="stylesheet" href="../assets/css/proto.css" />
  <link rel="stylesheet" href="../assets/css/mp.css?v=5" />
</head>
<body class="mp-page" data-tabbar="0">
  <div class="mp-frame">
    <div class="mp-top" style="height:170px"></div>
    <div class="mp-status"><span>9:41</span><span>订单</span><span>100%</span></div>
    <div class="mp-nav"><a class="back" href="mine.html">←</a>我的订单</div>
    <div class="mp-body" style="padding:0 14px">

      <!-- 状态筛选 -->
      <div class="mp-tabs" id="order-tabs">
        <a class="mp-tab active" href="#" data-state="">全部</a>
        <a class="mp-tab" href="#" data-state="待付款">待付款</a>
        <a class="mp-tab" href="#" data-state="已完成">已完成</a>
        <a class="mp-tab" href="#" data-state="已退款">已退款</a>
      </div>

      <div id="order-list"></div>

    </div>
  </div>
  <p class="mp-hint">订单与权益、支付结果联动 · <a href="../admin/orders.html">管理端订单</a></p>

  <script src="../assets/js/proto.js"></script>
  <script src="../assets/js/mp-shell.js"></script>
  <script>
    (function () {
      var ORDERS = [
        {
          no: "VX202603291001", time: "2026-09-13 09:12", state: "待付款",
          title: "亲子沟通基础", spec: "8 节视频课 · 长期有效", price: 199,
          cover: "沟通<br>基础", coverBg: "linear-gradient(160deg,#ffe0d8,#ffb3a0)",
          acts: [{ txt: "取消订单", cls: "" }, { txt: "去支付", cls: "primary", act: "pay" }]
        },
        {
          no: "VX202603291088", time: "2026-09-12 20:40", state: "已完成",
          title: "9.9 引流体验课", spec: "视频号订单兑换 · 已开通权益", price: 9.9,
          cover: "体验<br>9.9", coverBg: "linear-gradient(160deg,#ffe7c2,#ffc978)",
          acts: [{ txt: "去学习", cls: "primary", act: "learn" }, { txt: "再次购买", cls: "" }]
        },
        {
          no: "VX202603291075", time: "2026-09-11 21:05", state: "已完成",
          title: "亲子沟通 90 分钟（直播门票）", spec: "单场观看资格 · 已观看", price: 19.9,
          cover: "直播<br>门票", coverBg: "linear-gradient(160deg,#ffd0c9,#ff8b7a)",
          acts: [{ txt: "看回放", cls: "primary", act: "replay" }]
        },
        {
          no: "VX202603291003", time: "2026-09-08 14:22", state: "已退款",
          title: "情绪觉察公开课（回看）", spec: "已退款 ¥39 · 权益已回收", price: 39,
          cover: "回看", coverBg: "linear-gradient(160deg,#d7dee8,#8fa0b8)",
          acts: [{ txt: "再次购买", cls: "" }]
        }
      ];

      var stateMap = { "待付款": "wait", "已完成": "done", "已退款": "refund" };
      var filter = "";

      function render() {
        var list = ORDERS.filter(function (o) { return !filter || o.state === filter; });
        document.getElementById("order-list").innerHTML = list.length
          ? list.map(function (o, i) {
              return '<div class="mp-order">' +
                '<div class="mp-order-hd">' +
                  '<span>订单号 ' + o.no + '</span>' +
                  '<span class="mp-order-state ' + (stateMap[o.state] || "") + '">' + o.state + '</span>' +
                '</div>' +
                '<div class="mp-order-bd">' +
                  '<div class="mp-order-img" style="background:' + o.coverBg + '">' + o.cover + '</div>' +
                  '<div class="mp-order-info">' +
                    '<div class="mp-order-title">' + o.title + '</div>' +
                    '<div class="mp-order-spec">' + o.spec + '</div>' +
                    '<div class="mp-order-price">¥' + o.price + '<span>共 1 件</span></div>' +
                  '</div>' +
                '</div>' +
                '<div class="mp-order-ft">' +
                  '<span class="mp-order-time">' + o.time + '</span>' +
                  o.acts.map(function (a) {
                    return '<a class="mp-btn-sm ' + a.cls + '" href="#" data-act="' + (a.act || "toast") + '" data-idx="' + i + '">' + a.txt + '</a>';
                  }).join("") +
                '</div>' +
              '</div>';
            }).join("")
          : '<div class="mp-empty"><div class="mp-empty-ico">🗂</div>暂无该状态的订单</div>';
      }

      document.getElementById("order-tabs").addEventListener("click", function (e) {
        var t = e.target.closest(".mp-tab");
        if (!t) return;
        e.preventDefault();
        document.querySelectorAll("#order-tabs .mp-tab").forEach(function (x) { x.classList.remove("active"); });
        t.classList.add("active");
        filter = t.getAttribute("data-state") || "";
        render();
      });

      document.getElementById("order-list").addEventListener("click", function (e) {
        var a = e.target.closest("[data-act]");
        if (!a) return;
        e.preventDefault();
        var act = a.getAttribute("data-act");
        if (act === "pay") { location.href = "pay-result.html?from=course"; return; }
        if (act === "learn") { location.href = "learn.html"; return; }
        if (act === "replay") { location.href = "live-room.html"; return; }
        Proto.toast(a.textContent.trim() + "（原型）");
      });

      render();
    })();
  </script>
</body>
</html>
