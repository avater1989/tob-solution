<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的订单 · 星启家庭教育</title>
  <link rel="stylesheet" href="../assets/css/proto.css" />
  <link rel="stylesheet" href="../assets/css/mp.css?v=taste2" />
  <style>
    .mp-order-card {
      display: block;
      background: #fff;
      border-radius: var(--mp-radius);
      box-shadow: var(--mp-shadow);
      padding: 14px 14px 12px;
      margin-bottom: 12px;
      text-decoration: none;
      color: inherit;
    }
    .mp-order-card:hover { text-decoration: none; }
    .mp-order-hd {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--mp-muted);
    }
    .mp-order-hd .ch {
      font-weight: 650;
      color: #5c6575;
    }
    .mp-order-bd {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .mp-order-bd .mp-cover {
      width: 72px;
      height: 54px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .mp-order-bd h4 {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 6px;
      color: var(--mp-ink);
      letter-spacing: -0.02em;
    }
    .mp-order-meta {
      font-size: 12px;
      color: var(--mp-muted);
      line-height: 1.55;
    }
    .mp-order-ft {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #f3f4f6;
    }
    .mp-order-ft .amt {
      font-size: 15px;
      font-weight: 750;
      color: var(--mp-ink);
    }
    .mp-order-ft .amt small { font-size: 12px; font-weight: 650; }
    .mp-order-ft .acts { display: flex; gap: 8px; }
    .mp-mini-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
      border: 1px solid #c7d7ff;
      color: var(--mp-primary);
      background: #fff;
    }
    .mp-mini-btn.primary {
      background: linear-gradient(135deg, #3b82f6, var(--mp-primary-deep));
      color: #fff;
      border-color: transparent;
    }
    .mp-mini-btn:hover { text-decoration: none; }
  </style>
</head>
<body class="mp-page" data-tabbar="0">
  <div class="mp-frame">
    <div class="mp-status">
      <span>9:41</span>
      <span class="mp-notch" aria-hidden="true"></span>
      <span>100%</span>
    </div>
    <div class="mp-nav"><a class="back" href="mine.html" aria-label="返回">‹</a>我的订单</div>
    <div class="mp-body">
      <div style="padding:14px 16px 28px" id="order-list"></div>
    </div>
  </div>
  <p class="mp-hint"><span style="opacity:.75">原型切换</span> · <a href="../admin/orders.html">管理端订单</a></p>
  <script src="../assets/js/proto.js"></script>
  <script src="../assets/js/mp-shell.js"></script>
  <script>
    var AS_KEY = "mp_aftersale_demo_v1";

    function loadAftersales() {
      try {
        return JSON.parse(localStorage.getItem(AS_KEY) || "{}") || {};
      } catch (e) {
        return {};
      }
    }

    var ORDERS = [
      {
        id: "MP202609080199",
        channel: "miniprogram",
        channelLabel: "小程序购买",
        product: "亲子沟通基础",
        cover: "../assets/img/covers/comm.jpg",
        payStatus: "已支付",
        amount: 199,
        time: "2026-09-08 20:41",
        learnHref: "learn.html"
      },
      {
        id: "VX202603291088",
        channel: "video",
        channelLabel: "视频号购买",
        product: "家庭教育入门 9.9",
        cover: "../assets/img/covers/trial.jpg",
        payStatus: "已支付",
        amount: 9.9,
        time: "2026-03-29 14:18",
        learnHref: "claim.html"
      }
    ];

    var asMap = loadAftersales();
    var list = document.getElementById("order-list");

    list.innerHTML = ORDERS.map(function (o) {
      var as = asMap[o.id];
      var asTip = as
        ? '<span class="mp-tag" style="margin-left:6px">' + (as.statusLabel || "售后中") + "</span>"
        : "";
      var learnLabel = o.channel === "video" ? "去领课 / 学习" : "去学习";
      var detailHref = "order-detail.html?id=" + encodeURIComponent(o.id);
      return (
        '<div class="mp-order-card">' +
          '<a href="' + detailHref + '" style="display:block;color:inherit;text-decoration:none">' +
            '<div class="mp-order-hd">' +
              '<span class="ch">' + o.channelLabel + "</span>" +
              '<span>' + o.payStatus + asTip + "</span>" +
            "</div>" +
            '<div class="mp-order-bd">' +
              '<div class="mp-cover"><img src="' + o.cover + '" alt="" /></div>' +
              "<div>" +
                "<h4>" + o.product + "</h4>" +
                '<div class="mp-order-meta">订单号 ' + o.id + "<br />" + o.time + "</div>" +
              "</div>" +
            "</div>" +
          "</a>" +
          '<div class="mp-order-ft">' +
            '<div class="amt"><small>¥</small>' + o.amount + "</div>" +
            '<div class="acts">' +
              '<a class="mp-mini-btn" href="' + detailHref + '">详情</a>' +
              '<a class="mp-mini-btn primary" href="' + o.learnHref + '">' + learnLabel + "</a>" +
            "</div>" +
          "</div>" +
        "</div>"
      );
    }).join("");
  </script>
</body>
</html>
