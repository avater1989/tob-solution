<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的订单 · To-B 小程序</title>
  <link rel="stylesheet" href="../assets/css/proto.css?v=17" />
  <link rel="stylesheet" href="../assets/css/mp.css?v=22" />
  <style>
    /* 退款申请底部弹层（本页自包含，避免改动公共样式） */
    .rf-mask { position:absolute; inset:0; background:rgba(15,23,42,.45); z-index:60; }
    .rf-sheet { position:absolute; left:0; right:0; bottom:0; z-index:61; background:#fff;
      border-radius:16px 16px 0 0; padding:18px 16px 20px; box-shadow:0 -8px 24px rgba(0,0,0,.12); }
    .rf-sheet-hd { font-size:16px; font-weight:600; text-align:center; margin-bottom:16px; }
    .rf-field { margin-bottom:16px; }
    .rf-field > label { display:block; font-size:13px; color:#6b7280; margin-bottom:8px; }
    .rf-opt { color:#9ca3af; }
    .rf-reasons { display:flex; flex-direction:column; gap:8px; }
    .rf-reason { display:flex; align-items:center; gap:8px; padding:10px 12px; border:1px solid #e5e7eb;
      border-radius:8px; font-size:13px; cursor:pointer; }
    .rf-reason.on { border-color:#2563eb; background:#eff6ff; color:#1d4ed8; }
    .rf-field textarea { width:100%; padding:9px 10px; border:1px solid #e5e7eb; border-radius:8px;
      font-size:13px; font-family:inherit; resize:none; box-sizing:border-box; }
    .rf-note { font-size:12px; line-height:1.7; color:#6b7280; background:#f8fafc;
      border:1px solid #eef2f7; border-radius:8px; padding:10px 12px; }
    .rf-note b { color:#1f2937; }
    .rf-ft { display:flex; gap:10px; margin-top:18px; }
    .rf-ft .mp-btn { flex:1; justify-content:center; }
  </style>
</head>
<body class="mp-page" data-tabbar="0">
  <div class="mp-frame">
    <div class="mp-top" style="height:170px"></div>
    <div class="mp-status"><span>9:41</span><span>订单</span><span>100%</span></div>
    <div class="mp-nav"><a class="back" href="mine.html">←</a>我的订单</div>
    <div class="mp-body" style="padding:0 14px">

      <!-- 状态筛选 -->
      <div class="mp-tabs" id="order-tabs">
        <a class="mp-tab active" href="#" data-state="">全部</a>
        <a class="mp-tab" href="#" data-state="待付款">待付款</a>
        <a class="mp-tab" href="#" data-state="已完成">已完成</a>
        <a class="mp-tab" href="#" data-state="退款申请中">退款申请中</a>
        <a class="mp-tab" href="#" data-state="已退款">已退款</a>
      </div>

      <div id="order-list"></div>

    </div>
  </div>
  <!-- 退款理由申请（对应后台订单列表「用户已申请」与售后列表） -->
  <div class="rf-mask" id="rf-mask" style="display:none"></div>
  <div class="rf-sheet" id="rf-sheet" style="display:none">
    <div class="rf-sheet-hd">申请退款</div>
    <div class="rf-field">
      <label>退款理由</label>
      <div class="rf-reasons" id="rf-reasons"></div>
    </div>
    <div class="rf-field">
      <label>补充说明<span class="rf-opt">（选填）</span></label>
      <textarea id="rf-remark" rows="3" placeholder="可补充具体情况，便于运营人员审核"></textarea>
    </div>
    <div class="rf-note">提交后订单状态变为<b>退款申请中</b>，运营人员在后台审核：同意 → <b>退款中</b>；驳回 → <b>已驳回</b>。权益在退款成功后回收。</div>
    <div class="rf-ft">
      <a class="mp-btn" href="#" id="rf-cancel">取消</a>
      <a class="mp-btn primary" href="#" id="rf-submit">提交申请</a>
    </div>
  </div>

  <p class="mp-hint">订单与权益、支付结果联动 · <a href="../admin/orders.html">管理端订单</a> · <a href="../admin/aftersales.html">售后列表</a></p>

  <script src="../assets/js/proto.js"></script>
  <script src="../assets/js/mp-shell.js?v=5"></script>
  <script>
    (function () {
      var ORDERS = [
        {
          no: "VX202603291001", time: "2026-09-13 09:12", state: "待付款",
          title: "小学语文阅读启蒙", spec: "4 节视频课 · 长期有效 · 成交商品 G002", price: 199,
          cover: "阅读<br>启蒙", coverBg: "linear-gradient(160deg,#ffe0d8,#ffb3a0)",
          acts: [{ txt: "取消订单", cls: "" }, { txt: "去支付", cls: "primary", act: "pay" }]
        },
        {
          no: "VX202603291088", time: "2026-09-12 20:40", state: "已完成",
          title: "9.9 引流体验课", spec: "视频号订单兑换 · 已开通权益", price: 9.9,
          cover: "体验<br>9.9", coverBg: "linear-gradient(160deg,#ffe7c2,#ffc978)",
          acts: []
        },
        {
          no: "VX202603291075", time: "2026-09-11 21:05", state: "已完成",
          title: "亲子沟通 90 分钟（直播门票）", spec: "单场观看资格 · 已观看", price: 19.9,
          cover: "直播<br>门票", coverBg: "linear-gradient(160deg,#ffd0c9,#ff8b7a)",
          acts: [{ txt: "我要退款", cls: "", act: "refund" }]
        },
        {
          no: "VX202603291003", time: "2026-09-08 14:22", state: "已退款",
          title: "情绪觉察公开课（回看）", spec: "已退款 ¥39 · 权益已回收", price: 39,
          cover: "回看", coverBg: "linear-gradient(160deg,#d7dee8,#8fa0b8)",
          acts: []
        }
      ];

      var stateMap = { "待付款": "wait", "已完成": "done", "退款申请中": "apply", "已退款": "refund" };
      var filter = "";

      function render() {
        var list = ORDERS.filter(function (o) { return !filter || o.state === filter; });
        document.getElementById("order-list").innerHTML = list.length
          ? list.map(function (o, i) {
              return '<div class="mp-order">' +
                '<div class="mp-order-hd">' +
                  '<span>订单号 ' + o.no + '</span>' +
                  '<span class="mp-order-state ' + (stateMap[o.state] || "") + '">' + o.state + '</span>' +
                '</div>' +
                '<div class="mp-order-bd">' +
                  '<div class="mp-order-img" style="background:' + o.coverBg + '">' + o.cover + '</div>' +
                  '<div class="mp-order-info">' +
                    '<div class="mp-order-title">' + o.title + '</div>' +
                    '<div class="mp-order-spec">' + o.spec + '</div>' +
                    '<div class="mp-order-price">¥' + o.price + '<span>共 1 件</span></div>' +
                  '</div>' +
                '</div>' +
                '<div class="mp-order-ft">' +
                  '<span class="mp-order-time">' + o.time + '</span>' +
                  o.acts.map(function (a) {
                    return '<a class="mp-btn-sm ' + a.cls + '" href="#" data-act="' + (a.act || "toast") + '" data-idx="' + i + '">' + a.txt + '</a>';
                  }).join("") +
                '</div>' +
              '</div>';
            }).join("")
          : '<div class="mp-empty"><div class="mp-empty-ico">🗂</div>暂无该状态的订单</div>';
      }

      document.getElementById("order-tabs").addEventListener("click", function (e) {
        var t = e.target.closest(".mp-tab");
        if (!t) return;
        e.preventDefault();
        document.querySelectorAll("#order-tabs .mp-tab").forEach(function (x) { x.classList.remove("active"); });
        t.classList.add("active");
        filter = t.getAttribute("data-state") || "";
        render();
      });

      document.getElementById("order-list").addEventListener("click", function (e) {
        var a = e.target.closest("[data-act]");
        if (!a) return;
        e.preventDefault();
        var act = a.getAttribute("data-act");
        if (act === "pay") {
          /* 待付款订单：订单已生成，直接进收银台完成支付（与商品详情页「去支付」同一收银台） */
          var o = ORDERS[parseInt(a.getAttribute("data-idx"), 10)] || {};
          location.href = "cashier.html?from=order&goods_id=G002&content_id=C001" +
            "&order_no=" + encodeURIComponent(o.no || "") +
            "&return=" + encodeURIComponent("orders.html");
          return;
        }
        if (act === "learn") { location.href = "learn.html?id=C001"; return; }
        if (act === "refund") {
          openRefund(parseInt(a.getAttribute("data-idx"), 10));
          return;
        }
        Proto.toast(a.textContent.trim() + "（原型）");
      });

      /* ===== 退款理由申请 → 回写订单状态并联动后台 ===== */
      var RF_REASONS = ["课程内容与宣传不符", "买了之后没时间学", "重复下单", "价格 / 优惠问题", "其他原因"];
      var rfIdx = -1;
      var rfReason = "";

      function openRefund(i) {
        rfIdx = i;
        rfReason = RF_REASONS[0];
        document.getElementById("rf-remark").value = "";
        document.getElementById("rf-reasons").innerHTML = RF_REASONS.map(function (r, k) {
          return '<label class="rf-reason' + (k === 0 ? " on" : "") + '" data-r="' + r + '">' +
            '<input type="radio" name="rf-r" ' + (k === 0 ? "checked" : "") + ' />' + r + '</label>';
        }).join("");
        document.getElementById("rf-mask").style.display = "";
        document.getElementById("rf-sheet").style.display = "";
      }
      function closeRefund() {
        document.getElementById("rf-mask").style.display = "none";
        document.getElementById("rf-sheet").style.display = "none";
      }

      document.getElementById("rf-reasons").addEventListener("click", function (e) {
        var lab = e.target.closest(".rf-reason");
        if (!lab) return;
        rfReason = lab.getAttribute("data-r");
        document.querySelectorAll("#rf-reasons .rf-reason").forEach(function (x) { x.classList.remove("on"); });
        lab.classList.add("on");
        lab.querySelector("input").checked = true;
      });
      document.getElementById("rf-cancel").addEventListener("click", function (e) {
        e.preventDefault(); closeRefund();
      });
      document.getElementById("rf-mask").addEventListener("click", closeRefund);
      document.getElementById("rf-submit").addEventListener("click", function (e) {
        e.preventDefault();
        var o = ORDERS[rfIdx];
        if (!o) return;
        var remark = document.getElementById("rf-remark").value.trim();
        o.state = "退款申请中";
        o.refundReason = rfReason;
        o.refundRemark = remark;
        o.spec = "退款申请已提交 · 待运营人员审核";
        o.acts = [{ txt: "查看进度", cls: "",act: "toast" }];
        closeRefund();
        render();
        /* 切到「退款申请中」页签，让申请结果可见 */
        filter = "退款申请中";
        document.querySelectorAll("#order-tabs .mp-tab").forEach(function (x) {
          x.classList.toggle("active", x.getAttribute("data-state") === "退款申请中");
        });
        render();
        Proto.toast("退款申请已提交（理由：" + rfReason + "），待运营人员审核（原型）");
      });

      render();
    })();
  </script>
</body>
</html>
