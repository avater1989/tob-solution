  <p class="mp-hint">首页 = 搜索 + 金刚区 + 艺博士 + 直播 + 线上课 + 线下课 + 精选文章 · <a href="ai.html">艺博士</a> · <a href="../admin/mp-home.html">管理端装修</a></p>

  <script src="../assets/js/proto.js"></script>
  <script src="../assets/js/content-tags.js?v=2"></script>
  <script src="../assets/js/teachers-store.js?v=2"></script>
  <script src="../assets/js/course-store.js?v=2"></script>
  <script src="../assets/js/prototype-business-store.js"></script>
  <script src="../assets/js/goods-store.js?v=1"></script>
  <script src="../assets/js/listing-store.js?v=1"></script>
  <script src="../assets/js/mp-commerce.js?v=2"></script>
  <script src="../assets/js/mp-shell.js"></script>
  <script>
  (function () {
    var Store = window.CourseStore;
    var Tags = window.ContentTags;
    var Teachers = window.Teachers;
    var Mp = window.MpCommerce;
    var LS = window.ListingStore;

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    }

    function tagNames(ids) {
      return (ids || []).map(function (id) {
        var t = Tags.get(id);
        return t ? t.name : "";
      }).filter(Boolean).slice(0, 2);
    }

    /* 首页露出顺序与内容由「首页装修」的上架配置决定 */
    function listedIds(slot) {
      return LS.listBySlot(slot).filter(function (r) { return r.visible && r.status === "active"; })
        .map(function (r) { return r.content_id; });
    }

    function renderOnline() {
      var list = listedIds("online").map(function (cid) { return Store.get(cid); })
        .filter(function (c) { return c && c.storeVisible !== false; }).slice(0, 3);
      document.getElementById("home-online").innerHTML = list.map(function (c) {
        var tags = tagNames(c.tagIds);
        var priceBtn = Mp.priceLabel(c.id, "online").text;
        var ch = Store.chapterCount(c);
        return (
          '<a class="mp-crow" href="course.html?id=' + encodeURIComponent(c.id) + '">' +
            '<div class="mp-crow-cover"><img src="' + esc(c.cover) + '" alt="" /></div>' +
            '<div class="mp-crow-bd">' +
              '<div class="mp-crow-title">' + esc(c.name) + "</div>" +
              '<div class="mp-crow-tags">' +
                tags.map(function (n) { return '<span class="mp-crow-tag">' + esc(n) + "</span>"; }).join("") +
                (c.badge === "hot" ? '<span class="mp-crow-tag">热门</span>' : "") +
                (c.badge === "premium" ? '<span class="mp-crow-tag">精品</span>' : "") +
              "</div>" +
              '<div class="mp-crow-meta">' + esc(Teachers.nameOf(c.teacherId) || c.teacher || "讲师") +
                (c.term ? " · " + esc(c.term) : "") + " · 共" + ch + "讲</div>" +
              '<div class="mp-crow-num">' + (c.views || 0) + "人学过</div>" +
            "</div>" +
            '<span class="mp-crow-btn">' + priceBtn + "</span>" +
          "</a>"
        );
      }).join("") || '<p style="padding:12px;color:#8c8c8c;font-size:13px">暂无线上课</p>';
    }

    var OFFLINES = [
      {
        id: "O001", name: "卓越家族培养计划 · 线下工作坊", teacherId: "TCH02",
        city: "上海", courseStart: "09-28 09:30", signed: 86, capacity: 100,
        cover: "../assets/img/covers/classroom.jpg", phase: "报名中", tagIds: ["TG01", "TG02"]
      },
      {
        id: "O002", name: "亲子沟通实战 · 线下沙龙", teacherId: "TCH01",
        city: "深圳", courseStart: "10-12 14:00", signed: 32, capacity: 40,
        cover: "../assets/img/covers/talk.jpg", phase: "免费", tagIds: ["TG02"]
      }
    ];

    function renderOffline() {
      var order = listedIds("offline");
      var list = order.map(function (cid) {
        return OFFLINES.filter(function (x) { return x.id === cid; })[0];
      }).filter(Boolean).slice(0, 3);
      document.getElementById("home-offline").innerHTML = list.map(function (o) {
        var tags = tagNames(o.tagIds);
        var btn = Mp.priceLabel(o.id, "offline").text;
        return (
          '<a class="mp-crow" href="offline-detail.html?id=' + encodeURIComponent(o.id) + '">' +
            '<div class="mp-crow-cover"><img src="' + esc(o.cover) + '" alt="" /></div>' +
            '<div class="mp-crow-bd">' +
              '<div class="mp-crow-title">' + esc(o.name) + "</div>" +
              '<div class="mp-crow-tags">' +
                '<span class="mp-crow-tag">' + esc(o.city) + "</span>" +
                '<span class="mp-crow-tag">' + esc(o.phase) + "</span>" +
                tags.map(function (n) { return '<span class="mp-crow-tag">' + esc(n) + "</span>"; }).join("") +
              "</div>" +
              '<div class="mp-crow-meta">' + esc(Teachers.nameOf(o.teacherId)) + " · " + esc(o.courseStart) + " 开课</div>" +
              '<div class="mp-crow-num">' + o.signed + "/" + o.capacity + " 人已报名</div>" +
            "</div>" +
            '<span class="mp-crow-btn">' + btn + "</span>" +
          "</a>"
        );
      }).join("") || '<p style="padding:12px;color:#8c8c8c;font-size:13px">暂无线下课</p>';
    }

    var ARTICLES = [
      { id: "A001", title: "9 月新学期家长指南", cover: "../assets/img/covers/term.jpg", author: "编辑部", tagIds: ["TG04"], reads: 2340 },
      { id: "A002", title: "孩子注意力训练方法论", cover: "../assets/img/covers/focus.jpg", author: "张老师", tagIds: ["TG06"], reads: 1560 },
      { id: "A004", title: "亲子沟通的三个黄金句式", cover: "../assets/img/covers/talk.jpg", author: "李老师", tagIds: ["TG02"], reads: 980 }
    ];

    function renderArticles() {
      var order = listedIds("article");
      var list = order.map(function (cid) {
        return ARTICLES.filter(function (x) { return x.id === cid; })[0];
      }).filter(Boolean).slice(0, 3);
      document.getElementById("home-articles").innerHTML = list.map(function (a) {
        var tags = tagNames(a.tagIds);
        var lb = Mp.priceLabel(a.id, "article");
        var pay = lb.ctx.free
          ? '<span style="color:#165dff">免费</span>'
          : (lb.ctx.owned
            ? '<span style="color:#00b42a">已解锁</span>'
            : '<span style="color:#d46b08">' + (lb.ctx.orderMode === "inline" ? "付费 " + lb.text : "付费") + "</span>");
        return (
          '<a class="mp-arow" href="article-detail.html?id=' + encodeURIComponent(a.id) + '">' +
            '<div class="mp-arow-cover"><img src="' + esc(a.cover) + '" alt="" /></div>' +
            '<div class="mp-arow-bd">' +
              '<div class="mp-arow-title">' + esc(a.title) + "</div>" +
              '<div class="mp-arow-meta">' +
                "<span>" + pay + "</span>" +
                (tags[0] ? "<span>" + esc(tags[0]) + "</span>" : "") +
                "<span>" + esc(a.author) + "</span>" +
                "<span>" + a.reads + " 阅读</span>" +
              "</div>" +
            "</div>" +
          "</a>"
        );
      }).join("") || '<p style="padding:12px;color:#8c8c8c;font-size:13px">暂无精选文章</p>';
    }

    renderOnline();
    renderOffline();
    renderArticles();

    var body = document.getElementById("mpHomeBody");
    var fab = document.getElementById("mpFloatTop");
    if (body && fab) {
      fab.addEventListener("click", function (e) {
        e.preventDefault();
        body.scrollTo({ top: 0, behavior: "smooth" });
      });
    }
  })();
  </script>
