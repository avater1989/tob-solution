<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首页 · To-B 小程序</title>
  <link rel="stylesheet" href="../assets/css/proto.css" />
  <link rel="stylesheet" href="../assets/css/mp.css?v=5" />
</head>
<body class="mp-page" data-tab="home">
  <div class="mp-frame">
    <div class="mp-top"></div>
    <div class="mp-status"><span>9:41</span><span>To-B 小程序</span><span>100%</span></div>
    <div class="mp-nav">星启家庭教育</div>
    <div class="mp-body">

      <!-- Banner -->
      <div class="mp-banner">
        <span class="mp-banner-pill">今晚 20:00 公开课 · 预约即可</span>
        <h3>亲子沟通，从听懂开始</h3>
        <p>8 节体系课 · 陪学营老师全程答疑</p>
      </div>

      <!-- 定制化计划入口（特定条件下出现，?plan=0 隐藏） -->
      <a class="mp-strip" id="plan-strip" href="assess.html" style="display:none">
        <span class="mp-strip-dot">测</span>
        <span class="mp-strip-txt" id="plan-strip-txt">老师为你定制了计划</span>
        <span class="mp-strip-go">去测评 ›</span>
      </a>

      <!-- 精选课程 -->
      <div class="mp-section" style="padding-top:16px">
        <div class="mp-section-head">
          <div class="mp-section-title">精选课程</div>
          <a class="mp-section-more" href="lives.html">更多 ›</a>
        </div>

        <a class="course-card" href="course.html">
          <div class="course-cover">沟通<br />基础</div>
          <div class="course-info">
            <h4>亲子沟通基础</h4>
            <p>8 节 · 适合 3–12 岁家庭</p>
            <div class="price">¥199 <s>¥299</s></div>
          </div>
        </a>

        <a class="course-card" href="course.html">
          <div class="course-cover">系列<br />入门</div>
          <div class="course-info">
            <h4>家庭教育入门系列</h4>
            <p>3 门组合 · 系统学习</p>
            <div class="price">¥399</div>
          </div>
        </a>

        <a class="course-card" href="claim.html">
          <div class="course-cover">体验<br />9.9</div>
          <div class="course-info">
            <h4>9.9 引流体验课</h4>
            <p>视频号同款 · 可领课后学习</p>
            <div class="price">¥9.9</div>
          </div>
        </a>
      </div>

    </div>
  </div>
  <p class="mp-hint">首页 = Banner + 定制化计划入口 + 精选课程 · <a href="../admin/content-series.html">管理端内容</a></p>

  <script src="../assets/js/proto.js"></script>
  <script src="../assets/js/mp-plan.js?v=1"></script>
  <script src="../assets/js/mp-shell.js"></script>
  <script>
    // 细长条：仅当存在定制化计划时展示
    (function () {
      var strip = document.getElementById("plan-strip");
      if (!strip || !window.MpPlan || !window.MpPlan.active) return;
      var plan = window.MpPlan.plan;
      document.getElementById("plan-strip-txt").innerHTML =
        "定制化计划 · <b>" + plan.name + "</b>";
      strip.style.display = "flex";
    })();
  </script>
</body>
</html>
