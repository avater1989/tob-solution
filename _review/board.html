<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>原型评审标注看板</title>
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --border: #e5e6eb;
    --text: #1d2129;
    --text-2: #4e5969;
    --muted: #86909c;
    --primary: #165dff;
    --primary-soft: #e8f3ff;
    --success: #00b42a;
    --success-soft: #e8ffea;
    --warning: #ff7d00;
    --danger: #f53f3f;
    --radius: 8px;
    --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC",
      "Noto Sans CJK SC", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 14px; line-height: 1.6;
  }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 24px 64px; }

  header.top { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  header.top h1 { margin: 0 0 4px; font-size: 20px; font-weight: 650; }
  header.top .sub { color: var(--muted); font-size: 13px; }
  header.top .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 14px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: #0e42d2; border-color: #0e42d2; color: #fff; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer; transition: border-color .15s, box-shadow .15s;
  }
  .stat:hover { border-color: #c9cdd4; }
  .stat.active { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .stat .n { font-size: 24px; font-weight: 650; line-height: 1.2; }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat[data-status="open"] .n { color: var(--primary); }
  .stat[data-status="resolved"] .n { color: var(--success); }
  .stat[data-status="wontfix"] .n { color: var(--muted); }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .search {
    flex: 1; min-width: 220px; height: 34px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
    font-family: inherit; background: var(--surface); color: var(--text);
  }
  .search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .chips { display: flex; gap: 6px; }
  .chip {
    height: 34px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-2); font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); }
  .chip.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }

  .group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
  .group-hd {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fafbfc;
  }
  .group-hd .path { font-weight: 600; font-size: 14px; }
  .group-hd .cnt { font-size: 12px; color: var(--muted); }
  .group-hd .open-link { margin-left: auto; font-size: 13px; white-space: nowrap; }

  .item { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #f2f3f5; }
  .item:last-child { border-bottom: none; }
  .item .idx {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
    background: var(--primary-soft); color: var(--primary);
    font-size: 12px; font-weight: 600; display: grid; place-items: center; margin-top: 2px;
  }
  .item[data-status="resolved"] .idx { background: var(--success-soft); color: var(--success); }
  .item[data-status="wontfix"] .idx { background: #f2f3f5; color: var(--muted); }
  .item .body { flex: 1; min-width: 0; }

  .tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 4px; line-height: 18px; white-space: nowrap; }
  .tag-p0 { background: #ffece8; color: var(--danger); font-weight: 600; }
  .tag-p1 { background: #fff7e8; color: var(--warning); font-weight: 600; }
  .tag-p2 { background: #f2f3f5; color: var(--text-2); font-weight: 600; }
  .tag-type { background: #f2f3f5; color: var(--text-2); }
  .tag-st-open { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .tag-st-resolved { background: var(--success-soft); color: var(--success); font-weight: 600; }
  .tag-st-wontfix { background: #f2f3f5; color: var(--muted); font-weight: 600; }
  .tag-shell { background: #fff7e8; color: var(--warning); }
  .tag-time { color: var(--muted); font-size: 12px; margin-left: auto; }

  .comment { font-size: 14px; color: var(--text); margin: 4px 0 8px; white-space: pre-wrap; word-break: break-word; }
  .meta { font-size: 12px; color: var(--muted); }
  .meta .k { color: var(--text-2); }
  .meta code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #f7f8fa; border: 1px solid var(--border); border-radius: 4px;
    padding: 0 4px; font-size: 11.5px; word-break: break-all;
  }
  .meta .row { margin-top: 3px; }

  .empty, .error {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 48px 24px; text-align: center; color: var(--muted);
  }
  .error { border-color: #ffd2ce; background: #fff9f8; color: var(--text-2); text-align: left; }
  .error h3 { margin: 0 0 8px; color: var(--danger); font-size: 15px; }
  .error code {
    display: inline-block; background: #fff; border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px;
  }
  .error ol { margin: 8px 0 0; padding-left: 20px; }
  .error li { margin-bottom: 4px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>原型评审标注看板</h1>
      <div class="sub" id="sub">加载中…</div>
    </div>
    <div class="acts">
      <button class="btn" id="btn-refresh">刷新</button>
      <a class="btn btn-primary" href="/prototype/index.html">打开原型入口</a>
    </div>
  </header>

  <div class="stats" id="stats">
    <div class="stat" data-status="all"><div class="n" id="n-all">0</div><div class="l">全部标注</div></div>
    <div class="stat" data-status="open"><div class="n" id="n-open">0</div><div class="l">待处理</div></div>
    <div class="stat" data-status="resolved"><div class="n" id="n-resolved">0</div><div class="l">已修改</div></div>
    <div class="stat" data-status="wontfix"><div class="n" id="n-wontfix">0</div><div class="l">不修改</div></div>
  </div>

  <div class="toolbar">
    <input class="search" id="search" type="search" placeholder="搜索：页面 / 意见 / 元素文本 / 选择器…" />
    <div class="chips" id="chips">
      <button class="chip active" data-pri="all">全部优先级</button>
      <button class="chip" data-pri="P0">P0</button>
      <button class="chip" data-pri="P1">P1</button>
      <button class="chip" data-pri="P2">P2</button>
    </div>
  </div>

  <div id="list"></div>

  <div class="empty hidden" id="empty">还没有任何标注。<br />打开原型页按 <b>Alt+A</b> 进入标注模式，点击要改的元素写下意见。</div>

  <div class="error hidden" id="error">
    <h3>读不到标注数据</h3>
    <div id="error-msg"></div>
    <ol>
      <li>确认标注服务已启动：<code>python3 _review/serve.py</code></li>
      <li>用服务地址打开看板：<code>http://127.0.0.1:8090/_review/board.html</code></li>
      <li>直接用文件打开（<code>file://</code>）或换别的静态服务都会读不到数据。</li>
    </ol>
  </div>

</div>

<script>
(function () {
  var TYPE_TEXT = {
    copy: "文案", layout: "布局", interaction: "交互",
    add: "新增", remove: "删除", question: "疑问"
  };
  var STATUS_TEXT = { open: "待处理", resolved: "已修改", wontfix: "不修改" };

  var state = { items: [], status: "all", pri: "all", kw: "" };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function pageUrl(page) {
    return "/prototype/" + String(page || "").replace(/^\/+/, "");
  }

  function match(it) {
    if (state.status !== "all" && (it.status || "open") !== state.status) return false;
    if (state.pri !== "all" && (it.priority || "P1") !== state.pri) return false;
    if (!state.kw) return true;
    var a = it.anchor || {};
    var hay = [
      it.page, it.comment, it.id,
      TYPE_TEXT[it.type] || "", STATUS_TEXT[it.status || "open"] || "",
      a.selector, a.selectorIn, a.label, a.text, a.html, a.shell
    ].join(" ").toLowerCase();
    return hay.indexOf(state.kw) >= 0;
  }

  function itemHtml(it, idx) {
    var a = it.anchor || {};
    var st = it.status || "open";
    var pri = it.priority || "P1";
    var sel = a.selectorIn || a.selector || "—";
    var rows = [];
    rows.push('<div class="row"><span class="k">锚点</span> <code>' + esc(sel) + "</code>" +
      (a.root ? ' <span class="k">根</span> <code>' + esc(a.root) + "</code>" : "") + "</div>");
    if (a.region === "shell") {
      rows.push('<div class="row"><span class="k">区域</span> 外壳，需改 <code>' +
        esc(a.shell || "外壳脚本") + "</code> 而非页面 HTML</div>");
    }
    if (a.text) rows.push('<div class="row"><span class="k">元素文本</span> ' + esc(a.text.slice(0, 160)) + "</div>");
    if (a.html) rows.push('<div class="row"><span class="k">元素片段</span> <code>' + esc(a.html.slice(0, 220)) + "</code></div>");
    rows.push('<div class="row"><span class="k">标注 ID</span> <code>' + esc(it.id) + "</code></div>");

    return '<div class="item" data-status="' + esc(st) + '">' +
      '<div class="idx">' + idx + "</div>" +
      '<div class="body">' +
        '<div class="tags">' +
          '<span class="tag tag-' + esc(pri.toLowerCase()) + '">' + esc(pri) + "</span>" +
          '<span class="tag tag-type">' + esc(TYPE_TEXT[it.type] || "意见") + "</span>" +
          '<span class="tag tag-st-' + esc(st) + '">' + esc(STATUS_TEXT[st] || st) + "</span>" +
          (a.region === "shell" ? '<span class="tag tag-shell">外壳区域</span>' : "") +
          '<span class="tag-time">' + esc(it.createdAt || "") + "</span>" +
        "</div>" +
        '<div class="comment">' + esc(it.comment || "（未填写意见）") + "</div>" +
        '<div class="meta">' + rows.join("") + "</div>" +
      "</div>" +
    "</div>";
  }

  function render() {
    var all = state.items;
    document.getElementById("n-all").textContent = all.length;
    ["open", "resolved", "wontfix"].forEach(function (s) {
      document.getElementById("n-" + s).textContent = all.filter(function (i) {
        return (i.status || "open") === s;
      }).length;
    });

    Array.prototype.forEach.call(document.querySelectorAll(".stat"), function (el) {
      el.classList.toggle("active", el.getAttribute("data-status") === state.status);
    });
    Array.prototype.forEach.call(document.querySelectorAll("#chips .chip"), function (el) {
      el.classList.toggle("active", el.getAttribute("data-pri") === state.pri);
    });

    var rows = all.filter(match);
    var list = document.getElementById("list");
    var empty = document.getElementById("empty");

    if (!all.length) {
      list.innerHTML = "";
      empty.classList.remove("hidden");
      empty.innerHTML = "还没有任何标注。<br />打开原型页按 <b>Alt+A</b> 进入标注模式，点击要改的元素写下意见。";
      document.getElementById("sub").textContent = "共 0 条 · 尚未开始标注";
      return;
    }
    if (!rows.length) {
      list.innerHTML = "";
      empty.classList.remove("hidden");
      empty.innerHTML = "没有符合当前筛选条件的标注。";
      document.getElementById("sub").textContent = "共 " + all.length + " 条 · 当前筛选命中 0 条";
      return;
    }
    empty.classList.add("hidden");

    var groups = {};
    var order = [];
    rows.forEach(function (it) {
      var p = it.page || "unknown";
      if (!groups[p]) { groups[p] = []; order.push(p); }
      groups[p].push(it);
    });
    order.sort();

    var html = "";
    order.forEach(function (p) {
      var g = groups[p];
      var pend = g.filter(function (i) { return (i.status || "open") === "open"; }).length;
      html += '<div class="group">' +
        '<div class="group-hd">' +
          '<span class="path">' + esc(p) + "</span>" +
          '<span class="cnt">' + g.length + " 条 · 待处理 " + pend + "</span>" +
          '<a class="open-link" href="' + esc(pageUrl(p)) + '" target="_blank" rel="noopener">打开页面 →</a>' +
        "</div>" +
        g.map(function (it, i) { return itemHtml(it, i + 1); }).join("") +
      "</div>";
    });
    list.innerHTML = html;

    var open = all.filter(function (i) { return (i.status || "open") === "open"; }).length;
    document.getElementById("sub").textContent =
      "共 " + all.length + " 条（待处理 " + open + " / 已处理 " + (all.length - open) + "）" +
      " · 当前筛选命中 " + rows.length + " 条";
  }

  function showError(msg) {
    document.getElementById("error").classList.remove("hidden");
    document.getElementById("error-msg").innerHTML = msg;
    document.getElementById("sub").textContent = "数据读取失败";
  }

  function load() {
    return fetch("/__review/load?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) {
        document.getElementById("error").classList.add("hidden");
        state.items = (d && d.items) || [];
        render();
      })
      .catch(function (e) {
        state.items = [];
        document.getElementById("list").innerHTML = "";
        document.getElementById("empty").classList.add("hidden");
        showError("请求 <code>/__review/load</code> 失败：" + esc(e.message) + "（常见于页面不是经标注服务打开的）");
      });
  }

  document.getElementById("btn-refresh").addEventListener("click", load);
  document.getElementById("search").addEventListener("input", function (e) {
    state.kw = e.target.value.trim().toLowerCase();
    render();
  });
  Array.prototype.forEach.call(document.querySelectorAll(".stat"), function (el) {
    el.addEventListener("click", function () {
      state.status = el.getAttribute("data-status");
      render();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("#chips .chip"), function (el) {
    el.addEventListener("click", function () {
      state.pri = el.getAttribute("data-pri");
      render();
    });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
      e.preventDefault();
      document.getElementById("search").focus();
    }
  });

  load();
  setInterval(load, 15000);
})();
</script>
</body>
</html>
